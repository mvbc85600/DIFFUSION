<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d0d0f">
<title>MVBC — Écran LED</title>

<style type="text/css">

:root {
    --mvbc-yellow:#ffd400;
    --mvbc-red:#ff2020;
    --mvbc-blue:#168cff;
    --green:#17834d;
    --red-loss:#d34848;
}

* {
    box-sizing:border-box;
}

html,body {
    height:100%;
    margin:0;
    overflow:hidden;
    background:#0d0d0f;
    color:#fff;
    font-family:Inter,"Segoe UI",Arial,sans-serif;
}

/* =========================================================
   SCÈNE
========================================================= */

.screen {
    position:relative;
    width:100%;
    height:100vh;
    display:grid;
    place-items:center;
    padding:2.5vh 2.5vw;
    overflow:hidden;
}

/* =========================================================
   CARTES
========================================================= */

.card {
    position:absolute;

    width:min(1550px,100%);
    height:min(92vh,900px);

    grid-template-columns:1fr 1.15fr;
    grid-template-rows:auto minmax(0,1fr) auto;

    overflow:hidden;

    border-radius:26px;

    background:#141519;

    box-shadow:0 30px 90px rgba(0,0,0,.55);

    /* état initial */
    display:grid;
    opacity:0;
    visibility:hidden;

    transform:translateX(100%);
}

/* Carte actuellement affichée */
.card.active {
    opacity:1;
    visibility:visible;
    transform:translateX(0);
    z-index:2;
}

/* Carte qui entre depuis la droite */
.card.slide-in-right {
    animation:slideInRight .75s cubic-bezier(.22,.61,.36,1) both;
}

/* Carte qui entre depuis la gauche */
.card.slide-in-left {
    animation:slideInLeft .75s cubic-bezier(.22,.61,.36,1) both;
}

/* Carte précédente qui sort vers la gauche */
.card.slide-out-left {
    animation:slideOutLeft .75s cubic-bezier(.22,.61,.36,1) both;
}

/* Carte précédente qui sort vers la droite */
.card.slide-out-right {
    animation:slideOutRight .75s cubic-bezier(.22,.61,.36,1) both;
}

@keyframes slideInRight {
    from {
        opacity:0;
        transform:translateX(100%);
    }

    to {
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes slideInLeft {
    from {
        opacity:0;
        transform:translateX(-100%);
    }

    to {
        opacity:1;
        transform:translateX(0);
    }
}

@keyframes slideOutLeft {
    from {
        opacity:1;
        transform:translateX(0);
    }

    to {
        opacity:0;
        transform:translateX(-100%);
    }
}

@keyframes slideOutRight {
    from {
        opacity:1;
        transform:translateX(0);
    }

    to {
        opacity:0;
        transform:translateX(100%);
    }
}

/* =========================================================
   EN-TÊTE
========================================================= */

.card-header {
    grid-column:1 / span 2;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:2.2vh 3vw;

    font-family:"Arial Narrow","Segoe UI",Arial,sans-serif;
    font-size:clamp(38px,6.5vw,86px);
    font-weight:950;

    letter-spacing:2px;
    line-height:1;

    text-transform:uppercase;
}

.card-header.yellow {
    background:var(--mvbc-yellow);
    color:#111;
}

.card-header.red {
    background:var(--mvbc-red);
    color:#fff;
}

.card-header.blue {
    background:var(--mvbc-blue);
    color:#fff;
}

.card-header .balance {
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    font-size:clamp(14px,2vw,30px);
    font-weight:900;
    letter-spacing:1px;
    white-space:nowrap;
}

.card-header .balance small {
    display:block;
    font-size:.45em;
    letter-spacing:3px;
    opacity:.6;
}

/* =========================================================
   PHOTO
========================================================= */

.card-photo {
    grid-row:2;

    position:relative;

    margin:2.5vh 0 2.5vh 2.5vw;

    border-radius:20px;

    overflow:hidden;

    background:#1c1d21;
}

.card-photo img {
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:transform 8s ease;
}

/*
   Petit zoom lent pendant l'affichage
*/
.card.active .card-photo img {
    transform:scale(1.04);
}

.card-photo::after {
    content:"";

    position:absolute;

    inset:auto 0 0 0;

    height:35%;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.4)
    );
}

/* =========================================================
   INFOS
========================================================= */

.card-info {
    grid-row:2;

    display:flex;
    flex-direction:column;

    min-width:0;
    min-height:0;

    padding:2.5vh 2.5vw;

    overflow:hidden;
}

.coach-line {
    margin:0 0 2vh;

    font-size:clamp(16px,2.2vw,32px);

    font-weight:800;

    color:#ffd400;

    text-transform:uppercase;

    letter-spacing:1px;
}

.coach-line span {
    color:#9a9ca3;
    font-weight:700;
}

/* =========================================================
   TITRE EFFECTIF
========================================================= */

.players-title {
    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin:0 0 10px;

    color:#8f929a;

    font-size:12px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;

    flex:0 0 auto;
}

.players-title strong {
    color:#ffd400;

    font-size:11px;

    letter-spacing:1px;
}

/* =========================================================
   JOUEURS
========================================================= */

.players {
    display:grid;

    grid-template-columns:repeat(2,minmax(0,1fr));

    grid-auto-rows:minmax(42px,auto);

    gap:8px 10px;

    align-content:start;

    min-height:0;

    overflow:visible;
}

/*
   Animation des joueurs
*/
.player-chip {
    min-width:0;
    min-height:42px;

    padding:8px 12px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:14px;

    background:linear-gradient(
        145deg,
        #25262d,
        #1d1e23
    );

    color:#f2f3f5;

    font-size:clamp(13px,1.25vw,19px);

    line-height:1.12;

    font-weight:750;

    white-space:normal;

    overflow-wrap:anywhere;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,.18);

    opacity:0;

    transform:translateY(15px) scale(.97);
}

/*
   Les joueurs apparaissent progressivement
*/
.card.active .player-chip {
    animation:playerAppear .45s ease forwards;
}

/*
   Décalage progressif joueur par joueur
*/
.card.active .player-chip:nth-child(1)  { animation-delay:.08s; }
.card.active .player-chip:nth-child(2)  { animation-delay:.12s; }
.card.active .player-chip:nth-child(3)  { animation-delay:.16s; }
.card.active .player-chip:nth-child(4)  { animation-delay:.20s; }
.card.active .player-chip:nth-child(5)  { animation-delay:.24s; }
.card.active .player-chip:nth-child(6)  { animation-delay:.28s; }
.card.active .player-chip:nth-child(7)  { animation-delay:.32s; }
.card.active .player-chip:nth-child(8)  { animation-delay:.36s; }
.card.active .player-chip:nth-child(9)  { animation-delay:.40s; }
.card.active .player-chip:nth-child(10) { animation-delay:.44s; }
.card.active .player-chip:nth-child(11) { animation-delay:.48s; }
.card.active .player-chip:nth-child(12) { animation-delay:.52s; }

@keyframes playerAppear {
    from {
        opacity:0;
        transform:translateY(15px) scale(.97);
    }

    to {
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* =========================================================
   DERNIER RÉSULTAT
========================================================= */

.card-footer {
    grid-column:1 / span 2;
    grid-row:3;

    display:flex;

    align-items:center;
    justify-content:space-between;

    gap:2vw;

    margin:0 2.5vw 2.5vh;

    padding:2vh 2.2vw;

    border-radius:18px;

    background:#f0f1f3;

    color:#111;
}

.card-footer.win {
    background:#e6f4ed;
}

.card-footer.win .score {
    color:var(--green);
}

.card-footer.loss {
    background:#faeaea;
}

.card-footer.loss .score {
    color:var(--red-loss);
}

.card-footer .label {
    font-size:clamp(12px,1.5vw,22px);

    font-weight:950;

    letter-spacing:2px;

    color:#70757d;

    text-transform:uppercase;
}

.card-footer .score {
    font-size:clamp(22px,3.2vw,48px);

    font-weight:950;

    white-space:nowrap;
}

.card-footer .state {
    font-size:clamp(14px,1.9vw,30px);

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1px;
}

/* =========================================================
   INDICATEUR
========================================================= */

.dots {
    position:fixed;

    left:0;
    right:0;

    bottom:1.2vh;

    display:flex;

    justify-content:center;

    gap:8px;

    z-index:10;
}

.dot {
    width:10px;
    height:10px;

    border-radius:50%;

    background:#33343a;

    transition:
        background .3s,
        transform .3s;
}

.dot.active {
    background:var(--mvbc-yellow);

    transform:scale(1.35);
}

/* =========================================================
   PAS DE RÉSULTAT
========================================================= */

.no-result {
    color:#70757d;

    font-weight:900;

    letter-spacing:1px;

    text-transform:uppercase;
}

/* =========================================================
   TABLETTES
========================================================= */

@media (max-width:1100px) {

    .players {
        gap:6px;
    }

    .player-chip {
        min-height:36px;

        padding:6px 8px;

        font-size:clamp(11px,1.45vw,16px);

        border-radius:11px;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:700px) {

    .card {
        width:96vw;

        height:94vh;

        grid-template-columns:1fr;

        grid-template-rows:auto minmax(0,1fr) auto;
    }

    .card-header {
        grid-column:1;

        padding:1.6vh 4vw;

        font-size:clamp(30px,9vw,52px);
    }

    .card-photo {
        display:none;
    }

    .card-info {
        grid-column:1;

        grid-row:2;

        padding:2vh 4vw 1vh;
    }

    .players {
        grid-template-columns:1fr 1fr;

        grid-auto-rows:minmax(34px,auto);

        gap:5px;
    }

    .player-chip {
        min-height:34px;

        padding:4px 6px;

        font-size:clamp(9px,2.7vw,14px);

        border-radius:10px;
    }

    .card-footer {
        grid-column:1;

        grid-row:3;

        margin:0 3vw 2vh;

        padding:1.5vh 3vw;
    }
}

/* =========================================================
   ACCESSIBILITÉ
========================================================= */

@media (prefers-reduced-motion:reduce) {

    .card,
    .player-chip,
    .card-photo img {
        animation:none !important;

        transition:none !important;
    }
}

</style>

/* =========================================================
   CSV
========================================================= */

function parseCSV(text) {

    var rows = [];
    var row = [];
    var field = "";
    var inQ = false;

    for (var i = 0; i < text.length; i++) {

        var c = text[i];

        if (inQ) {

            if (c === '"') {

                if (text[i + 1] === '"') {
                    field += '"';
                    i++;
                } else {
                    inQ = false;
                }

            } else {
                field += c;
            }

        } else if (c === '"') {

            inQ = true;

        } else if (c === ",") {

            row.push(field);
            field = "";

        } else if (c === "\n" || c === "\r") {

            if (c === "\r" && text[i + 1] === "\n") {
                i++;
            }

            row.push(field);
            field = "";

            if (
                row.some(function(f) {
                    return f.trim() !== "";
                })
            ) {
                rows.push(row);
            }

            row = [];

        } else {

            field += c;
        }
    }

    row.push(field);

    if (
        row.some(function(f) {
            return f.trim() !== "";
        })
    ) {
        rows.push(row);
    }

    return rows;
}


function normalize(s) {

    return (s || "")
        .toUpperCase()
        .replace(/\s+/g, "");
}


function jourNum(j) {

    return parseInt(
        String(j).replace(/\D/g, ""),
        10
    ) || 0;
}


/* =========================================================
   RÉSULTATS
========================================================= */

function buildResults(csvText) {

    var rows = parseCSV(csvText);

    var byTeam = {};

    SHEET_TEAMS.forEach(function(teamName, blockIndex) {

        var colJ = blockIndex * 3;
        var colS = blockIndex * 3 + 1;
        var colD = blockIndex * 3 + 2;

        var best = null;

        var wins = 0;
        var losses = 0;

        rows.forEach(function(cols) {

            var journey =
                (cols[colJ] || "").trim();

            var score =
                (cols[colS] || "").trim();

            var lieu =
                normalize(cols[colD] || "");

            if (!/^J\d+$/i.test(journey)) return;

            if (!/^\d+\s*-\s*\d+$/.test(score)) return;

            var isHome =
                !/^(EXT|E|A|AWAY)/.test(lieu);

            var parts =
                score
                .split("-")
                .map(function(n) {
                    return parseInt(n.trim(),10);
                });

            var s =
                isHome
                ? parts[0]
                : parts[1];

            var o =
                isHome
                ? parts[1]
                : parts[0];

            if (s > o) {
                wins++;
            } else if (s < o) {
                losses++;
            }

            if (
                !best ||
                jourNum(journey) > best.journeyNum
            ) {

                best = {
                    journeyNum:jourNum(journey),
                    journey:journey.toUpperCase(),
                    mvbc:s,
                    opp:o
                };
            }
        });

        if (best) {

            byTeam[normalize(teamName)] = {

                journey:best.journey,

                score:
                    best.mvbc +
                    "-" +
                    best.opp,

                state:
                    best.mvbc > best.opp
                    ? "win"
                    : best.mvbc < best.opp
                    ? "loss"
                    : "draw",

                balance:{
                    wins:wins,
                    losses:losses
                }
            };
        }
    });

    return byTeam;
}


function loadResults() {

    fetch(RESULTS_CSV_URL)

            if (!r.ok) {

        .then(function(text) {

            currentResults =
                buildResults(text);

            renderAll();
        })

        .catch(function(e) {

            if (window.console) {
                console.warn(
                    "Résultats indisponibles :",
                    e
                );
            }
        });
}

/* =========================================================
   CARROUSEL
========================================================= */

function showCard(index, animate) {

    var cards =
        document.querySelectorAll(".card");

    var dots =
        document.querySelectorAll(".dot");


    if (!cards.length) {
        return;
    }


    /*
       Si aucun mouvement demandé,
       on affiche directement la carte.
    */

    if (!animate) {

        cards.forEach(function(card, i) {

            card.classList.remove(
                "active",
                "slide-in-right",
                "slide-in-left",
                "slide-out-left",
                "slide-out-right"
            );

            if (i === index) {
                card.classList.add("active");
            }
        });


        dots.forEach(function(dot, i) {

            dot.classList.toggle(
                "active",
                i === index
            );
        });

        return;
    }


    /*
       Recherche de l'ancienne carte active
    */

    var oldIndex = currentIndex;

    var oldCard =
        cards[oldIndex];

    var newCard =
        cards[index];


    if (!newCard) {
        return;
    }


    /*
       Détermine le sens du carrousel.

       Si on avance :
       ancienne carte -> gauche
       nouvelle carte -> droite vers centre

       Si on recule :
       ancienne carte -> droite
       nouvelle carte -> gauche vers centre
    */

    var goingForward =
        index > oldIndex ||
        (
            oldIndex === cards.length - 1 &&
            index === 0
        );


    var inClass =
        goingForward
        ? "slide-in-right"
        : "slide-in-left";


    var outClass =
        goingForward
        ? "slide-out-left"
        : "slide-out-right";


    /*
       Nettoyage
    */

    cards.forEach(function(card) {

        card.classList.remove(
            "slide-in-right",
            "slide-in-left",
            "slide-out-left",
            "slide-out-right"
        );
    });


    /*
       Ancienne carte
    */

    if (oldCard) {

        oldCard.classList.remove("active");

        oldCard.classList.add(outClass);
    }


    /*
       Nouvelle carte
    */

    newCard.classList.add("active");

    newCard.classList.add(inClass);


    /*
       Points de navigation
    */

    dots.forEach(function(dot, i) {

        dot.classList.toggle(
            "active",
            i === index
        );
    });


    /*
       Nettoyage après animation
    */

    setTimeout(function() {

        cards.forEach(function(card, i) {

            if (i !== index) {

                card.classList.remove(
                    "active",
                    "slide-in-right",
                    "slide-in-left",
                    "slide-out-left",
                    "slide-out-right"
                );
            }

        });

        newCard.classList.remove(
            inClass
        );

    }, 800);
}


/* =========================================================
   ROTATION AUTOMATIQUE
========================================================= */

function startRotation() {

    setInterval(function() {

        var nextIndex =
            (currentIndex + 1) %
            TEAMS.length;


        showCard(
            nextIndex,
            true
        );


        currentIndex =
            nextIndex;

    }, SLIDE_MS);
}

        if (

        ) {

            var next =
                (currentIndex + 1) %

            showCard(

            );


            currentIndex =

        else if (
            e.key === "ArrowLeft"
        ) {

            var previous =
                (
                    currentIndex -
                    1 +
                    TEAMS.length
                ) %
                TEAMS.length;


            showCard(
                previous,
                true
            );


            currentIndex =
                previous;
        }

    }
);
