<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREE — NBA Score Animation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 48%, rgba(23,105,255,.13), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 38%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
}

.stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
}

/* Subtle arena atmosphere */
.stage::before {
    content: "";
    position: absolute;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.012) 91px 92px
        ),
        radial-gradient(
            ellipse at 50% 45%,
            rgba(255,255,255,.06),
            transparent 48%
        );
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

.stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.48) 100%
    );
}

/* Main impact */
.three {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 10;
    margin: 0;
    transform:
        translate(-50%, -50%)
        scale(.55)
        skewX(-5deg);
    opacity: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(170px, 27vw, 390px);
    font-weight: 900;
    line-height: .72;
    letter-spacing: -.075em;
    color: var(--white);

    /* Hard broadcast-style edge instead of neon glow */
    text-shadow:
        5px 5px 0 var(--black),
        10px 10px 0 var(--yellow),
        16px 16px 0 rgba(237,23,76,.9),
        22px 22px 0 rgba(23,105,255,.5);

    will-change: transform, opacity, filter;
}

/* Accent slash behind DUNK */
.slash {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 7;
    width: min(64vw, 850px);
    height: 18px;
    transform:
        translate(-50%, -50%)
        rotate(-7deg)
        scaleX(0);
    transform-origin: center;
    opacity: 0;
    background: linear-gradient(
        90deg,
        transparent,
        var(--blue) 12%,
        var(--yellow) 35%,
        var(--white) 50%,
        var(--yellow) 65%,
        var(--red) 88%,
        transparent
    );
    box-shadow: 0 0 40px rgba(23,105,255,.45);
}

/* Giant background number */
.echo {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    transform:
        translate(-50%, -50%)
        scale(.9)
        skewX(-5deg);
    opacity: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(260px, 48vw, 700px);
    font-weight: 900;
    line-height: .7;
    letter-spacing: -.09em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,.07);
}

/* "THREE!" */
.three-word {
    position: absolute;
    left: 50%;
    top: calc(50% + clamp(115px, 15vw, 210px));
    z-index: 12;
    transform: translate(-50%, 30px);
    opacity: 0;
    font-size: clamp(18px, 2.3vw, 34px);
    font-weight: 900;
    letter-spacing: .42em;
    text-indent: .42em;
    text-transform: uppercase;
    white-space: nowrap;
}

/* Radial impact rings */
.ring {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 5;
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(.1);
    opacity: 0;
}

.ring.red {
    border-color: rgba(237,23,76,.8);
}

.ring.blue {
    border-color: rgba(23,105,255,.8);
}

/* Speed lines */
.lines {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
}

.line {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 2px;
    width: clamp(100px, 20vw, 300px);
    transform-origin: 0 50%;
    transform: rotate(var(--angle)) translateX(20px) scaleX(0);
    opacity: 0;
    background: linear-gradient(
        90deg,
        rgba(255,255,255,.85),
        transparent
    );
}

/* Flash */
.flash {
    position: absolute;
    inset: 0;
    z-index: 18;
    pointer-events: none;
    opacity: 0;
    background: rgba(255,255,255,.9);
    mix-blend-mode: screen;
}

/* State: active animation */
.stage.play .three {
    animation: threeImpact 2.5s cubic-bezier(.16,.9,.25,1) forwards;
}

.stage.play .echo {
    animation: echoImpact 2.5s ease-out forwards;
}

.stage.play .slash {
    animation: slashImpact 1.8s cubic-bezier(.16,1,.3,1) forwards;
}

.stage.play .three-word {
    animation: wordImpact 2s cubic-bezier(.16,1,.3,1) .18s forwards;
}

.stage.play .ring {
    animation: ringImpact 1.5s cubic-bezier(.12,.75,.25,1) forwards;
}

.stage.play .ring.red {
    animation-delay: .06s;
}

.stage.play .ring.blue {
    animation-delay: .12s;
}

.stage.play .flash {
    animation: flashImpact .32s ease-out forwards;
}

.stage.play .line {
    animation: lineImpact .8s cubic-bezier(.15,.8,.3,1) forwards;
}

.stage.play .line:nth-child(2n) {
    animation-delay: .035s;
}

.stage.play .line:nth-child(3n) {
    animation-delay: .07s;
}

@keyframes threeImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.45) skewX(-5deg);
        filter: blur(8px);
    }
    12% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.12) skewX(-5deg);
        filter: blur(0);
    }
    23% {
        transform: translate(-50%,-50%) scale(.96) skewX(-5deg);
    }
    38% {
        transform: translate(-50%,-50%) scale(1.02) skewX(-5deg);
    }
    70% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1) skewX(-5deg);
    }
    90% {
        opacity: 0;
        transform: translate(-50%,-53%) scale(1.08) skewX(-5deg);
    }
    100% {
        opacity: 0;
    }
}

@keyframes echoImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.6) skewX(-5deg);
    }
    18% {
        opacity: .8;
    }
    80% {
        opacity: 0;
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(1.25) skewX(-5deg);
    }
}

@keyframes slashImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(0);
    }
    18% {
        opacity: 1;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1);
    }
    65% {
        opacity: .8;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1.05);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1.18);
    }
}

@keyframes wordImpact {
    0%, 45% {
        opacity: 0;
        transform: translate(-50%, 30px);
    }
    58% {
        opacity: 1;
        transform: translate(-50%, 0);
    }
    90% {
        opacity: 0;
        transform: translate(-50%, -8px);
    }
    100% {
        opacity: 0;
    }
}

@keyframes ringImpact {
    0% {
        opacity: .8;
        transform: translate(-50%,-50%) scale(.1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(12);
    }
}

@keyframes lineImpact {
    0% {
        opacity: 0;
        transform: rotate(var(--angle)) translateX(10px) scaleX(0);
    }
    20% {
        opacity: .9;
    }
    100% {
        opacity: 0;
        transform: rotate(var(--angle)) translateX(30px) scaleX(1);
    }
}

@keyframes flashImpact {
    0% { opacity: 0; }
    12% { opacity: .75; }
    100% { opacity: 0; }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
    .stage.play * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>

<div class="stage" id="stage">
    <div class="echo">D U N K</div>
    <div class="slash"></div>

    <div class="lines" id="lines"></div>

    <div class="ring"></div>
    <div class="ring red"></div>
    <div class="ring blue"></div>

    <div class="flash"></div>

    <div class="three" aria-live="polite">G O G O G O <br><center> M V B C </center></div>
    
</div>

<script>
const stage = document.getElementById("stage");
const lines = document.getElementById("lines");

const angles = [
    0, 18, 36, 54, 72, 90, 108, 126, 144, 162,
    180, 198, 216, 234, 252, 270, 288, 306, 324, 342
];

angles.forEach(angle => {
    const line = document.createElement("div");
    line.className = "line";
    line.style.setProperty("--angle", `${angle}deg`);
    lines.appendChild(line);
});

function playThree() {
    // Retire la classe pour réinitialiser l'animation
    stage.classList.remove("play");
    // Force le recalcul du style
    void stage.offsetWidth;
    // Ajoute la classe pour relancer l'animation
    stage.classList.add("play");
}

// Démarre la première animation après 500ms
setTimeout(playThree, 500);
// Répète l'animation toutes les 2.5 secondes (durée de l'animation)
setInterval(playThree, 2500);
</script>

</body>
</html>
