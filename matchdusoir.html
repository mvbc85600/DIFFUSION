<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Match du soir</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at center,
            #222 0%,
            #050505 70%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;

    flex-direction: column;

    align-items: center;

}


/* =====================================================
   TITRE
===================================================== */

.championnat {

    margin-top: 60px;

    font-size: 48px;

    font-weight: bold;

    letter-spacing: 8px;

    text-align: center;

    color: #ffcc00;

    text-shadow:
        0 0 10px #ffcc00,
        0 0 30px #ffcc00;

}


/* =====================================================
   CONTENEUR
===================================================== */

.match {

    width: 90%;

    max-width: 1400px;

    margin-top: 80px;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


/* =====================================================
   EQUIPES
===================================================== */

.team {

    width: 40%;

    text-align: center;

    opacity: 0;

    transform: scale(0.5);

}


.team.active {

    animation:
        apparition
        1.2s
        ease
        forwards;

}


@keyframes apparition {

    0% {

        opacity: 0;

        transform:
            scale(0.4)
            rotateY(90deg);

    }

    60% {

        opacity: 1;

        transform:
            scale(1.15)
            rotateY(-10deg);

    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotateY(0deg);

    }

}


/* =====================================================
   LOGOS
===================================================== */

.team img {

    width: 300px;

    height: 300px;

    object-fit: contain;

    filter:
        drop-shadow(
            0 0 20px
            rgba(255,255,255,0.4)
        );

}


/* =====================================================
   NOM ÉQUIPE
===================================================== */

.team-name {

    margin-top: 25px;

    font-size: 42px;

    font-weight: bold;

    text-transform: uppercase;

}


/* =====================================================
   VS
===================================================== */

.vs {

    font-size: 70px;

    font-weight: bold;

    color: #ffcc00;

    text-shadow:
        0 0 10px #ffcc00,
        0 0 30px #ffcc00;

    animation:
        pulse
        2s
        infinite;

}


@keyframes pulse {

    0%,
    100% {

        transform:
            scale(1);

    }

    50% {

        transform:
            scale(1.2);

    }

}


/* =====================================================
   INFOS
===================================================== */

.infos {

    margin-top: 60px;

    text-align: center;

    font-size: 30px;

    opacity: 0;

}


.infos.active {

    animation:
        fadeInfo
        1s
        ease
        1.3s
        forwards;

}


@keyframes fadeInfo {

    from {

        opacity: 0;

        transform:
            translateY(30px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    .championnat {

        margin-top: 25px;

        font-size: 25px;

    }

    .match {

        margin-top: 50px;

    }

    .team img {

        width: 130px;

        height: 130px;

    }

    .team-name {

        font-size: 20px;

    }

    .vs {

        font-size: 35px;

    }

    .infos {

        margin-top: 30px;

        font-size: 18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     CHAMPIONNAT
===================================================== -->

<div
    id="championnat"
    class="championnat">

    CHAMPIONNAT

</div>


<!-- =====================================================
     MATCH
===================================================== -->

<div class="match">


    <!-- EQUIPE 1 -->

    <div
        id="team1"
        class="team">

        <img
            id="logo1"
            src=""
            alt="Équipe 1">

        <div
            id="nom1"
            class="team-name">

            ÉQUIPE 1

        </div>

    </div>


    <!-- VS -->

    <div class="vs">

        VS

    </div>


    <!-- EQUIPE 2 -->

    <div
        id="team2"
        class="team">

        <img
            id="logo2"
            src=""
            alt="Équipe 2">

        <div
            id="nom2"
            class="team-name">

            ÉQUIPE 2

        </div>

    </div>


</div>


<!-- =====================================================
     INFORMATIONS
===================================================== -->

<div
    id="infos"
    class="infos">

    <div id="date">
        SAMEDI
    </div>

    <div id="heure">
        20H00
    </div>

</div>



<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

    getDatabase,

    ref,

    onValue

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

    authDomain:
        "diffusion-b9afa.firebaseapp.com",

    databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "diffusion-b9afa",

    storageBucket:
        "diffusion-b9afa.firebasestorage.app",

    messagingSenderId:
        "674799570797",

    appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"

};



/* =====================================================
   INITIALISATION
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const db =
    getDatabase(app);



/* =====================================================
   ELEMENTS
===================================================== */

const championnat =
    document.getElementById(
        "championnat"
    );

const logo1 =
    document.getElementById(
        "logo1"
    );

const logo2 =
    document.getElementById(
        "logo2"
    );

const nom1 =
    document.getElementById(
        "nom1"
    );

const nom2 =
    document.getElementById(
        "nom2"
    );

const date =
    document.getElementById(
        "date"
    );

const heure =
    document.getElementById(
        "heure"
    );

const team1 =
    document.getElementById(
        "team1"
    );

const team2 =
    document.getElementById(
        "team2"
    );

const infos =
    document.getElementById(
        "infos"
    );



/* =====================================================
   REFERENCE FIREBASE
===================================================== */

const matchRef =
    ref(
        db,
        "matchdusoir"
    );



/* =====================================================
   ECOUTE EN TEMPS REEL
===================================================== */

onValue(

    matchRef,

    (snapshot) => {

        const data =
            snapshot.val();


        if (!data) {

            console.log(
                "Aucun match enregistré."
            );

            return;

        }



        /* =================================================
           TEXTES
        ================================================= */

        championnat.textContent =
            data.championnat ||
            "CHAMPIONNAT";


        nom1.textContent =
            data.equipe1 ||
            "ÉQUIPE 1";


        nom2.textContent =
            data.equipe2 ||
            "ÉQUIPE 2";


        date.textContent =
            data.date ||
            "";


        heure.textContent =
            data.heure ||
            "";



        /* =================================================
           LOGO ÉQUIPE 1
           
           Exemple Firebase :
           
           logo1:
           "logos/mvbc.png"
        ================================================= */

        if (data.logo1) {

            logo1.src =
                data.logo1;

            logo1.onerror =
                () => {

                    console.error(
                        "Impossible de charger le logo 1 :",
                        data.logo1
                    );

                    logo1.style.opacity =
                        "0.3";

                };

            logo1.onload =
                () => {

                    logo1.style.opacity =
                        "1";

                };

        }



        /* =================================================
           LOGO ÉQUIPE 2
        ================================================= */

        if (data.logo2) {

            logo2.src =
                data.logo2;

            logo2.onerror =
                () => {

                    console.error(
                        "Impossible de charger le logo 2 :",
                        data.logo2
                    );

                    logo2.style.opacity =
                        "0.3";

                };

            logo2.onload =
                () => {

                    logo2.style.opacity =
                        "1";

                };

        }



        /* =================================================
           RESET DES ANIMATIONS
        ================================================= */

        team1.classList.remove(
            "active"
        );

        team2.classList.remove(
            "active"
        );

        infos.classList.remove(
            "active"
        );


        /*
           Force le navigateur à
           recalculer l'animation.
        */

        void team1.offsetWidth;



        /* =================================================
           LANCEMENT DES ANIMATIONS
        ================================================= */

        team1.classList.add(
            "active"
        );

        team2.classList.add(
            "active"
        );

        infos.classList.add(
            "active"
        );

    }

);

</script>


</body>

</html>
