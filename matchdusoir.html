<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATCH DU SOIR — MVBC</title>

<!-- =====================================================
     POLICES — MÊME TYPOGRAPHIE QUE GO GO GO / THREE
     ===================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

/* =====================================================
   VARIABLES
   ===================================================== */

:root {
    --white: #f7f7f5;
    --black: #050608;

    --blue: #1769ff;
    --red: #ed174c;
    --yellow: #ffd400;

    --halo1: #ffffff;
    --halo2: #ffffff;

    --halo1-rgb: 255,255,255;
    --halo2-rgb: 255,255,255;
}


/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html {
    overflow: hidden;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.035),
            transparent 32%
        ),
        #050608;

    color: var(--white);

    font-family: "Inter", sans-serif;

    visibility: hidden;
    opacity: 0;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

body.loaded {
    visibility: visible;
    opacity: 1;
}


/* =====================================================
   SCÈNE
   ===================================================== */

.stage {
    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    isolation: isolate;
}


/* =====================================================
   HALO ÉQUIPE GAUCHE
   ===================================================== */

.stage::before {
    content: "";

    position: absolute;

    left: -18%;
    top: 5%;

    width: 70%;
    height: 90%;

    z-index: -5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(var(--halo1-rgb), .20),
            rgba(var(--halo1-rgb), .08) 30%,
            transparent 68%
        );

    filter: blur(70px);

    pointer-events: none;
}


/* =====================================================
   HALO ÉQUIPE DROITE
   ===================================================== */

.stage::after {
    content: "";

    position: absolute;

    right: -18%;
    top: 5%;

    width: 70%;
    height: 90%;

    z-index: -5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(var(--halo2-rgb), .20),
            rgba(var(--halo2-rgb), .08) 30%,
            transparent 68%
        );

    filter: blur(70px);

    pointer-events: none;
}


/* =====================================================
   ATMOSPHÈRE ARENA
   ===================================================== */

.arena-grid {
    position: absolute;

    inset: -20%;

    z-index: -4;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.012) 91px 92px
        ),
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.045),
            transparent 50%
        );

    transform:
        perspective(800px)
        rotateX(58deg)
        scale(1.35);

    transform-origin: center bottom;
}


/* =====================================================
   VIGNETTE
   ===================================================== */

.vignette {
    position: absolute;

    inset: 0;

    z-index: 30;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.48) 100%
        );
}


/* =====================================================
   LIGNES TECHNIQUES
   ===================================================== */

.tech-lines {
    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    opacity: .5;
}

.tech-lines::before,
.tech-lines::after {
    content: "";

    position: absolute;

    left: 5%;
    right: 5%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}

.tech-lines::before {
    top: 8%;
}

.tech-lines::after {
    bottom: 8%;
}


/* =====================================================
   PETITES LIGNES LATÉRALES
   ===================================================== */

.side-mark {
    position: absolute;

    width: 70px;
    height: 4px;

    z-index: 5;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--white)
        );

    opacity: .7;
}

.side-mark.left {
    left: 4%;
    top: 50%;
}

.side-mark.right {
    right: 4%;
    top: 50%;

    transform: rotate(180deg);
}


/* =====================================================
   CONTENU
   ===================================================== */

.content {
    position: relative;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        clamp(25px, 4vh, 55px)
        4vw
        clamp(25px, 4vh, 45px);

    min-height: 0;
}


/* =====================================================
   CHAMPIONNAT
   ===================================================== */

.championnat-wrap {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    width: min(80vw, 800px);

    margin-bottom: clamp(10px, 2vh, 24px);

    opacity: 0;
    transform: translateY(-25px);
}

.championnat-wrap::before,
.championnat-wrap::after {
    content: "";

    width: clamp(35px, 8vw, 120px);
    height: 2px;

    margin: 0 15px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--white)
        );

    opacity: .55;
}

.championnat-wrap::after {
    transform: rotate(180deg);
}

.championnat {
    padding:
        7px
        18px;

    border:
        1px solid rgba(255,255,255,.35);

    background:
        rgba(255,255,255,.035);

    font-family: "Inter", sans-serif;

    font-size: clamp(12px, 1.1vw, 18px);

    font-weight: 900;

    letter-spacing: .28em;

    text-transform: uppercase;

    white-space: nowrap;
}


/* =====================================================
   TITRE MATCH DU SOIR
   ===================================================== */

.match-title {
    position: relative;

    margin: 0;

    font-family: "Barlow Condensed", sans-serif;

    font-size: clamp(
        75px,
        12vw,
        190px
    );

    font-weight: 900;

    line-height: .76;

    letter-spacing: -.075em;

    text-align: center;

    text-transform: uppercase;

    white-space: nowrap;

    font-style: italic;

    transform:
        skewX(-5deg)
        scale(.65);

    opacity: 0;

    color: var(--white);

    text-shadow:
        5px 5px 0 var(--black),
        10px 10px 0 var(--yellow),
        16px 16px 0 rgba(237,23,76,.75),
        22px 22px 0 rgba(23,105,255,.45);

    will-change:
        transform,
        opacity;
}


/* =====================================================
   TRAIT SOUS LE TITRE
   ===================================================== */

.match-title-line {
    position: relative;

    width: min(65vw, 900px);

    height: 5px;

    margin-top: clamp(12px, 2vh, 25px);

    transform:
        scaleX(0)
        skewX(-15deg);

    transform-origin: center;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue) 15%,
            var(--yellow) 35%,
            var(--white) 50%,
            var(--yellow) 65%,
            var(--red) 85%,
            transparent
        );

    box-shadow:
        0 0 25px rgba(23,105,255,.35);
}


/* =====================================================
   ZONE ÉQUIPES
   ===================================================== */

.teams {
    position: relative;

    flex: 1;

    min-height: 0;

    width: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: clamp(
        50px,
        9vw,
        180px
    );

    margin-top: clamp(10px, 2vh, 25px);
}


/* =====================================================
   ÉQUIPE
   ===================================================== */

.team {
    position: relative;

    width: clamp(
        220px,
        25vw,
        390px
    );

    height: clamp(
        300px,
        43vh,
        450px
    );

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: flex-start;

    opacity: 0;
}

.team.left {
    transform:
        translateX(-80px)
        skewX(-3deg);
}

.team.right {
    transform:
        translateX(80px)
        skewX(3deg);
}


/* =====================================================
   LOGO BOX
   ===================================================== */

.logo-box {
    position: relative;

    width: clamp(
        190px,
        23vw,
        340px
    );

    height: clamp(
        190px,
        23vw,
        340px
    );

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.10),
            rgba(0,0,0,.7) 65%
        );

    border:
        2px solid rgba(255,255,255,.22);

    box-shadow:
        0 0 0 8px rgba(255,255,255,.025),
        inset 0 0 50px rgba(0,0,0,.8);

    isolation: isolate;
}


/* Anneau principal */

.logo-box::before {
    content: "";

    position: absolute;

    inset: -13px;

    border-radius: 50%;

    border:
        4px solid transparent;

    border-top-color: var(--halo);
    border-right-color: var(--halo);

    transform: rotate(0deg);

    animation:
        rotateRing 7s linear infinite;
}


/* Anneau secondaire */

.logo-box::after {
    content: "";

    position: absolute;

    inset: -25px;

    border-radius: 50%;

    border:
        1px solid var(--halo);

    opacity: .45;

    animation:
        pulseRing 2.5s ease-in-out infinite;
}


/* =====================================================
   LOGO
   ===================================================== */

.logo {
    position: relative;

    z-index: 3;

    width: 72%;
    height: 72%;

    object-fit: contain;

    filter:
        drop-shadow(
            0 10px 18px rgba(0,0,0,.65)
        );

    opacity: 0;
}

.team.left .logo {
    transform:
        translateX(-80px)
        scale(.75);
}

.team.right .logo {
    transform:
        translateX(80px)
        scale(.75);
}


/* =====================================================
   NOM ÉQUIPE
   ===================================================== */

.team-name {
    position: relative;

    z-index: 10;

    min-width: 230px;

    max-width: 32vw;

    margin-top: clamp(
        30px,
        4vh,
        50px
    );

    padding:
        10px
        24px
        7px;

    text-align: center;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: clamp(
        30px,
        4.2vw,
        65px
    );

    font-weight: 900;

    line-height: .9;

    letter-spacing: -.025em;

    text-transform: uppercase;

    white-space: nowrap;

    background:
        rgba(0,0,0,.78);

    border-bottom:
        5px solid var(--halo);

    box-shadow:
        8px 8px 0 rgba(0,0,0,.7);

    text-shadow:
        3px 3px 0 #000;

    opacity: 0;
    transform: translateY(30px);
}


/* =====================================================
   VS CENTRAL
   ===================================================== */

.vs-container {
    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 15;

    width: clamp(
        110px,
        10vw,
        165px
    );

    height: clamp(
        110px,
        10vw,
        165px
    );

    transform:
        translate(-50%, -50%)
        scale(.2);

    opacity: 0;
}


/* Cercle VS */

.vs-container::before,
.vs-container::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    border: 2px solid rgba(255,255,255,.5);
}

.vs-container::before {
    border-top-color: var(--blue);
    border-bottom-color: var(--red);

    animation:
        rotateVS 5s linear infinite;
}

.vs-container::after {
    inset: 10px;

    border-left-color: var(--yellow);
    border-right-color: var(--white);

    animation:
        rotateVS 3s linear infinite reverse;
}


/* Texte VS */

.vs {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: clamp(
        55px,
        6vw,
        90px
    );

    font-weight: 900;

    font-style: italic;

    letter-spacing: -.05em;

    transform: skewX(-5deg);

    color: var(--white);

    text-shadow:
        4px 4px 0 #000,
        7px 7px 0 var(--yellow),
        10px 10px 0 rgba(237,23,76,.7);
}


/* =====================================================
   INFOS MATCH
   ===================================================== */

.match-info {
    position: relative;

    z-index: 12;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: clamp(
        20px,
        4vw,
        60px
    );

    margin-top: auto;

    padding:
        10px 28px;

    border:
        1px solid rgba(255,255,255,.25);

    background:
        rgba(0,0,0,.65);

    box-shadow:
        7px 7px 0 rgba(0,0,0,.55);

    opacity: 0;

    transform:
        translateY(30px);
}


/* Ligne info */

.info-block {
    display: flex;

    align-items: center;

    gap: 12px;
}

.info-label {
    font-size: clamp(
        10px,
        .8vw,
        14px
    );

    font-weight: 900;

    letter-spacing: .22em;

    opacity: .55;
}

.info-value {
    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size: clamp(
        24px,
        2.4vw,
        40px
    );

    font-weight: 900;

    letter-spacing: .02em;
}


/* Séparateur */

.info-separator {
    width: 2px;

    height: 35px;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,.6),
            transparent
        );
}


/* =====================================================
   SLASH CENTRAL
   ===================================================== */

.slash {
    position: absolute;

    left: 50%;
    top: 50%;

    z-index: 4;

    width: min(70vw, 1100px);

    height: 12px;

    transform:
        translate(-50%, -50%)
        rotate(-7deg)
        scaleX(0);

    transform-origin: center;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue) 12%,
            var(--yellow) 35%,
            var(--white) 50%,
            var(--yellow) 65%,
            var(--red) 88%,
            transparent
        );

    box-shadow:
        0 0 30px rgba(23,105,255,.35);

    pointer-events: none;
}


/* =====================================================
   SPEED LINES
   ===================================================== */

.speed-lines {
    position: absolute;

    inset: 0;

    z-index: 3;

    overflow: hidden;

    pointer-events: none;
}

.speed-line {
    position: absolute;

    left: 50%;
    top: 50%;

    width: clamp(
        120px,
        18vw,
        300px
    );

    height: 2px;

    transform-origin: 0 50%;

    transform:
        rotate(var(--angle))
        translateX(20px)
        scaleX(0);

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.85),
            transparent
        );
}


/* =====================================================
   FLASH
   ===================================================== */

.flash {
    position: absolute;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    opacity: 0;

    background:
        rgba(255,255,255,.8);

    mix-blend-mode: screen;
}


/* =====================================================
   PARTICULES
   ===================================================== */

.particles {
    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,255,255,.55);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);
}


/* =====================================================
   ANIMATIONS
   ===================================================== */

.stage.loaded .championnat-wrap {
    animation:
        championshipIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        .15s
        forwards;
}

.stage.loaded .match-title {
    animation:
        titleImpact
        1.5s
        cubic-bezier(.16,.9,.25,1)
        .25s
        forwards;
}

.stage.loaded .match-title-line {
    animation:
        lineReveal
        1s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;
}

.stage.loaded .team.left {
    animation:
        teamLeftIn
        1s
        cubic-bezier(.16,.9,.25,1)
        .45s
        forwards;
}

.stage.loaded .team.right {
    animation:
        teamRightIn
        1s
        cubic-bezier(.16,.9,.25,1)
        .45s
        forwards;
}

.stage.loaded .team.left .logo {
    animation:
        logoLeftIn
        1s
        cubic-bezier(.16,.9,.25,1)
        .65s
        forwards;
}

.stage.loaded .team.right .logo {
    animation:
        logoRightIn
        1s
        cubic-bezier(.16,.9,.25,1)
        .65s
        forwards;
}

.stage.loaded .team-name {
    animation:
        nameIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        1s
        forwards;
}

.stage.loaded .vs-container {
    animation:
        vsImpact
        1s
        cubic-bezier(.16,.9,.25,1)
        1.05s
        forwards;
}

.stage.loaded .match-info {
    animation:
        infoIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        1.25s
        forwards;
}

.stage.loaded .slash {
    animation:
        slashImpact
        1.2s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;
}

.stage.loaded .speed-line {
    animation:
        speedImpact
        .8s
        cubic-bezier(.15,.8,.3,1)
        forwards;
}


/* =====================================================
   KEYFRAMES
   ===================================================== */

@keyframes championshipIn {

    0% {
        opacity: 0;

        transform:
            translateY(-30px);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes titleImpact {

    0% {
        opacity: 0;

        transform:
            skewX(-5deg)
            scale(.45);

        filter: blur(8px);
    }

    15% {
        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1.08);

        filter: blur(0);
    }

    28% {
        transform:
            skewX(-5deg)
            scale(.96);
    }

    42% {
        transform:
            skewX(-5deg)
            scale(1.02);
    }

    100% {
        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1);
    }
}


@keyframes lineReveal {

    0% {
        opacity: 0;

        transform:
            scaleX(0)
            skewX(-15deg);
    }

    100% {
        opacity: 1;

        transform:
            scaleX(1)
            skewX(-15deg);
    }
}


@keyframes teamLeftIn {

    0% {
        opacity: 0;

        transform:
            translateX(-100px)
            skewX(-3deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            skewX(-3deg);
    }
}


@keyframes teamRightIn {

    0% {
        opacity: 0;

        transform:
            translateX(100px)
            skewX(3deg);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            skewX(3deg);
    }
}


@keyframes logoLeftIn {

    0% {
        opacity: 0;

        transform:
            translateX(-100px)
            scale(.7);
    }

    65% {
        opacity: 1;

        transform:
            translateX(10px)
            scale(1.04);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


@keyframes logoRightIn {

    0% {
        opacity: 0;

        transform:
            translateX(100px)
            scale(.7);
    }

    65% {
        opacity: 1;

        transform:
            translateX(-10px)
            scale(1.04);
    }

    100% {
        opacity: 1;

        transform:
            translateX(0)
            scale(1);
    }
}


@keyframes nameIn {

    0% {
        opacity: 0;

        transform:
            translateY(30px);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes vsImpact {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.2);

        filter: blur(8px);
    }

    55% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15);

        filter: blur(0);
    }

    75% {
        transform:
            translate(-50%, -50%)
            scale(.94);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}


@keyframes infoIn {

    0% {
        opacity: 0;

        transform:
            translateY(30px);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes slashImpact {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(0);
    }

    20% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1);
    }

    65% {
        opacity: .75;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1.05);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1.15);
    }
}


@keyframes speedImpact {

    0% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(10px)
            scaleX(0);
    }

    20% {
        opacity: .8;
    }

    100% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(30px)
            scaleX(1);
    }
}


@keyframes rotateRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes rotateVS {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes pulseRing {

    0%,
    100% {
        transform: scale(.95);

        opacity: .25;
    }

    50% {
        transform: scale(1.05);

        opacity: .65;
    }
}


@keyframes particleFloat {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.5);
    }

    30% {
        opacity: .6;
    }

    70% {
        opacity: .35;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-100px)
            scale(1);
    }
}

<body>

<div class="stage" id="stage">

    <!-- Atmosphère -->
    <div class="arena-grid"></div>

    <!-- Lignes -->
    <div class="tech-lines"></div>

    <div class="side-mark left"></div>
    <div class="side-mark right"></div>

    <!-- Speed lines -->
    <div class="speed-lines" id="speedLines"></div>

    <!-- Slash central -->
    <div class="slash"></div>

    <!-- Flash -->
    <div class="flash"></div>

    <!-- Contenu principal -->
    <main class="content">

        <!-- Championnat -->
        <div class="championnat-wrap">

            <div
                class="championnat"
                id="championnat"
            >
                CHAMPIONNAT
            </div>

        </div>


        <!-- Titre -->
        <h1
            class="match-title"
            id="titreMatch"
        >
            MATCH DU SOIR
        </h1>


        <div class="match-title-line"></div>


        <!-- ÉQUIPES -->
        <section class="teams">

            <!-- ÉQUIPE 1 -->
            <div
                class="team left"
                id="team1"
                style="--halo:#1769ff;"
            >

                <div class="logo-box">

                    <img
                        id="logo1"
                        class="logo"
                        src=""
                        alt="Équipe 1"
                    >

                </div>

                <div
                    class="team-name"
                    id="nom1"
                >
                    ÉQUIPE 1
                </div>

            </div>


            <!-- VS -->
            <div class="vs-container">

                <div class="vs">
                    VS
                </div>

            </div>


            <!-- ÉQUIPE 2 -->
            <div
                class="team right"
                id="team2"
                style="--halo:#ed174c;"
            >

                <div class="logo-box">

                    <img
                        id="logo2"
                        class="logo"
                        src=""
                        alt="Équipe 2"
                    >

                </div>

                <div
                    class="team-name"
                    id="nom2"
                >
                    ÉQUIPE 2
                </div>

            </div>

        </section>


        <!-- INFORMATIONS -->
        <div class="match-info">

            <div class="info-block">

                <span class="info-label">
                    DATE
                </span>

                <span
                    class="info-value"
                    id="date"
                >
                    SAMEDI
                </span>

            </div>


            <div class="info-separator"></div>


            <div class="info-block">

                <span class="info-label">
                    COUP D'ENVOI
                </span>

                <span
                    class="info-value"
                    id="heure"
                >
                    20H00
                </span>

            </div>

        </div>

    </main>


    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Particules -->
    <div
        class="particles"
        id="particles"
    ></div>

</div>


<!-- =====================================================
     FIREBASE
     ===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   CONFIG FIREBASE
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

    authDomain:
        "diffusion-b9afa.firebaseapp.com",

    databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "diffusion-b9afa",

    storageBucket:
        "diffusion-b9afa.firebasestorage.app",

    messagingSenderId:
        "674799570797",

    appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"
};


/* =====================================================
   INITIALISATION
   ===================================================== */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const matchRef = ref(
    db,
    "matchdusoir"
);


/* =====================================================
   DOM
   ===================================================== */

const body =
    document.body;

const stage =
    document.getElementById("stage");

const championnat =
    document.getElementById("championnat");

const titreMatch =
    document.getElementById("titreMatch");

const nom1 =
    document.getElementById("nom1");

const nom2 =
    document.getElementById("nom2");

const logo1 =
    document.getElementById("logo1");

const logo2 =
    document.getElementById("logo2");

const date =
    document.getElementById("date");

const heure =
    document.getElementById("heure");

const team1 =
    document.getElementById("team1");

const team2 =
    document.getElementById("team2");

const speedLines =
    document.getElementById("speedLines");

const particles =
    document.getElementById("particles");


/* =====================================================
   SPEED LINES
   ===================================================== */

const angles = [

    0,
    18,
    36,
    54,
    72,
    90,
    108,
    126,
    144,
    162,
    180,
    198,
    216,
    234,
    252,
    270,
    288,
    306,
    324,
    342

];


angles.forEach(
    angle => {

        const line =
            document.createElement("div");

        line.className =
            "speed-line";

        line.style.setProperty(
            "--angle",
            `${angle}deg`
        );

        line.style.animationDelay =
            `${Math.random() * .18}s`;

        speedLines.appendChild(line);

    }
);


/* =====================================================
   PARTICULES
   ===================================================== */

for (
    let i = 0;
    i < 30;
    i++
) {

    const particle =
        document.createElement("div");

    particle.className =
        "particle";

    particle.style.left =
        `${Math.random() * 100}%`;

    particle.style.top =
        `${Math.random() * 100}%`;

    particle.style.setProperty(
        "--duration",
        `${3 + Math.random() * 5}s`
    );

    particle.style.setProperty(
        "--delay",
        `${Math.random() * 5}s`
    );

    particles.appendChild(
        particle
    );
}


/* =====================================================
   HEX → RGB
   ===================================================== */

function hexToRgb(hex) {

    if (
        typeof hex !== "string"
    ) {
        return {
            r: 255,
            g: 255,
            b: 255
        };
    }

    let value =
        hex.replace("#", "").trim();

    if (
        value.length === 3
    ) {

        value =
            value
                .split("")
                .map(
                    c => c + c
                )
                .join("");

    }

    if (
        !/^[0-9a-fA-F]{6}$/.test(value)
    ) {

        return {
            r: 255,
            g: 255,
            b: 255
        };

    }

    return {

        r: parseInt(
            value.substring(0, 2),
            16
        ),

        g: parseInt(
            value.substring(2, 4),
            16
        ),

        b: parseInt(
            value.substring(4, 6),
            16
        )

    };

}


/* =====================================================
   ANIMATIONS
   ===================================================== */

function restartAnimations() {

    const animatedElements = [

        document.querySelector(
            ".championnat-wrap"
        ),

        titreMatch,

        document.querySelector(
            ".match-title-line"
        ),

        team1,

        team2,

        logo1,

        logo2,

        document.querySelector(
            ".team.left .team-name"
        ),

        document.querySelector(
            ".team.right .team-name"
        ),

        document.querySelector(
            ".vs-container"
        ),

        document.querySelector(
            ".match-info"
        ),

        document.querySelector(
            ".slash"
        )

    ];


    stage.classList.remove(
        "loaded"
    );

    animatedElements.forEach(
        element => {

            if (!element) {
                return;
            }

            element.style.animation =
                "none";

            void element.offsetWidth;

            element.style.animation =
                "";

        }
    );


    document
        .querySelectorAll(".speed-line")
        .forEach(
            line => {

                line.style.animation =
                    "none";

                void line.offsetWidth;

                line.style.animation =
                    "";

            }
        );


    void stage.offsetWidth;

    stage.classList.add(
        "loaded"
    );

}


/* =====================================================
   MISE À JOUR HALOS
   ===================================================== */

function setHalo(
    element,
    color
) {

    const safeColor =
        color || "#ffffff";

    const rgb =
        hexToRgb(
            safeColor
        );

    element.style.setProperty(
        "--halo",
        safeColor
    );

    element.style.setProperty(
        "--halo-rgb",
        `${rgb.r},${rgb.g},${rgb.b}`
    );

}


/* =====================================================
   FIREBASE
   ===================================================== */

onValue(
    matchRef,

    snapshot => {

        const data =
            snapshot.val();


        /* ---------------------------------------------
           PAS DE DONNÉES
           --------------------------------------------- */

        if (!data) {

            championnat.textContent =
                "CHAMPIONNAT";

            titreMatch.textContent =
                "MATCH DU SOIR";

            nom1.textContent =
                "ÉQUIPE 1";

            nom2.textContent =
                "ÉQUIPE 2";

            date.textContent =
                "SAMEDI";

            heure.textContent =
                "20H00";


            logo1.removeAttribute(
                "src"
            );

            logo2.removeAttribute(
                "src"
            );


            document.documentElement.style.setProperty(
                "--halo1-rgb",
                "255,255,255"
            );

            document.documentElement.style.setProperty(
                "--halo2-rgb",
                "255,255,255"
            );


            setHalo(
                team1,
                "#ffffff"
            );

            setHalo(
                team2,
                "#ffffff"
            );


            body.classList.add(
                "loaded"
            );

            restartAnimations();

            return;
        }


        /* ---------------------------------------------
           TEXTES
           --------------------------------------------- */

        championnat.textContent =
            data.championnat ||
            "CHAMPIONNAT";


        titreMatch.textContent =
            data.titreMatch ||
            "MATCH DU SOIR";


        nom1.textContent =
            data.equipe1 ||
            "ÉQUIPE 1";


        nom2.textContent =
            data.equipe2 ||
            "ÉQUIPE 2";


        date.textContent =
            data.date ||
            "SAMEDI";


        heure.textContent =
            data.heure ||
            "20H00";


        /* ---------------------------------------------
           COULEURS
           --------------------------------------------- */

        const couleur1 =
            data.haloCouleur1 ||
            "#1769ff";

        const couleur2 =
            data.haloCouleur2 ||
            "#ed174c";


        const rgb1 =
            hexToRgb(
                couleur1
            );

        const rgb2 =
            hexToRgb(
                couleur2
            );


        document.documentElement.style.setProperty(
            "--halo1",
            couleur1
        );

        document.documentElement.style.setProperty(
            "--halo2",
            couleur2
        );


        document.documentElement.style.setProperty(
            "--halo1-rgb",
            `${rgb1.r},${rgb1.g},${rgb1.b}`
        );

        document.documentElement.style.setProperty(
            "--halo2-rgb",
            `${rgb2.r},${rgb2.g},${rgb2.b}`
        );


        setHalo(
            team1,
            couleur1
        );

        setHalo(
            team2,
            couleur2
        );


        /* ---------------------------------------------
           LOGOS
           --------------------------------------------- */

        if (
            data.logo1
        ) {

            logo1.src =
                data.logo1;

        } else {

            logo1.removeAttribute(
                "src"
            );

        }


        if (
            data.logo2
        ) {

            logo2.src =
                data.logo2;

        } else {

            logo2.removeAttribute(
                "src"
            );

        }


        /* ---------------------------------------------
           AFFICHAGE
           --------------------------------------------- */

        body.classList.add(
            "loaded"
        );


        restartAnimations();

    },

    error => {

        console.error(
            "Erreur Firebase matchdusoir :",
            error
        );


        body.classList.add(
            "loaded"
        );

        stage.classList.add(
            "loaded"
        );

    }
);

</script>

</body>
</html>
