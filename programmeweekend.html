<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programme du Week-End — MVBC</title>

<!-- Police Barlow Condensed (style boutique) -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    margin: 0;
    background: #0b0b0d;
    color: #eaeaea;
    font-family: "Segoe UI", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden; /* AUCUN SCROLL : tout tient dans l'écran */
}

/* =========================
   EN-TÊTE — STYLE "LA BOUTIQUE"
   Titre Barlow Condensed, barre colorée en slash,
   ombres décalées noir/jaune/rouge/bleu.
========================= */
:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
}

.header {
    flex: 0 0 auto;
    position: relative;
    text-align: center;
    padding: 1.6vh 20px 1vh;
    z-index: 10;
}

.header .title-container {
    position: relative;
    display: inline-block;
}

/* Barre colorée derrière le titre */
.header .slash {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) rotate(-7deg);
    width: min(46vw, 900px);
    height: 14px;
    background: linear-gradient(
        90deg,
        transparent,
        var(--blue) 12%,
        var(--yellow) 35%,
        var(--white) 50%,
        var(--yellow) 65%,
        var(--red) 88%,
        transparent
    );
    box-shadow: 0 0 40px rgba(23,105,255,.45);
    z-index: -1;
}

.header h1 {
    margin: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(28px, 5.5vh, 64px);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--white);
    white-space: nowrap;
    text-shadow:
        3px 3px 0 var(--black),
        5px 5px 0 var(--yellow),
        8px 8px 0 rgba(237,23,76,.9),
        11px 11px 0 rgba(23,105,255,.5);
}

.header .sous-titre {
    color: #77777e;
    font-size: clamp(10px, 1.5vh, 15px);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 0.8vh;
    font-weight: 600;
}

/* =========================
   GRILLE : REMPLIT L'ÉCRAN
   Cartes allongées "type ligne" : colonnes larges,
   peu de lignes -> chaque carte est horizontale.
========================= */
#grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(430px, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 1vh 0.8vw;
    padding: 0 1vw 1vh;
    align-content: stretch;
}

/* =========================
   CARTE — DESIGN ÉPURÉ
   Une seule couleur par carte : la fine barre latérale
   gauche qui code le lieu.
   EXTERIEUR -> blanc | ST GEORGES -> jaune
   ST HILAIRE -> rouge            | MONTAIGU -> bleu
========================= */
.carte {
    background: #161619;
    border: 1px solid #26262a;
    border-radius: 12px;
    padding: 0.9vh 0.9vw 0.7vh calc(0.9vw + 4px);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: apparition 0.4s ease both;
}

/* Barre colorée du lieu, verticale à gauche */
.carte::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: #3a3a3f;
}

.carte.lieu-exterieur::before { background: #ffffff; }
.carte.lieu-stgeorges::before { background: #f5b301; }
.carte.lieu-sthilaire::before { background: #e5484d; }
.carte.lieu-montaigu::before  { background: #3b82f6; }

@keyframes apparition {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* LIGNE DU HAUT : CHAMPIONNAT + JOUR/HEURE */
.carte-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 0.5vh;
}

.championnat {
    color: #9a9aa2;
    font-weight: 700;
    font-size: clamp(10px, 1.5vh, 15px);
    letter-spacing: 1px;
    white-space: nowrap;
}

.horaire {
    text-align: right;
    white-space: nowrap;
    line-height: 1.15;
    color: #ffffff;
}

.horaire .jour {
    color: #88888f;
    font-weight: 600;
    font-size: clamp(9px, 1.3vh, 12px);
    text-transform: uppercase;
}

.horaire .heure {
    font-size: clamp(12px, 1.9vh, 19px);
    font-weight: 800;
}

/* ÉQUIPES SUR 2 COLONNES — compactes, une ligne chacune */
.equipes {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 0 0.5vw;
}

.equipe {
    font-size: clamp(7px, 1.15vh, 11.5px);
    font-weight: 600;
    line-height: 1.15;
    word-break: break-word;
    color: #cfcfd6;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.equipe.mvbc {
    color: #ffffff;
    font-weight: 800;
}

.vs {
    color: #4a4a52;
    font-size: clamp(7px, 1vh, 10px);
    font-weight: 700;
    padding: 0 0.2vw;
}

/* LIEU + OFFICIELS — mis en avant */
.footer-carte {
    border-top: 1px solid #232327;
    margin-top: 0.4vh;
    padding-top: 0.45vh;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    font-size: clamp(8.5px, 1.35vh, 13px);
}

.lieu {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 42%;
    color: #e8e8ec;
    font-weight: 700;
    letter-spacing: 0.3px;
}

.lieu.exterieur {
    color: #ffffff;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

/* Bloc officiel : arbitres et responsable de table
   BIEN SÉPARÉS, chacun avec son icône — texte clair */
.officiels {
    text-align: right;
    max-width: 60%;
    line-height: 1.3;
    white-space: pre-line;
}

.officiels .bloc {
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    gap: 5px;
}

.officiels .bloc + .bloc {
    margin-top: 0.3vh;
}

.officiels .bloc .ico {
    flex: 0 0 auto;
    font-size: 0.9em;
    opacity: 0.9;
}

.officiels .bloc .noms {
    color: #ececf1;
    font-weight: 600;
}

.officiels .bloc.table .noms {
    color: #bcbcc4;
}

/* =========================
   RÉ-APPARITION PÉRIODIQUE
   Toutes les 10 s, la grille "rejoue" l'animation
   d'apparition des cartes (effet de vague dynamique).
========================= */
@keyframes apparition {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* =========================
   ÉTAT VIDE
========================= */
.vide {
    grid-column: 1 / -1;
    text-align: center;
    color: #555;
    font-size: clamp(16px, 2.5vh, 26px);
    align-self: center;
}
</style>
</head>

<body>

<div class="header">
    <div class="title-container">
        <div class="slash"></div>
        <h1>PROGRAMME DU WEEK-END À DOMICILE</h1>
    </div>
    <div class="sous-titre" id="sousTitre"> </div>
</div>

<div id="grid" class="grid">
    <div class="vide">Chargement du programme...</div>
</div>

<!-- =====================================================
     FIREBASE
===================================================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
    authDomain: "diffusion-b9afa.firebaseapp.com",
    databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "diffusion-b9afa",
    storageBucket: "diffusion-b9afa.firebasestorage.app",
    messagingSenderId: "674799570797",
    appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const programmeRef = ref(db, "programmeweekend");

const grid = document.getElementById("grid");
const sousTitreEl = document.getElementById("sousTitre");

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
}

function estMVBC(nom) {
    return /MONTAIGU|MVBC/i.test(nom || "");
}

/* =====================================================
   RACCOURCIS DES NOMS D'ÉQUIPES
===================================================== */
const ABREVIATIONS = [
    [/MONTAIGU VENDEE BASKET CLUB\s*[-–]?\s*(\d+)/gi, "MVBC $1"],
    [/MONTAIGU VENDEE BASKET CLUB/gi, "MVBC"],
    [/BASKET CLUB OYEN CECILIEN/gi, "BC OYEN CECILIEN"],
    [/BASKET CLUB LES ESSARTS BOULOGNE LA MERLATIERE/gi, "BC ESSARTS BLM"],
    [/BASKET CLUB GUYONS SEPTIEROIS/gi, "BC GUYONS SEPT."],
    [/CHAMBRETAUD SAINT-MALO VENDÉE BASKET/gi, "CHAMBRETAUD SM VB"],
    [/CHANTONNAY-ST GERMAIN BASKET/gi, "CHANTONNAY-ST G. BASKET"],
    [/HERBIERS VENDEE BASKET/gi, "HERBIERS VB"],
    [/SMASH VENDEE SUD LOIRE BASKET/gi, "SMASH VS LOIRE"],
    [/IE - CTC BASSE GOULAINE - SAINT SEBASTIEN - VERTOU/gi, "IE CTC BG-SS-V"],
    [/IE - CTC LOIRE ET PLAINE BASKET/gi, "IE CTC LOIRE & PLAINE"],
    [/IE - SAINTE GEMME LA PLAINE/gi, "IE STE GEMME LA P."],
    [/NORD VENDEE BASKET/gi, "NORD VENDÉE BC"],
    [/ROCHE VENDEE BC/gi, "ROCHE VENDÉE BC"],
    [/BCCF VENDEE/gi, "BCCF VENDÉE"],
    [/MORTAGNE SUR SEVRE/gi, "MORTAGNE/SÈVRE"],
    [/JAM BASKET CLUB/gi, "JAM BC"],
    [/AMICALE SPORTIVE NIORTAISE/gi, "AS NIORTAISE"],
    [/BASKET CLUB/gi, "BC"]
];

function raccourcir(nom) {
    if (!nom) return "";
    let resultat = nom.trim();
    ABREVIATIONS.forEach(([motif, remplacement]) => {
        resultat = resultat.replace(motif, remplacement);
    });
    return resultat;
}

function raccourcirLieu(lieu) {
    return (lieu || "")
        .replace(/ST GEORGES SALLE A/gi, "ST GEORGES A")
        .replace(/ST GEORGES SALLE B/gi, "ST GEORGES B")
        .replace(/ST HILAIRE SALLE A/gi, "ST HILAIRE A")
        .replace(/ST HILAIRE SALLE B/gi, "ST HILAIRE B")
        .replace(/MONTAIGU SALLE MAINE/gi, "MONTAIGU MAINE")
        .replace(/MONTAIGU SALLE SEVRE/gi, "MONTAIGU SÈVRE");
}

/* =====================================================
   ARBITRES vs RESPONSABLE DE TABLE — BIEN SÉPARÉS
   arbitres (colonne 6) et table (colonne 7) sont
   stockés séparément dans Firebase.
   Chaque champ peut contenir 2 noms (retour à la ligne,
   " - ", "," ou "/").
===================================================== */
function separerNoms(brut) {
    if (!brut) return "";
    return brut
        .split(/\r?\n|\s*[-–]\s*|\s*\/\s*|\s*,\s*/)
        .map(n => n.trim())
        .filter(Boolean)
        .join("\n");
}

function blocOfficiels(m) {
    const arbitres = separerNoms(m.arbitres || m.officiels);
    const table = separerNoms(m.table);

    let html = "";

    if (arbitres) {
        html += `<div class="bloc arbitres">
            <span class="ico">🦺</span>
            <span class="noms">${escapeHtml(arbitres)}</span>
        </div>`;
    }

    if (table) {
        html += `<div class="bloc table">
            <span class="ico">📋</span>
            <span class="noms">${escapeHtml(table)}</span>
        </div>`;
    }

    return html ? `<div class="officiels">${html}</div>` : "";
}

/* =====================================================
   TRI : SAMEDI d'abord, puis DIMANCHE,
   et à l'intérieur de chaque jour, par horaire croissant
===================================================== */
function heureVersMinutes(h) {
    const m = (h || "").match(/(\d{1,2})\s*[hH:]\s*(\d{2})/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : 24 * 60;
}

function ordreJour(jour) {
    return /DIM/i.test(jour || "") ? 1 : 0;
}

function trierMatchs(matchs) {
    return [...matchs].sort((a, b) =>
        ordreJour(a.jour) - ordreJour(b.jour) ||
        heureVersMinutes(a.heure) - heureVersMinutes(b.heure)
    );
}

/* =====================================================
   COULEUR DE LA BARRE SELON LE LIEU
===================================================== */
function classeLieu(lieu) {
    const l = (lieu || "").toUpperCase();
    if (l.includes("EXTERIEUR") || l.includes("EXTÉRIEUR")) return "lieu-exterieur";
    if (l.includes("ST GEORGES") || l.includes("ST-GEORGES")) return "lieu-stgeorges";
    if (l.includes("ST HILAIRE") || l.includes("ST-HILAIRE")) return "lieu-sthilaire";
    if (l.includes("MONTAIGU")) return "lieu-montaigu";
    return "";
}

function creerCarte(m, index) {
    const carte = document.createElement("div");
    const exterieur = (m.lieu || "").toUpperCase().includes("EXTERIEUR");
    carte.className = "carte " + classeLieu(m.lieu);
    carte.dataset.index = index;
    carte.style.animationDelay = (Math.min(index, 40) * 0.04) + "s";

    /* Équipe MVBC toujours affichée à gauche, adversaire à droite */
    let eqMVBC, eqAdv;
    if (estMVBC(m.equipe1)) {
        eqMVBC = m.equipe1;
        eqAdv = m.equipe2;
    } else {
        eqMVBC = m.equipe2;
        eqAdv = m.equipe1;
    }

    carte.innerHTML = `
        <div class="carte-top">
            <span class="championnat">${escapeHtml(raccourcir(m.championnat))}</span>
            <div class="horaire">
                <div class="jour">${escapeHtml(m.jour)}</div>
                <div class="heure">${escapeHtml(m.heure)}</div>
            </div>
        </div>
        <div class="equipes">
            <div class="equipe mvbc">${escapeHtml(raccourcir(eqMVBC))}</div>
            <div class="vs">VS</div>
            <div class="equipe">${escapeHtml(raccourcir(eqAdv))}</div>
        </div>
        <div class="footer-carte">
            <div class="lieu ${exterieur ? "exterieur" : ""}">
                ${exterieur ? "🚌 EXTERIEUR" : "📍 " + escapeHtml(raccourcirLieu(m.lieu))}
            </div>
            ${blocOfficiels(m)}
        </div>
    `;

    return carte;
}

/* =====================================================
   RÉ-APPARITION PÉRIODIQUE : toutes les 10 secondes,
   la grille rejoue l'animation d'apparition des cartes
   (pas de carrousel, tout reste affiché en permanence).
===================================================== */
const INTERVAL_APPARITION_MS = 40000;
let timerApparition = null;

function rejouerApparition() {
    grid.querySelectorAll(".carte").forEach(carte => {
        carte.style.animation = "none";
        void carte.offsetWidth; /* force le recalcul pour relancer l'anim */
        carte.style.animation = "";
        carte.style.animationDelay = (Math.min(carte.dataset.index || 0, 40) * 0.04) + "s";
    });
}

function demarrerApparitionPeriodique() {
    arreterApparitionPeriodique();
    timerApparition = setInterval(rejouerApparition, INTERVAL_APPARITION_MS);
}

function arreterApparitionPeriodique() {
    if (timerApparition) {
        clearInterval(timerApparition);
        timerApparition = null;
    }
}

function afficherProgramme(data) {
    grid.innerHTML = "";
    arreterApparitionPeriodique();

    if (data && data.sousTitre) {
        sousTitreEl.textContent = data.sousTitre;
    }

    let matchs = (data && Array.isArray(data.matchs)) ? data.matchs : [];

    if (matchs.length === 0) {
        grid.innerHTML = '<div class="vide">Aucun programme enregistré pour le moment.</div>';
        return;
    }

    /* Seuls les matchs À DOMICILE sont affichés */
    matchs = trierMatchs(matchs.filter(m =>
        m && (m.equipe1 || m.equipe2) &&
        !(m.lieu || "").toUpperCase().includes("EXTERIEUR")
    ));

    if (matchs.length === 0) {
        grid.innerHTML = '<div class="vide">Aucun match à domicile programmé.</div>';
        return;
    }

    matchs.forEach((m, i) => {
        if (!m || (!m.equipe1 && !m.equipe2)) return;
        grid.appendChild(creerCarte(m, i));
    });

    /* Une fois toutes les cartes affichées : ré-apparition
       de la grille toutes les 10 s (pas de carrousel) */
    demarrerApparitionPeriodique();
}

/* Écoute en temps réel : mise à jour dès qu'on enregistre
   un nouveau programme depuis admin.html */
onValue(programmeRef, (snapshot) => {
    afficherProgramme(snapshot.val());
});
</script>
</body>
</html>
