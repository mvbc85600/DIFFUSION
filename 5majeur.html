    /* =====================================================
       RESET
    ===================================================== */

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {
        --white: #f7f7f5;
        --black: #050608;
        --red: #ed174c;
        --blue: #1769ff;
        --yellow: #ffd400;

        --court-line: rgba(255, 255, 255, 0.75);
    }


    /* =====================================================
       FOND
    ===================================================== */

    body {
        position: relative;

        background:
            radial-gradient(
                circle at center 55% 55%,
                #252000 0%,
                #100e00 35%,
                #050500 65%,
                #000 100%
            );
    }

    body::before {
        content: "";

        position: fixed;

        width: 900px;
        height: 900px;

        left: 50%;
        top: 55%;

        transform: translate(-50%, -50%);

        background:
            radial-gradient(
                circle,
                rgba(255, 204, 0, 0.20) 0%,
                rgba(255, 204, 0, 0.08) 25%,
                rgba(255, 204, 0, 0.02) 50%,
                transparent 70%
            );

        pointer-events: none;

        animation: halo 4s ease-in-out infinite;
    }

    @keyframes halo {

        0% {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }

        50% {
            transform: translate(-50%, -50%) scale(1.10);
            opacity: 1;
        }

        100% {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }
    }


    /* =====================================================
       TITRE
       STYLE CONSERVÉ
    ===================================================== */

    .title-container {
        position: relative;

        height: 105px;

        margin-top: 12px;

        z-index: 100;

    }

    .partner-title {
        position: relative;

        font-size: clamp(42px, 6vw, 90px);

        font-weight: 900;

        line-height: 0.9;

        letter-spacing: -0.04em;

        color: var(--white);

        text-align: center;

        white-space: nowrap;

        text-shadow:

            11px 11px 0 rgba(237, 23, 76, .9),
            15px 15px 0 rgba(23, 105, 255, .5);
    }

    .slash {
        position: absolute;

        left: 50%;
        top: 50%;

        height: 18px;

                var(--white) 50%,
                var(--yellow) 65%,
                var(--red) 88%,

            );

            0 0 40px rgba(23, 105, 255, .45);

        z-index: -1;
    }


    /* =====================================================
       ZONE DU TERRAIN — FORMAT 16:9
    ===================================================== */

    .players-container {
        position: relative;

        width: 100%;

        height: calc(100vh - 125px);

        display: flex;

        justify-content: center;

        align-items: flex-start;

        padding-top: 100px;
    }


    /* =====================================================
       DEMI-TERRAIN

       Aucun contour extérieur.
       Seules les lignes de jeu sont affichées.
    ===================================================== */

    .court {
        position: relative;

        width: min(66vw, 900px);

        height: min(70vh, 700px);

        aspect-ratio: 15 / 14;

        background:
            linear-gradient(
                180deg,
                rgba(255, 212, 0, .018),
                rgba(255, 212, 0, .006)
            );

        overflow: visible;
    }


    /* =====================================================
       LIGNE CENTRALE DISCRÈTE
    ===================================================== */

    .court::after {
        content: "";

        position: absolute;

        left: 50%;
        top: 0;

        width: 1px;
        height: 100%;

        transform: translateX(-50%);

        background:
            rgba(255,255,255,.025);

        pointer-events: none;
    }


    /* =====================================================
       RAQUETTE
    ===================================================== */

    .paint {
        position: absolute;

        width: 32.7%;

        height: 41%;

        left: 50%;

        bottom: 0;

        transform: translateX(-50%);

        border-left:
            3px solid var(--court-line);

        border-right:
            3px solid var(--court-line);

        border-top:
            3px solid var(--court-line);

        background:
            linear-gradient(
                180deg,
                rgba(255,255,255,.035),
                rgba(255,212,0,.012)
            );

        box-shadow:
            inset 0 0 30px rgba(255,212,0,.025);
    }


    /* =====================================================
       LIGNE DES LANCERS FRANCS
    ===================================================== */

    .free-throw-line {
        position: absolute;

        left: 50%;

        bottom: 41%;

        width: 32.7%;

        height: 3px;

        transform: translateX(-50%);

        background:
            var(--court-line);

        box-shadow:
            0 0 8px rgba(255,255,255,.12);
    }


    /* =====================================================
       PETIT DEMI-ARC DES LANCERS

       IMPORTANT :
       - ce n'est plus un cercle complet
       - il est plus petit que la raquette
       - il est centré dans la raquette
    ===================================================== */

    .free-throw-circle {
        position: absolute;

        width: 25%;

        height: 12.5%;

        left: 50%;

        bottom: 41%;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100% 100% 0 0;

        pointer-events: none;
    }


    /* =====================================================
       PETIT DEMI-CERCLE SOUS LE PANIER
    ===================================================== */

    .restricted-area {
        position: absolute;

        width: 13%;

        height: 6.5%;

        left: 50%;

        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100px 100px 0 0;

        pointer-events: none;
    }


    /* =====================================================
       PANIER
    ===================================================== */

    .basket {
        position: absolute;

        left: 50%;

        bottom: -4px;

        transform: translateX(-50%);

        width: 8%;

        height: 7px;

        background:
            var(--red);

        border-radius: 10px;

        box-shadow:
            0 0 8px var(--red),
            0 0 20px rgba(237,23,76,.7),
            0 0 35px rgba(237,23,76,.25);

        animation:
            basketPulse 2.4s ease-in-out infinite;
    }

    @keyframes basketPulse {

        0%,
        100% {
            box-shadow:
                0 0 8px var(--red),
                0 0 20px rgba(237,23,76,.7);
        }

        50% {
            box-shadow:
                0 0 12px var(--red),
                0 0 30px rgba(237,23,76,.9),
                0 0 45px rgba(237,23,76,.3);
        }
    }


    /* =====================================================
       PANNEAU
    ===================================================== */

    .backboard {
        position: absolute;

        left: 50%;

        bottom: 18px;

        transform: translateX(-50%);

        width: 13%;

        height: 5px;

        background:
            var(--white);

        border-radius: 3px;

        box-shadow:
            0 0 8px rgba(255,255,255,.5),
            0 0 18px rgba(255,255,255,.15);
    }


    /* =====================================================
       LIGNE À 3 POINTS

       ABAISSÉE POUR PASSER SOUS
       LES POINTS DES JOUEURS 1 / 2 / 3
    ===================================================== */

    .three-point {
        position: absolute;

        /*
         * Avant : 91% de hauteur
         *
         * Maintenant : 72%
         *
         * Cela rapproche le sommet de l'arc
         * du panier et place les joueurs 1/2/3
         * au-dessus de la ligne.
         */

        width: 94%;

        height: 72%;

        left: 50%;

        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            50% 50% 0 0;

        pointer-events: none;

        filter:
            drop-shadow(
                0 0 5px
                rgba(255,255,255,.10)
            );
    }


    /*
     * Masque le raccord sous le panier.
     */

    .three-point::after {
        content: "";

        position: absolute;

        left: 50%;

        bottom: -5px;

        width: 18%;

        height: 9px;

        transform: translateX(-50%);

        background:
            #100e00;
    }


    /* =====================================================
       JOUEURS
    ===================================================== */

    .players-list {
        position: absolute;

        inset: 0;

        width: 100%;
        height: 100%;

        z-index: 10;
    }


    .player {
        position: absolute;

        width:
            clamp(150px, 14.5vw, 215px);

        padding:
            13px 16px;

        background:
            linear-gradient(
                145deg,
                rgba(35,35,35,.98),
                rgba(5,5,5,.98)
            );

        border:
            2px solid rgba(255,255,255,.75);

        border-radius:
            14px;

        font-family:
            "Inter",
            sans-serif;

        font-size:
            clamp(18px, 1.65vw, 27px);

        font-weight:
            800;

        color:
            #fff;

        text-align:
            center;

        box-shadow:
            0 0 12px rgba(255,255,255,.35),

        transform:
            translate(-50%, -50%);

        z-index:
            20;

        transition:
            transform .3s ease,

    }


    .player:hover {
        transform:
            translate(-50%, -50%)
            scale(1.08);

        box-shadow:
            0 0 20px rgba(255,212,0,.8),
            0 0 45px rgba(255,212,0,.45);
    }


    /* =====================================================
       JOUEUR 1
       
       MENEUR
       AU-DESSUS DE LA LIGNE À 3 POINTS

    .player.position-1 {
        left: 50%;

        top: 15%;
    }


    /* =====================================================
       JOUEUR 2
       
       AILE GAUCHE

    .player.position-2 {

    .player.position-3 {

    /* =====================================================

    /* =====================================================

    .player-number {

    /* =====================================================

    .player::after {
        content: "";

<!-- =====================================================
     TITRE
===================================================== -->

<div class="title-container">

    <div class="slash"></div>

    <h1 class="partner-title">
        LE 5
    </h1>

</div>


<!-- =====================================================
     DEMI-TERRAIN
===================================================== -->

<div class="players-container">

    <div class="court">

        <!-- Ligne à 3 points -->
        <div class="three-point"></div>

        <!-- Raquette -->
        <div class="paint"></div>

        <!-- Ligne des lancers francs -->
        <div class="free-throw-line"></div>

        <!-- Petit demi-arc des lancers francs -->
        <div class="free-throw-circle"></div>

        <!-- Zone restrictive -->
        <div class="restricted-area"></div>

        <!-- Panneau -->
        <div class="backboard"></div>

        <!-- Panier -->
        <div class="basket"></div>

        <!-- Joueurs -->
        <div
            class="players-list"
            id="playersList">
        </div>

    </div>

</div>


<!-- =====================================================
     BARRE LUMINEUSE
===================================================== -->

<div class="light-line"></div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    const firebaseConfig = {

        apiKey:
            "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

        authDomain:
            "diffusion-b9afa.firebaseapp.com",

        databaseURL:
            "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "diffusion-b9afa",

        storageBucket:
            "diffusion-b9afa.firebasestorage.app",

        messagingSenderId:
            "674799570797",

        appId:
            "1:674799570797:web:0d8b7a2a892f604eb7d464"
    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getDatabase(app);


    const cinqMajeurRef =
        ref(
            db,
            "cinqmajeur"
        );


    /* =====================================================
       CHARGEMENT DES JOUEURS
    ===================================================== */

    onValue(
        cinqMajeurRef,
        (snapshot) => {

            const data =
                snapshot.val() || {};


            const players =
                data.players || [];


            const playerNumbers =
                data.playerNumbers || {};


            const playersList =
                document.getElementById(
                    "playersList"
                );


            playersList.innerHTML = "";


            players
                .slice(0, 5)
                .forEach(
                    (player, index) => {

                        const playerDiv =
                            document.createElement(
                                "div"
                            );


                        playerDiv.className =
                            `player position-${index + 1}`;


                        /* Numéro */

                        const playerNumber =
                            playerNumbers[player];


                        if (
                            playerNumber !== undefined
                        ) {

                            const numberSpan =
                                document.createElement(
                                    "span"
                                );


                            numberSpan.className =
                                "player-number";


                            numberSpan.textContent =
                                `#${playerNumber}`;


                            playerDiv.appendChild(
                                numberSpan
                            );
                        }


                        /* Nom */

                        const nameSpan =
                            document.createElement(
                                "span"
                            );


                        nameSpan.textContent =
                            player;


                        nameSpan.style.color =
                            "#fff";


                        playerDiv.appendChild(
                            nameSpan
                        );


                        playersList.appendChild(
                            playerDiv
                        );

                    }
                );

        }
    );

</script>
