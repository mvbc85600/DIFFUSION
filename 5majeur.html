<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Majeur - MVBC</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

    /* =====================================================
       RESET
    ===================================================== */

    *
    {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body
    {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================================
       VARIABLES
    ===================================================== */

    :root
    {
        --white: #f7f7f5;
        --black: #050608;
        --red: #ed174c;
        --blue: #1769ff;
        --yellow: #ffd400;

        --court-line: rgba(255, 255, 255, 0.75);
    }

    /* =====================================================
       FOND
    ===================================================== */

    body
    {
        position: relative;

        background:
            radial-gradient(
                circle at center 55% 55%,
                #252000 0%,
                #100e00 35%,
                #050500 65%,
                #000 100%
            );
    }

    body::before
    {
        content: "";

        position: fixed;

        width: 990px; /* Agrandi de 10% (900px -> 990px) */
        height: 990px; /* Agrandi de 10% */

        left: 50%;
        top: 55%;

        transform: translate(-50%, -50%);

        background:
            radial-gradient(
                circle,
                rgba(255, 204, 0, 0.20) 0%,
                rgba(255, 204, 0, 0.08) 25%,
                rgba(255, 204, 0, 0.02) 50%,
                transparent 70%
            );

        pointer-events: none;

        animation: halo 4s ease-in-out infinite;
    }

    @keyframes halo
    {
        0%
        {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }

        50%
        {
            transform: translate(-50%, -50%) scale(1.10);
            opacity: 1;
        }

        100%
        {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }
    }

    /* =====================================================
       TITRE
    ===================================================== */

    .title-container
    {
        position: relative;

        width: 100%;
        height: 115px; /* Augmenté de 10% (105px -> 115px) */

        margin-top: 12px;

        z-index: 100;

        text-align: center;
    }

    .partner-title
    {
        position: relative;

        font-family: "Barlow Condensed", sans-serif;

        font-size: clamp(46px, 6.6vw, 99px); /* Augmenté de 10% */

        font-weight: 900;

        line-height: 0.9;

        letter-spacing: -0.04em;

        color: var(--white);

        text-align: center;

        white-space: nowrap;

        text-shadow:
            4px 4px 0 var(--black),
            7px 7px 0 var(--yellow),
            11px 11px 0 rgba(237, 23, 76, .9),
            15px 15px 0 rgba(23, 105, 255, .5);
    }

    .slash
    {
        position: absolute;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%)
            rotate(-7deg);

        width: min(70.4vw, 935px); /* Augmenté de 10% (850px -> 935px) */
        height: 20px; /* Augmenté de 10% (18px -> 20px) */

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--blue) 12%,
                var(--yellow) 35%,
                var(--white) 50%,
                var(--yellow) 65%,
                var(--red) 88%,
                transparent
            );

        box-shadow:
            0 0 40px rgba(23, 105, 255, .45);

        z-index: -1;
    }

    /* =====================================================
       ZONE DU TERRAIN
    ===================================================== */

    .players-container
    {
        position: relative;

        width: 100%;
        height: calc(100vh - 165px); /* Augmenté de 10% (150px -> 165px) */
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 0;
    }

    /* =====================================================
       DEMI-TERRAIN
    ===================================================== */

    .court
    {
        position: relative;

        width: min(72.6vw, 990px); /* Augmenté de 10% (66vw -> 72.6vw, 900px -> 990px) */
        height: min(71.5vh, 715px); /* Augmenté de 10% (65vh -> 71.5vh, 650px -> 715px) */
        aspect-ratio: 15 / 14;

        background:
            linear-gradient(
                180deg,
                rgba(255, 212, 0, .018),
                rgba(255, 212, 0, .006)
            );

        overflow: visible;
    }

    /* =====================================================
       LIGNE CENTRALE DISCRÈTE
    ===================================================== */

    .court::after
    {
        content: "";

        position: absolute;

        left: 50%;
        top: 0;

        width: 1px;
        height: 100%;

        transform: translateX(-50%);

        background:
            rgba(255,255,255,.025);

        pointer-events: none;
    }

    /* =====================================================
       RAQUETTE
    ===================================================== */

    .paint
    {
        position: absolute;

        width: 32.7%;
        height: 41%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border-left:
            3px solid var(--court-line);

        border-right:
            3px solid var(--court-line);

        border-top:
            3px solid var(--court-line);

        background:
            linear-gradient(
                180deg,
                rgba(255,255,255,.035),
                rgba(255,212,0,.012)
            );

        box-shadow:
            inset 0 0 30px rgba(255,212,0,.025);
    }

    /* =====================================================
       LIGNE DES LANCERS FRANCS
    ===================================================== */

    .free-throw-line
    {
        position: absolute;

        left: 50%;
        bottom: 41%;
        width: 32.7%;
        height: 3px;

        transform: translateX(-50%);

        background:
            var(--court-line);

        box-shadow:
            0 0 8px rgba(255,255,255,.12);
    }

    /* =====================================================
       PETIT DEMI-ARC DES LANCERS
    ===================================================== */

    .free-throw-circle
    {
        position: absolute;

        width: 25%;
        height: 12.5%;

        left: 50%;
        bottom: 41%;
        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100% 100% 0 0;

        pointer-events: none;
    }

    /* =====================================================
       PETIT DEMI-CERCLE SOUS LE PANIER
    ===================================================== */

    .restricted-area
    {
        position: absolute;

        width: 13%;
        height: 6.5%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100px 100px 0 0;

        pointer-events: none;
    }

    /* =====================================================
       PANIER
    ===================================================== */

    .basket
    {
        position: absolute;

        left: 50%;
        bottom: -4px;

        transform: translateX(-50%);

        width: 8%;
        height: 8px; /* Augmenté de 10% (7px -> 8px) */

        background:
            var(--red);

        border-radius: 10px;

        box-shadow:
            0 0 8px var(--red),
            0 0 22px rgba(237,23,76,.7), /* Augmenté de 10% */
            0 0 38px rgba(237,23,76,.25); /* Augmenté de 10% */
    }

    @keyframes basketPulse
    {
        0%,
        100%
        {
            box-shadow:
                0 0 8px var(--red),
                0 0 22px rgba(237,23,76,.7);
        }

        50%
        {
            box-shadow:
                0 0 13px var(--red), /* Augmenté de 10% */
                0 0 33px rgba(237,23,76,.9), /* Augmenté de 10% */
                0 0 49px rgba(237,23,76,.3); /* Augmenté de 10% */
        }
    }

    /* =====================================================
       PANNEAU
    ===================================================== */

    .backboard
    {
        position: absolute;

        left: 50%;
        bottom: 20px; /* Augmenté de 10% (18px -> 20px) */

        transform: translateX(-50%);

        width: 13%;
        height: 6px; /* Augmenté de 10% (5px -> 6px) */

        background:
            var(--white);

        border-radius: 3px;

        box-shadow:
            0 0 9px rgba(255,255,255,.5), /* Augmenté de 10% */
            0 0 20px rgba(255,255,255,.15); /* Augmenté de 10% */
    }

    /* =====================================================
       LIGNE À 3 POINTS
    ===================================================== */

    .three-point
    {
        position: absolute;

        width: 94%;
        height: 72%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            50% 50% 0 0;

        pointer-events: none;

        filter:
            drop-shadow(
                0 0 5px
                rgba(255,255,255,.10)
            );
    }

    .three-point::after
    {
        content: "";

        position: absolute;

        left: 50%;
        bottom: -6px; /* Augmenté de 10% (5px -> 6px) */

        width: 19.8%; /* Augmenté de 10% (18% -> 19.8%) */
        height: 10px; /* Augmenté de 10% (9px -> 10px) */

        transform: translateX(-50%);

        background:
            #100e00;
    }

    /* =====================================================
       JOUEURS
    ===================================================== */

    .players-list
    {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
    }

    .player
    {
        position: absolute;
        width: clamp(192px, 17.6vw, 264px); /* Augmenté de 10% (175px -> 192px, 16vw -> 17.6vw, 240px -> 264px) */
        height: clamp(165px, 13.2vw, 203px); /* Augmenté de 10% (150px -> 165px, 12vw -> 13.2vw, 185px -> 203px) */
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: linear-gradient(135deg, rgba(28,30,34,.96), rgba(7,8,10,.98));
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 18px; /* Augmenté de 10% (16px -> 18px) */
        font-family: "Inter", sans-serif;
        color: #fff;
        box-shadow: 0 11px 31px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10); /* Augmenté de 10% */
        transform: translate(-50%, -50%);
        z-index: 20;
        overflow: hidden;
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    /* Image du joueur : 75% de la hauteur pour afficher 3/4 de la photo */
    .player-photo
    {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 75%;
        object-fit: cover;
        object-position: center top;
        border-radius: 18px 18px 0 0; /* Augmenté de 10% (16px -> 18px) */
        opacity: .98;
        pointer-events: none;
    }

    .player-photo + .player-info
    {
        position: relative;
        z-index: 2;
        margin-top: 0;
        padding-top: 15%;
    }

    /* Fondu de l'image vers le nom. */
    .player::after
    {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 15%;
        bottom: 0;
        background: linear-gradient(180deg, transparent 0%, rgba(5,6,8,.18) 28%, rgba(5,6,8,.84) 72%, rgba(5,6,8,1) 100%);
        pointer-events: none;
        z-index: 1;
    }

    /* Liseré lumineux. */
    .player::before
    {
        content: "";
        position: absolute;
        left: 0;
        top: 13px; /* Augmenté de 10% (12px -> 13px) */
        bottom: 13px; /* Augmenté de 10% */
        width: 3px;
        background: linear-gradient(180deg, var(--yellow), var(--red));
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 11px rgba(255,212,0,.45); /* Augmenté de 10% */
        pointer-events: none;
        z-index: 4;
    }

    .player-info
    {
        position: relative;
        z-index: 3;
        width: 100%;
        min-height: 30%;
        padding: 4px 13px 9px 60px; /* Augmenté de 10% (12px -> 13px, 54px -> 60px) */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .player:hover
    {
        transform: translate(-50%, -50%) scale(1.045);
        border-color: rgba(255,212,0,.65);
        box-shadow: 0 15px 38px rgba(0,0,0,.55), 0 0 26px rgba(255,212,0,.28), inset 0 1px 0 rgba(255,255,255,.14); /* Augmenté de 10% */
    }

    /* Style pour le nom et prénom */
    .player-name-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
    }

    .player-firstname, .player-lastname {
        display: block;
        width: 100%;
        color: var(--white);
        font-size: clamp(12px, 1.32vw, 20px); /* Augmenté de 10% (11px -> 12px, 1.1vw -> 1.32vw, 16px -> 20px) */
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -.025em;
        text-shadow: 0 1px 11px rgba(0,0,0,.65); /* Augmenté de 10% */
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* =====================================================
       POSITIONS DES JOUEURS
    ===================================================== */

    .player.position-1
    {
        left: 50%;
        top: 15%;
    }

    .player.position-2
    {
        left: 8%;
        top: 35%;
    }

    .player.position-3
    {
        left: 90%;
        top: 35%;
    }

    .player.position-4
    {
        left: 37%;
        top: 80%;
    }

    .player.position-5
    {
        left: 63%;
        top: 80%;
    }

    /* =====================================================
       NUMÉRO DE POSITION
    ===================================================== */

    .player-number
    {
        position: absolute;
        left: 11px; /* Augmenté de 10% (10px -> 11px) */
        top: 50%;
        width: 37px; /* Augmenté de 10% (34px -> 37px) */
        height: 37px; /* Augmenté de 10% */
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(-50%);
        margin: 0;
        background: linear-gradient(145deg, var(--yellow), #ff9f00);
        border: 2px solid rgba(255,255,255,.85);
        border-radius: 11px; /* Augmenté de 10% (10px -> 11px) */
        color: var(--black);
        font-size: 0.79em; /* Augmenté de 10% (0.72em -> 0.79em) */
        font-weight: 900;
        letter-spacing: -.03em;
        text-shadow: none;
        box-shadow: 0 4px 13px rgba(0,0,0,.35), 0 0 15px rgba(255,212,0,.25); /* Augmenté de 10% */
    }

    /* =====================================================
       BARRE LUMINEUSE
    ===================================================== */

    .light-line
    {
        position: fixed;

        left: 50%;
        bottom: 0;

        transform:
            translateX(-50%);

        width: 71.5%; /* Augmenté de 10% (65% -> 71.5%) */
        height: 3px;

        background:
            var(--yellow);

        box-shadow:
            0 0 11px var(--yellow), /* Augmenté de 10% */
            0 0 28px var(--yellow), /* Augmenté de 10% */
            0 0 55px var(--yellow); /* Augmenté de 10% */

        z-index: 90;
    }

    /* =====================================================
       GRAND ÉCRAN 16:9
    ===================================================== */

    @media (min-width: 1200px)
    {
        .players-container
        {
            padding-top: 0;
        }

        .court
        {
            width: min(72.6vw, 990px); /* Augmenté de 10% */
            height: min(calc(100vh - 165px), 770px); /* Augmenté de 10% (700px -> 770px) */
        }

        .player
        {
            width: clamp(176px, 15.4vw, 242px); /* Augmenté de 10% (160px -> 176px, 14vw -> 15.4vw, 220px -> 242px) */
        }
    }

    /* =====================================================
       TABLETTE
    ===================================================== */

    @media (max-width: 900px)
    {
        .court
        {
            width: 82vw;
            height: min(calc(100vh - 132px), 682px); /* Augmenté de 10% (620px -> 682px) */
        }

        .player
        {
            width: clamp(132px, 20.9vw, 198px); /* Augmenté de 10% (120px -> 132px, 19vw -> 20.9vw, 180px -> 198px) */
            padding: 11px 13px 11px 53px; /* Augmenté de 10% (10px -> 11px, 12px -> 13px, 48px -> 53px) */
            min-height: 57px; /* Augmenté de 10% (52px -> 57px) */
        }

        .player.position-1
        {
            top: 7%;
        }

        .player.position-2
        {
            left: 10%;
            top: 35%;
        }

        .player.position-3
        {
            left: 90%;
            top: 35%;
        }

        .player.position-4
        {
            left: 37%;
            top: 80%;
        }

        .player.position-5
        {
            left: 63%;
            top: 80%;
        }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px)
    {
        .player
        {
            width: clamp(115px, 27.5vw, 159px); /* Augmenté de 10% (105px -> 115px, 25vw -> 27.5vw, 145px -> 159px) */
            height: clamp(115px, 30.8vw, 148px); /* Augmenté de 10% (105px -> 115px, 28vw -> 30.8vw, 135px -> 148px) */
            border-radius: 13px; /* Augmenté de 10% (12px -> 13px) */
        }

        .player-info
        {
            padding: 7px 8px 8px 44px; /* Augmenté de 10% (6px -> 7px, 7px -> 8px, 40px -> 44px) */
            min-height: 35%;
        }

        .player-number
        {
            left: 8px; /* Augmenté de 10% (7px -> 8px) */
            width: 30px; /* Augmenté de 10% (27px -> 30px) */
            height: 30px; /* Augmenté de 10% */
            border-radius: 9px; /* Augmenté de 10% (8px -> 9px) */
        }

        .title-container
        {
            height: 82px; /* Augmenté de 10% (75px -> 82px) */
            margin-top: 9px; /* Augmenté de 10% (8px -> 9px) */
        }

        .partner-title
        {
            font-size: clamp(33px, 9.9vw, 53px); /* Augmenté de 10% (30px -> 33px, 9vw -> 9.9vw, 48px -> 53px) */
        }

        .slash
        {
            height: 11px; /* Augmenté de 10% (10px -> 11px) */
        }

        .players-container
        {
            height: calc(100vh - 99px); /* Augmenté de 10% (90px -> 99px) */
            padding-top: 6px; /* Augmenté de 10% (5px -> 6px) */
        }

        .court
        {
            width: 94vw;
            height: min(calc(100vh - 110px), 616px); /* Augmenté de 10% (560px -> 616px) */
        }

        .player
        {
            width: clamp(115px, 27.5vw, 159px);
            padding: 9px 9px 9px 46px; /* Augmenté de 10% (8px -> 9px, 42px -> 46px) */
            min-height: 50px; /* Augmenté de 10% (46px -> 50px) */
        }

        .player.position-1
        {
            top: 7%;
        }

        .player.position-2
        {
            left: 9%;
            top: 35%;
        }

        .player.position-3
        {
            left: 91%;
            top: 35%;
        }

        .player.position-4
        {
            left: 36%;
            top: 80%;
        }

        .player.position-5
        {
            left: 64%;
            top: 80%;
        }
    }

    /* =====================================================
       TRÈS PETITS ÉCRANS
    ===================================================== */

    @media (max-width: 400px)
    {
        .player
        {
            width: 110px; /* Augmenté de 10% (100px -> 110px) */
            height: 110px; /* Augmenté de 10% */
        }

        .player-info
        {
            padding: 6px 6px 7px 37px; /* Augmenté de 10% (5px -> 6px, 34px -> 37px) */
            min-height: 35%;
        }

        .player-number
        {
            left: 7px; /* Augmenté de 10% (6px -> 7px) */
            width: 26px; /* Augmenté de 10% (24px -> 26px) */
            height: 26px; /* Augmenté de 10% */
            border-radius: 8px; /* Augmenté de 10% (7px -> 8px) */
        }

        .player-firstname, .player-lastname {
            font-size: 12px; /* Augmenté de 10% (11px -> 12px) */
        }

        .court
        {
            width: 95vw;
            height: calc(100vh - 110px); /* Augmenté de 10% (100px -> 110px) */
        }

        .player
        {
            width: 110px;
            padding: 8px 7px 8px 42px; /* Augmenté de 10% (7px -> 8px, 38px -> 42px) */
            min-height: 46px; /* Augmenté de 10% (42px -> 46px) */
        }
    }

</style>
</head>

<body>

<!-- =====================================================
     TITRE
===================================================== -->

<div class="title-container">

    <div class="slash"></div>

    <h1 class="partner-title">
        LE 5
    </h1>
<br>
    <br>
</div>

<!-- =====================================================
     DEMI-TERRAIN
===================================================== -->

<div class="players-container">

    <div class="court">

        <!-- Ligne à 3 points -->
        <div class="three-point"></div>

        <!-- Raquette -->
        <div class="paint"></div>

        <!-- Ligne des lancers francs -->
        <div class="free-throw-line"></div>

        <!-- Petit demi-arc des lancers francs -->
        <div class="free-throw-circle"></div>

        <!-- Zone restrictive -->
        <div class="restricted-area"></div>

        <!-- Panneau -->
        <div class="backboard"></div>

        <!-- Panier -->
        <div class="basket"></div>

        <!-- Joueurs -->
        <div
            class="players-list"
            id="playersList">
        </div>

    </div>

</div>

<!-- =====================================================
     BARRE LUMINEUSE
===================================================== -->

<div class="light-line"></div>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

        apiKey:
            "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

        authDomain:
            "diffusion-b9afa.firebaseapp.com",

        databaseURL:
            "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "diffusion-b9afa",

        storageBucket:
            "diffusion-b9afa.firebasestorage.app",

        messagingSenderId:
            "674799570797",

        appId:
            "1:674799570797:web:0d8b7a2a892f604eb7d464"
    };

    const app =
        initializeApp(firebaseConfig);

    const db =
        getDatabase(app);

    const cinqMajeurRef =
        ref(
            db,
            "cinqmajeur"
        );

    onValue(
        cinqMajeurRef,
        (snapshot) => {

            const data =
                snapshot.val() || {};

            const players =
                data.players || [];

            const playerNumbers =
                data.playerNumbers || {};

            const playersList =
                document.getElementById(
                    "playersList"
                );

            playersList.innerHTML = "";

            players
                .slice(0, 5)
                .forEach(
                    (player, index) => {

                        const playerDiv =
                            document.createElement(
                                "div"
                            );

                        playerDiv.className =
                            `player position-${index + 1}`;

                        // Séparer le nom et le prénom
                        const nameParts = player.trim().split(/\s+/);
                        const firstName = nameParts.slice(0, -1).join(' ');
                        const lastName = nameParts[nameParts.length - 1];

                        const playerImage =
                            document.createElement("img");

                        playerImage.className =
                            "player-photo";

                        playerImage.src =
                            `joueursnm2/${encodeURIComponent(firstName.toLowerCase())}.png`;

                        playerImage.alt =
                            player;

                        playerImage.loading =
                            "eager";

                        playerImage.onerror = () => {
                            playerImage.style.display = "none";
                        };

                        playerDiv.appendChild(
                            playerImage
                        );

                        const playerInfo =
                            document.createElement("div");

                        playerInfo.className =
                            "player-info";

                        const playerNumber =
                            playerNumbers[player];

                        if (
                            playerNumber !== undefined
                        ) {

                            const numberSpan =
                                document.createElement("span");

                            numberSpan.className =
                                "player-number";

                            numberSpan.textContent =
                                `#${playerNumber}`;

                            playerInfo.appendChild(
                                numberSpan
                            );
                        }

                        // Conteneur pour le nom et prénom
                        const nameContainer = document.createElement("div");
                        nameContainer.className = "player-name-container";

                        // Prénom
                        if (firstName) {
                            const firstNameSpan = document.createElement("span");
                            firstNameSpan.className = "player-firstname";
                            firstNameSpan.textContent = firstName;
                            nameContainer.appendChild(firstNameSpan);
                        }

                        // Nom
                        const lastNameSpan = document.createElement("span");
                        lastNameSpan.className = "player-lastname";
                        lastNameSpan.textContent = lastName;
                        nameContainer.appendChild(lastNameSpan);

                        playerInfo.appendChild(nameContainer);

                        playerDiv.appendChild(
                            playerInfo
                        );

                        playersList.appendChild(
                            playerDiv
                        );

                    }
                );
        }
    );

</script>

</body>

</html>
