<!DOCTYPE html>

<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5 Majeur - MVBC</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

    /* =====================================================
       RESET
    ===================================================== */

    *
    {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    html,
    body
    {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
    }

    /* =====================================================
       VARIABLES
    ===================================================== */

    :root
    {
        --white: #f7f7f5;
        --black: #050608;
        --red: #ed174c;
        --blue: #1769ff;
        --yellow: #ffd400;

        --court-line: rgba(255, 255, 255, 0.75);
    }

    /* =====================================================
       FOND
    ===================================================== */

    body
    {
        position: relative;

        background:
            radial-gradient(
                circle at center 55% 55%,
                #252000 0%,
                #100e00 35%,
                #050500 65%,
                #000 100%
            );
    }

    body::before
    {
        content: "";

        position: fixed;

        width: 990px;
        height: 990px;

        left: 50%;
        top: 55%;

        transform: translate(-50%, -50%);

        background:
            radial-gradient(
                circle,
                rgba(255, 204, 0, 0.20) 0%,
                rgba(255, 204, 0, 0.08) 25%,
                rgba(255, 204, 0, 0.02) 50%,
                transparent 70%
            );

        pointer-events: none;

        animation: halo 4s ease-in-out infinite;
    }

    @keyframes halo
    {
        0%
        {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }

        50%
        {
            transform: translate(-50%, -50%) scale(1.10);
            opacity: 1;
        }

        100%
        {
            transform: translate(-50%, -50%) scale(0.90);
            opacity: 0.65;
        }
    }

    /* =====================================================
       TITRE
    ===================================================== */

    .title-container
    {
        position: relative;

        width: 100%;
        height: 115px;

        margin-top: 12px;

        z-index: 100;

        text-align: center;
    }

    .partner-title
    {
        position: relative;

        font-family: "Barlow Condensed", sans-serif;

        font-size: clamp(46px, 6.6vw, 99px);

        font-weight: 900;

        line-height: 0.9;

        letter-spacing: -0.04em;

        color: var(--white);

        text-align: center;

        white-space: nowrap;

        text-shadow:
            4px 4px 0 var(--black),
            7px 7px 0 var(--yellow),
            11px 11px 0 rgba(237, 23, 76, .9),
            15px 15px 0 rgba(23, 105, 255, .5);
    }

    .slash
    {
        position: absolute;

        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%)
            rotate(-7deg);

        width: min(70.4vw, 935px);
        height: 20px;

        background:
            linear-gradient(
                90deg,
                transparent,
                var(--blue) 12%,
                var(--yellow) 35%,
                var(--white) 50%,
                var(--yellow) 65%,
                var(--red) 88%,
                transparent
            );

        box-shadow:
            0 0 40px rgba(23, 105, 255, .45);

        z-index: -1;
    }

    /* =====================================================
       ZONE DU TERRAIN
    ===================================================== */

    .players-container
    {
        position: relative;

        width: 100%;
        height: calc(100vh - 165px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding-top: 0;
    }

    /* =====================================================
       DEMI-TERRAIN
    ===================================================== */

    .court
    {
        position: relative;

        width: min(72.6vw, 990px);
        height: min(71.5vh, 715px);
        aspect-ratio: 15 / 14;

        background:
            linear-gradient(
                180deg,
                rgba(255, 212, 0, .018),
                rgba(255, 212, 0, .006)
            );

        overflow: visible;
    }

    /* =====================================================
       LIGNE CENTRALE DISCRÈTE
    ===================================================== */

    .court::after
    {
        content: "";

        position: absolute;

        left: 50%;
        top: 0;

        width: 1px;
        height: 100%;

        transform: translateX(-50%);

        background:
            rgba(255,255,255,.025);

        pointer-events: none;
    }

    /* =====================================================
       RAQUETTE
    ===================================================== */

    .paint
    {
        position: absolute;

        width: 32.7%;
        height: 41%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border-left:
            3px solid var(--court-line);

        border-right:
            3px solid var(--court-line);

        border-top:
            3px solid var(--court-line);

        background:
            linear-gradient(
                180deg,
                rgba(255,255,255,.035),
                rgba(255,212,0,.012)
            );

        box-shadow:
            inset 0 0 30px rgba(255,212,0,.025);
    }

    /* =====================================================
       LIGNE DES LANCERS FRANCS
    ===================================================== */

    .free-throw-line
    {
        position: absolute;

        left: 50%;
        bottom: 41%;
        width: 32.7%;
        height: 3px;

        transform: translateX(-50%);

        background:
            var(--court-line);

        box-shadow:
            0 0 8px rgba(255,255,255,.12);
    }

    /* =====================================================
       PETIT DEMI-ARC DES LANCERS
    ===================================================== */

    .free-throw-circle
    {
        position: absolute;

        width: 25%;
        height: 12.5%;

        left: 50%;
        bottom: 41%;
        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100% 100% 0 0;

        pointer-events: none;
    }

    /* =====================================================
       PETIT DEMI-CERCLE SOUS LE PANIER
    ===================================================== */

    .restricted-area
    {
        position: absolute;

        width: 13%;
        height: 6.5%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            100px 100px 0 0;

        pointer-events: none;
    }

    /* =====================================================
       PANIER
    ===================================================== */

    .basket
    {
        position: absolute;

        left: 50%;
        bottom: -4px;

        transform: translateX(-50%);

        width: 8%;
        height: 8px;

        background:
            var(--red);

        border-radius: 10px;

        box-shadow:
            0 0 8px var(--red),
            0 0 22px rgba(237,23,76,.7),
            0 0 38px rgba(237,23,76,.25);

        animation:
            basketPulse 2.4s ease-in-out infinite;
    }

    @keyframes basketPulse
    {

        0%,
        100%
        {
            box-shadow:
                0 0 8px var(--red),
                0 0 22px rgba(237,23,76,.7);
        }

        50%
        {
            box-shadow:
                0 0 13px var(--red),
                0 0 33px rgba(237,23,76,.9),
                0 0 49px rgba(237,23,76,.3);
        }
    }

    /* =====================================================
       PANNEAU
    ===================================================== */

    .backboard
    {
        position: absolute;

        left: 50%;
        bottom: 20px;

        transform: translateX(-50%);

        width: 13%;
        height: 6px;

        background:
            var(--white);

        border-radius: 3px;

        box-shadow:
            0 0 9px rgba(255,255,255,.5),
            0 0 20px rgba(255,255,255,.15);
    }

    /* =====================================================
       LIGNE À 3 POINTS
    ===================================================== */

    .three-point
    {
        position: absolute;

        width: 94%;
        height: 72%;

        left: 50%;
        bottom: 0;

        transform: translateX(-50%);

        border:
            3px solid var(--court-line);

        border-bottom: none;

        border-radius:
            50% 50% 0 0;

        pointer-events: none;

        filter:
            drop-shadow(
                0 0 5px
                rgba(255,255,255,.10)
            );
    }

    .three-point::after
    {
        content: "";

        position: absolute;

        left: 50%;
        bottom: -6px;

        width: 19.8%;
        height: 10px;

        transform: translateX(-50%);

        background:
            #100e00;
    }

    /* =====================================================
       JOUEURS
    ===================================================== */

    .players-list
    {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
    }

    .player
    {
        position: absolute;
        width: clamp(192px, 17.6vw, 264px);
        height: clamp(190px, 14.5vw, 230px);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        background: linear-gradient(135deg, rgba(28,30,34,.96), rgba(7,8,10,.98));
        border: 1px solid rgba(255,255,255,.22);
        border-radius: 18px;
        font-family: "Inter", sans-serif;
        color: #fff;
        box-shadow: 0 10px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.10);
        transform: translate(-50%, -50%);
        z-index: 20;
        overflow: visible;
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    /* Image du joueur : 65% de la hauteur pour laisser plus de place au texte */
    .player-photo
    {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 65%;
        object-fit: cover;
        object-position: center top;
        border-radius: 18px 18px 0 0;
        opacity: .98;
        pointer-events: none;
    }

    .player-photo + .player-info
    {
        position: relative;
        z-index: 2;
        margin-top: 0;
        padding-top: 10%;
    }

    /* Fondu de l'image vers le nom. */
    .player::after
    {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 10%;
        bottom: 0;
        background: linear-gradient(180deg, transparent 0%, rgba(5,6,8,.18) 20%, rgba(5,6,8,.84) 60%, rgba(5,6,8,1) 100%);
        pointer-events: none;
        z-index: 1;
    }

    /* Liseré lumineux. */
    .player::before
    {
        content: "";
        position: absolute;
        left: 0;
        top: 12px;
        bottom: 12px;
        width: 3px;
        background: linear-gradient(180deg, var(--yellow), var(--red));
        border-radius: 0 4px 4px 0;
        box-shadow: 0 0 10px rgba(255,212,0,.45);
        pointer-events: none;
        z-index: 4;
    }

    .player-info
    {
        position: relative;
        z-index: 3;
        width: 100%;
        min-height: 35%;
        padding: 0 12px 8px 50px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    .player:hover
    {
        transform: translate(-50%, -50%) scale(1.045);
        border-color: rgba(255,212,0,.65);
        box-shadow: 0 14px 35px rgba(0,0,0,.55), 0 0 24px rgba(255,212,0,.28), inset 0 1px 0 rgba(255,255,255,.14);
    }

    /* Style pour le prénom et le nom */
    .player-name-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        text-align: center;
    }

    .player-firstname {
        display: block;
        width: 100%;
        color: var(--white);
        font-size: clamp(10px, 1.0vw, 15px);
        font-weight: 800;
        line-height: 1.0;
        letter-spacing: -.025em;
        text-shadow: 0 1px 8px rgba(0,0,0,.65);
        white-space: nowrap;
        overflow: visible;
    }

    .player-lastname {
        display: block;
        width: 100%;
        color: var(--white);
        font-size: clamp(10px, 1.0vw, 15px);
        font-weight: 800;
        line-height: 1.0;
        letter-spacing: -.025em;
        text-shadow: 0 1px 8px rgba(0,0,0,.65);
        white-space: nowrap;
        overflow: visible;
    }

    /* =====================================================
       POSITIONS DES JOUEURS
    ===================================================== */

    .player.position-1
    {
        left: 50%;
        top: 15%;
    }

    .player.position-2
    {
        left: 8%;
        top: 35%;
    }

    .player.position-3
    {
        left: 90%;
        top: 35%;
    }

    .player.position-4
    {
        left: 37%;
        top: 80%;
    }

    .player.position-5
    {
        left: 63%;
        top: 80%;
    }

    /* =====================================================
       NUMÉRO DE POSITION
    ===================================================== */

    .player-number
    {
        position: absolute;
        left: 10px;
        top: 50%;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(-50%);
        margin: 0;
        background: linear-gradient(145deg, var(--yellow), #ff9f00);
        border: 2px solid rgba(255,255,255,.85);
        border-radius: 10px;
        color: var(--black);
        font-size: .72em;
        font-weight: 900;
        letter-spacing: -.03em;
        text-shadow: none;
        box-shadow: 0 4px 12px rgba(0,0,0,.35), 0 0 14px rgba(255,212,0,.25);
    }

    /* =====================================================
       BARRE LUMINEUSE
    ===================================================== */

    .light-line
    {
        position: fixed;

        left: 50%;
        bottom: 0;

        transform:
            translateX(-50%);

        width: 65%;
        height: 3px;

        background:
            var(--yellow);

        box-shadow:
            0 0 10px var(--yellow),
            0 0 25px var(--yellow),
            0 0 50px var(--yellow);

        z-index: 90;
    }

    /* =====================================================
       GRAND ÉCRAN 16:9
    ===================================================== */

    @media (min-width: 1200px)
    {
        .players-container
        {
            padding-top: 0;
        }

        .court
        {
            width: min(66vw, 900px);
            height: min(calc(100vh - 145px), 700px);
        }

        .player
        {
            width: clamp(175px, 16vw, 240px);
        }
    }

    /* =====================================================
       TABLETTE
    ===================================================== */

    @media (max-width: 900px)
    {
        .court
        {
            width: 82vw;
            height: min(calc(100vh - 120px), 620px);
        }

        .player
        {
            width: clamp(140px, 19vw, 180px);
            height: clamp(150px, 18vw, 190px);
            padding: 8px 10px 8px 45px;
            min-height: 55px;
        }

        .player.position-1
        {
            top: 7%;
        }

        .player.position-2
        {
            left: 10%;
            top: 35%;
        }

        .player.position-3
        {
            left: 90%;
            top: 35%;
        }

        .player.position-4
        {
            left: 37%;
            top: 80%;
        }

        .player.position-5
        {
            left: 63%;
            top: 80%;
        }
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 600px)
    {
        .player
        {
            width: clamp(125px, 25vw, 150px);
            height: clamp(135px, 25vw, 155px);
            border-radius: 12px;
        }

        .player-info
        {
            padding: 5px 6px 6px 40px;
            min-height: 35%;
        }

        .player-number
        {
            left: 7px;
            width: 27px;
            height: 27px;
            border-radius: 8px;
        }

        .player-firstname, .player-lastname {
            font-size: clamp(9px, 2.3vw, 13px);
        }

        .title-container
        {
            height: 75px;
            margin-top: 8px;
        }

        .partner-title
        {
            font-size: clamp(30px, 9vw, 48px);
        }

        .slash
        {
            height: 10px;
        }

        .players-container
        {
            height: calc(100vh - 90px);
            padding-top: 5px;
        }

        .court
        {
            width: 94vw;
            height: min(calc(100vh - 100px), 560px);
        }

        .player
        {
            width: clamp(125px, 25vw, 150px);
            padding: 6px 6px 6px 42px;
            min-height: 50px;
        }

        .player.position-1
        {
            top: 7%;
        }

        .player.position-2
        {
            left: 9%;
            top: 35%;
        }

        .player.position-3
        {
            left: 91%;
            top: 35%;
        }

        .player.position-4
        {
            left: 36%;
            top: 80%;
        }

        .player.position-5
        {
            left: 64%;
            top: 80%;
        }
    }

    /* =====================================================
       TRÈS PETITS ÉCRANS
    ===================================================== */

    @media (max-width: 400px)
    {
        .player
        {
            width: 110px;
            height: 120px;
        }

        .player-info
        {
            padding: 4px 4px 5px 35px;
            min-height: 35%;
        }

        .player-number
        {
            left: 6px;
            width: 24px;
            height: 24px;
            border-radius: 7px;
        }

        .player-firstname, .player-lastname {
            font-size: 9px;
        }

        .court
        {
            width: 95vw;
            height: calc(100vh - 100px);
        }

        .player
        {
            width: 110px;
            padding: 5px 4px 5px 38px;
            min-height: 45px;
        }
    }

</style>
</head>

<body>

<!-- =====================================================
     TITRE
===================================================== -->

<div class="title-container">

    <div class="slash"></div>

    <h1 class="partner-title">
        LE 5
    </h1>
<br>
    <br>
</div>

<!-- =====================================================
     DEMI-TERRAIN
===================================================== -->

<div class="players-container">

    <div class="court">

        <!-- Ligne à 3 points -->
        <div class="three-point"></div>

        <!-- Raquette -->
        <div class="paint"></div>

        <!-- Ligne des lancers francs -->
        <div class="free-throw-line"></div>

        <!-- Petit demi-arc des lancers francs -->
        <div class="free-throw-circle"></div>

        <!-- Zone restrictive -->
        <div class="restricted-area"></div>

        <!-- Panneau -->
        <div class="backboard"></div>

        <!-- Panier -->
        <div class="basket"></div>

        <!-- Joueurs -->
        <div
            class="players-list"
            id="playersList">
        </div>

    </div>

</div>

<!-- =====================================================
     BARRE LUMINEUSE
===================================================== -->

<div class="light-line"></div>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
        getDatabase,
        ref,
        onValue
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {

        apiKey:
            "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

        authDomain:
            "diffusion-b9afa.firebaseapp.com",

        databaseURL:
            "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

        projectId:
            "diffusion-b9afa",

        storageBucket:
            "diffusion-b9afa.firebasestorage.app",

        messagingSenderId:
            "674799570797",

        appId:
            "1:674799570797:web:0d8b7a2a892f604eb7d464"
    };

    const app =
        initializeApp(firebaseConfig);

    const db =
        getDatabase(app);

    const cinqMajeurRef =
        ref(
            db,
            "cinqmajeur"
        );

    onValue(
        cinqMajeurRef,
        (snapshot) => {

            const data =
                snapshot.val() || {};

            const players =
                data.players || [];

            const playerNumbers =
                data.playerNumbers || {};

            const playersList =
                document.getElementById(
                    "playersList"
                );

            playersList.innerHTML = "";

            players
                .slice(0, 5)
                .forEach(
                    (player, index) => {

                        const playerDiv =
                            document.createElement(
                                "div"
                            );

                        playerDiv.className =
                            `player position-${index + 1}`;

                        // Extraire le premier prénom pour le fichier image (ex: "Robin LE STER" -> "robin")
                        const firstNameForImage = player.trim().split(/\s+/)[0].toLowerCase();

                        // Séparer prénom et nom pour l'affichage
                        const nameParts = player.trim().split(/\s+/);
                        const firstName = nameParts.slice(0, -1).join(' ');
                        const lastName = nameParts[nameParts.length - 1];

                        const playerImage =
                            document.createElement("img");

                        playerImage.className =
                            "player-photo";

                        // Utiliser uniquement le premier prénom pour le fichier (ex: robin.png)
                        playerImage.src =
                            `joueursnm2/${firstNameForImage}.png`;

                        playerImage.alt =
                            player;

                        playerImage.loading =
                            "eager";

                        playerImage.onerror = () => {
                            playerImage.style.display = "none";
                        };

                        playerDiv.appendChild(
                            playerImage
                        );

                        const playerInfo =
                            document.createElement("div");

                        playerInfo.className =
                            "player-info";

                        const playerNumber =
                            playerNumbers[player];

                        if (
                            playerNumber !== undefined
                        ) {

                            const numberSpan =
                                document.createElement("span");

                            numberSpan.className =
                                "player-number";

                            numberSpan.textContent =
                                `#${playerNumber}`;

                            playerInfo.appendChild(
                                numberSpan
                            );
                        }

                        // Conteneur pour le prénom et le nom
                        const nameContainer = document.createElement("div");
                        nameContainer.className = "player-name-container";

                        // Prénom
                        if (firstName) {
                            const firstNameSpan = document.createElement("span");
                            firstNameSpan.className = "player-firstname";
                            firstNameSpan.textContent = firstName;
                            nameContainer.appendChild(firstNameSpan);
                        }

                        // Nom
                        const lastNameSpan = document.createElement("span");
                        lastNameSpan.className = "player-lastname";
                        lastNameSpan.textContent = lastName;
                        nameContainer.appendChild(lastNameSpan);

                        playerInfo.appendChild(nameContainer);

                        playerDiv.appendChild(
                            playerInfo
                        );

                        playersList.appendChild(
                            playerDiv
                        );

                    }
                );
        }
    );

</script>

</body>

</html>
