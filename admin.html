<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestion du Match</title>
    <style>
        /* =====================================================
           RESET ET STYLES DE BASE
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-size: 28px;
        }

        /* =====================================================
           GROUPES DE FORMULAIRE
        ===================================================== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cccccc;
        }

        .form-group input[type="text"],
        .form-group input[type="url"],
        .form-group input[type="color"],
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2d2d2d;
            color: #ffffff;
            font-size: 16px;
        }

        .form-group input[type="color"] {
            height: 50px;
            padding: 5px;
            cursor: pointer;
        }

        /* =====================================================
           BOUTONS
        ===================================================== */
        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button.save {
            background-color: #4CAF50;
            color: #ffffff;
        }

        button.save:hover {
            background-color: #45a049;
        }

        button.reset {
            background-color: #f44336;
            color: #ffffff;
        }

        button.reset:hover {
            background-color: #d32f2f;
        }

        /* =====================================================
           SECTIONS THÉMATIQUES
        ===================================================== */
        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 8px;
            background-color: #252526;
        }

        .section h2 {
            margin-bottom: 15px;
            color: #ffffff;
            font-size: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* =====================================================
           GRID POUR LES COULEURS
        ===================================================== */
        .colors-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 600px) {
            .colors-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Administration - Match du Soir</h1>

        <!-- =================================================
             SECTION : INFORMATIONS GÉNÉRALES
        ================================================= -->
        <div class="section">
            <h2>📌 Informations générales</h2>

            <div class="form-group">
                <label for="championnat">Championnat :</label>
                <input type="text" id="championnat" placeholder="Ex: LIGUE 1, PREMIER LEAGUE, etc.">
            </div>

            <div class="form-group">
                <label for="titreMatch">Titre du match :</label>
                <select id="titreMatch">
                    <option value="MATCH DU SOIR">MATCH DU SOIR</option>
                    <option value="PROCHAIN MATCH">PROCHAIN MATCH</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date :</label>
                <input type="text" id="date" placeholder="Ex: SAMEDI, DIMANCHE, etc.">
            </div>

            <div class="form-group">
                <label for="heure">Heure :</label>
                <input type="text" id="heure" placeholder="Ex: 20H00, 21H30, etc.">
            </div>
        </div>

        <!-- =================================================
             SECTION : ÉQUIPES
        ================================================= -->
        <div class="section">
            <h2>⚽ Équipes</h2>

            <div class="form-group">
                <label for="equipe1">Équipe 1 (à gauche) :</label>
                <input type="text" id="equipe1" placeholder="Ex: PSG">
            </div>

            <div class="form-group">
                <label for="logo1">URL du logo de l'équipe 1 :</label>
                <input type="url" id="logo1" placeholder="Ex: https://exemple.com/logo-psg.png">
            </div>

            <div class="form-group">
                <label for="equipe2">Équipe 2 (à droite) :</label>
                <input type="text" id="equipe2" placeholder="Ex: OM">
            </div>

            <div class="form-group">
                <label for="logo2">URL du logo de l'équipe 2 :</label>
                <input type="url" id="logo2" placeholder="Ex: https://exemple.com/logo-om.png">
            </div>
        </div>

        <!-- =================================================
             SECTION : COULEURS DES HALOS
        ================================================= -->
        <div class="section">
            <h2>🎨 Couleurs des halos</h2>

            <div class="colors-grid">
                <div class="form-group">
                    <label for="haloCouleur1">Couleur halo équipe 1 (gauche) :</label>
                    <input type="color" id="haloCouleur1" value="#008cff">
                </div>

                <div class="form-group">
                    <label for="haloCouleur2">Couleur halo équipe 2 (droite) :</label>
                    <input type="color" id="haloCouleur2" value="#ff6500">
                </div>
            </div>
        </div>

        <!-- =================================================
             BOUTONS D'ACTION
        ================================================= -->
        <div class="button-group">
            <button class="save" onclick="saveMatchData()">💾 Sauvegarder</button>
            <button class="reset" onclick="resetForm()">🔄 Réinitialiser</button>
        </div>
    </div>

    <!-- =====================================================
         SCRIPT FIREBASE
    ===================================================== -->
    <script type="module">
        // Import des modules Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
            authDomain: "diffusion-b9afa.firebaseapp.com",
            databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "diffusion-b9afa",
            storageBucket: "diffusion-b9afa.firebasestorage.app",
            messagingSenderId: "674799570797",
            appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
        };

        // Initialisation Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const matchRef = ref(db, "matchdusoir");

        // Charger les données existantes depuis Firebase
        onValue(matchRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("championnat").value = data.championnat || "";
                document.getElementById("titreMatch").value = data.titreMatch || "MATCH DU SOIR";
                document.getElementById("date").value = data.date || "";
                document.getElementById("heure").value = data.heure || "";
                document.getElementById("equipe1").value = data.equipe1 || "";
                document.getElementById("logo1").value = data.logo1 || "";
                document.getElementById("equipe2").value = data.equipe2 || "";
                document.getElementById("logo2").value = data.logo2 || "";
                document.getElementById("haloCouleur1").value = data.haloCouleur1 || "#008cff";
                document.getElementById("haloCouleur2").value = data.haloCouleur2 || "#ff6500";
            }
        });

        // Sauvegarder les données dans Firebase
        function saveMatchData() {
            const matchData = {
                championnat: document.getElementById("championnat").value,
                titreMatch: document.getElementById("titreMatch").value,
                date: document.getElementById("date").value,
                heure: document.getElementById("heure").value,
                equipe1: document.getElementById("equipe1").value,
                logo1: document.getElementById("logo1").value,
                equipe2: document.getElementById("equipe2").value,
                logo2: document.getElementById("logo2").value,
                haloCouleur1: document.getElementById("haloCouleur1").value,
                haloCouleur2: document.getElementById("haloCouleur2").value
            };

            set(matchRef, matchData)
                .then(() => {
                    alert("✅ Données sauvegardées avec succès !");
                })
                .catch((error) => {
                    console.error("❌ Erreur lors de la sauvegarde :", error);
                    alert("❌ Erreur lors de la sauvegarde. Veuillez réessayer.");
                });
        }

        // Réinitialiser le formulaire
        function resetForm() {
            if (confirm("⚠️ Voulez-vous vraiment réinitialiser le formulaire ?")) {
                document.getElementById("championnat").value = "";
                document.getElementById("titreMatch").value = "MATCH DU SOIR";
                document.getElementById("date").value = "";
                document.getElementById("heure").value = "";
                document.getElementById("equipe1").value = "";
                document.getElementById("logo1").value = "";
                document.getElementById("equipe2").value = "";
                document.getElementById("logo2").value = "";
                document.getElementById("haloCouleur1").value = "#008cff";
                document.getElementById("haloCouleur2").value = "#ff6500";
            }
        }
    </script>
</body>
</html>
