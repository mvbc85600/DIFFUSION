<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Régie MVBC</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 0;

      background: #111;

      color: #fff;

      font-family: Arial, sans-serif;

    }


    /* ==========================================
       CONNEXION
       ========================================== */

    #login {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }


    .login-box {

      width: 100%;

      max-width: 400px;

      background: #222;

      padding: 30px;

      border-radius: 15px;

      box-shadow:
        0 10px 40px rgba(0,0,0,0.5);

    }


    .login-box h1 {

      text-align: center;

      margin-bottom: 30px;

    }


    input {

      width: 100%;

      padding: 15px;

      margin-bottom: 15px;

      border: none;

      border-radius: 8px;

      font-size: 16px;

    }


    #loginButton {

      width: 100%;

      padding: 15px;

      background: #2563eb;

      color: #fff;

      border: none;

      border-radius: 8px;

      font-size: 18px;

      cursor: pointer;

    }


    #loginButton:hover {

      background: #1d4ed8;

    }


    #loginError {

      margin-top: 15px;

      color: #ff5555;

      text-align: center;

    }


    /* ==========================================
       ADMINISTRATION
       ========================================== */

    #admin {

      display: none;

      max-width: 1100px;

      margin: auto;

      padding: 20px;

    }


    .header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;

    }


    .header h1 {

      margin: 0;

      font-size: 30px;

    }


    #logoutButton {

      padding: 10px 15px;

      background: #444;

      color: white;

      border: none;

      border-radius: 8px;

      cursor: pointer;

    }


    /* ==========================================
       STATUT
       ========================================== */

    .status {

      background: #222;

      padding: 15px;

      margin-bottom: 25px;

      border-radius: 10px;

      text-align: center;

    }


    #currentScene {

      color: #4ade80;

      font-weight: bold;

    }


    /* ==========================================
       BOUTONS
       ========================================== */

    .scene-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));

      gap: 15px;

    }


    .scene-button {

      min-height: 110px;

      padding: 15px;

      border: none;

      border-radius: 12px;

      background: #333;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.15s;

    }


    .scene-button:hover {

      background: #444;

      transform: scale(1.03);

    }


    .scene-button:active {

      transform: scale(0.98);

    }


    /* ==========================================
       COULEURS
       ========================================== */

    .video {

      background: #1d4ed8;

    }


    .video:hover {

      background: #2563eb;

    }


    .page {

      background: #15803d;

    }


    .page:hover {

      background: #16a34a;

    }


    .photos {

      background: #9333ea;

    }


    .photos:hover {

      background: #a855f7;

    }


    .black {

      background: #000;

      border:
        1px solid #444;

    }


    /* ==========================================
       MOBILE
       ========================================== */

    @media (max-width: 600px) {

      #admin {

        padding: 12px;

      }


      .header {

        align-items: flex-start;

      }


      .header h1 {

        font-size: 24px;

      }


      .scene-grid {

        grid-template-columns:
          repeat(2, 1fr);

        gap: 10px;

      }


      .scene-button {

        min-height: 90px;

        font-size: 14px;

      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       CONNEXION
       ========================================== -->

  <div id="login">


    <div class="login-box">


      <h1>
        🔐 Régie MVBC
      </h1>


      <input
        type="password"
        id="password"
        placeholder="Mot de passe"
        autocomplete="current-password">


      <button
        id="loginButton">

        Se connecter

      </button>


      <div id="loginError"></div>


    </div>

  </div>


  <!-- ==========================================
       ADMINISTRATION
       ========================================== -->

  <div id="admin">


    <div class="header">


      <h1>
        🎬 Régie de diffusion
      </h1>


      <button
        id="logoutButton">

        Déconnexion

      </button>


    </div>


    <!-- ========================================
         SCÈNE ACTUELLE
         ======================================== -->

    <div class="status">

      Scène actuellement diffusée :

      <span id="currentScene">
        Aucune
      </span>

    </div>


    <!-- ========================================
         BOUTONS DE DIFFUSION
         ======================================== -->

    <div class="scene-grid">


      <!-- VIDÉO 1 -->

      <button
        class="scene-button video"
        onclick="diffuser('video1')">

        🎬<br>
        VIDÉO 1

      </button>


      <!-- VIDÉO 2 -->

      <button
        class="scene-button video"
        onclick="diffuser('video2')">

        🎬<br>
        VIDÉO 2

      </button>


      <!-- DIAPORAMA -->

      <button
        class="scene-button photos"
        onclick="diffuser('photos')">

        🖼️<br>
        DIAPORAMA

      </button>


      <!-- PARTENAIRES -->

      <button
        class="scene-button page"
        onclick="diffuser('partenaires')">

        🤝<br>
        PARTENAIRES

      </button>


      <!-- ÉVÉNEMENTS -->

      <button
        class="scene-button page"
        onclick="diffuser('evenements')">

        📅<br>
        ÉVÉNEMENTS

      </button>


      <!-- VIDÉOS MVBC -->

      <button
        class="scene-button page"
        onclick="diffuser('videomvbc')">

        🎬<br>
        VIDÉOS MVBC

      </button>


      <!-- MATCH DU SOIR -->

      <button
        class="scene-button page"
        onclick="diffuser('matchdusoir')">

        🏀<br>
        MATCH DU SOIR

      </button>


      <!-- CLASSEMENT -->

      <button
        class="scene-button page"
        onclick="diffuser('classementnm2')">

        🏆<br>
        CLASSEMENT NM2

      </button>


      <!-- NOS ÉQUIPES -->

      <button
        class="scene-button page"
        onclick="diffuser('nosequipes')">

        👥<br>
        NOS ÉQUIPES

      </button>


      <!-- MESSAGE -->

      <button
        class="scene-button"
        onclick="diffuser('message')">

        📝<br>
        MESSAGE

      </button>


      <!-- ÉCRAN NOIR -->

      <button
        class="scene-button black"
        onclick="diffuser('black')">

        ⬛<br>
        ÉCRAN NOIR

      </button>


    </div>


  </div>


  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script type="module">

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
      getDatabase,
      ref,
      set
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // ========================================
    // FIREBASE
    // ========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

      authDomain:
        "diffusion-b9afa.firebaseapp.com",

      databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

      projectId:
        "diffusion-b9afa",

      storageBucket:
        "diffusion-b9afa.firebasestorage.app",

      messagingSenderId:
        "674799570797",

      appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"

    };


    const app =
      initializeApp(
        firebaseConfig
      );


    const db =
      getDatabase(app);


    // ========================================
    // MOT DE PASSE
    // ========================================

    const MOT_DE_PASSE =
      "Mvbc85600@";


    // ========================================
    // ÉLÉMENTS
    // ========================================

    const login =
      document.getElementById("login");

    const admin =
      document.getElementById("admin");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginError =
      document.getElementById("loginError");

    const logoutButton =
      document.getElementById("logoutButton");

    const currentScene =
      document.getElementById("currentScene");


    // ========================================
    // CONNEXION AUTOMATIQUE
    // ========================================

    if (
      sessionStorage.getItem(
        "adminConnecte"
      ) === "true"
    ) {

      afficherAdmin();

    }


    // ========================================
    // CONNEXION
    // ========================================

    loginButton.addEventListener(
      "click",
      verifierMotDePasse
    );


    // ========================================
    // ENTER
    // ========================================

    password.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          verifierMotDePasse();

        }

      }
    );


    // ========================================
    // VÉRIFIER MOT DE PASSE
    // ========================================

    function verifierMotDePasse() {


      if (
        password.value ===
        MOT_DE_PASSE
      ) {


        sessionStorage.setItem(
          "adminConnecte",
          "true"
        );


        afficherAdmin();


        password.value = "";


        loginError.textContent =
          "";

      }

      else {


        loginError.textContent =
          "Mot de passe incorrect.";


        password.value =
          "";

      }

    }


    // ========================================
    // AFFICHER ADMIN
    // ========================================

    function afficherAdmin() {

      login.style.display =
        "none";

      admin.style.display =
        "block";

    }


    // ========================================
    // DÉCONNEXION
    // ========================================

    logoutButton.addEventListener(
      "click",
      () => {

        sessionStorage.removeItem(
          "adminConnecte"
        );


        admin.style.display =
          "none";


        login.style.display =
          "flex";

      }
    );


    // ========================================
    // DIFFUSER
    // ========================================

    window.diffuser =
      function(scene) {


        console.log(
          "Commande envoyée :",
          scene
        );


        set(

          ref(
            db,
            "diffusion"
          ),

          {

            scene:
              scene,

            timestamp:
              Date.now()

          }

        )

        .then(() => {


          console.log(
            "Diffusion réussie :",
            scene
          );


          currentScene.textContent =
            scene;


        })

        .catch((error) => {


          console.error(
            "Erreur Firebase :",
            error
          );


          alert(
            "Erreur de diffusion : " +
            error.message
          );

        });

      };


  </script>


</body>

</html>
