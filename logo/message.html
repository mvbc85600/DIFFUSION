<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MESSAGE — MVBC</title>

<!-- =====================================================
     POLICES — MÊME TYPOGRAPHIE QUE MATCH DU SOIR
     ===================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

<style>

/* =====================================================
   VARIABLES
   ===================================================== */

:root {
    --white: #f7f7f5;
    --black: #050608;

    --blue: #1769ff;
    --red: #ed174c;
    --yellow: #ffd400;

    --halo1-rgb: 255,255,255;
}


/* =====================================================
   RESET
   ===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

html {
    overflow: hidden;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.035),
            transparent 32%
        ),
        #050608;

    color: var(--white);

    font-family: "Inter", sans-serif;

    visibility: hidden;
    opacity: 0;

    transition:
        opacity .35s ease,
        visibility .35s ease;
}

body.loaded {
    visibility: visible;
    opacity: 1;
}


/* =====================================================
   SCÈNE
   ===================================================== */

.stage {
    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    isolation: isolate;
}


/* =====================================================
   HALO CENTRAL
   ===================================================== */

.stage::before {
    content: "";

    position: absolute;

    left: 15%;
    top: 5%;

    width: 70%;
    height: 90%;

    z-index: -5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(var(--halo1-rgb), .20),
            rgba(var(--halo1-rgb), .08) 30%,
            transparent 68%
        );

    filter: blur(70px);

    pointer-events: none;
}


/* =====================================================
   ATMOSPHÈRE ARENA
   ===================================================== */

.arena-grid {
    position: absolute;

    inset: -20%;

    z-index: -4;

    pointer-events: none;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.012) 91px 92px
        ),
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.045),
            transparent 50%
        );

    transform:
        perspective(800px)
        rotateX(58deg)
        scale(1.35);

    transform-origin: center bottom;
}


/* =====================================================
   VIGNETTE
   ===================================================== */

.vignette {
    position: absolute;

    inset: 0;

    z-index: 30;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.48) 100%
        );
}


/* =====================================================
   LIGNES TECHNIQUES
   ===================================================== */

.tech-lines {
    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    opacity: .5;
}

.tech-lines::before,
.tech-lines::after {
    content: "";

    position: absolute;

    left: 5%;
    right: 5%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            transparent
        );
}

.tech-lines::before {
    top: 8%;
}

.tech-lines::after {
    bottom: 8%;
}


/* =====================================================
   PETITES LIGNES LATÉRALES
   ===================================================== */

.side-mark {
    position: absolute;

    width: 70px;
    height: 4px;

    z-index: 5;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--white)
        );

    opacity: .7;
}

.side-mark.left {
    left: 4%;
    top: 50%;
}

.side-mark.right {
    right: 4%;
    top: 50%;

    transform: rotate(180deg);
}


/* =====================================================
   CONTENU
   ===================================================== */

.content {
    position: relative;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding:
        clamp(25px, 5vh, 60px)
        6vw
        clamp(25px, 5vh, 50px);

    min-height: 0;
}


/* =====================================================
   TITRE DU MESSAGE
   ===================================================== */

.message-title {
    position: relative;

    margin: 0 0 clamp(18px, 3vh, 40px) 0;

    font-family: "Barlow Condensed", sans-serif;

    font-size: clamp(
        40px,
        6vw,
        110px
    );

    font-weight: 900;

    line-height: .9;

    letter-spacing: .12em;

    text-align: center;

    text-transform: uppercase;

    white-space: nowrap;

    font-style: italic;

    transform:
        skewX(-5deg)
        scale(.65);

    opacity: 0;

    color: var(--white);

    text-shadow:
        5px 5px 0 var(--black),
        10px 10px 0 var(--yellow),
        16px 16px 0 rgba(237,23,76,.75),
        22px 22px 0 rgba(23,105,255,.45);

    will-change:
        transform,
        opacity;
}


/* =====================================================
   TRAIT SOUS LE TITRE
   ===================================================== */

.message-title-line {
    position: relative;

    width: min(65vw, 900px);

    height: 5px;

    margin-bottom: clamp(20px, 4vh, 45px);

    transform:
        scaleX(0)
        skewX(-15deg);

    transform-origin: center;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue) 15%,
            var(--yellow) 35%,
            var(--white) 50%,
            var(--yellow) 65%,
            var(--red) 85%,
            transparent
        );

    box-shadow:
        0 0 25px rgba(23,105,255,.35);
}


/* =====================================================
   CORPS DU MESSAGE (HTML riche)
   ===================================================== */

.message-body-wrap {
    flex: 1;

    width: min(86vw, 1100px);

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    opacity: 0;

    transform: translateY(30px);
}

.message-body {
    width: 100%;

    max-height: 100%;

    overflow-y: auto;

    padding:
        clamp(20px, 3vh, 40px)
        clamp(24px, 4vw, 55px);

    border:
        1px solid rgba(255,255,255,.25);

    border-radius: 6px;

    box-shadow:
        7px 7px 0 rgba(0,0,0,.55);

    font-family: "Inter", sans-serif;

    text-align: center;

    line-height: 1.5;
}

.message-body::-webkit-scrollbar {
    width: 6px;
}

.message-body::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,.25);
    border-radius: 3px;
}

/* Le HTML riche inséré depuis l'éditeur admin */

.message-body :is(h1, h2, h3) {
    font-family: "Barlow Condensed", sans-serif;
    text-transform: uppercase;
    letter-spacing: .02em;
    margin: .4em 0;
}

.message-body h1 { font-size: clamp(30px, 4vw, 60px); }
.message-body h2 { font-size: clamp(26px, 3.4vw, 50px); }
.message-body h3 { font-size: clamp(22px, 2.8vw, 42px); }

.message-body p {
    margin: .5em 0;
}

.message-body ul,
.message-body ol {
    text-align: left;
    display: inline-block;
    margin: .5em 0;
    padding-left: 1.4em;
}

.message-body a {
    color: inherit;
    text-decoration: underline;
}

.message-body hr {
    border: none;
    height: 2px;
    background:
        linear-gradient(
            90deg,
            transparent,
            var(--yellow),
            transparent
        );
    margin: 1em auto;
    width: 60%;
}

.message-body blockquote {
    margin: .6em 0;
    padding: .4em 1em;
    border-left: 4px solid var(--yellow);
    background: rgba(255,255,255,.05);
}

.message-body img {
    max-width: 100%;
    height: auto;
}


/* =====================================================
   DÉFILEMENT DES LOGOS DES PARTENAIRES
   ===================================================== */

.partners-bar {
    position: relative;

    z-index: 12;

    flex: 0 0 auto;

    width: min(90vw, 1200px);

    height: clamp(80px, 11vh, 120px);

    margin-top: clamp(18px, 3vh, 35px);

    background: rgba(0, 0, 0, 0.55);

    border:
        1px solid rgba(255,255,255,.18);

    border-radius: 10px;

    overflow: hidden;

    opacity: 0;

    transform: translateY(30px);

    display: none; /* activé si afficherDefilementLogos = true */
}

.partners-bar.visible {
    display: block;
}

.partners-scroll {
    display: flex;

    align-items: center;

    width: max-content;

    height: 100%;

    white-space: nowrap;

    animation: scrollPartners 60s linear infinite;
}

.partners-scroll img {
    height: 82%;

    max-height: 80px;

    margin: 0 25px;

    object-fit: contain;

    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));

    opacity: 1;
}

@keyframes scrollPartners {
    0% {
        transform: translateX(0);
    }
    100% {
        transform: translateX(-50%);
    }
}


/* =====================================================
   SPEED LINES
   ===================================================== */

.speed-lines {
    position: absolute;

    inset: 0;

    z-index: 3;

    overflow: hidden;

    pointer-events: none;
}

.speed-line {
    position: absolute;

    left: 50%;
    top: 50%;

    width: clamp(
        120px,
        18vw,
        300px
    );

    height: 2px;

    transform-origin: 0 50%;

    transform:
        rotate(var(--angle))
        translateX(20px)
        scaleX(0);

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.85),
            transparent
        );
}


/* =====================================================
   FLASH
   ===================================================== */

.flash {
    position: absolute;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    opacity: 0;

    background:
        rgba(255,255,255,.8);

    mix-blend-mode: screen;
}


/* =====================================================
   PARTICULES
   ===================================================== */

.particles {
    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;
}

.particle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,255,255,.55);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);
}


/* =====================================================
   ANIMATIONS
   ===================================================== */

.stage.loaded .message-title {
    animation:
        titleImpact
        1.5s
        cubic-bezier(.16,.9,.25,1)
        .25s
        forwards;
}

.stage.loaded .message-title-line {
    animation:
        lineReveal
        1s
        cubic-bezier(.16,1,.3,1)
        .65s
        forwards;
}

.stage.loaded .message-body-wrap {
    animation:
        infoIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        .9s
        forwards;
}

.stage.loaded .partners-bar {
    animation:
        infoIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        1.15s
        forwards;
}

.stage.loaded .speed-line {
    animation:
        speedImpact
        .8s
        cubic-bezier(.15,.8,.3,1)
        forwards;
}


/* =====================================================
   KEYFRAMES
   ===================================================== */

@keyframes titleImpact {

    0% {
        opacity: 0;

        transform:
            skewX(-5deg)
            scale(.45);

        filter: blur(8px);
    }

    15% {
        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1.08);

        filter: blur(0);
    }

    28% {
        transform:
            skewX(-5deg)
            scale(.96);
    }

    42% {
        transform:
            skewX(-5deg)
            scale(1.02);
    }

    100% {
        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1);
    }
}


@keyframes lineReveal {

    0% {
        opacity: 0;

        transform:
            scaleX(0)
            skewX(-15deg);
    }

    100% {
        opacity: 1;

        transform:
            scaleX(1)
            skewX(-15deg);
    }
}


@keyframes infoIn {

    0% {
        opacity: 0;

        transform: translateY(30px);
    }

    100% {
        opacity: 1;

        transform: translateY(0);
    }
}


@keyframes speedImpact {

    0% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(10px)
            scaleX(0);
    }

    20% {
        opacity: .8;
    }

    100% {
        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(30px)
            scaleX(1);
    }
}


@keyframes particleFloat {

    0% {
        opacity: 0;

        transform:
            translateY(20px)
            scale(.5);
    }

    30% {
        opacity: .6;
    }

    70% {
        opacity: .35;
    }

    100% {
        opacity: 0;

        transform:
            translateY(-100px)
            scale(1);
    }
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 600px) {

    .content {
        padding:
            20px
            4vw
            16px;
    }

    .message-title {
        font-size: clamp(
            32px,
            9vw,
            64px
        );

        line-height: .95;

        letter-spacing: .1em;
    }

    .message-title-line {
        width: 75vw;
    }

    .message-body {
        padding: 16px 18px;
        font-size: 15px;
    }

    .partners-bar {
        height: 70px;
    }

    .partners-scroll img {
        margin: 0 12px;
    }
}


/* =====================================================
   GRANDS ÉCRANS LED
   ===================================================== */

@media (min-width: 1600px) {

    .message-title {
        font-size:
            clamp(
                70px,
                6vw,
                130px
            );
    }

    .message-body {
        font-size: clamp(24px, 1.8vw, 34px);
    }
}


/* =====================================================
   ACCESSIBILITÉ
   ===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration: .01ms !important;

        animation-iteration-count: 1 !important;

        scroll-behavior: auto !important;
    }
}

</style>
</head>


<body>

<div class="stage" id="stage">

    <!-- Atmosphère -->
    <div class="arena-grid"></div>

    <!-- Lignes -->
    <div class="tech-lines"></div>

    <div class="side-mark left"></div>
    <div class="side-mark right"></div>

    <!-- Speed lines -->
    <div class="speed-lines" id="speedLines"></div>

    <!-- Flash -->
    <div class="flash"></div>

    <!-- Contenu principal -->
    <main class="content">

        <!-- Titre du message -->
        <h1
            class="message-title"
            id="messageTitre"
        >
            MESSAGE
        </h1>

        <div class="message-title-line"></div>

        <!-- Corps du message (HTML riche) -->
        <div class="message-body-wrap">
            <div
                class="message-body"
                id="messageContenu"
            >
                &nbsp;
            </div>
        </div>

        <!-- Défilement des logos des partenaires -->
        <div
            class="partners-bar"
            id="partnersBar"
        >
            <div
                class="partners-scroll"
                id="partnersScroll"
            >
                <!-- Logos ajoutés dynamiquement -->
            </div>
        </div>

    </main>


    <!-- Vignette -->
    <div class="vignette"></div>

    <!-- Particules -->
    <div
        class="particles"
        id="particles"
    ></div>

</div>


<!-- =====================================================
     FIREBASE
     ===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   CONFIG FIREBASE (identique à admin.html / matchdusoir.html)
   ===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

    authDomain:
        "diffusion-b9afa.firebaseapp.com",

    databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "diffusion-b9afa",

    storageBucket:
        "diffusion-b9afa.firebasestorage.app",

    messagingSenderId:
        "674799570797",

    appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"
};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const messageRef = ref(
    db,
    "message"
);


/* =====================================================
   LOGOS PARTENAIRES (GitHub — même source que admin.html)
   ===================================================== */

const GITHUB_LOGO_API =
    "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";

const GITHUB_LOGO_RAW =
    "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";


/* =====================================================
   DOM
   ===================================================== */

const body =
    document.body;

const stage =
    document.getElementById("stage");

const messageTitre =
    document.getElementById("messageTitre");

const messageContenu =
    document.getElementById("messageContenu");

const partnersBar =
    document.getElementById("partnersBar");

const partnersScroll =
    document.getElementById("partnersScroll");

const speedLines =
    document.getElementById("speedLines");

const particles =
    document.getElementById("particles");


/* =====================================================
   SPEED LINES
   ===================================================== */

const angles = [
    0, 18, 36, 54, 72, 90,
    108, 126, 144, 162, 180,
    198, 216, 234, 252, 270,
    288, 306, 324, 342
];

angles.forEach(angle => {
    const line = document.createElement("div");
    line.className = "speed-line";
    line.style.setProperty("--angle", `${angle}deg`);
    line.style.animationDelay = `${Math.random() * .18}s`;
    speedLines.appendChild(line);
});


/* =====================================================
   PARTICULES
   ===================================================== */

for (let i = 0; i < 30; i++) {

    const particle = document.createElement("div");
    particle.className = "particle";

    particle.style.left = `${Math.random() * 100}%`;
    particle.style.top = `${Math.random() * 100}%`;

    particle.style.setProperty(
        "--duration",
        `${3 + Math.random() * 5}s`
    );

    particle.style.setProperty(
        "--delay",
        `${Math.random() * 5}s`
    );

    particles.appendChild(particle);
}


/* =====================================================
   HEX → RGB
   ===================================================== */

function hexToRgb(hex) {

    if (typeof hex !== "string") {
        return { r: 255, g: 255, b: 255 };
    }

    let value = hex.replace("#", "").trim();

    if (value.length === 3) {
        value =
            value
                .split("")
                .map(c => c + c)
                .join("");
    }

    if (!/^[0-9a-fA-F]{6}$/.test(value)) {
        return { r: 255, g: 255, b: 255 };
    }

    return {
        r: parseInt(value.substring(0, 2), 16),
        g: parseInt(value.substring(2, 4), 16),
        b: parseInt(value.substring(4, 6), 16)
    };
}


/* =====================================================
   ANIMATIONS (relance à chaque mise à jour Firebase)
   ===================================================== */

function restartAnimations() {

    const animatedElements = [
        messageTitre,
        document.querySelector(".message-title-line"),
        document.querySelector(".message-body-wrap"),
        partnersBar
    ];

    stage.classList.remove("loaded");

    animatedElements.forEach(element => {
        if (!element) return;
        element.style.animation = "none";
        void element.offsetWidth;
        element.style.animation = "";
    });

    document
        .querySelectorAll(".speed-line")
        .forEach(line => {
            line.style.animation = "none";
            void line.offsetWidth;
            line.style.animation = "";
        });

    void stage.offsetWidth;

    stage.classList.add("loaded");
}


/* =====================================================
   LOGOS PARTENAIRES
   ===================================================== */

let logosChargees = false;

async function chargerLogosPartenaires() {

    if (logosChargees) return true;

    try {

        const response = await fetch(GITHUB_LOGO_API, {
            headers: {
                "Accept": "application/vnd.github+json"
            },
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`GitHub a répondu ${response.status}`);
        }

        const fichiers = await response.json();

        partnersScroll.innerHTML = "";

        const logos = fichiers
            .filter(fichier =>
                fichier.type === "file" &&
                /\.(png|jpe?g|webp|gif|svg)$/i.test(fichier.name)
            )
            .map(fichier =>
                GITHUB_LOGO_RAW +
                encodeURIComponent(fichier.name)
            );

        /*
         * Deux passages pour conserver
         * le défilement en boucle infinie.
         */
        [...logos, ...logos].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Partenaire";
            img.onerror = function () {
                this.style.display = "none";
            };
            partnersScroll.appendChild(img);
        });

        logosChargees = true;

        return true;

    } catch (error) {
        console.error("Erreur chargement logos partenaires :", error);
        return false;
    }
}


/* =====================================================
   FIREBASE — ÉCOUTE DU MESSAGE
   ===================================================== */

onValue(
    messageRef,

    async snapshot => {

        const data = snapshot.val();


        /* ---------------------------------------------
           PAS DE DONNÉES
           --------------------------------------------- */

        if (!data) {

            messageTitre.textContent = "MESSAGE";
            messageContenu.innerHTML = "&nbsp;";

            messageContenu.style.color = "#f7f7f5";
            messageContenu.style.background = "transparent";

            document.documentElement.style.setProperty(
                "--halo1-rgb",
                "255,255,255"
            );

            partnersBar.classList.remove("visible");

            body.classList.add("loaded");
            restartAnimations();

            return;
        }


        /* ---------------------------------------------
           TEXTES
           --------------------------------------------- */

        messageTitre.textContent =
            (data.titre && data.titre.trim() !== "")
                ? data.titre
                : "MESSAGE";


        /*
         * Le contenu est enregistré en HTML depuis l'éditeur
         * riche de admin.html. Compatibilité : si c'est encore
         * du texte brut (ancien message), on l'insère comme
         * texte simple.
         */
        if (data.contenu !== undefined && data.contenu !== null) {
            if (/<[a-z][\s\S]*>/i.test(data.contenu)) {
                messageContenu.innerHTML = data.contenu;
            } else {
                messageContenu.textContent = data.contenu;
            }
        } else {
            messageContenu.innerHTML = "&nbsp;";
        }


        /* ---------------------------------------------
           COULEURS
           --------------------------------------------- */

        const couleurTexte = data.couleur || "#f7f7f5";
        const couleurFond = data.fond || "#1e1e1e";

        messageContenu.style.color = couleurTexte;
        messageContenu.style.background = couleurFond;

        const rgb = hexToRgb(couleurTexte);

        document.documentElement.style.setProperty(
            "--halo1-rgb",
            `${rgb.r},${rgb.g},${rgb.b}`
        );


        /* ---------------------------------------------
           DÉFILEMENT DES LOGOS
           --------------------------------------------- */

        if (data.afficherDefilementLogos) {

            const ok = await chargerLogosPartenaires();

            if (ok && partnersScroll.children.length > 0) {
                partnersBar.classList.add("visible");
            }

        } else {

            partnersBar.classList.remove("visible");
        }


        /* ---------------------------------------------
           AFFICHAGE
           --------------------------------------------- */

        body.classList.add("loaded");

        restartAnimations();
    },

    error => {

        console.error("Erreur Firebase message :", error);

        body.classList.add("loaded");
        stage.classList.add("loaded");
    }
);

</script>

</body>
</html>
