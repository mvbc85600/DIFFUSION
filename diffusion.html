<!DOCTYPE html>

<title>Diffusion MVBC</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   DIFFUSION
===================================================== */

#diffusion {

    position: relative;

    width: 100%;
    height: 100%;

}


/* =====================================================
   VIDÉO
===================================================== */

#video {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    display: none;

    z-index: 10;

}


/* =====================================================
   DIAPORAMA
===================================================== */

#slideshow {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: #000;

    display: none;

    z-index: 20;

}


#slideImage {

    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

}


/* =====================================================
   MESSAGE
===================================================== */

#message {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: calc(100% - 120px);

    display: none;

    align-items: center;
    justify-content: center;

    background: #000;

    color: #fff;

    z-index: 30;

    padding: 70px;

}


/* =====================================================
   PAGES
===================================================== */

#pageFrame {

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    border: 0;

    display: none;

    background: #000;

    z-index: 40;

}


/* =====================================================
   CARROUSEL PARTENAIRES
   7 LOGOS VISIBLES
===================================================== */

#partners-scroll-container {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 180px;

    background:

        linear-gradient(
            to top,
            rgba(0,0,0,0.98),
            rgba(0,0,0,0.88),
            rgba(0,0,0,0.60)
        );

    overflow: hidden;

    z-index: 50;

    display: none;

    perspective: 1800px;

    perspective-origin: center center;

}


/* =====================================================
   CONTENEUR DES 7 LOGOS
===================================================== */

#partners-scroll {

    position: relative;

    width: 100%;
    height: 100%;

}


/* =====================================================
   LOGOS
===================================================== */

#partners-scroll img {

    position: absolute;

    left: 50%;
    top: 50%;

    width: auto;
    height: auto;

    max-width: 250px;
    max-height: 125px;

    padding: 8px;

    object-fit: contain;

    background:

        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 3px solid;

    border-radius: 14px;

    transform-origin: center center;

    transition:

        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.9s ease;

}


/* =====================================================
   JAUNE
===================================================== */

#partners-scroll img.color-yellow {

    border-color: #ffcc00 !important;

}


/* =====================================================
   ROUGE
===================================================== */

#partners-scroll img.color-red {

    border-color: #ff2020 !important;

}


/* =====================================================
   BLEU
===================================================== */

#partners-scroll img.color-blue {

    border-color: #168cff !important;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

#partners-scroll img.center {

    transform:

        translate(-50%, -50%)
        translateZ(300px)
        scale(1.10);

    z-index: 20;

    opacity: 1;

    filter:

        brightness(1.15)
        contrast(1.08);

}


/* =====================================================
   HALO CENTRAL JAUNE
===================================================== */

#partners-scroll img.center.color-yellow {

    box-shadow:

        0 0 12px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px rgba(255,204,0,0.85),
        0 0 80px rgba(255,204,0,0.35);

}


/* =====================================================
   HALO CENTRAL ROUGE
===================================================== */

#partners-scroll img.center.color-red {

    box-shadow:

        0 0 12px #ff2020,
        0 0 25px #ff2020,
        0 0 50px rgba(255,32,32,0.85),
        0 0 80px rgba(255,32,32,0.35);

}


/* =====================================================
   HALO CENTRAL BLEU
===================================================== */

#partners-scroll img.center.color-blue {

    box-shadow:

        0 0 12px #168cff,
        0 0 25px #168cff,
        0 0 50px rgba(22,140,255,0.85),
        0 0 80px rgba(22,140,255,0.35);

}


/* =====================================================
   GAUCHE 1
===================================================== */

#partners-scroll img.left1 {

    transform:

        translate(-50%, -50%)
        translateX(-270px)
        translateZ(40px)
        scale(0.70);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   GAUCHE 2
===================================================== */

#partners-scroll img.left2 {

    transform:

        translate(-50%, -50%)
        translateX(-480px)
        translateZ(-250px)
        scale(0.48);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   DROITE 1
===================================================== */

#partners-scroll img.right1 {

    transform:

        translate(-50%, -50%)
        translateX(270px)
        translateZ(40px)
        scale(0.70);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   DROITE 2
===================================================== */

#partners-scroll img.right2 {

    transform:

        translate(-50%, -50%)
        translateX(480px)
        translateZ(-250px)
        scale(0.48);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   LOGOS CACHÉS
===================================================== */

#partners-scroll img.hidden {

    transform:

        translate(-50%, -50%)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    filter: blur(5px);

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

#partners-light-line {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform: translateX(-50%);

    width: 65%;

    height: 3px;

    background: #ffcc00;

    box-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;

    z-index: 90;

    transition:

        background 0.7s ease,
        box-shadow 0.7s ease;

}


/* =====================================================
   TRANSITION
===================================================== */

.fade {

    animation: fadeIn 0.5s ease-in-out;

}


@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


/* =====================================================
   ANIMATIONS MESSAGE
===================================================== */

@keyframes typing {

    from {
        width: 0;
    }

    to {
        width: 100%;
    }

}


@keyframes fadeInText {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


@keyframes slideUp {

    from {

        transform:
            translateY(20px);

        opacity: 0;

    }

    to {

        transform:
            translateY(0);

        opacity: 1;

    }

}


@keyframes pulseGlow {

    from {

        transform:
            scale(0.8);

        opacity: 0.5;

    }

    to {

        transform:
            scale(1.2);

        opacity: 0.8;

    }

}


@keyframes shine {

    from {

        opacity: 0.5;

        transform:
            scaleX(0.8);

    }

    to {

        opacity: 1;

        transform:
            scaleX(1.2);

    }

}


/* =====================================================
   ÉCRANS 1600PX ET MOINS
===================================================== */

@media (max-width: 1600px) {

    #partners-scroll img {

        max-width: 220px;
        max-height: 115px;

    }


    #partners-scroll img.left1 {

        transform:

            translate(-50%, -50%)
            translateX(-240px)
            translateZ(30px)
            scale(0.65);

    }


    #partners-scroll img.right1 {

        transform:

            translate(-50%, -50%)
            translateX(240px)
            translateZ(30px)
            scale(0.65);

    }


    #partners-scroll img.left2 {

        transform:

            translate(-50%, -50%)
            translateX(-430px)
            translateZ(-200px)
            scale(0.42);

    }


    #partners-scroll img.right2 {

        transform:

            translate(-50%, -50%)
            translateX(430px)
            translateZ(-200px)
            scale(0.42);

    }

}


/* =====================================================
   ÉCRANS 1200PX ET MOINS
===================================================== */

@media (max-width: 1200px) {

    #partners-scroll-container {

        height: 160px;

    }


    #partners-scroll img {

        max-width: 180px;
        max-height: 100px;

    }


    #partners-scroll img.center {

        transform:

            translate(-50%, -50%)
            translateZ(180px)
            scale(0.95);

    }


    #partners-scroll img.left1 {

        transform:

            translate(-50%, -50%)
            translateX(-190px)
            translateZ(20px)
            scale(0.52);

    }


    #partners-scroll img.right1 {

        transform:

            translate(-50%, -50%)
            translateX(190px)
            translateZ(20px)
            scale(0.52);

    }


    #partners-scroll img.left2 {

        opacity: 0;

    }


    #partners-scroll img.right2 {

        opacity: 0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    #partners-scroll-container {

        height: 140px;

    }


    #partners-scroll img {

        max-width: 140px;
        max-height: 80px;

        padding: 6px;

        border-width: 2px;

        border-radius: 10px;

    }


    #partners-scroll img.center {

        transform:

            translate(-50%, -50%)
            scale(0.90);

    }


    #partners-scroll img.left1 {

        transform:

            translate(-50%, -50%)
            translateX(-120px)
            scale(0.40);

    }


    #partners-scroll img.right1 {

        transform:

            translate(-50%, -50%)
            translateX(120px)
            scale(0.40);

    }


    #partners-scroll img.left2,
    #partners-scroll img.right2 {

        display: none;

    }

}

</style>

];


/* =====================================================
   COULEURS
   JAUNE → ROUGE → BLEU
===================================================== */

const partnerColors = [

    "color-yellow",
    "color-red",
    "color-blue"

];


/* =====================================================
   INDEX DU CARROUSEL
===================================================== */

let partnerCarouselIndex = 0;


/* =====================================================
   CHARGEMENT DES LOGOS
===================================================== */

function chargerLogosPartenaires() {

    partnersScroll.innerHTML = "";


    partnerLogos.forEach(

        (logo, index) => {

            const img =
                document.createElement("img");


            img.src = logo;

            img.alt =
                "Partenaire";


            img.dataset.index =
                index;


            img.onerror =
                () => {

                    img.style.display =
                        "none";

                };


            partnersScroll.appendChild(img);

        }

    );


    updatePartnerCarousel();

}


/* =====================================================
   COULEUR DU PARTENAIRE
===================================================== */

function getPartnerColor(index) {

    return partnerColors[
        index %
        partnerColors.length
    ];

}


/* =====================================================
   MISE À JOUR DE LA BARRE LUMINEUSE
===================================================== */

function updateLightLine() {

    const currentColor =
        getPartnerColor(
            partnerCarouselIndex
        );


    if (
        currentColor ===
        "color-yellow"
    ) {

        partnersLightLine.style.background =
            "#ffcc00";

        partnersLightLine.style.boxShadow =

            "0 0 10px #ffcc00," +
            "0 0 25px #ffcc00," +
            "0 0 50px #ffcc00";

    }


    else if (
        currentColor ===
        "color-red"
    ) {

        partnersLightLine.style.background =
            "#ff2020";

        partnersLightLine.style.boxShadow =

            "0 0 10px #ff2020," +
            "0 0 25px #ff2020," +
            "0 0 50px #ff2020";

    }


    else {

        partnersLightLine.style.background =
            "#168cff";

        partnersLightLine.style.boxShadow =

            "0 0 10px #168cff," +
            "0 0 25px #168cff," +
            "0 0 50px #168cff";

    }

}


/* =====================================================
   MISE À JOUR DU CARROUSEL
   7 LOGOS VISIBLES
===================================================== */

function updatePartnerCarousel() {

    const logos =
        partnersScroll.querySelectorAll("img");


    const total =
        logos.length;


    if (!total) {

        return;

    }


    const center =
        partnerCarouselIndex % total;


    const left1 =
        (
            partnerCarouselIndex -
            1 +
            total
        ) % total;


    const left2 =
        (
            partnerCarouselIndex -
            2 +
            total
        ) % total;


    const right1 =
        (
            partnerCarouselIndex +
            1
        ) % total;


    const right2 =
        (
            partnerCarouselIndex +
            2
        ) % total;


    /*
       Tous les logos sont cachés
    */

    logos.forEach(

        logo => {

            logo.className =
                "hidden";

        }

    );


    /*
       Logo central
    */

    logos[center].className =

        "center " +
        getPartnerColor(center);


    /*
       Gauche 1
    */

    logos[left1].className =

        "left1 " +
        getPartnerColor(left1);


    /*
       Gauche 2
    */

    logos[left2].className =

        "left2 " +
        getPartnerColor(left2);


    /*
       Droite 1
    */

    logos[right1].className =

        "right1 " +
        getPartnerColor(right1);


    /*
       Droite 2
    */

    logos[right2].className =

        "right2 " +
        getPartnerColor(right2);


    updateLightLine();

}


/* =====================================================
   ROTATION DU CARROUSEL
===================================================== */

let partnerCarouselTimer = null;


function demarrerCarrouselPartenaires() {

    if (partnerCarouselTimer) {

        clearInterval(
            partnerCarouselTimer
        );

    }


    partnerCarouselTimer =

        setInterval(

            () => {

                partnerCarouselIndex =

                    (
                        partnerCarouselIndex +
                        1
                    ) %
                    partnerLogos.length;


                updatePartnerCarousel();

            },

            2500

        );

}


function arreterCarrouselPartenaires() {

    if (partnerCarouselTimer) {

        clearInterval(
            partnerCarouselTimer
        );

        partnerCarouselTimer =
            null;

    }

}


/* =====================================================
   CHARGEMENT INITIAL
===================================================== */

chargerLogosPartenaires();


/* =====================================================
   RÉFÉRENCES FIREBASE
===================================================== */

const messageRef =
    ref(db, "message");


const diffusionRef =
    ref(db, "diffusion");


let currentMessageData =
    null;


let currentScene =
    null;


/* =====================================================
   ÉCOUTE DU MESSAGE
===================================================== */

onValue(

    messageRef,

    (snapshot) => {

        currentMessageData =
            snapshot.val();


        console.log(
            "Message mis à jour:",
            currentMessageData
        );


        if (
            currentScene ===
            "message"
        ) {

            const afficherLogos =

                currentMessageData &&
                currentMessageData.afficherDefilementLogos;


            partnersScrollContainer.style.display =

                afficherLogos
                    ? "block"
                    : "none";


            if (afficherLogos) {

                demarrerCarrouselPartenaires();

            }

            else {

                arreterCarrouselPartenaires();

            }

        }

    }

);


/* =====================================================
   ÉCOUTE DE LA DIFFUSION
===================================================== */

onValue(

    diffusionRef,

    (snapshot) => {

        const data =
            snapshot.val();


        if (
            !data ||
            !data.scene
        ) {

            return;

        }


        currentScene =
            data.scene;


        console.log(
            "Nouvelle scène:",
            currentScene
        );


        afficherScene(
            currentScene
        );

    }

);


/* =====================================================
   AFFICHER UNE SCÈNE
===================================================== */

    /*
       Tout masquer
    */

    video.style.display =
        "none";


    slideshow.style.display =
        "none";


    message.style.display =
        "none";


    pageFrame.style.display =
        "none";


    partnersScrollContainer.style.display =
        "none";


    arreterCarrouselPartenaires();


    /*
       Arrêter le diaporama
    */

    arreterDiaporama();


    /*
       Arrêter la vidéo
    */

    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    /*
       Afficher la scène demandée
    */

    switch (scene) {


        case "video1":

            afficherVideo(
                "video/defense.mp4"
            );

            break;


        case "video2":

            afficherVideo(
                "videos/video2.mp4"
            );

            break;


        case "photos":

            lancerDiaporama();

            break;


        case "partenaires":

            afficherPage(
                "partenaires.html"
            );

            break;


        case "evenements":

            afficherPage(
                "evenements.html"
            );

            break;


        case "videomvbc":

            afficherPage(
                "videomvbc.html"
            );

            break;


        case "matchdusoir":

            afficherPage(

            );

            break;


        case "classementnm2":

            afficherPage(
                "classementnm2.html"
            );

            break;


        case "nosequipes":

            afficherPage(
                "nosequipes.html"
            );

            break;


        case "page2":

            afficherMessage(

            );

        case "message":

            afficherMessagePersonnalise();


            /*
               Afficher le carrousel
               uniquement si activé
            */

            if (

                currentMessageData &&

                currentMessageData
                    .afficherDefilementLogos

            ) {

                partnersScrollContainer.style.display =
                    "block";


                demarrerCarrouselPartenaires();

            }

            break;


        case "black":

            document.body.style.background =
                "#000";

            break;

    }

}


/* =====================================================
   AFFICHER VIDÉO
===================================================== */

function afficherVideo(source) {

    document.body.style.background =
        "#000";


    video.style.display =
        "block";


    video.classList.remove(
        "fade"
    );


    void video.offsetWidth;


    video.classList.add(
        "fade"
    );


    video.src =
        source;


    video.currentTime =
        0;


    video.play().catch(

        e =>
            console.error(
                "Erreur vidéo:",
                e
            )

    );

}

/* =====================================================
   DIAPORAMA
===================================================== */

let slideTimer =
    null;


let currentSlide =
    0;


const slides = [

    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"

];


function lancerDiaporama() {

    document.body.style.background =
        "#000";


    slideshow.style.display =
        "block";


    currentSlide =
        0;


    afficherSlide();


    slideTimer =

        setInterval(

            () => {

                currentSlide =

                    (
                        currentSlide +
                        1
                    ) %
                    slides.length;


                afficherSlide();

            },

            5000

        );

}


function afficherSlide() {

    slideImage.classList.remove(
        "fade"
    );


    void slideImage.offsetWidth;


    slideImage.classList.add(
        "fade"
    );


    slideImage.src =
        slides[currentSlide];

}


function arreterDiaporama() {

    if (slideTimer) {

        clearInterval(
            slideTimer
        );

        slideTimer =
            null;

    }

}
