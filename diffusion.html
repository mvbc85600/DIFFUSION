<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffusion MVBC</title>
  <style>
    /* =====================================================
       RESET
    ===================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    /* =====================================================
       FOND
    ===================================================== */
    body {
      position: relative;
      background:
        radial-gradient(
          circle at center,
          #252000 0%,
          #100e00 35%,
          #050500 65%,
          #000 100%
        );
    }

    /* =====================================================
       HALO CENTRAL DU FOND
    ===================================================== */
    body::before {
      content: "";
      position: fixed;
      width: 900px;
      height: 900px;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(
          circle,
          rgba(255,204,0,0.20) 0%,
          rgba(255,204,0,0.08) 25%,
          rgba(255,204,0,0.02) 50%,
          transparent 70%
        );
      pointer-events: none;
      animation: halo 4s ease-in-out infinite;
    }

    @keyframes halo {
      0% {
        transform: translate(-50%, -50%) scale(0.90);
        opacity: 0.65;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.10);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.90);
        opacity: 0.65;
      }
    }

    /* =====================================================
       CONTENEUR PRINCIPAL
    ===================================================== */
    #diffusion {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* =====================================================
       VIDÉO
    ===================================================== */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 20;
    }

    /* =====================================================
       DIAPORAMA
    ===================================================== */
    #slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 20;
    }

    #slideImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* =====================================================
       MESSAGE
    ===================================================== */
    #message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      z-index: 30;
      padding: 40px;
      box-sizing: border-box;
    }

    /* =====================================================
       PAGES HTML
    ===================================================== */
    #pageFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #000;
      z-index: 40;
    }

    /* =====================================================
       CARROUSEL DES PARTENAIRES
    ===================================================== */
    #partners-carousel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      z-index: 50;
      perspective: 1800px;
      perspective-origin: center center;
    }

    #partners-carousel .carousel {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =====================================================
       STYLE DES LOGOS (MEME QUE PARTENAIRES.HTML)
    ===================================================== */
    #partners-carousel img {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: center center;
      width: auto;
      height: auto;
      max-width: 740px;
      max-height: 550px;
      padding: 22px;
      object-fit: contain;
      background:
        linear-gradient(
          145deg,
          rgba(30,30,30,0.98),
          rgba(5,5,5,0.98)
        );
      border: 4px solid;
      border-radius: 24px;
      transition:
        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.9s ease;
    }

    /* COULEURS DES BORDURES */
    .color-yellow { border-color: #ffcc00 !important; }
    .color-red { border-color: #ff2020 !important; }
    .color-blue { border-color: #168cff !important; }

    /* POSITIONS DES LOGOS */
    .center {
      transform:
        translate(-50%, -50%)
        translateZ(300px)
        scale(1.10);
      z-index: 20;
      opacity: 1;
      filter:
        brightness(1.15)
        contrast(1.08);
    }

    .left1 {
      transform:
        translate(-50%, -50%)
        translateX(-540px)
        translateZ(40px)
        scale(0.62);
      z-index: 12;
      opacity: 0.75;
      filter:
        brightness(0.75)
        contrast(0.95);
    }

    .left2 {
      transform:
        translate(-50%, -50%)
        translateX(-860px)
        translateZ(-250px)
        scale(0.41);
      z-index: 8;
      opacity: 0.38;
      filter:
        brightness(0.55)
        blur(0.3px);
    }

    .right1 {
      transform:
        translate(-50%, -50%)
        translateX(540px)
        translateZ(40px)
        scale(0.62);
      z-index: 12;
      opacity: 0.75;
      filter:
        brightness(0.75)
        contrast(0.95);
    }

    .right2 {
      transform:
        translate(-50%, -50%)
        translateX(860px)
        translateZ(-250px)
        scale(0.41);
      z-index: 8;
      opacity: 0.38;
      filter:
        brightness(0.55)
        blur(0.3px);
    }

    .hidden {
      transform:
        translate(-50%, -50%)
        translateZ(-700px)
        scale(0.15);
      opacity: 0;
      filter: blur(5px);
      z-index: 1;
      pointer-events: none;
    }

    /* EFFETS DE LUMIÈRE POUR LES LOGOS CENTRAUX */
    .center.color-yellow {
      box-shadow:
        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);
    }

    .center.color-red {
      box-shadow:
        0 0 20px #ff2020,
        0 0 45px #ff2020,
        0 0 90px rgba(255,32,32,0.85),
        0 0 140px rgba(255,32,32,0.35);
    }

    .center.color-blue {
      box-shadow:
        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 90px rgba(22,140,255,0.85),
        0 0 140px rgba(22,140,255,0.35);
    }

    /* =====================================================
       BARRE LUMINEUSE (MEME QUE PARTENAIRES.HTML)
    ===================================================== */
    .light-line {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 65%;
      height: 3px;
      background: #ffcc00;
      box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
      z-index: 90;
      display: none;
    }

    /* =====================================================
       TRANSITIONS
    ===================================================== */
    .fade {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* =====================================================
       ANIMATIONS POUR LE MESSAGE
    ===================================================== */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes fadeInText {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulseGlow {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1.2); opacity: 0.8; }
    }

    @keyframes shine {
      from { opacity: 0.5; transform: scaleX(0.8); }
      to { opacity: 1; transform: scaleX(1.2); }
    }

    /* =====================================================
       RESPONSIVE
    ===================================================== */
    @media (max-width: 1600px) {
      #partners-carousel img {
        max-width: 680px;
        max-height: 510px;
      }
      .center {
        transform:
          translate(-50%, -50%)
          translateZ(250px)
          scale(1.02);
      }
      .left1 {
        transform:
          translate(-50%, -50%)
          translateX(-450px)
          translateZ(30px)
          scale(0.55);
      }
      .right1 {
        transform:
          translate(-50%, -50%)
          translateX(450px)
          translateZ(30px)
          scale(0.55);
      }
      .left2 {
        transform:
          translate(-50%, -50%)
          translateX(-700px)
          translateZ(-200px)
          scale(0.36);
      }
      .right2 {
        transform:
          translate(-50%, -50%)
          translateX(700px)
          translateZ(-200px)
          scale(0.36);
      }
    }

    @media (max-width: 1200px) {
      #partners-carousel img {
        max-width: 570px;
        max-height: 430px;
      }
      .center {
        transform:
          translate(-50%, -50%)
          translateZ(180px)
          scale(0.98);
      }
      .left1 {
        transform:
          translate(-50%, -50%)
          translateX(-330px)
          translateZ(20px)
          scale(0.48);
      }
      .right1 {
        transform:
          translate(-50%, -50%)
          translateX(330px)
          translateZ(20px)
          scale(0.48);
      }
      .left2, .right2 {
        opacity: 0;
      }
    }

    @media (max-width: 700px) {
      #partners-carousel img {
        max-width: 85vw;
        max-height: 400px;
        padding: 15px;
      }
      .center {
        transform:
          translate(-50%, -50%)
          scale(0.92);
      }
      .left1 {
        transform:
          translate(-50%, -50%)
          translateX(-190px)
          scale(0.40);
      }
      .right1 {
        transform:
          translate(-50%, -50%)
          translateX(190px)
          scale(0.40);
      }
      .left2, .right2 {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="diffusion">
    <!-- VIDÉO -->
    <video id="video" playsinline preload="auto"></video>

    <!-- DIAPORAMA -->
    <div id="slideshow">
      <img id="slideImage" src="" alt="Diaporama">
    </div>

    <!-- MESSAGE -->
    <div id="message"></div>

    <!-- PAGES HTML -->
    <iframe id="pageFrame" src="" allow="autoplay"></iframe>

    <!-- CARROUSEL DES PARTENAIRES -->
    <div id="partners-carousel">
      <div class="carousel" id="carousel"></div>
    </div>
  </div>

  <!-- BARRE LUMINEUSE -->
  <div class="light-line" id="light-line"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ==================================================
    // CONFIGURATION FIREBASE
    // ==================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
      authDomain: "diffusion-b9afa.firebaseapp.com",
      databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "diffusion-b9afa",
      storageBucket: "diffusion-b9afa.firebasestorage.app",
      messagingSenderId: "674799570797",
      appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ==================================================
    // RÉCUPÉRATION DES ÉLÉMENTS HTML
    // ==================================================
    const video = document.getElementById("video");
    const message = document.getElementById("message");
    const slideshow = document.getElementById("slideshow");
    const slideImage = document.getElementById("slideImage");
    const pageFrame = document.getElementById("pageFrame");
    const partnersCarousel = document.getElementById("partners-carousel");
    const carousel = document.getElementById("carousel");
    const lightLine = document.getElementById("light-line");

    // ==================================================
    // LISTE DES LOGOS DES PARTENAIRES
    // ==================================================
    const partnerLogos = [
      "logo/7ENVIE DE PAIN.png",
      "logo/AGTIM.png",
      "logo/Alain AFFLELOU.png",
      "logo/APOLLO.png",
      "logo/ARRIVE.png",
      "logo/ARTIPOLE.png",
      "logo/ATP.png",
      "logo/AUTO BILAN VIEILLEVIGNE.png",
      "logo/BAR LE SCORE.png",
      "logo/BARREAU.png",
      "logo/BIOCOOP.png",

      "logo/ID2TECH.png",
      "logo/IDM.png",

      "logo/JAD'O.png",
      "logo/LA MARTINIQUAISE.png",
      "logo/LE CONSERVATEUR.png",
      "logo/LECLERC.png",
      "logo/LLA.png",

      "logo/NATURACARE.png",

      "logo/RATOKE.png",

      "logo/RT.png",
      "logo/SCHMIDT.png",
      "logo/SENARD.png",
      "logo/SEV.png",
      "logo/SODEBO.png",

      "logo/STRAPHARM.png",

      "logo/SYMBIOSE.png",
      "logo/TDM.png",
      "logo/UNE ENVIE DE PIZZA.png",
      "logo/VEB (2).png",
      "logo/VFLIT.png",
      "logo/VST.png"
    ];

    // ==================================================
    // CHARGEMENT DES LOGOS DANS LE CARROUSEL
    // ==================================================
    function chargerLogosPartenaires() {
      carousel.innerHTML = "";
      partnerLogos.forEach(logo => {
        const img = document.createElement('img');
        img.src = logo;
        img.alt = "Partenaire";
        img.onerror = () => { img.style.display = 'none'; };
        carousel.appendChild(img);
      });
    }

    // Charger les logos au démarrage
    chargerLogosPartenaires();

    // ==================================================
    // CARROUSEL 3D (MEME QUE PARTENAIRES.HTML)
    // ==================================================
    let currentIndex = 0;
    const colors = ["color-yellow", "color-red", "color-blue"];
    const logos = document.querySelectorAll("#carousel img");
    const totalLogos = logos.length;

    function getColor(index) {
      return colors[index % colors.length];
    }

    function updateCarousel() {
      // Cacher tous les logos
      logos.forEach(logo => {
        logo.className = "hidden";
      });

      // Calculer les positions
      const center = currentIndex % totalLogos;
      const left1 = (currentIndex - 1 + totalLogos) % totalLogos;
      const left2 = (currentIndex - 2 + totalLogos) % totalLogos;
      const right1 = (currentIndex + 1) % totalLogos;
      const right2 = (currentIndex + 2) % totalLogos;

      // Appliquer les classes
      logos[center].className = `center ${getColor(center)}`;
      logos[left1].className = `left1 ${getColor(left1)}`;
      logos[left2].className = `left2 ${getColor(left2)}`;
      logos[right1].className = `right1 ${getColor(right1)}`;
      logos[right2].className = `right2 ${getColor(right2)}`;

      // Mettre à jour la barre lumineuse
      const currentColor = getColor(currentIndex);
      if (currentColor === "color-yellow") {
        lightLine.style.background = "#ffcc00";
        lightLine.style.boxShadow = "0 0 10px #ffcc00, 0 0 25px #ffcc00, 0 0 50px #ffcc00";
      } else if (currentColor === "color-red") {
        lightLine.style.background = "#ff2020";
        lightLine.style.boxShadow = "0 0 10px #ff2020, 0 0 25px #ff2020, 0 0 50px #ff2020";
      } else {
        lightLine.style.background = "#168cff";
        lightLine.style.boxShadow = "0 0 10px #168cff, 0 0 25px #168cff, 0 0 50px #168cff";
      }
    }

    // Initialiser le carrousel
    updateCarousel();

    // Rotation automatique toutes les 2.5 secondes
    setInterval(() => {
      currentIndex = (currentIndex + 1) % totalLogos;
      updateCarousel();
    }, 2500);

    // ==================================================
    // RÉFÉRENCES FIREBASE
    // ==================================================
    const messageRef = ref(db, "message");
    const diffusionRef = ref(db, "diffusion");
    let currentMessageData = null;
    let currentScene = null;

    // ==================================================
    // ÉCOUTE DES MODIFICATIONS
    // ==================================================
    onValue(messageRef, (snapshot) => {
      currentMessageData = snapshot.val();
      console.log("Message mis à jour:", currentMessageData);
    });

    onValue(diffusionRef, (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.scene) return;

      currentScene = data.scene;
      console.log("Nouvelle scène:", currentScene);
      afficherScene(currentScene);
    });

    // ==================================================
    // AFFICHER UNE SCÈNE
    // ==================================================
    function afficherScene(scene) {
      // Tout masquer
      video.style.display = "none";
      slideshow.style.display = "none";
      message.style.display = "none";
      pageFrame.style.display = "none";
      partnersCarousel.style.display = "none";
      lightLine.style.display = "none";

      // Arrêter le diaporama et la vidéo
      arreterDiaporama();
      video.pause();
      video.removeAttribute("src");
      video.load();

      // Afficher la scène demandée
      switch(scene) {
        case "video1":
          afficherVideo("video/defense.mp4");
          break;
        case "video2":
          afficherVideo("videos/video2.mp4");
          break;
        case "photos":
          lancerDiaporama();
          break;
        case "partenaires":
          afficherPage("partenaires.html");
          break;
        case "evenements":
          afficherPage("evenements.html");
          break;
        case "videomvbc":
          afficherPage("videomvbc.html");
          break;
        case "matchdusoir":
          afficherPage("matchdusoir.html");
          break;
        case "classementnm2":
          afficherPage("classementnm2.html");
          break;
        case "nosequipes":
          afficherPage("nosequipes.html");
          break;
        case "page2":
          afficherMessage("PAGE 2");
          break;
        case "message":
          afficherMessagePersonnalise();
          break;
        case "black":
          document.body.style.background = "#000";
          break;
        case "carousel-partenaires":
          afficherCarouselPartenaires();
          break;
      }
    }

    // ==================================================
    // FONCTION POUR AFFICHER LE CARROUSEL DES PARTENAIRES
    // ==================================================
    function afficherCarouselPartenaires() {
      document.body.style.background = "transparent";
      partnersCarousel.style.display = "block";
      lightLine.style.display = "block";
    }

    // ==================================================
    // FONCTIONS D'AFFICHAGE
    // ==================================================
    function afficherVideo(source) {
      document.body.style.background = "#000";
      video.style.display = "block";
      video.classList.remove("fade");
      void video.offsetWidth;
      video.classList.add("fade");
      video.src = source;
      video.currentTime = 0;
      video.play().catch(e => console.error("Erreur vidéo:", e));
    }

    function afficherPage(page) {
      document.body.style.background = "#000";
      pageFrame.style.display = "block";
      pageFrame.classList.remove("fade");
      void pageFrame.offsetWidth;
      pageFrame.classList.add("fade");
      pageFrame.src = page;
    }

    function afficherMessage(text) {
      document.body.style.background = "#000";
      message.textContent = text;
      message.style.display = "flex";
      message.classList.remove("fade");
      void message.offsetWidth;
      message.classList.add("fade");
    }

    // ==================================================
    // AFFICHER UN MESSAGE PERSONNALISÉ AVEC ANIMATIONS
    // ==================================================
    function afficherMessagePersonnalise() {
      document.body.style.background = "#000";

      let htmlContent = `
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          padding: 20px;
          box-sizing: border-box;
          position: relative;
        ">
          <div class="message-glow" style="
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, ${currentMessageData ? currentMessageData.couleur : '#ffffff'}20, transparent 70%);
            filter: blur(50px);
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite alternate;
          "></div>
          <div class="message-box" style="
            background-color: ${currentMessageData ? currentMessageData.fond : '#1e1e1e'};
            max-width: 80%;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 100px;
            animation: slideUp 1s ease-out, fadeIn 1.5s ease-in-out;
            position: relative;
            overflow: hidden;
          ">
            <div class="message-box::before" style="
              content: '';
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 5px;
              background: linear-gradient(90deg, transparent, ${currentMessageData ? currentMessageData.couleur : '#ffffff'}, transparent);
              animation: shine 2s infinite alternate;
            "></div>
            <h2 class="message-title" style="
              font-size: 2.5em;
              margin-bottom: 20px;
              color: ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              font-weight: bold;
              opacity: 0;
              white-space: nowrap;
              overflow: hidden;
              border-right: 3px solid ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              animation: typing 0.5s ease-out 1s forwards, fadeInText 1s ease-out 1s forwards;
            ">${currentMessageData ? currentMessageData.titre || "Message" : "Message"}</h2>
            <p class="message-content" style="
              font-size: 1.5em;
              line-height: 1.8;
              color: ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              opacity: 0;
              animation: fadeInText 1s ease-out 1.5s forwards;
            ">${currentMessageData ? currentMessageData.contenu || "Aucun contenu" : "Bienvenue"}</p>
          </div>
        </div>
      `;

      message.innerHTML = htmlContent;
      message.style.display = "flex";
    }

    // ==================================================
    // DIAPORAMA
    // ==================================================
    let slideTimer = null;
    let currentSlide = 0;
    const slides = ["photos/photo1.jpg", "photos/photo2.jpg", "photos/photo3.jpg"];

    function lancerDiaporama() {
      document.body.style.background = "#000";
      slideshow.style.display = "block";
      currentSlide = 0;
      afficherSlide();
      slideTimer = setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        afficherSlide();
      }, 5000);
    }

    function afficherSlide() {
      slideImage.classList.remove("fade");
      void slideImage.offsetWidth;
      slideImage.classList.add("fade");
      slideImage.src = slides[currentSlide];
    }

    function arreterDiaporama() {
      if (slideTimer) {
        clearInterval(slideTimer);
        slideTimer = null;
      }
    }
  </script>
</body>
</html>
