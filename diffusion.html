<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diffusion MVBC</title>
  <style>
    *
    {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #diffusion {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* VIDÉO */
    #video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
      z-index: 10;
    }

    /* DIAPORAMA */
    #slideshow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 20;
    }

    #slideImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* MESSAGE */
    #message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(100% - 120px);
      display: none;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      z-index: 30;
      padding: 70px;
      box-sizing: border-box;
    }

    /* PAGES */
    #pageFrame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: none;
      background: #000;
      z-index: 40;
    }

    /* DÉFILEMENT DES LOGOS DES PARTENAIRES */
    #partners-scroll-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      background-color: rgba(0, 0, 0, 0.8);
      overflow: hidden;
      z-index: 50;
      display: none;
    }

    #partners-scroll {
      display: flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll 20s linear infinite;
    }

    #partners-scroll img {
      height: 120px;
      margin: 0 50px;
      opacity: 0.9;
      transition: all 0.3s ease;
    }

    #partners-scroll img:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    /* TRANSITION */
    .fade {
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ANIMATIONS POUR LE MESSAGE */
    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes fadeInText {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes pulseGlow {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1.2); opacity: 0.8; }
    }

    @keyframes shine {
      from { opacity: 0.5; transform: scaleX(0.8); }
      to { opacity: 1; transform: scaleX(1.2); }
    }
  </style>
</head>
<body>
  <div id="diffusion">
    <!-- VIDÉO -->
    <video id="video" playsinline preload="auto"></video>

    <!-- DIAPORAMA -->
    <div id="slideshow">
      <img id="slideImage" src="" alt="Diaporama">
    </div>

    <!-- MESSAGE -->
    <div id="message"></div>

    <!-- PAGES HTML -->
    <iframe id="pageFrame" src="" allow="autoplay"></iframe>

    <!-- DÉFILEMENT DES LOGOS -->
    <div id="partners-scroll-container">
      <div id="partners-scroll"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // ==================================================
    // CONFIGURATION FIREBASE
    // ==================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
      authDomain: "diffusion-b9afa.firebaseapp.com",
      databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "diffusion-b9afa",
      storageBucket: "diffusion-b9afa.firebasestorage.app",
      messagingSenderId: "674799570797",
      appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // ==================================================
    // RÉCUPÉRATION DES ÉLÉMENTS HTML
    // ==================================================
    const video = document.getElementById("video");
    const message = document.getElementById("message");
    const slideshow = document.getElementById("slideshow");
    const slideImage = document.getElementById("slideImage");
    const pageFrame = document.getElementById("pageFrame");
    const partnersScrollContainer = document.getElementById("partners-scroll-container");
    const partnersScroll = document.getElementById("partners-scroll");

    // ==================================================
    // LISTE DES LOGOS DES PARTENAIRES (À ADAPTER)
    // ==================================================
    const partnerLogos = [
      "logo/7ENVIE DE PAIN.png",
      "logo/AGTIM.png",
      "logo/Alain AFFLELOU.png",
      "logo/APOLLO.png",
      "logo/ARRIVE.png",
      "logo/ARTIPOLE.png",
      "logo/ATP.png",
      "logo/AUTO BILAN VIEILLEVIGNE.png",
      "logo/BAR LE SCORE.png",
      "logo/BARREAU.png",
      "logo/BIOCOOP.png",
      "logo/BOUTEAU.png",
      "logo/BRIOGEL.png",
      "logo/BUROLOGIC.png",
      "logo/C3P.png",
      "logo/CALIPAGE.png",
      "logo/CBH.png",
      "logo/CD VENDEE.png",
      "logo/CHAPLEAU MACONNERIE.png",
      "logo/CLARA AUTO.png",
      "logo/CMO.png",
      "logo/COIFFURE CELINE.png",
      "logo/COMITE DES FETES.png",
      "logo/CPM AXA.png",
      "logo/CYRIL LECLAIR.png",
      "logo/DIAGONAL.png",
      "logo/DURET.png",
      "logo/ENVOLIIS.png",
      "logo/ERIC MOCQUET.png",
      "logo/EVEILLARD.png",
      "logo/FLEUR D'ANGE.png",
      "logo/GO IMPRESSION.png",
      "logo/HEPPNER.png",
      "logo/HP.png",
      "logo/ID2TECH.png",
      "logo/IDM.png",
      "logo/INDCAR.png",
      "logo/JAD'O.png",
      "logo/LA MARTINIQUAISE.png",
      "logo/LE CONSERVATEUR.png",
      "logo/LECLERC.png",
      "logo/LLA.png",
      "logo/MAITRE COQ.png",
      "logo/MD NERGIES.png",
      "logo/MDLP.png",
      "logo/MJ.png",
      "logo/MOINARD.png",
      "logo/MV.png",
      "logo/NAT EVASION.png",
      "logo/NATURACARE.png",
      "logo/O BORD DELO.png",
      "logo/PETIT ST GEORGES.png",
      "logo/RATOKE.png",
      "logo/RAUTUREAU.png",
      "logo/RT.png",
      "logo/SCHMIDT.png",
      "logo/SENARD.png",
      "logo/SEV.png",
      "logo/SODEBO.png",
      "logo/SQUARE.png",
      "logo/STARTRUCKS.png",
      "logo/STRAPHARM.png",
      "logo/SUPER U.png",
      "logo/SYMBIOSE.png",
      "logo/TDM.png",
      "logo/UNE ENVIE DE PIZZA.png",
      "logo/VEB (2).png",
      "logo/VFLIT.png",
      "logo/VST.png"
    ];

    // ==================================================
    // CHARGEMENT DES LOGOS
    // ==================================================
    function chargerLogosPartenaires() {
      partnersScroll.innerHTML = "";
      // Ajouter chaque logo deux fois pour un défilement infini
      partnerLogos.forEach(logo => {
        const img = document.createElement('img');
        img.src = logo;
        img.alt = "Partenaire";
        img.onerror = () => { img.style.display = 'none'; };
        partnersScroll.appendChild(img);
      });
      // Dupliquer pour un défilement infini
      partnerLogos.forEach(logo => {
        const img = document.createElement('img');
        img.src = logo;
        img.alt = "Partenaire";
        img.onerror = () => { img.style.display = 'none'; };
        partnersScroll.appendChild(img);
      });
    }

    // Charger les logos au démarrage
    chargerLogosPartenaires();

    // ==================================================
    // RÉFÉRENCES FIREBASE
    // ==================================================
    const messageRef = ref(db, "message");
    const diffusionRef = ref(db, "diffusion");
    let currentMessageData = null;
    let currentScene = null;

    // ==================================================
    // ÉCOUTE DES MODIFICATIONS
    // ==================================================
    onValue(messageRef, (snapshot) => {
      currentMessageData = snapshot.val();
      console.log("Message mis à jour:", currentMessageData);
      // Mettre à jour l'affichage des logos SI on est sur la scène "message"
      if (currentScene === "message") {
        partnersScrollContainer.style.display =
          (currentMessageData && currentMessageData.afficherDefilementLogos) ? "block" : "none";
      }
    });

    onValue(diffusionRef, (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.scene) return;

      currentScene = data.scene;
      console.log("Nouvelle scène:", currentScene);
      afficherScene(currentScene);
    });

    // ==================================================
    // AFFICHER UNE SCÈNE
    // ==================================================
    function afficherScene(scene) {
      // Tout masquer
      video.style.display = "none";
      slideshow.style.display = "none";
      message.style.display = "none";
      pageFrame.style.display = "none";
      partnersScrollContainer.style.display = "none";

      // Arrêter le diaporama et la vidéo
      arreterDiaporama();
      video.pause();
      video.removeAttribute("src");
      video.load();

      // Afficher la scène demandée
      switch(scene) {
        case "video1":
          afficherVideo("video/defense.mp4");
          break;
        case "video2":
          afficherVideo("videos/video2.mp4");
          break;
        case "photos":
          lancerDiaporama();
          break;
        case "partenaires":
          afficherPage("partenaires.html");
          break;
        case "evenements":
          afficherPage("evenements.html");
          break;
        case "videomvbc":
          afficherPage("videomvbc.html");
          break;
        case "matchdusoir":
          afficherPage("matchdusoir.html");
          break;
        case "classementnm2":
          afficherPage("classementnm2.html");
          break;
        case "nosequipes":
          afficherPage("nosequipes.html");
          break;
        case "page2":
          afficherMessage("PAGE 2");
          break;
        case "message":
          afficherMessagePersonnalise();
          // Afficher les logos SI la case est cochée
          if (currentMessageData && currentMessageData.afficherDefilementLogos) {
            partnersScrollContainer.style.display = "block";
          }
          break;
        case "black":
          document.body.style.background = "#000";
          break;
      }
    }

    // ==================================================
    // FONCTIONS D'AFFICHAGE
    // ==================================================
    function afficherVideo(source) {
      document.body.style.background = "#000";
      video.style.display = "block";
      video.classList.remove("fade");
      void video.offsetWidth;
      video.classList.add("fade");
      video.src = source;
      video.currentTime = 0;
      video.play().catch(e => console.error("Erreur vidéo:", e));
    }

    function afficherPage(page) {
      document.body.style.background = "#000";
      pageFrame.style.display = "block";
      pageFrame.classList.remove("fade");
      void pageFrame.offsetWidth;
      pageFrame.classList.add("fade");
      pageFrame.src = page;
    }

    function afficherMessage(text) {
      document.body.style.background = "#000";
      message.textContent = text;
      message.style.display = "flex";
      message.classList.remove("fade");
      void message.offsetWidth;
      message.classList.add("fade");
    }

    // ==================================================
    // AFFICHER UN MESSAGE PERSONNALISÉ AVEC ANIMATIONS
    // ==================================================
    function afficherMessagePersonnalise() {
      document.body.style.background = "#000";

      // Créer le contenu du message avec animations
      let htmlContent = `
        <div style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          padding: 20px;
          box-sizing: border-box;
          position: relative;
        ">
          <div class="message-glow" style="
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, ${currentMessageData ? currentMessageData.couleur : '#ffffff'}20, transparent 70%);
            filter: blur(50px);
            z-index: -1;
            animation: pulseGlow 3s ease-in-out infinite alternate;
          "></div>
          <div class="message-box" style="
            background-color: ${currentMessageData ? currentMessageData.fond : '#1e1e1e'};
            max-width: 80%;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 100px;
            animation: slideUp 1s ease-out, fadeIn 1.5s ease-in-out;
            position: relative;
            overflow: hidden;
          ">
            <div class="message-box::before" style="
              content: '';
              position: absolute;
              top: 0;
              left: 0;
              width: 100%;
              height: 5px;
              background: linear-gradient(90deg, transparent, ${currentMessageData ? currentMessageData.couleur : '#ffffff'}, transparent);
              animation: shine 2s infinite alternate;
            "></div>
            <h2 class="message-title" style="
              font-size: 2.5em;
              margin-bottom: 20px;
              color: ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              font-weight: bold;
              opacity: 0;
              white-space: nowrap;
              overflow: hidden;
              border-right: 3px solid ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              animation: typing 0.5s ease-out 1s forwards, fadeInText 1s ease-out 1s forwards;
            ">${currentMessageData ? currentMessageData.titre || "Message" : "Message"}</h2>
            <p class="message-content" style="
              font-size: 1.5em;
              line-height: 1.8;
              color: ${currentMessageData ? currentMessageData.couleur : '#ffffff'};
              opacity: 0;
              animation: fadeInText 1s ease-out 1.5s forwards;
            ">${currentMessageData ? currentMessageData.contenu || "Aucun contenu" : "Bienvenue"}</p>
          </div>
        </div>
      `;

      message.innerHTML = htmlContent;
      message.style.display = "flex";
    }

    // ==================================================
    // DIAPORAMA
    // ==================================================
    let slideTimer = null;
    let currentSlide = 0;
    const slides = ["photos/photo1.jpg", "photos/photo2.jpg", "photos/photo3.jpg"];

    function lancerDiaporama() {
      document.body.style.background = "#000";
      slideshow.style.display = "block";
      currentSlide = 0;
      afficherSlide();
      slideTimer = setInterval(() => {
        currentSlide = (currentSlide + 1) % slides.length;
        afficherSlide();
      }, 5000);
    }

    function afficherSlide() {
      slideImage.classList.remove("fade");
      void slideImage.offsetWidth;
      slideImage.classList.add("fade");
      slideImage.src = slides[currentSlide];
    }

    function arreterDiaporama() {
      if (slideTimer) {
        clearInterval(slideTimer);
        slideTimer = null;
      }
    }
  </script>
</body>
</html>
