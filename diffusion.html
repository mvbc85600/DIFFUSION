<style>

/* =====================================================
   RESET
===================================================== */

*
{
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body
{
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   DIFFUSION
===================================================== */

#diffusion
{
    position: relative;
    width: 100%;
    height: 100%;
}

/* =====================================================
   VIDÉO
===================================================== */

#video
{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
    z-index: 10;
}

/* =====================================================
   DIAPORAMA
===================================================== */

#slideshow
{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    display: none;
    z-index: 20;
}

#slideImage
{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

/* =====================================================
   MESSAGE
===================================================== */

#message
{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: calc(100% - 150px);
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    z-index: 30;
    padding: 50px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 15px;
    box-sizing: border-box;
}

/* =====================================================
   PAGES
===================================================== */

#pageFrame
{
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #000;
    z-index: 40;
}

/* =====================================================
   CARROUSEL PARTENAIRES
   7 LOGOS VISIBLES
===================================================== */

#partners-scroll-container
{
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 190px;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,1),
            rgba(0,0,0,0.96),
            rgba(0,0,0,0.82)
        );
    overflow: hidden;
    z-index: 50;
    display: none;
    perspective: 1800px;
    perspective-origin: center center;
}

/* =====================================================
   CONTENEUR
===================================================== */

#partners-scroll
{
    position: relative;
    width: 100%;
    height: 100%;
}

/* =====================================================
   LOGOS
===================================================== */

#partners-scroll img
{
    position: absolute;
    left: 50%;
    top: 50%;
    width: auto;
    height: auto;
    max-width: 250px;
    max-height: 130px;
    padding: 9px;
    object-fit: contain;
    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );
    border: 3px solid;
    border-radius: 15px;
    transform-origin: center center;
    transition:
        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.9s ease;

   CONTOUR JAUNE
===================================================== */

===================================================== */

/* =====================================================
   TRANSITION
===================================================== */

.fade
{
    animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn
{
    from
    {
        opacity: 0;
    }
    to
    {
        opacity: 1;
    }
}

/* =====================================================
   ANIMATIONS MESSAGE
===================================================== */

@keyframes typing
{
    from
    {
        width: 0;
    }
    to
    {
        width: 100%;
    }
}

@keyframes fadeInText
{
    from
    {
        opacity: 0;
    }
    to
    {
        opacity: 1;
    }
}

@keyframes slideUp
{
    from
    {
        transform:
            translateY(20px);
        opacity: 0;
    }
    to
    {
        transform:
            translateY(0);
        opacity: 1;
    }
}

@keyframes pulseGlow
{
    from
    {
        transform: scale(0.8);
        opacity: 0.5;
    }
    to
    {
        transform: scale(1.2);
        opacity: 0.8;
    }
}

@keyframes shine
{
    from
    {
        opacity: 0.5;
        transform: scaleX(0.8);
    }
    to
    {
        opacity: 1;
        transform: scaleX(1.2);
    }
}

/* =====================================================

/* =====================================================

];

/* =====================================================
   COULEURS
   JAUNE → ROUGE → BLEU
===================================================== */

const partnerColors = [
    "color-yellow",
    "color-red",
    "color-blue"
];

/* =====================================================
   INDEX DU CARROUSEL
===================================================== */
let partnerCarouselIndex = parseInt(localStorage.getItem('partnerCarouselIndex')) || Math.floor(Math.random() * partnerLogos.length);
let partnerCarouselTimer = null;

/* =====================================================
   CHARGEMENT DES LOGOS
===================================================== */

function chargerLogosPartenaires() {
    partnersScroll.innerHTML = "";
    partnerLogos.forEach(
        (logo, index) => {
            const img =
                document.createElement("img");
            img.src =
                logo;
            img.alt =
                "Partenaire";
            img.dataset.index =
                index;
            img.onerror =
                () => {
                    img.style.display =
                        "none";
                };
            partnersScroll.appendChild(
                img
            );
        }
    );
    updatePartnerCarousel();
}

/* =====================================================
   COULEUR DU PARTENAIRE
===================================================== */

function getPartnerColor(index) {
    return partnerColors[
        index %
        partnerColors.length
    ];
}

/* =====================================================
   MISE À JOUR BARRE LUMINEUSE
===================================================== */

function updateLightLine() {
    const currentColor =
        getPartnerColor(
            partnerCarouselIndex
        );
    if (
        currentColor ===
        "color-yellow"
    ) {
        partnersLightLine.style.background =
            "#ffcc00";
        partnersLightLine.style.boxShadow =
            "0 0 10px #ffcc00," +
            "0 0 25px #ffcc00," +
            "0 0 50px #ffcc00";
    }
    else if (
        currentColor ===
        "color-red"
    ) {
        partnersLightLine.style.background =
            "#ff2020";
        partnersLightLine.style.boxShadow =
            "0 0 10px #ff2020," +
            "0 0 25px #ff2020," +
            "0 0 50px #ff2020";
    }
    else {
        partnersLightLine.style.background =
            "#168cff";
        partnersLightLine.style.boxShadow =
            "0 0 10px #168cff," +
            "0 0 25px #168cff," +
            "0 0 50px #168cff";
    }
}

/* =====================================================
   CARROUSEL — 7 LOGOS VISIBLES
===================================================== */

function updatePartnerCarousel() {
    const logos =
        partnersScroll.querySelectorAll(
            "img"
        );
    const total =
        logos.length;
    if (!total) {
        return;
    }

    /* CENTRE */
    const center =
        partnerCarouselIndex % total;

    /* GAUCHE 1 */
    const left1 =
        (
            partnerCarouselIndex -
            1 +
            total
        ) % total;

    /* GAUCHE 2 */
    const left2 =
        (
            partnerCarouselIndex -
            2 +
            total
        ) % total;

    /* GAUCHE 3 */
    const left3 =
        (
            partnerCarouselIndex -
            3 +
            total
        ) % total;

    /* DROITE 1 */
    const right1 =
        (
            partnerCarouselIndex +
            1
        ) % total;

    /* DROITE 2 */
    const right2 =
        (
            partnerCarouselIndex +
            2
        ) % total;

    /* DROITE 3 */
    const right3 =
        (
            partnerCarouselIndex +
            3
        ) % total;

    /* CACHER TOUS LES LOGOS */
    logos.forEach(
        logo => {
            logo.className =
                "hidden";
        }
    );

    /* 7 LOGOS */
    logos[center].className =
        "center " +
        getPartnerColor(center);

    logos[left1].className =
        "left1 " +
        getPartnerColor(left1);

    logos[left2].className =
        "left2 " +
        getPartnerColor(left2);

    logos[left3].className =
        "left3 " +
        getPartnerColor(left3);

    logos[right1].className =
        "right1 " +
        getPartnerColor(right1);

    logos[right2].className =
        "right2 " +
        getPartnerColor(right2);

    logos[right3].className =
        "right3 " +
        getPartnerColor(right3);

    /* BARRE LUMINEUSE */
    updateLightLine();
}

/* =====================================================
   DÉMARRER LE CARROUSEL
===================================================== */

function demarrerCarrouselPartenaires() {
    if (
        partnerCarouselTimer
    ) {
        clearInterval(
            partnerCarouselTimer
        );
    }

    updatePartnerCarousel();

    partnerCarouselTimer =
        setInterval(
            () => {
                partnerCarouselIndex =
                    (
                        partnerCarouselIndex +
                        1
                    ) %
                    partnerLogos.length;
                localStorage.setItem('partnerCarouselIndex', partnerCarouselIndex);
                updatePartnerCarousel();
            },
            2500
        );
}

/* =====================================================
   ARRÊTER LE CARROUSEL
===================================================== */

function arreterCarrouselPartenaires() {
    if (
        partnerCarouselTimer
    ) {
        clearInterval(
            partnerCarouselTimer
        );
        partnerCarouselTimer =
            null;
    }
}

/* =====================================================
   CHARGEMENT INITIAL
===================================================== */

chargerLogosPartenaires();

/* =====================================================
   RÉFÉRENCES FIREBASE
===================================================== */

const messageRef =
    ref(
        db,
        "message"
    );

const diffusionRef =
    ref(
        db,
        "diffusion"
    );

let currentMessageData =
    null;

let currentScene =
    null;

/* =====================================================
   ÉCOUTE MESSAGE
===================================================== */

onValue(
    messageRef,
    (snapshot) => {
        currentMessageData =
            snapshot.val();
        console.log(
            "Message mis à jour:",
            currentMessageData
        );

        if (
            currentScene ===
            "message"
        ) {
            const afficherLogos =
                currentMessageData &&
                currentMessageData
                    .afficherDefilementLogos;

            if (afficherLogos) {
                partnersScrollContainer.style.display =
                    "block";
                demarrerCarrouselPartenaires();
            }
            else {
                partnersScrollContainer.style.display =
                    "none";
                arreterCarrouselPartenaires();
            }
        }
    }
);

/* =====================================================
   ÉCOUTE DIFFUSION
===================================================== */

onValue(
    diffusionRef,
    (snapshot) => {
        const data =
            snapshot.val();

        if (
            !data ||
            !data.scene
        ) {
            return;
        }

        currentScene =
            data.scene;

        console.log(
            "Nouvelle scène:",
            currentScene
        );

        afficherScene(
            currentScene
        );
    }
);

/* =====================================================
   AFFICHER UNE SCÈNE
===================================================== */

function afficherScene(scene) {

    /* Retirer le mode spécial message */
    document.body.classList.remove("message-active-partners");

    /* TOUT MASQUER */
    video.style.display =
        "none";

    slideshow.style.display =
        "none";

    message.style.display =
        "none";

    pageFrame.style.display =
        "none";

    partnersScrollContainer.style.display =
        "none";

    arreterCarrouselPartenaires();

    /* ARRÊTER DIAPORAMA */
    arreterDiaporama();

    /* ARRÊTER VIDÉO */
    video.pause();
    video.removeAttribute(
        "src"
    );
    video.load();

    /* AFFICHER SCÈNE */
    switch (scene) {

        case "video1":
            afficherVideo(
                "video/defense.mp4"
            );
            break;

        case "video2":
            afficherVideo(
                "videos/video2.mp4"
            );
            break;

        case "photos":
            lancerDiaporama();
            break;

        case "partenaires":
            afficherPage(
                "partenaires.html"
            );
            break;

        case "evenements":
            afficherPage(
                "evenements.html"
            );
            break;

        case "videomvbc":
            afficherPage(
                "videomvbc.html"
            );
            break;

        case "matchdusoir":
            afficherPage(
                "matchdusoir.html"
            );
            break;

        case "classementnm2":
            afficherPage(
                "classementnm2.html"
            );
            break;

        case "nosequipes":
            afficherPage(
                "nosequipes.html"
            );
            break;
          
case "trois":
            afficherPage(
                "trois.html"
            );
            break;

          case "dunk":
            afficherPage(
                "dunk.html"
            );
            break;

          case "gogogo":
            afficherPage(
                "gogogomvbc.html"
            );
            break;

          case "boutique":
            afficherPage(
                "boutique.html"
            );
            break;

          
        case "partenairedumatch": 
            afficherPage(
                "partenairedumatch.html"
            );
            break;

          case "cinqmajeur":
            afficherPage(
                "5majeur.html"
            );
            break;

        case "page2":
            afficherMessage(
                "PAGE 2"
            );
            break;

        case "message":

    /* Activer le mode message agrandi */
    document.body.classList.add("message-active-partners");

    afficherMessagePersonnalise();

    if (
        currentMessageData &&
        currentMessageData
            .afficherDefilementLogos
    ) {
        partnersScrollContainer.style.display =
            "block";

        demarrerCarrouselPartenaires();
    }

    break;

        case "black":
            document.body.style.background =
                "#000";
            break;
    }
}

/* =====================================================
   AFFICHER VIDÉO
===================================================== */

function afficherVideo(source) {
    document.body.style.background =
        "#000";
    video.style.display =
        "block";
    video.classList.remove(
        "fade"
    );
    void video.offsetWidth;
    video.classList.add(
        "fade"
    );
    video.src =
        source;
    video.currentTime =
        0;
    video.play().catch(
        e =>
            console.error(
                "Erreur vidéo:",
                e
            )
    );
}

/* =====================================================
   AFFICHER PAGE
===================================================== */

function afficherPage(page) {
    document.body.style.background =
        "#000";
    pageFrame.style.display =

/* =====================================================
   DIAPORAMA
===================================================== */

let slideTimer =
    null;
let currentSlide =
    0;
const slides = [
    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"
];

function lancerDiaporama() {
    document.body.style.background =
        "#000";
    slideshow.style.display =
        "block";
    currentSlide =
        0;
    afficherSlide();
    slideTimer =
        setInterval(
            () => {
                currentSlide =
                    (
                        currentSlide +
                        1
                    ) %
                    slides.length;
                afficherSlide();
            },
            5000
        );
}

function afficherSlide() {
    slideImage.classList.remove(
        "fade"
    );
    void slideImage.offsetWidth;
    slideImage.classList.add(
        "fade"
    );
    slideImage.src =
        slides[currentSlide];
}

function arreterDiaporama() {
    if (slideTimer) {
        clearInterval(
            slideTimer
        );
        slideTimer =
            null;
    }
}

/* =====================================================
   EMPÊCHER LA MISE EN VEILLE DE L'ÉCRAN
===================================================== */

let wakeLock = null;

async function activerWakeLock() {

    try {

        if ("wakeLock" in navigator) {

            wakeLock =
                await navigator.wakeLock.request(
                    "screen"
                );

            console.log(
                "Wake Lock activé : écran maintenu actif"
            );

            wakeLock.addEventListener(
                "release",
                () => {

                    console.log(
                        "Wake Lock désactivé"
                    );

                }
            );

        }

    }

    catch (error) {

        console.error(
            "Impossible d'activer le Wake Lock :",
            error
        );

    }

}


/* =====================================================
   RÉACTIVER SI LA PAGE REDEVIENT VISIBLE
===================================================== */

document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState === "visible" &&
            !wakeLock
        ) {

            await activerWakeLock();

        }

    }
);


/* =====================================================
   ACTIVATION AUTOMATIQUE
===================================================== */

activerWakeLock();
