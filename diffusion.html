<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Diffusion</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: black;

      font-family: Arial, sans-serif;

    }


    #diffusion {

      position: relative;

      width: 100vw;

      height: 100vh;

      background: black;

    }


    /* =================================
       VIDÉO
       ================================= */

    #video {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: none;

      background: black;

    }


    /* =================================
       DIAPORAMA
       ================================= */

    #slideshow {

      position: absolute;

      inset: 0;

      display: none;

      background: black;

    }


    #slideImage {

      width: 100%;

      height: 100%;

      object-fit: contain;

    }


    /* =================================
       MESSAGE
       ================================= */

    #message {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      color: white;

      background: black;

      font-size: 50px;

      text-align: center;

    }


    /* =================================
       PARTENAIRES
       ================================= */

    #partenairesFrame {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;

      display: none;

      background: black;

    }


    /* =================================
       TRANSITION
       ================================= */

    .fade {

      animation: fadeIn 0.8s ease;

    }


    @keyframes fadeIn {

      from {

        opacity: 0;

      }

      to {

        opacity: 1;

      }

    }

  </style>

</head>


<body>


  <div id="diffusion">


    <!-- VIDÉO -->

    <video
      id="video"
      playsinline
      preload="auto">
    </video>


    <!-- DIAPORAMA -->

    <div id="slideshow">

      <img
        id="slideImage"
        src=""
        alt="">

    </div>


    <!-- MESSAGE -->

    <div id="message">

      En attente de diffusion...

    </div>


    <!-- PARTENAIRES -->

    <iframe
      id="partenairesFrame"
      src=""
      allow="autoplay">
    </iframe>


  </div>


  <script
    type="module"
    src="diffusion.js">
  </script>


</body>

</html>
