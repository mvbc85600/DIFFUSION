<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vidéo en boucle</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
      /* La vidéo remplit tout l'écran sans jamais être coupée */
      video {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        object-fit: contain; /* "contain" = toute la vidéo visible ; "cover" = remplit l'écran (rognée) */
      }
    </style>
  </head>
  <body>
    <video
      id="player"
      src="https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/DRAPEAU%20Seb.mp4"
      autoplay
      muted
      loop
      playsinline
    ></video>

    <script>
      const video = document.getElementById("player");
      // Lecture en boucle garantie même si "loop" est ignoré par le navigateur
      video.addEventListener("ended", () => video.play());
      // Relance la lecture si elle est interrompue
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) video.play().catch(() => {});
      });
      video.play().catch(() => {
        document.addEventListener("click", () => video.play(), { once: true });
      });
    </script>
  </body>
</html>
