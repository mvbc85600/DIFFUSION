<div class="custom-section">
<style type="text/css">
  /* =====================================================
     RESET & FOND
  ===================================================== */
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  .custom-section {
    position: relative;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(
        circle at center,
        #252000 0%,
        #100e00 35%,
        #050500 65%,
        #000 100%
      );
    height: 100vh;
    padding: 10px;
    margin: 0;
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* =====================================================
     HALO CENTRAL
  ===================================================== */
  .custom-section::before {
    content: "";
    position: fixed;
    width: 900px;
    height: 900px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background:
      radial-gradient(
        circle,
        rgba(255, 204, 0, 0.15) 0%,
        rgba(255, 204, 0, 0.05) 25%,
        transparent 50%
      );
    pointer-events: none;
    animation: halo 6s ease-in-out infinite;
    z-index: -1;
  }

  @keyframes halo {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
  }

  /* =====================================================
     TITRES
  ===================================================== */
  .custom-section h2 {
    position: relative;
    text-align: center;
    color: #ffffff;
    font-size: clamp(16px, 2.5vw, 20px);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow:
      0 0 8px #ffffff,
      0 0 15px #ffcc00;
    margin-bottom: 8px;
    z-index: 10;
    flex-shrink: 0;
  }

  .custom-section h2::after {
    content: "";
    display: block;
    width: 120px;
    height: 2px;
    margin: 6px auto 0;
    background: #ffcc00;
    border-radius: 3px;
    box-shadow: 0 0 8px #ffcc00;
  }

  /* =====================================================
     TABLES WRAPPER
  ===================================================== */
  .custom-section .tables-wrapper {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: flex-start;
    flex: 1;
    min-height: 0;
    padding-bottom: 40px;
    box-sizing: border-box;
  }

  .custom-section .table-container {
    flex: 1;
    min-width: 300px;
    max-width: 600px;
    background: rgba(10, 10, 10, 0.7);
    border-radius: 8px;
    padding: 8px;
    border: 1px solid rgba(255, 204, 0, 0.2);
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.1);
    overflow: hidden;
  }

  /* =====================================================
     TABLE ROWS (espacements réduits)
  ===================================================== */
  .custom-section .table-row {
    display: grid;
    background: rgba(20, 20, 20, 0.8);
    border-radius: 4px;
    padding: 4px;
    align-items: center;
    margin-bottom: 2px;
    transition: all 0.2s ease;
    font-size: clamp(11px, 1.5vw, 13px);
    border: 1px solid rgba(255, 204, 0, 0.1);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInUp 0.5s ease forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Animation séquentielle accélérée */
  .custom-section .table-row:nth-child(1) { animation-delay: 0.05s; }
  .custom-section .table-row:nth-child(2) { animation-delay: 0.1s; }
  .custom-section .table-row:nth-child(3) { animation-delay: 0.15s; }
  .custom-section .table-row:nth-child(4) { animation-delay: 0.2s; }
  .custom-section .table-row:nth-child(5) { animation-delay: 0.25s; }
  .custom-section .table-row:nth-child(6) { animation-delay: 0.3s; }
  .custom-section .table-row:nth-child(7) { animation-delay: 0.35s; }
  .custom-section .table-row:nth-child(8) { animation-delay: 0.4s; }
  .custom-section .table-row:nth-child(9) { animation-delay: 0.45s; }
  .custom-section .table-row:nth-child(10) { animation-delay: 0.5s; }

  .custom-section .table-row:hover {
    background: rgba(30, 30, 40, 0.9);
    border-color: rgba(255, 204, 0, 0.4);
    box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
  }

  .custom-section .table-header {
    background: linear-gradient(145deg, #1a1a1a, #2a2a2a) !important;
    color: #ffcc00 !important;
    font-weight: bold;
    border-radius: 4px 4px 0 0;
    border-bottom: 1px solid #ffcc00;
    box-shadow: 0 0 5px rgba(255, 204, 0, 0.2);
    animation: none;
    opacity: 1;
    transform: none;
    position: sticky;
    top: 0;
    z-index: 20;
    margin-bottom: 2px;
  }

  .custom-section .highlight-yellow {
    background: linear-gradient(145deg, rgba(255, 204, 0, 0.2), rgba(255, 204, 0, 0.1)) !important;
    border-left: 2px solid #ffcc00;
    color: #ffffff !important;
  }

  .custom-section .table-row > div {
    padding: 4px 2px;
    text-align: center;
    word-break: break-word;
    color: #e0e0e0;
    font-size: 0.9em;
  }

  .custom-section .table2 {
    --col-a: 1fr;
    --col-b: 1fr;
    --col-c: 0.7fr;
    --col-d: 0.7fr;
    --col-e: 0.7fr;
    --col-f: 0.7fr;
    --col-g: 0.7fr;
    --col-h: 0.7fr;
  }

  /* =====================================================
     RESPONSIVE
  ===================================================== */
  @media (max-width: 768px) {
    .custom-section .tables-wrapper {
      flex-direction: column;
      height: 100%;
    }
    .custom-section .table-container {
      flex: 1;
      margin-bottom: 10px;
    }
    .custom-section .table-row {
      font-size: clamp(10px, 1.8vw, 12px);
      padding: 3px;
      margin-bottom: 1px;
    }
    .custom-section .table-row > div {
      padding: 2px 1px;
      font-size: 0.85em;
    }
    .custom-section h2 {
      font-size: clamp(14px, 3vw, 18px);
    }
  }
</style>

<div class="tables-wrapper">
  <div class="table-container">
    <h2>📅 PROGRAMME</h2>
    <div id="json1"></div>
  </div>
  <div class="table-container">
    <h2>🏆 CLASSEMENT</h2>
    <div id="json2"></div>
  </div>
</div>

<!-- Barre lumineuse -->
<div class="light-line"></div>

<script>
  function fetchSheetData(gid, elementId, options = {}) {
    const id = '1vidVkLiiLMnmrO9HTmzM9Ns8bC28ONU1dVL41SVepOU';
    const url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&tq&gid=${gid}`;

    fetch(url)
      .then(response => response.text())
      .then(data => {
        const json = JSON.parse(data.substring(47).slice(0, -2));
        document.getElementById(elementId).innerHTML = buildModernTable(json, options);
      });
  }

  function buildModernTable(json, options = {}) {
    const { skipHeader = false, highlightFirstRow = false, extraClass = '', fixedColumns = null } = options;
    let html = '';
    const colCount = json.table.cols.length;

    const gridTemplate = fixedColumns && extraClass === 'table2'
      ? 'var(--col-a) var(--col-b) var(--col-c) var(--col-d) var(--col-e) var(--col-f) var(--col-g) var(--col-h)'
      : `repeat(${fixedColumns || colCount}, 1fr)`;

    const gridStyle = `grid-template-columns: ${gridTemplate};`;

    if (!skipHeader) {
      const headerClass = `table-row table-header ${extraClass}`;
      html += `<div class="${headerClass}" style="${gridStyle}">`;
      json.table.cols.forEach(col => {
        html += `<div>${col.label}</div>`;
      });
      html += '</div>';
    }

    json.table.rows.forEach((row, index) => {
      const rowClass = (highlightFirstRow && index === 0)
        ? `table-row highlight-yellow ${extraClass}`
        : `table-row ${extraClass}`;
      html += `<div class="${rowClass}" style="${gridStyle}">`;
      for (let i = 0; i < (fixedColumns || colCount); i++) {
        const cell = row.c[i];
        let value = '';
        try {
          value = cell?.f ?? cell?.v ?? '';
        } catch (e) {}
        html += `<div>${value}</div>`;
      }
      html += '</div>';
    });

    return html;
  }

  fetchSheetData('1902966512', 'json1', { skipHeader: true, highlightFirstRow: true });
  fetchSheetData('1966074571', 'json2', { extraClass: 'table2', fixedColumns: 8 });
</script>

<style>
  .light-line {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 65%;
    height: 2px;
    background: #ffcc00;
    box-shadow:
      0 0 8px #ffcc00,
      0 0 20px rgba(255, 204, 0, 0.5);
    z-index: 90;
  }
</style>
