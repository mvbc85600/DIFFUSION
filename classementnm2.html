/* =====================================================

===================================================== */

* {

  margin: 0;
  padding: 0;

  height: 100%;

/* =====================================================
   HALO CENTRAL
===================================================== */

.custom-section::before {

  width: 900px;
  height: 900px;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);

    radial-gradient(

      transparent 50%

  pointer-events: none;

  animation:
    halo 6s ease-in-out infinite;

  z-index: 0;
}

    transform:

  50% {

<script>

/* =====================================================
   CHARGEMENT DES DONNÉES DES TABLEAUX
===================================================== */

function fetchSheetData(
  gid,
  elementId,
  options = {}
) {

  const id =
    '1vidVkLiiLMnmrO9HTmzM9Ns8bC28ONU1dVL41SVepOU';


  const url =
    `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&tq&gid=${gid}`;


  fetch(url)

    .then(
      response =>
        response.text()
    )

    .then(
      data => {

        const json =
          JSON.parse(
            data.substring(47).slice(0, -2)
          );


        document
          .getElementById(elementId)
          .innerHTML =
            buildModernTable(
              json,
              options
            );

      }
    )

    .catch(
      error => {

        console.error(
          "Erreur lors du chargement des données :",
          error
        );

      }
    );

}


/* =====================================================
   CONSTRUCTION DES TABLEAUX
===================================================== */

function buildModernTable(
  json,
  options = {}
) {

  const {
    skipHeader = false,
    highlightFirstRow = false,
    extraClass = '',
    fixedColumns = null
  } = options;


  let html = '';


  const colCount =
    json.table.cols.length;


  const gridTemplate =
    fixedColumns &&
    extraClass === 'table2'

      ? 'var(--col-a) var(--col-b) var(--col-c) var(--col-d) var(--col-e) var(--col-f) var(--col-g) var(--col-h)'

      : `repeat(
          ${fixedColumns || colCount},
          1fr
        )`;


  const gridStyle =
    `grid-template-columns: ${gridTemplate};`;


  /* ===============================================
     EN-TÊTE
  =============================================== */

  if (!skipHeader) {

    const headerClass =
      `table-row table-header ${extraClass}`;


    html +=
      `<div
        class="${headerClass}"
        style="${gridStyle}"
      >`;


    json.table.cols.forEach(
      col => {

        html +=
          `<div>${col.label}</div>`;

      }
    );


    html +=
      '</div>';
  }


  /* ===============================================
     LIGNES
  =============================================== */

  json.table.rows.forEach(
    (row, index) => {

      const rowClass =
        (
          highlightFirstRow &&
          index === 0
        )

          ? `table-row highlight-yellow ${extraClass}`

          : `table-row ${extraClass}`;


      html +=
        `<div
          class="${rowClass}"
          style="${gridStyle}"
        >`;


      for (
        let i = 0;
        i < (fixedColumns || colCount);
        i++
      ) {

        const cell =
          row.c[i];


        let value = '';


        try {

          value =
            cell?.f ??
            cell?.v ??
            '';

        }

        catch (e) {

          value =
            '';

        }


        html +=
          `<div>${value}</div>`;

      }


      html +=
        '</div>';

    }
  );


  return html;

}

      0;


    /* ===============================================
       COULEURS
    =============================================== */

    const colors = [

      "color-yellow",

      "color-red",

      "color-blue"

    ];


    function getColor(
      partnerIndex
    ) {

      return colors[
        partnerIndex %
        colors.length
      ];

    }


    /* ===============================================
       MISE À JOUR DU CARROUSEL
    =============================================== */

    function updateCarousel() {


      /* -------------------------------------------
         POSITIONS
      ------------------------------------------- */

      const center =
        index % total;


      const left1 =
        (index - 1 + total) %
        total;


      const left2 =
        (index - 2 + total) %
        total;


      const right1 =
        (index + 1) %
        total;


      const right2 =
        (index + 2) %
        total;


      /* -------------------------------------------
         MASQUER TOUS LES LOGOS
      ------------------------------------------- */

      const images =
        carousel.querySelectorAll(
          'img'
        );


      images.forEach(
        img => {

          img.className =
            'hidden';

        }
      );


      /* -------------------------------------------
         LOGO CENTRAL
      ------------------------------------------- */

      const centerImg =
        carousel.querySelector(
          `img:nth-child(${center + 1})`
        );


      if (centerImg) {

        centerImg.className =
          `center ${getColor(center)}`;

      }


      /* -------------------------------------------
         LOGO GAUCHE 1
      ------------------------------------------- */

      const left1Img =
        carousel.querySelector(
          `img:nth-child(${left1 + 1})`
        );


      if (left1Img) {

        left1Img.className =
          `left1 ${getColor(left1)}`;

      }


 
      /* -------------------------------------------
         LOGO DROITE 1
      ------------------------------------------- */

      const right1Img =
        carousel.querySelector(
          `img:nth-child(${right1 + 1})`
        );


      if (right1Img) {

        right1Img.className =
          `right1 ${getColor(right1)}`;

      }


   


      /* ===========================================
         BARRE LUMINEUSE
      =========================================== */

      const lightLine =
        document.querySelector(
          '.light-line'
        );


      if (lightLine) {

        const currentColor =
          getColor(index);


        if (
          currentColor ===
          "color-yellow"
        ) {

          lightLine.style.background =
            "#ffcc00";


          lightLine.style.boxShadow =
            "0 0 8px #ffcc00, 0 0 20px #ffcc00, 0 0 40px rgba(255, 204, 0, 0.5)";

        }


        else if (
          currentColor ===
          "color-red"
        ) {

          lightLine.style.background =
            "#ff2020";


          lightLine.style.boxShadow =
            "0 0 8px #ff2020, 0 0 20px #ff2020, 0 0 40px rgba(255, 32, 32, 0.5)";

        }


        else {

          lightLine.style.background =
            "#168cff";


          lightLine.style.boxShadow =
            "0 0 8px #168cff, 0 0 20px #168cff, 0 0 40px rgba(22, 140, 255, 0.5)";

        }

      }


      /* ===========================================
         SAUVEGARDE INDEX
      =========================================== */

      localStorage.setItem(
        "partenaireIndex",
        index
      );

    }


    /* ===============================================
       CHARGEMENT DES IMAGES
    =============================================== */

    partnerLogos.forEach(
      (logo, i) => {

        const img =
          document.createElement(
            'img'
          );


        img.src =
          logo;


        img.alt =
          `Partenaire ${i + 1}`;


        img.className =
          'hidden';


        carousel.appendChild(
          img
        );

      }
    );


    /* ===============================================
       RÉCUPÉRATION INDEX SAUVEGARDÉ
    =============================================== */

    const savedIndex =
      localStorage.getItem(
        "partenaireIndex"
      );


    if (
      savedIndex !== null &&
      !isNaN(
        parseInt(savedIndex)
      )
    ) {

      index =
        parseInt(savedIndex) %
        total;

    }

    else {

      index =
        0;

    }


    /* ===============================================
       INITIALISATION
    =============================================== */

    updateCarousel();


    /* ===============================================
       ROTATION AUTOMATIQUE
       2,5 secondes
    =============================================== */

    setInterval(
      () => {

        index =
          (index + 1) %
          total;


        updateCarousel();

      },
      2500
    );

  };

</script>

</div>

</body>

</html>
