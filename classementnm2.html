<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSEMENT — MVBC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
    --green: #22c55e;
}

* { box-sizing: border-box; }

html, body { width: 100%; height: 100%; margin: 0; }

body {
    background:
        radial-gradient(circle at 50% 40%, rgba(23,105,255,.13), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 40%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
    padding: 1.5vh 2.5vw 1.2vh;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,255,255,.012) 91px 92px),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.06), transparent 48%);
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.48) 100%);
}

.layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1860px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

.title {
    flex: 0 0 auto;
    margin: 0 0 clamp(6px, 1.4vh, 18px);
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(30px, 5vw, 74px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--white);
    transform: skewX(-5deg);
    text-shadow:
        4px 4px 0 var(--black),
        9px 9px 0 var(--yellow),
        14px 14px 0 rgba(237,23,76,.75),
        19px 19px 0 rgba(23,105,255,.4);
}

/* =====================================================
   DEUX TABLEAUX CÔTE À CÔTE
   ===================================================== */
.cl-columns {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(12px, 1.4vw, 28px);
}

.cl-column {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, .55vh, 8px);
}

.cl-head, .cl-row {
    display: grid;
    grid-template-columns: var(--cols, 6% 1fr 8% 8% 8% 8% 9% 9%);
    align-items: center;
    gap: clamp(4px, .45vw, 9px);
}

.cl-head {
    flex: 0 0 auto;
    padding: 0 clamp(8px, .9vw, 16px);
    font-size: clamp(12px, 1vw, 17px);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
}

.cl-head > div {
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cl-head > div:first-child,
.cl-head > div:nth-child(2) { text-align: left; }

.cl-rows {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(4px, .55vh, 8px);
    overflow: hidden;
    padding-right: 0;
}

.cl-rows::-webkit-scrollbar { width: 5px; }
.cl-rows::-webkit-scrollbar-track { background: rgba(20,20,20,.5); border-radius: 10px; }
.cl-rows::-webkit-scrollbar-thumb { background: rgba(255,212,0,.7); border-radius: 10px; }

.cl-row {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    font-size: clamp(19px, 2.8vh, 38px);
    padding: .12em clamp(8px, .9vw, 16px);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
    animation: popIn .55s cubic-bezier(.16,.9,.25,1) both;
    animation-delay: var(--d, 0s);
}

.cl-row::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
    background: rgba(255,255,255,.14);
}

.cl-row .logo {
    flex: 0 0 auto;
    width: 1.05em;
    height: 1.05em;
    object-fit: contain;
    filter: drop-shadow(0 0 10px var(--halo, rgba(255,255,255,.35)));
}

.cl-row .rang {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: 1.1em;
    line-height: 1;
    color: rgba(255,255,255,.55);
    text-shadow: 2px 2px 0 rgba(0,0,0,.7);
}

.cl-row .equipe-nom {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
}

.cl-row .equipe {
    display: flex;
    align-items: center;
    gap: .22em;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: 1em;
    line-height: 1.05;
    text-transform: uppercase;
    text-shadow:
        0 0 18px var(--halo, rgba(255,255,255,.25)),
        3px 3px 0 rgba(0,0,0,.8);
    white-space: nowrap;
    overflow: hidden;
}

.cl-row .cell {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: 1.02em;
    line-height: 1.05;
    color: rgba(255,255,255,.85);
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
}

.cl-row .cell.pts {
    color: var(--black);
    background: rgba(255,212,0,.9);
    text-shadow: none;
    border-radius: .3em;
    padding: .12em 0;
    box-shadow: 0 0 18px rgba(255,212,0,.3);
}

.cl-row.mvbc {
    background: linear-gradient(90deg, rgba(255,212,0,.18), rgba(8,9,12,.74) 55%);
    border-color: rgba(255,212,0,.55);
    --accent: var(--yellow);
    --halo: rgba(255,212,0,.55);
}

.cl-row.mvbc .rang { color: var(--yellow); }

.vide-msg {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 30px 20px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(18px, 2.2vw, 34px);
    font-weight: 800;
    text-transform: uppercase;
    color: rgba(255,255,255,.35);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
}

.partners-bar {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    width: 100%;
    height: clamp(72px, 10vh, 112px);
    margin-top: clamp(10px, 1.5vh, 20px);
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    overflow: hidden;
}

.partners-scroll {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    white-space: nowrap;
    animation: scrollPartners 60s linear infinite;
}

.partners-scroll img {
    height: 84%;
    max-height: 100px;
    max-width: 220px;
    margin: 0 clamp(12px, 1.5vw, 24px);
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
}

@keyframes scrollPartners {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes popIn {
    0% { opacity: 0; transform: translateY(26px) scale(.9); filter: blur(4px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
}

@media (max-width: 900px) {
    .cl-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .cl-column:last-child { display: flex; }
    .cl-row { flex: 1 1 0; }
}

@media (max-width: 600px) {
    .title { font-size: clamp(22px, 6.4vw, 40px); white-space: normal; }
    .cl-columns { gap: 6px; }
    .cl-column { gap: 4px; }
    .cl-head { display: none; }
    .cl-row { font-size: clamp(12px, 2.6vw, 17px); padding: .18em 5px; border-radius: 7px; }
    .cl-head, .cl-row { gap: 3px; }
    .cl-row .logo { width: 1em; height: 1em; }
    .cl-row .cell { font-size: .9em; }
    .partners-bar { height: 60px; margin-top: 8px; }
    .partners-scroll img { margin: 0 10px; }
}

@media (prefers-reduced-motion: reduce) {
    .partners-scroll, .cl-row { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>

<body>

<div class="layout">
    <h1 class="title">Classement</h1>

    <div class="cl-columns" id="clColumns">
        <section class="cl-column">
            <div class="cl-head" id="clHead1" style="display:none"></div>
            <div class="cl-rows" id="clRows1"></div>
        </section>
        <section class="cl-column">
            <div class="cl-head" id="clHead2" style="display:none"></div>
            <div class="cl-rows" id="clRows2"></div>
        </section>
    </div>

    <div class="partners-bar" id="partnersBar">
        <div class="partners-scroll" id="partnersScroll"></div>
    </div>
</div>

<script>
/* =====================================================
   SCRIPT PRINCIPAL (classique, pas "module") :
   le classement s'affiche même si Firebase est indisponible.
   ===================================================== */
const SHEET_ID = "1vidVkLiiLMnmrO9HTmzM9Ns8bC28ONU1dVL41SVepOU";
const GID_CLASSEMENT = "1966074571";
const REFRESH_MS = 60000;
const GITHUB_LOGO_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
const GITHUB_LOGO_RAW = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

function normaliser(nom) {
    return (nom || "").toLowerCase().normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
}

/* Logos de secours si Firebase ne répond pas */
const LOGOS_FALLBACK = {
    "mvbc": "logos/mvbc.png",
    "nantesbh": "logos/nantesbh.png",
    "nantes": "logos/nantesbh.png",
    "bbmarmande": "logos/bbm.png",
    "bbm": "logos/bbm.png",
    "dax": "logos/dax.png",
    "adourdax": "logos/dax.png",
    "esms": "logos/esms.png",
    "esms40": "logos/esms.png",
    "garonne": "logos/garonne.png",
    "niort": "logos/niort.png",
    "reze": "logos/reze.png",
    "reze44": "logos/reze.png",
    "brissac": "logos/brissac.png",
    "toulouse": "logos/toulouse.png",
    "pornic": "logos/pornic.png",
    "challans": "logos/challans.png",
    "stmedard": "logos/st medard.png",
    "horsarrieu": "logos/asch.png",
    "asch": "logos/asch.png"
};

let logosClubs = {};

function logoPourEquipe(nom) {
    const n = normaliser(nom);
    if (!n) return null;
    if (logosClubs[n]) return logosClubs[n];
    for (const cle in logosClubs) {
        if (n.startsWith(cle) || cle.startsWith(n)) return logosClubs[cle];
    }
    if (LOGOS_FALLBACK[n]) return LOGOS_FALLBACK[n];
    for (const cle in LOGOS_FALLBACK) {
        if (n.startsWith(cle) || cle.startsWith(n)) return LOGOS_FALLBACK[cle];
    }
    return null;
}

/* =====================================================
   GOOGLE SHEET — export CSV
   ===================================================== */
function parseCsv(texte) {
    const lignes = [];
    let ligne = [], cellule = "", dansGuillemets = false;
    for (let i = 0; i < texte.length; i++) {
        const c = texte[i];
        if (dansGuillemets) {
            if (c === '"') {
                if (texte[i + 1] === '"') { cellule += '"'; i++; }
                else dansGuillemets = false;
            } else cellule += c;
        } else if (c === '"') {
            dansGuillemets = true;
        } else if (c === ",") {
            ligne.push(cellule); cellule = "";
        } else if (c === "\n") {
            ligne.push(cellule); lignes.push(ligne);
            ligne = []; cellule = "";
        } else if (c !== "\r") {
            cellule += c;
        }
    }
    if (cellule !== "" || ligne.length) { ligne.push(cellule); lignes.push(ligne); }
    return lignes;
}

async function chargerClassement() {
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/export?format=csv&gid=" + GID_CLASSEMENT + "&cache=" + Date.now();
    try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const lignes = parseCsv(await response.text()).filter(l => l.some(c => c.trim() !== ""));
        if (lignes.length < 2) throw new Error("Feuille vide");
        rendreClassement(lignes[0], lignes.slice(1));
    } catch (error) {
        console.error("Erreur chargement classement :", error);
        afficherErreur("Classement indisponible<br>" + escapeHtml(error.message));
    }
}

function afficherErreur(messageHtml) {
    if (!document.getElementById("clRows1").children.length) {
        document.getElementById("clColumns").innerHTML =
            '<div class="vide-msg">' + messageHtml + '</div>';
    }
}

function rendreClassement(entetes, donnees) {
    /* La 1re colonne de la feuille contient-elle le rang ? (ex : "1", "2", "3") */
    const premiereColNum = donnees.length > 0 && /^\d+$/.test((donnees[0][0] || "").trim());

    /* index de l'équipe et des stats selon la structure de la feuille */
    const colEquipe = premiereColNum ? 1 : 0;
    const nbStats = Math.max(entetes.length - colEquipe - 1, 1);
    const colsTemplate = "7% minmax(110px, 1.7fr) repeat(" + nbStats + ", minmax(42px, .8fr))";

    const headHtml =
        "<div>" + escapeHtml(entetes[0] || "#") + "</div>" +
        "<div>Équipe</div>" +
        entetes.slice(colEquipe + 1).map(h => "<div>" + escapeHtml(h) + "</div>").join("");

    /* Lignes valides : on saute une éventuelle ligne d'en-tête répétée */
    const lignesValid = donnees.filter((cells, i) => {
        if (!premiereColNum && i === 0 && isNaN(parseInt(cells[0], 10))) return false;
        return cells.some(v => String(v || "").trim() !== "");
    });

    /* Répartition équilibrée : moitié gauche / moitié droite */
    const milieu = Math.ceil(lignesValid.length / 2);
    const moities = [lignesValid.slice(0, milieu), lignesValid.slice(milieu)];

    moities.forEach((moitie, index) => {
        const head = document.getElementById("clHead" + (index + 1));
        const rows = document.getElementById("clRows" + (index + 1));
        head.style.display = "";
        head.style.setProperty("--cols", colsTemplate);
        head.innerHTML = headHtml;
        rows.innerHTML = "";

        moitie.forEach((cells, i) => {
            const rang = premiereColNum ? String(cells[0]).trim() : String(index * milieu + i + 1);
            const nomEquipe = (cells[colEquipe] || "").trim();

            const ligne = document.createElement("div");
            ligne.className = "cl-row";
            ligne.style.setProperty("--d", (0.1 + (index * milieu + i) * 0.06).toFixed(2) + "s");
            ligne.style.setProperty("--cols", colsTemplate);

            let html = "<div class='rang'>" + escapeHtml(rang) + "</div>";

            /* Équipe + logo */
            const logo = logoPourEquipe(nomEquipe);
            html += "<div class='equipe'>" +
                (logo ? "<img class='logo' src='" + escapeHtml(logo) + "' alt='' onerror='this.remove()'>" : "") +
                "<span class='equipe-nom'>" + escapeHtml(nomEquipe) + "</span>" +
                "</div>";

            /* Colonnes de stats (points = pastille jaune) */
            cells.slice(colEquipe + 1).forEach((v, k) => {
                const cls = k === 0 ? "cell pts" : "cell";
                html += "<div class='" + cls + "'>" + escapeHtml(v) + "</div>";
            });

            ligne.innerHTML = html;

            if (normaliser(nomEquipe).includes("mvbc")) ligne.classList.add("mvbc");

            rows.appendChild(ligne);

            /* Nom sur une seule ligne : réduction auto de la police */
            const eq = ligne.querySelector(".equipe-nom");
            let taille = parseFloat(getComputedStyle(eq.parentElement).fontSize);
            eq.style.fontSize = taille + "px";
            let securite = 20;
            while (securite-- > 0 && eq.scrollWidth > eq.clientWidth + 1 && taille > 10) {
                taille -= 1;
                eq.style.fontSize = taille + "px";
            }
        });

        if (!moitie.length) {
            rows.innerHTML = '<div class="vide-msg">—</div>';
        }
    });
}

chargerClassement();
setInterval(chargerClassement, REFRESH_MS);

/* =====================================================
   LOGOS DES CLUBS — Firebase en optionnel :
   si l'import échoue (réseau, CSP…), le classement reste affiché
   avec les logos de secours.
   ===================================================== */
(async function chargerLogosFirebase() {
    try {
        const [{ initializeApp }, { getDatabase, ref, onValue }] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
        ]);

        const firebaseConfig = {
            apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
            authDomain: "diffusion-b9afa.firebaseapp.com",
            databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "diffusion-b9afa",
            storageBucket: "diffusion-b9afa.firebasestorage.app",
            messagingSenderId: "674799570797",
            appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
        };

        const db = getDatabase(initializeApp(firebaseConfig));

        onValue(ref(db, "poule"), (snapshot) => {
            const data = snapshot.val() || {};
            const matchs = Array.isArray(data.matchs) ? data.matchs : [];
            const map = {};
            matchs.forEach(m => {
                m = m || {};
                if (m.eq1 && m.logo1) map[normaliser(m.eq1)] = m.logo1;
                if (m.eq2 && m.logo2) map[normaliser(m.eq2)] = m.logo2;
            });
            logosClubs = map;
            /* logos arrivés après le rendu → on relance pour les appliquer */
            if (document.getElementById("clRows1").children.length) chargerClassement();
        });
    } catch (error) {
        console.warn("Logos Firebase indisponibles, utilisation des logos de secours :", error);
    }
})();

/* =====================================================
   LOGOS PARTENAIRES (GitHub)
   ===================================================== */
async function chargerLogosPartenaires() {
    try {
        const response = await fetch(GITHUB_LOGO_API, {
            headers: { "Accept": "application/vnd.github+json" },
            cache: "no-store"
        });
        if (!response.ok) throw new Error("GitHub a répondu " + response.status);
        const fichiers = await response.json();
        const scroll = document.getElementById("partnersScroll");
        scroll.innerHTML = "";
        const logos = fichiers
            .filter(f => f.type === "file" && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name))
            .map(f => GITHUB_LOGO_RAW + encodeURIComponent(f.name));
        if (!logos.length) { document.getElementById("partnersBar").style.display = "none"; return; }
        [...logos, ...logos].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Partenaire";
            img.onerror = function () { this.remove(); };
            scroll.appendChild(img);
        });
    } catch (error) {
        console.error("Erreur chargement logos partenaires :", error);
        document.getElementById("partnersBar").style.display = "none";
    }
}
chargerLogosPartenaires();
</script>

</body>
</html>
