<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSEMENT — MVBC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
    --green: #22c55e;
}

* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background:
        radial-gradient(circle at 50% 40%, rgba(23,105,255,.13), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 40%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
    padding: 2.5vh 4vw;
    overflow: hidden;
}

/* Atmosphère arène */
body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,255,255,.012) 91px 92px),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.06), transparent 48%);
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

/* Vignette broadcast */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.48) 100%);
}

.layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1560px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

.title {
    margin: 0 0 clamp(6px, 1.4vh, 18px);
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(30px, 5vw, 74px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--white);
    transform: skewX(-5deg);
    text-shadow:
        4px 4px 0 var(--black),
        9px 9px 0 var(--yellow),
        14px 14px 0 rgba(237,23,76,.75),
        19px 19px 0 rgba(23,105,255,.4);
}

.champ {
    margin: 0 0 clamp(18px, 3vh, 40px);
    text-align: center;
    font-size: clamp(10px, 1.2vw, 16px);
    font-weight: 800;
    letter-spacing: .32em;
    text-indent: .32em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =====================================================
   TABLEAU CLASSEMENT
   ===================================================== */
.classement-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 12px);
}

/* Ligne d'en-tête (colonnes du Google Sheet) */
.cl-head, .cl-row {
    display: grid;
    grid-template-columns: 6% 1fr repeat(auto-fit, minmax(56px, 7%));
    align-items: center;
    gap: clamp(8px, 1vw, 18px);
    padding: clamp(8px, 1.2vh, 16px) clamp(12px, 1.6vw, 26px);
}

.cl-head {
    font-size: clamp(9px, 1vw, 13px);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
}

.cl-head > div {
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cl-head > div:nth-child(2) {
    text-align: left;
}

/* Carte ligne d'équipe */
.cl-row {
    position: relative;
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
    animation: popIn .55s cubic-bezier(.16,.9,.25,1) both;
    animation-delay: var(--d, 0s);
    flex: 1 1 0;
    min-height: 0;
}

/* Barre latérale selon la position */
.cl-row::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
    background: var(--accent, rgba(255,255,255,.2));
}

.cl-row .rang {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: clamp(22px, 2.8vw, 46px);
    line-height: 1;
    color: rgba(255,255,255,.55);
    text-shadow: 2px 2px 0 rgba(0,0,0,.7);
}

.cl-row .equipe {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: clamp(18px, 2.3vw, 40px);
    line-height: 1;
    text-transform: uppercase;
    text-shadow:
        0 0 18px var(--halo, rgba(255,255,255,.25)),
        3px 3px 0 rgba(0,0,0,.8);
    white-space: nowrap;
    overflow: hidden;
}

.cl-row .cell {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: clamp(16px, 2vw, 32px);
    line-height: 1;
    color: rgba(255,255,255,.85);
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
}

/* Équipe MVBC : pastille jaune broadcast */
.cl-row.mvbc {
    background: linear-gradient(90deg, rgba(255,212,0,.16), rgba(8,9,12,.74) 55%);
    border-color: rgba(255,212,0,.55);
    --accent: var(--yellow);
    --halo: rgba(255,212,0,.55);
}

.cl-row.mvbc .equipe {
    color: #fff;
}

/* Zone scrollable si beaucoup d'équipes */
.classement-scroll {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 12px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,212,0,.7) rgba(20,20,20,.5);
    padding-right: 4px;
}

.classement-scroll::-webkit-scrollbar { width: 5px; }
.classement-scroll::-webkit-scrollbar-track { background: rgba(20,20,20,.5); border-radius: 10px; }
.classement-scroll::-webkit-scrollbar-thumb { background: rgba(255,212,0,.7); border-radius: 10px; }

/* Message vide */
.vide-msg {
    text-align: center;
    padding: 60px 20px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(22px, 3vw, 40px);
    font-weight: 800;
    text-transform: uppercase;
    color: rgba(255,255,255,.35);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
}

/* =====================================================
   DÉFILEMENT DES LOGOS PARTENAIRES
   ===================================================== */
.partners-bar {
    position: relative;
    z-index: 12;
    width: 100%;
    height: clamp(100px, 13vh, 150px);
    margin-top: clamp(20px, 3vh, 40px);
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    overflow: hidden;
}

.partners-scroll {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    white-space: nowrap;
    animation: scrollPartners 60s linear infinite;
}

.partners-scroll img {
    height: 90%;
    max-height: 135px;
    margin: 0 30px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
}

@keyframes scrollPartners {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes popIn {
    0% { opacity: 0; transform: translateY(26px) scale(.9); filter: blur(4px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
}

/* Petits écrans */
@media (max-width: 600px) {
    .title {
        font-size: clamp(22px, 6.4vw, 40px);
        white-space: normal;
    }
    .cl-head { display: none; }
    .partners-bar { height: 84px; margin-top: 18px; }
    .partners-scroll img { margin: 0 14px; }
}

@media (prefers-reduced-motion: reduce) {
    .partners-scroll, .cl-row { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>

<body>

<div class="layout">
    <h1 class="title">Classement</h1>
    <div class="champ" id="champClassement">&nbsp;</div>

    <div class="classement-wrap">
        <div class="cl-head" id="clHead"></div>
        <div class="classement-scroll" id="clRows"></div>
    </div>

    <!-- Défilement des logos partenaires -->
    <div class="partners-bar" id="partnersBar">
        <div class="partners-scroll" id="partnersScroll"></div>
    </div>
</div>

<script>
/* =====================================================
   SOURCE : GOOGLE SHEET (même feuille que l'ancienne page)
   ===================================================== */
const SHEET_ID = "1vidVkLiiLMnmrO9HTmzM9Ns8bC28ONU1dVL41SVepOU";
const GID_CLASSEMENT = "1966074571";
const REFRESH_MS = 60000; /* rafraîchissement toutes les 60 s */

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

function normaliser(nom) {
    return (nom || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
}

async function chargerClassement() {
    const url =
        "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?tqx=out:json&tq&gid=" + GID_CLASSEMENT;

    try {
        const response = await fetch(url);
        const data = await response.text();
        const json = JSON.parse(data.substring(47).slice(0, -2));
        rendreClassement(json);
    } catch (error) {
        console.error("Erreur lors du chargement du classement :", error);
    }
}

function cellule(cell) {
    if (!cell) return "";
    return String(cell.f ?? cell.v ?? "");
}

function rendreClassement(json) {
    const colonnes = json.table.cols.map(c => (c.label || "").trim()).filter(Boolean);
    const lignes = (json.table.rows || []).map(r => (r.c || []).map(cellule));

    /* Titres de colonnes */
    const head = document.getElementById("clHead");
    head.innerHTML = "<div>#</div>" +
        colonnes.map(c => "<div>" + escapeHtml(c) + "</div>").join("");

    const rows = document.getElementById("clRows");
    rows.innerHTML = "";

    if (!lignes.length) {
        rows.innerHTML = "<div class='vide-msg'>Classement indisponible</div>";
        return;
    }

    lignes.forEach((cells, i) => {
        const ligne = document.createElement("div");
        ligne.className = "cl-row";
        ligne.style.setProperty("--d", (0.1 + i * 0.08).toFixed(2) + "s");

        /* Accent : jaune pour MVBC, dégradé du classement sinon */
        const nomEquipe = cells[1] || "";
        if (normaliser(nomEquipe).includes("mvbc")) {
            ligne.classList.add("mvbc");
        } else {
            /* du rouge (1er) vers le bleu (dernier) */
            const t = lignes.length > 1 ? i / (lignes.length - 1) : 0;
            const rouge = [237, 23, 76];
            const bleu = [23, 105, 255];
            const mix = rouge.map((v, k) => Math.round(v + (bleu[k] - v) * t));
            ligne.style.setProperty("--accent", "rgb(" + mix.join(",") + ")");
        }

        let html = "<div class='rang'>" + (i + 1) + "</div>";
        cells.forEach((v, k) => {
            html += k === 1
                ? "<div class='equipe'>" + escapeHtml(v) + "</div>"
                : "<div class='cell'>" + escapeHtml(v) + "</div>";
        });
        ligne.innerHTML = html;
        rows.appendChild(ligne);

        /* Nom sur une seule ligne : réduction auto de la police */
        const eq = ligne.querySelector(".equipe");
        let taille = parseFloat(getComputedStyle(eq).fontSize);
        let securite = 20;
        while (securite-- > 0 && eq.scrollWidth > eq.clientWidth + 1 && taille > 12) {
            taille -= 1;
            eq.style.fontSize = taille + "px";
        }
    });
}

chargerClassement();
setInterval(chargerClassement, REFRESH_MS);

/* =====================================================
   LOGOS PARTENAIRES (GitHub — même source que poule.html)
   ===================================================== */
const GITHUB_LOGO_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
const GITHUB_LOGO_RAW = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

async function chargerLogosPartenaires() {
    try {
        const response = await fetch(GITHUB_LOGO_API, {
            headers: { "Accept": "application/vnd.github+json" },
            cache: "no-store"
        });
        if (!response.ok) throw new Error("GitHub a répondu " + response.status);
        const fichiers = await response.json();
        const scroll = document.getElementById("partnersScroll");
        scroll.innerHTML = "";
        const logos = fichiers
            .filter(f => f.type === "file" && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name))
            .map(f => GITHUB_LOGO_RAW + encodeURIComponent(f.name));
        [...logos, ...logos].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Partenaire";
            img.onerror = function () { this.style.display = "none"; };
            scroll.appendChild(img);
        });
    } catch (error) {
        console.error("Erreur chargement logos partenaires :", error);
    }
}
chargerLogosPartenaires();
</script>

</body>
</html>
