<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSEMENT — MVBC</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
    --green: #22c55e;
}

* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background:
        radial-gradient(circle at 50% 40%, rgba(23,105,255,.13), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 40%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
    padding: 2.5vh 4vw;
    overflow: hidden;
}

/* Atmosphère arène */
body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,255,255,.012) 91px 92px),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.06), transparent 48%);
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

/* Vignette broadcast */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.48) 100%);
}

.layout {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1560px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

.title {
    margin: 0 0 clamp(6px, 1.4vh, 18px);
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(30px, 5vw, 74px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--white);
    transform: skewX(-5deg);
    text-shadow:
        4px 4px 0 var(--black),
        9px 9px 0 var(--yellow),
        14px 14px 0 rgba(237,23,76,.75),
        19px 19px 0 rgba(23,105,255,.4);
}

/* =====================================================
   TABLEAU CLASSEMENT
   ===================================================== */
.cl-head, .cl-row {
    display: grid;
    grid-template-columns: var(--cols, 6% 1fr 8% 8% 8% 8% 9% 9%);
    align-items: center;
    gap: clamp(8px, 1vw, 18px);
}

.cl-head {
    padding: 0 clamp(12px, 1.6vw, 26px);
    font-size: clamp(9px, 1vw, 13px);
    font-weight: 800;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
}

.cl-head > div {
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.cl-head > div:first-child,
.cl-head > div:nth-child(2) {
    text-align: left;
}

/* Carte ligne d'équipe — hauteur liée à la police (unités em) */
.cl-row {
    position: relative;
    font-size: clamp(20px, 2.6vh, 34px);
    padding: .32em clamp(12px, 1.6vw, 26px);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 18px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
    animation: popIn .55s cubic-bezier(.16,.9,.25,1) both;
    animation-delay: var(--d, 0s);
}

/* Barre latérale selon la position */
.cl-row::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 6px;
    background: rgba(255,255,255,.14);
}

.cl-row .logo {
    flex: 0 0 auto;
    width: 1.15em;
    height: 1.15em;
    object-fit: contain;
    filter: drop-shadow(0 0 10px var(--halo, rgba(255,255,255,.35)));
}

.cl-row .rang {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: 1.1em;
    line-height: 1;
    color: rgba(255,255,255,.55);
    text-shadow: 2px 2px 0 rgba(0,0,0,.7);
}

.cl-row .equipe-nom {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    white-space: nowrap;
}

.cl-row .equipe {
    display: flex;
    align-items: center;
    gap: .3em;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: 1em;
    line-height: 1.05;
    text-transform: uppercase;
    text-shadow:
        0 0 18px var(--halo, rgba(255,255,255,.25)),
        3px 3px 0 rgba(0,0,0,.8);
    white-space: nowrap;
    overflow: hidden;
}

.cl-row .cell {
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: .85em;
    line-height: 1.05;
    color: rgba(255,255,255,.85);
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
}

/* Cellule "points" : pastille jaune broadcast */
.cl-row .cell.pts {
    color: var(--black);
    background: rgba(255,212,0,.9);
    text-shadow: none;
    border-radius: .3em;
    padding: .12em 0;
    box-shadow: 0 0 18px rgba(255,212,0,.3);
}

/* Équipe MVBC : ligne dorée */
.cl-row.mvbc {
    background: linear-gradient(90deg, rgba(255,212,0,.18), rgba(8,9,12,.74) 55%);
    border-color: rgba(255,212,0,.55);
    --accent: var(--yellow);
    --halo: rgba(255,212,0,.55);
}

.cl-row.mvbc .rang {
    color: var(--yellow);
}

/* Zone scrollable si beaucoup d'équipes */
.classement-scroll {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1vh, 12px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,212,0,.7) rgba(20,20,20,.5);
    padding-right: 4px;
}

.classement-scroll::-webkit-scrollbar { width: 5px; }
.classement-scroll::-webkit-scrollbar-track { background: rgba(20,20,20,.5); border-radius: 10px; }
.classement-scroll::-webkit-scrollbar-thumb { background: rgba(255,212,0,.7); border-radius: 10px; }

/* Message vide */
.vide-msg {
    text-align: center;
    padding: 60px 20px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(22px, 3vw, 40px);
    font-weight: 800;
    text-transform: uppercase;
    color: rgba(255,255,255,.35);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
}

/* =====================================================
   DÉFILEMENT DES LOGOS PARTENAIRES
   ===================================================== */
.partners-bar {
    position: relative;
    z-index: 12;
    flex: 0 0 auto;
    width: 100%;
    height: clamp(100px, 13vh, 150px);
    margin-top: clamp(20px, 3vh, 40px);
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    overflow: hidden;
}

.partners-scroll {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    white-space: nowrap;
    animation: scrollPartners 60s linear infinite;
}

.partners-scroll img {
    height: 90%;
    max-height: 135px;
    margin: 0 30px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
}

@keyframes scrollPartners {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes popIn {
    0% { opacity: 0; transform: translateY(26px) scale(.9); filter: blur(4px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
}

/* Petits écrans */
@media (max-width: 600px) {
    .title {
        font-size: clamp(22px, 6.4vw, 40px);
        white-space: normal;
    }
    .cl-head { display: none; }
    .partners-bar { height: 84px; margin-top: 18px; }
    .partners-scroll img { margin: 0 14px; }
}

@media (prefers-reduced-motion: reduce) {
    .partners-scroll, .cl-row { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
}
</style>
</head>

<body>

<div class="layout">
    <h1 class="title">Classement</h1>

    <div class="cl-head" id="clHead" style="display:none"></div>
    <div class="classement-scroll" id="clRows"></div>

    <!-- Défilement des logos partenaires -->
    <div class="partners-bar" id="partnersBar">
        <div class="partners-scroll" id="partnersScroll"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
    authDomain: "diffusion-b9afa.firebaseapp.com",
    databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "diffusion-b9afa",
    storageBucket: "diffusion-b9afa.firebasestorage.app",
    messagingSenderId: "674799570797",
    appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getDatabase(appFirebase);

/* =====================================================
   SOURCE : GOOGLE SHEET (même feuille que l'ancienne page)
   ===================================================== */
const SHEET_ID = "1vidVkLiiLMnmrO9HTmzM9Ns8bC28ONU1dVL41SVepOU";
const GID_CLASSEMENT = "1966074571";
const REFRESH_MS = 60000; /* rafraîchissement toutes les 60 s */

function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
}

function normaliser(nom) {
    return (nom || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
}

/* =====================================================
   LOGOS DES CLUBS — depuis la base Firebase (admin.html)
   Le nœud "poule" contient les matchs avec eq1/logo1, eq2/logo2 :
   on en déduit automatiquement nom d'équipe -> logo.
   ===================================================== */
const LOGOS_FALLBACK = {
    "mvbc": "logos/mvbc.png",
    "nantesbh": "logos/nantesbh.png",
    "bbmarmande": "logos/bbm.png",
    "dax": "logos/dax.png",
    "adourdax": "logos/dax.png",
    "esms": "logos/esms.png",
    "esms40": "logos/esms.png",
    "garonne": "logos/garonne.png",
    "niort": "logos/niort.png",
    "reze": "logos/reze.png",
    "brissac": "logos/brissac.png",
    "toulouse": "logos/toulouse.png",
    "pornic": "logos/pornic.png",
    "challans": "logos/challans.png",
    "stmedard": "logos/st medard.png",
    "horsarrieu": "logos/asch.png",
    "asch": "logos/asch.png"
};

let logosClubs = {};       /* nom normalisé -> URL du logo */
let dernierRenduLogos = "";

function majLogosDepuisFirebase(data) {
    const data_ = data || {};
    const matchs = Array.isArray(data_.matchs) ? data_.matchs : [];
    const map = {};
    matchs.forEach(m => {
        m = m || {};
        if (m.eq1 && m.logo1) map[normaliser(m.eq1)] = m.logo1;
        if (m.eq2 && m.logo2) map[normaliser(m.eq2)] = m.logo2;
    });
    const signature = JSON.stringify(map);
    if (signature === dernierRenduLogos) return;
    logosClubs = map;
    dernierRenduLogos = signature;
    console.log("Logos clubs mis à jour depuis Firebase :", Object.keys(map).length);
}

function logoPourEquipe(nom) {
    const n = normaliser(nom);
    if (!n) return null;
    /* correspondance exacte, puis partielle (ex : "reze44" -> "reze") */
    if (logosClubs[n]) return logosClubs[n];
    for (const cle in logosClubs) {
        if (n.startsWith(cle) || cle.startsWith(n)) return logosClubs[cle];
    }
    if (LOGOS_FALLBACK[n]) return LOGOS_FALLBACK[n];
    for (const cle in LOGOS_FALLBACK) {
        if (n.startsWith(cle) || cle.startsWith(n)) return LOGOS_FALLBACK[cle];
    }
    return null;
}

/* Écoute en temps réel du nœud "poule" (même source que poule.html) */
onValue(ref(db, "poule"), (snapshot) => {
    majLogosDepuisFirebase(snapshot.val());
    /* si des logos arrivent alors que le classement est déjà affiché, on relance le rendu */
    if (document.getElementById("clRows").children.length) chargerClassement();
});

/* Parse un CSV complet (avec guillemets) en tableau de tableaux */
function parseCsv(texte) {
    const lignes = [];
    let ligne = [], cellule = "", dansGuillemets = false;
    for (let i = 0; i < texte.length; i++) {
        const c = texte[i];
        if (dansGuillemets) {
            if (c === '"') {
                if (texte[i + 1] === '"') { cellule += '"'; i++; }
                else dansGuillemets = false;
            } else cellule += c;
        } else if (c === '"') {
            dansGuillemets = true;
        } else if (c === ",") {
            ligne.push(cellule); cellule = "";
        } else if (c === "\n") {
            ligne.push(cellule); lignes.push(ligne);
            ligne = []; cellule = "";
        } else if (c !== "\r") {
            cellule += c;
        }
    }
    if (cellule !== "" || ligne.length) { ligne.push(cellule); lignes.push(ligne); }
    return lignes;
}

async function chargerClassement() {
    /* export CSV : plus fiable que le gviz JSON pour cette feuille */
    const url =
        "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/export?format=csv&gid=" + GID_CLASSEMENT +
        "&cache=" + Date.now(); /* évite le cache navigateur */

    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const texte = await response.text();
        const lignes = parseCsv(texte).filter(l => l.some(c => c.trim() !== ""));
        if (lignes.length < 2) throw new Error("Feuille vide");
        rendreClassement(lignes[0], lignes.slice(1));
    } catch (error) {
        console.error("Erreur chargement classement :", error);
    }
}

function rendreClassement(entetes, donnees) {
    const head = document.getElementById("clHead");

    /* La 1re colonne de la feuille contient le rang (1, 2, 3…) :
       les lignes affichent [rang, équipe, Pts, J, G, P, p., c.]. */
    const premiereColNum = donnees.length > 0 && /^\d+$/.test((donnees[0][0] || "").trim());

    /* Colonnes affichées, identiques pour l'en-tête et les lignes */
    const colsTemplate =
        "5% minmax(120px, 1fr) repeat(" + Math.max(entetes.length - 2, 1) + ", minmax(52px, 1fr))";

    head.style.display = "";
    head.style.setProperty("--cols", colsTemplate);
    head.innerHTML =
        "<div>" + escapeHtml(entetes[0] || "Classement") + "</div>" +
        "<div>Équipe</div>" +
        entetes.slice(2).map(h => "<div>" + escapeHtml(h) + "</div>").join("");

    const rows = document.getElementById("clRows");
    rows.innerHTML = "";

    donnees.forEach((cells, i) => {
        /* Ignore la ligne d'en-tête si la feuille la répète */
        if (!premiereColNum && i === 0 && isNaN(parseInt(cells[0], 10))) return;

        const ligne = document.createElement("div");
        ligne.className = "cl-row";
        ligne.style.setProperty("--d", (0.1 + i * 0.06).toFixed(2) + "s");
        ligne.style.setProperty("--cols", colsTemplate);

        const nomEquipe = (cells[1] || "").trim();

        /* Seul le MVBC est mis en avant (jaune broadcast) */
        if (normaliser(nomEquipe).includes("mvbc")) {
            ligne.classList.add("mvbc");
        }

        let html = premiereColNum
            ? "<div class='rang'>" + escapeHtml(cells[0]) + "</div>"
            : "<div class='rang'>" + (i + 1) + "</div>";

        cells.forEach((v, k) => {
            if (premiereColNum && k === 0) return; /* rang déjà affiché */
            if (k === 1) {
                const logo = logoPourEquipe(nomEquipe);
                html += "<div class='equipe'>" +
                    (logo ? "<img class='logo' src='" + escapeHtml(logo) + "' alt='' onerror='this.style.display=\"none\"'>" : "") +
                    "<span class='equipe-nom'>" + escapeHtml(nomEquipe) + "</span>" +
                    "</div>";
            } else {
                /* 3e colonne = points → pastille jaune */
                const cls = k === 2 ? "cell pts" : "cell";
                html += "<div class='" + cls + "'>" + escapeHtml(v) + "</div>";
            }
        });
        ligne.innerHTML = html;
        rows.appendChild(ligne);

        /* Nom sur une seule ligne : réduction auto de la police */
        const eq = ligne.querySelector(".equipe-nom");
        let taille = parseFloat(getComputedStyle(eq.parentElement).fontSize);
        eq.style.fontSize = taille + "px";
        let securite = 20;
        while (securite-- > 0 && eq.scrollWidth > eq.clientWidth + 1 && taille > 12) {
            taille -= 1;
            eq.style.fontSize = taille + "px";
        }
    });
}

chargerClassement();
setInterval(chargerClassement, REFRESH_MS);

/* =====================================================
   LOGOS PARTENAIRES (GitHub — même source que poule.html)
   ===================================================== */
const GITHUB_LOGO_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
const GITHUB_LOGO_RAW = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

async function chargerLogosPartenaires() {
    try {
        const response = await fetch(GITHUB_LOGO_API, {
            headers: { "Accept": "application/vnd.github+json" },
            cache: "no-store"
        });
        if (!response.ok) throw new Error("GitHub a répondu " + response.status);
        const fichiers = await response.json();
        const scroll = document.getElementById("partnersScroll");
        scroll.innerHTML = "";
        const logos = fichiers
            .filter(f => f.type === "file" && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name))
            .map(f => GITHUB_LOGO_RAW + encodeURIComponent(f.name));
        [...logos, ...logos].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Partenaire";
            img.onerror = function () { this.style.display = "none"; };
            scroll.appendChild(img);
        });
    } catch (error) {
        console.error("Erreur chargement logos partenaires :", error);
    }
}
chargerLogosPartenaires();
</script>

</body>
</html>
