<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam</title>

  <style>
    /* ========== RESET & BASE ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ========== CAMÉRA PLEIN ÉCRAN ========== */
    #camera-container {
      flex: 1;
      background: #000;
      position: relative;
    }

    #camera-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ========== SLIDER DES PARTENAIRES ========== */
    .partners-slider {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      overflow: hidden;
      background: #111;
      border-top: 2px solid #00ffcc;
      z-index: 999;
      height: 100px;
    }

    .partners-track {
      display: flex;
      width: max-content;
      animation: scroll 30s linear infinite;
      height: 100%;
      align-items: center;
    }

    .partners-track img {
      height: 80px;
      margin: 0 40px;
      object-fit: contain;
      flex-shrink: 0;
      filter: grayscale(100%) brightness(1.5);
      transition: filter 0.3s;
    }

    .partners-track img:hover {
      filter: grayscale(0%) brightness(1);
    }

    @keyframes scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }
  </style>
</head>

<body>
  <!-- ========== CAMÉRA PLEIN ÉCRAN ========== -->
  <div id="camera-container">
    <iframe
      src="https://vdo.ninja/?view=ApolloRunCcam1&cleanoutput&transparent&autoplay"
      allow="camera; microphone; autoplay"
    ></iframe>
  </div>

  <!-- ========== SLIDER DES PARTENAIRES ========== -->
  <div class="partners-slider">
    <div class="partners-track">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <img src="logo/SUPERU.png">
      <!-- Duplication pour une boucle infinie -->
      <img src="logo/SUPERU.png">
      <img src="Z2.png">
      <img src="Z3.png">
      <img src="Z4.png">
      <img src="Z5.png">
      <img src="Z6.png">
      <img src="Z7.png">
      <img src="Z8.png">
    </div>
  </div>
</body>
</html>
