<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Apollo Run - Caméra Plein Écran</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #111;
  color: white;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Caméra en plein écran */
#camera-container {
  flex: 1;
  background: #000;
}

#camera-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* Slider des partenaires */
.partners-slider {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  overflow: hidden;
  background: #111;
  border-top: 2px solid #feef22;
  z-index: 999;
  height: 120px; /* Légèrement plus haut pour les logos plus grands */
}

.partners-track {
  display: flex;
  width: max-content;
  animation: scroll 30s linear infinite;
  height: 100%;
  align-items: center;
}

.partners-track img {
  height: 100px; /* Logos agrandis */
  margin: 0 50px; /* Espacement augmenté pour équilibrer */
  object-fit: contain;
  flex-shrink: 0;
  filter: grayscale(100%) brightness(1.5);
  transition: filter 0.3s;
}

.partners-track img:hover {
  filter: grayscale(0%) brightness(1);
}

@keyframes scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}
</style>
</head>

<body>
  <!-- Caméra en plein écran -->
  <div id="camera-container">
    <iframe src="https://vdo.ninja/?view=ApolloRunAcam1&cleanoutput&transparent&autoplay" allow="camera; microphone; autoplay"></iframe>
  </div>

  <!-- Slider des partenaires -->
  <div class="partners-slider">
    <div class="partners-track">
      <img src="Z1.png">
      <img src="Z2.png">
      <img src="Z3.png">
      <img src="Z4.png">
      <img src="Z5.png">
      <img src="Z6.png">
      <img src="Z7.png">
      <img src="Z8.png">
      <!-- Duplication pour une boucle infinie -->
      <img src="Z1.png">
      <img src="Z2.png">
      <img src="Z3.png">
      <img src="Z4.png">
      <img src="Z5.png">
      <img src="Z6.png">
      <img src="Z7.png">
      <img src="Z8.png">
    </div>
  </div>
</body>
</html>
