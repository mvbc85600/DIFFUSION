<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partenaire du Match - MVBC</title>
    <style>
        /* =====================================================
           VARIABLES CSS POUR LES COULEURS DYNAMIQUES
        ===================================================== */
        :root {
            --halo-couleur: #008cff; /* Couleur par défaut (bleu) */
            --halo-couleur-rgb: 0, 140, 255;
        }

        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: white;
        }

        /* =====================================================
           FOND AVEC EFFETS LUMINEUX
        ===================================================== */
        body {
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    rgba(var(--halo-couleur-rgb), 0.20),
                    transparent 70%
                ),
                linear-gradient(
                    135deg,
                    #020611,
                    #080808,
                    #110703
                );
        }

        body::before {
            content: "";
            position: absolute;
            width: 800px;
            height: 800px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(var(--halo-couleur-rgb), 0.15);
            filter: blur(100px);
            border-radius: 50%;
            z-index: 1;
        }

        /* =====================================================
           CONTENEUR PRINCIPAL
        ===================================================== */
        .container {
            position: relative;
            z-index: 5;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* =====================================================
           TITRE "PARTENAIRE DU MATCH"
        ===================================================== */
        .title {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-align: center;
            background:
                linear-gradient(
                    90deg,
                    white,
                    var(--halo-couleur),
                    white
                );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation:
                titleIn 1.2s ease forwards,
                titleShine 5s linear infinite;
            opacity: 0;
            margin-bottom: 30px;
        }

        @keyframes titleIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.7);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes titleShine {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        /* =====================================================
           LIGNE SOUS LE TITRE
        ===================================================== */
        .title-line {
            width: 50%;
            max-width: 400px;
            height: 3px;
            margin-bottom: 40px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--halo-couleur),
                    transparent
                );
            box-shadow:
                0 0 15px var(--halo-couleur);
            transform: scaleX(0);
            animation:
                lineIn 1s ease forwards;
            animation-delay: 0.5s;
        }

        @keyframes lineIn {
            to {
                transform: scaleX(1);
            }
        }

        /* =====================================================
           CADRE DU LOGO
        ===================================================== */
        .logo-container {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.08),
                    rgba(0, 0, 0, 0.8)
                );
            overflow: visible;
            animation:
                logoPulse 2.5s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% {
                filter: drop-shadow(0 0 15px var(--halo-couleur));
            }
            50% {
                filter: drop-shadow(0 0 50px var(--halo-couleur));
            }
        }

        /* =====================================================
           ANNEAU TOURNANT AUTOUR DU LOGO
        ===================================================== */
        .logo-container::before {
            content: "";
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 3px solid var(--halo-couleur);
            box-shadow:
                0 0 15px var(--halo-couleur),
                0 0 35px var(--halo-couleur),
                inset 0 0 20px rgba(var(--halo-couleur-rgb), 0.3);
            animation:
                rotateRing 8s linear infinite;
        }

        @keyframes rotateRing {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* =====================================================
           LOGO PARTENAIRE
        ===================================================== */
        .logo {
            position: relative;
            z-index: 5;
            width: 280px;
            height: 280px;
            object-fit: contain;
            opacity: 0;
            animation:
                logoIn 1.2s cubic-bezier(.17, .67, .3, 1.3) forwards;
            animation-delay: 0.8s;
        }

        @keyframes logoIn {
            from {
                opacity: 0;
                transform: scale(0.3) rotate(-15deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        /* =====================================================
           NOM DU PARTENAIRE
        ===================================================== */
        .partner-name {
            margin-top: 30px;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: 900;
            letter-spacing: 3px;
            text-align: center;
            color: var(--halo-couleur);
            text-shadow: 0 0 15px var(--halo-couleur);
            opacity: 0;
            animation:
                nameIn 0.8s ease forwards;
            animation-delay: 1.5s;
        }

        @keyframes nameIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
           PARTICULES (EFFETS VISUELS)
        ===================================================== */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: white;
            opacity: 0;
            animation:
                particleFloat
                var(--duration)
                linear
                infinite;
        }

        @keyframes particleFloat {
            0% {
                transform:
                    translateY(100vh)
                    translateX(0);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform:
                    translateY(-20vh)
                    translateX(var(--move));
                opacity: 0;
            }
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */
        @media (max-width: 768px) {
            .logo-container {
                width: 280px;
                height: 280px;
            }
            .logo {
                width: 220px;
                height: 220px;
            }
            .title {
                font-size: clamp(18px, 6vw, 32px);
            }
            .partner-name {
                font-size: clamp(16px, 4vw, 24px);
            }
        }

        @media (max-width: 480px) {
            .logo-container {
                width: 200px;
                height: 200px;
            }
            .logo {
                width: 160px;
                height: 160px;
            }
            .title {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .partner-name {
                font-size: 16px;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>
    <!-- PARTICULES -->
    <div class="particle" style="left: 10%; --duration: 8s; --move: 50px;"></div>
    <div class="particle" style="left: 20%; --duration: 11s; --move: -80px;"></div>
    <div class="particle" style="left: 30%; --duration: 9s; --move: 100px;"></div>
    <div class="particle" style="left: 70%; --duration: 10s; --move: -60px;"></div>
    <div class="particle" style="left: 80%; --duration: 12s; --move: 70px;"></div>
    <div class="particle" style="left: 90%; --duration: 9s; --move: -90px;"></div>

    <div class="container">
        <h1 class="title">PARTENAIRE DU MATCH</h1>
        <div class="title-line"></div>

        <div class="logo-container">
            <img id="partnerLogo" class="logo" src="" alt="Logo Partenaire">
        </div>

        <div id="partnerName" class="partner-name">Nom du partenaire</div>
    </div>

    <script type="module">
        // =====================================================
        // CONFIGURATION FIREBASE
        // =====================================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
            authDomain: "diffusion-b9afa.firebaseapp.com",
            databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "diffusion-b9afa",
            storageBucket: "diffusion-b9afa.firebasestorage.app",
            messagingSenderId: "674799570797",
            appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // =====================================================
        // ÉLÉMENTS HTML
        // =====================================================
        const partnerLogo = document.getElementById("partnerLogo");
        const partnerName = document.getElementById("partnerName");
        const root = document.documentElement;

        // =====================================================
        // FONCTION POUR CONVERTIR HEX EN RGB
        // =====================================================
        function hexToRgb(hex) {
            hex = hex.replace('#', '');
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return `${r}, ${g}, ${b}`;
        }

        // =====================================================
        // REJOUER LES ANIMATIONS
        // =====================================================
        function restartAnimations() {
            const animatedElements = [
                document.querySelector(".title"),
                document.querySelector(".title-line"),
                partnerLogo,
                partnerName
            ];

            animatedElements.forEach(element => {
                if (!element) return;
                element.style.animation = "none";
            });

            void document.body.offsetWidth; // Force un reflow

            animatedElements.forEach(element => {
                if (!element) return;
                element.style.animation = "";
            });
        }

        // =====================================================
        // RÉFÉRENCE FIREBASE POUR LE PARTENAIRE DU MATCH
        // =====================================================
        const partnerRef = ref(db, "partenairedumatch");

        // =====================================================
        // ÉCOUTE EN TEMPS RÉEL
        // =====================================================
        onValue(partnerRef, (snapshot) => {
            const data = snapshot.val();

            if (!data) {
                console.log("Aucun partenaire du match sélectionné.");
                return;
            }

            // =================================================
            // NOM DU PARTENAIRE
            // =================================================
            partnerName.textContent = data.nom || "Nom du partenaire";

            // =================================================
            // COULEUR DU HALO (par défaut : bleu #008cff)
            // =================================================
            const haloCouleur = data.couleur || "#008cff";
            root.style.setProperty('--halo-couleur', haloCouleur);
            root.style.setProperty('--halo-couleur-rgb', hexToRgb(haloCouleur));

            // =================================================
            // LOGO DU PARTENAIRE
            // =================================================
            if (data.logo) {
                partnerLogo.style.opacity = "0";
                partnerLogo.src = data.logo;

                partnerLogo.onerror = () => {
                    console.error("Impossible de charger le logo :", data.logo);
                    partnerLogo.style.opacity = "0.3";
                };

                partnerLogo.onload = () => {
                    partnerLogo.style.opacity = "";
                    restartAnimations();
                };
            } else {
                partnerLogo.src = "";
                partnerLogo.alt = "Aucun logo";
            }

            // =================================================
            // RELANCER LES ANIMATIONS
            // =================================================
            restartAnimations();
        });
    </script>
</body>
</html>
