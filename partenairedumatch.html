<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PARTENAIRE DU MATCH — MVBC</title>

<!-- =====================================================
     POLICES — MÊME IDENTITÉ QUE GO GO GO / MATCH DU SOIR
===================================================== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap"
    rel="stylesheet"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root {

    --white: #f7f7f5;
    --black: #050608;

    --blue: #1769ff;
    --red: #ed174c;
    --yellow: #ffd400;

    --halo-couleur: #008cff;

    --halo-couleur-rgb: 0,140,255;
}


/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    margin: 0;
    padding: 0;
}

body {

    position: relative;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(var(--halo-couleur-rgb), .12),
            transparent 34%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(237,23,76,.06),
            transparent 40%
        ),
        #050608;

    color: var(--white);

    font-family: "Inter", sans-serif;
}


/* =====================================================
   SCÈNE
===================================================== */

.stage {

    position: relative;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    isolation: isolate;
}


/* =====================================================
   ATMOSPHÈRE ARENA
===================================================== */

.stage::before {

    content: "";

    position: absolute;

    inset: -20%;

    z-index: -5;

    background:

        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.012) 91px 92px
        ),

        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.045),
            transparent 48%
        );

    transform:
        perspective(800px)
        rotateX(58deg)
        scale(1.35);

    transform-origin: center bottom;

    pointer-events: none;
}


/* =====================================================
   HALO CENTRAL PARTENAIRE
===================================================== */

.halo {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(70vw, 850px);
    height: min(70vw, 850px);

    z-index: -4;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(var(--halo-couleur-rgb), .20),
            rgba(var(--halo-couleur-rgb), .09) 35%,
            transparent 70%
        );

    filter: blur(45px);

    pointer-events: none;
}


/* =====================================================
   HALOS LATÉRAUX
===================================================== */

.halo-left,
.halo-right {

    position: absolute;

    top: 10%;

    width: 35%;
    height: 80%;

    z-index: -5;

    filter: blur(80px);

    opacity: .35;

    pointer-events: none;
}

.halo-left {

    left: -15%;

    background:
        radial-gradient(
            ellipse,
            rgba(var(--halo-couleur-rgb), .35),
            transparent 70%
        );
}

.halo-right {

    right: -15%;

    background:
        radial-gradient(
            ellipse,
            rgba(23,105,255,.10),
            transparent 70%
        );
}


/* =====================================================
   VIGNETTE
===================================================== */

.vignette {

    position: absolute;

    inset: 0;

    z-index: 25;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 32%,
            rgba(0,0,0,.52) 100%
        );
}


/* =====================================================
   LIGNES TECHNIQUES
===================================================== */

.tech-lines {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;
}

.tech-lines::before,
.tech-lines::after {

    content: "";

    position: absolute;

    left: 5%;
    right: 5%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.30),
            transparent
        );
}

.tech-lines::before {
    top: 8%;
}

.tech-lines::after {
    bottom: 8%;
}


/* =====================================================
   PETITS REPÈRES LATÉRAUX
===================================================== */

.side-mark {

    position: absolute;

    top: 50%;

    width: 80px;
    height: 3px;

    z-index: 5;

    opacity: .75;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--halo-couleur)
        );
}

.side-mark.left {
    left: 4%;
}

.side-mark.right {

    right: 4%;

    transform: rotate(180deg);
}


/* =====================================================
   CONTENEUR PRINCIPAL
===================================================== */

.container {

    position: relative;

    z-index: 10;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding:
        clamp(25px, 5vh, 60px)
        4vw;

    overflow: hidden;
}


/* =====================================================
   SURTITRE
===================================================== */

.eyebrow {

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 18px;

    margin-bottom:
        clamp(5px, 1vh, 15px);

    opacity: 0;

    transform:
        translateY(-25px);
}

.eyebrow-line {

    width:
        clamp(40px, 8vw, 110px);

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--white)
        );

    opacity: .55;
}

.eyebrow-line.right {

    transform: rotate(180deg);
}

.eyebrow-text {

    font-family: "Inter", sans-serif;

    font-size:
        clamp(10px, 1vw, 16px);

    font-weight: 900;

    letter-spacing: .32em;

    text-transform: uppercase;

    white-space: nowrap;
}


/* =====================================================
   TITRE
===================================================== */

.title {

    position: relative;

    margin: 0;

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:
        clamp(
            65px,
            11vw,
            180px
        );

    font-weight: 900;

    line-height: .76;

    letter-spacing: -.075em;

    font-style: italic;

    text-align: center;

    text-transform: uppercase;

    white-space: nowrap;

    color: var(--white);

    opacity: 0;

    transform:
        skewX(-5deg)
        scale(.45);

    text-shadow:

        5px 5px 0 var(--black),

        10px 10px 0 var(--yellow),

        16px 16px 0 rgba(237,23,76,.85),

        22px 22px 0 rgba(23,105,255,.50);

    will-change:
        transform,
        opacity;
}


/* =====================================================
   LIGNE MULTICOLORE
===================================================== */

.title-line {

    width:
        min(65vw, 900px);

    height: 5px;

    margin-top:
        clamp(15px, 2vh, 25px);

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue) 12%,
            var(--yellow) 35%,
            var(--white) 50%,
            var(--yellow) 65%,
            var(--red) 88%,
            transparent
        );

    box-shadow:
        0 0 25px rgba(23,105,255,.35);

    transform:
        scaleX(0)
        skewX(-15deg);

    opacity: 0;
}


/* =====================================================
   ZONE LOGO
===================================================== */

.logo-zone {

    position: relative;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-top:
        clamp(20px, 4vh, 45px);

    margin-bottom:
        clamp(20px, 3vh, 40px);

    flex: 1;

    min-height: 0;

    width: 100%;
}


/* =====================================================
   SLASH DERRIÈRE LE LOGO
===================================================== */

.slash {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        min(70vw, 1050px);

    height: 14px;

    transform:
        translate(-50%, -50%)
        rotate(-7deg)
        scaleX(0);

    transform-origin: center;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--blue) 12%,
            var(--yellow) 35%,
            var(--white) 50%,
            var(--yellow) 65%,
            var(--red) 88%,
            transparent
        );

    box-shadow:
        0 0 35px rgba(23,105,255,.4);

    z-index: 1;
}


/* =====================================================
   LOGO CONTAINER
===================================================== */

.logo-container {

    position: relative;

    width:
        clamp(
            240px,
            30vw,
            430px
        );

    height:
        clamp(
            240px,
            30vw,
            430px
        );

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.10),
            rgba(0,0,0,.78) 68%
        );

    border:
        2px solid rgba(255,255,255,.20);

    box-shadow:

        0 0 0 8px rgba(255,255,255,.025),

        inset 0 0 60px rgba(0,0,0,.85),

        0 0 60px
        rgba(var(--halo-couleur-rgb),.15);

    z-index: 5;

    opacity: 0;

    transform:
        scale(.3);

    isolation: isolate;
}


/* =====================================================
   ANNEAU PRINCIPAL
===================================================== */

.logo-container::before {

    content: "";

    position: absolute;

    inset: -17px;

    border-radius: 50%;

    border:
        4px solid transparent;

    border-top-color:
        var(--halo-couleur);

    border-right-color:
        var(--halo-couleur);

    box-shadow:
        0 0 18px
        rgba(var(--halo-couleur-rgb),.65),

        0 0 40px
        rgba(var(--halo-couleur-rgb),.25);

    animation:
        rotateRing
        7s linear infinite;
}


/* =====================================================
   ANNEAU SECONDAIRE
===================================================== */

.logo-container::after {

    content: "";

    position: absolute;

    inset: -30px;

    border-radius: 50%;

    border:
        1px solid
        rgba(var(--halo-couleur-rgb),.55);

    animation:
        pulseRing
        2.5s ease-in-out infinite;
}


/* =====================================================
   PETITS REPÈRES AUTOUR DU LOGO
===================================================== */

.logo-ring-detail {

    position: absolute;

    inset: -38px;

    border-radius: 50%;

    border:
        1px dashed
        rgba(255,255,255,.18);

    animation:
        rotateRingReverse
        14s linear infinite;
}


/* =====================================================
   LOGO PARTENAIRE
===================================================== */

.logo {

    position: relative;

    z-index: 10;

    width: 78%;
    height: 78%;

    object-fit: contain;

    opacity: 0;

    transform:
        scale(.35)
        rotate(-12deg);

    filter:
        drop-shadow(
            0 12px 20px rgba(0,0,0,.70)
        );

    animation:
        logoIn
        1.15s
        cubic-bezier(.16,.9,.25,1)
        .75s
        forwards;
}


/* =====================================================
   NOM PARTENAIRE
===================================================== */

.partner-name {

    position: relative;

    z-index: 15;

    max-width: 80vw;

    padding:
        9px 28px 7px;

    margin-top:
        clamp(5px, 1vh, 12px);

    font-family:
        "Barlow Condensed",
        sans-serif;

    font-size:
        clamp(
            28px,
            4vw,
            60px
        );

    font-weight: 900;

    line-height: .9;

    letter-spacing: -.015em;

    text-transform: uppercase;

    text-align: center;

    white-space: nowrap;

    background:
        rgba(0,0,0,.78);

    border-bottom:
        5px solid var(--halo-couleur);

    box-shadow:
        7px 7px 0 rgba(0,0,0,.65);

    text-shadow:
        3px 3px 0 #000;

    opacity: 0;

    transform:
        translateY(30px);
}


/* =====================================================
   BADGE PARTENAIRE OFFICIEL
===================================================== */

.partner-badge {

    position: absolute;

    left: 50%;
    bottom: 4%;

    transform:
        translateX(-50%);

    z-index: 15;

    font-family:
        "Inter",
        sans-serif;

    font-size:
        clamp(
            9px,
            .8vw,
            13px
        );

    font-weight: 900;

    letter-spacing: .30em;

    text-transform: uppercase;

    white-space: nowrap;

    opacity: 0;

    color:
        rgba(255,255,255,.65);
}


/* =====================================================
   SPEED LINES
===================================================== */

.speed-lines {

    position: absolute;

    inset: 0;

    z-index: 3;

    overflow: hidden;

    pointer-events: none;
}

.speed-line {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        clamp(
            120px,
            18vw,
            300px
        );

    height: 2px;

    transform-origin: 0 50%;

    transform:
        rotate(var(--angle))
        translateX(20px)
        scaleX(0);

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.85),
            transparent
        );
}


/* =====================================================
   FLASH
===================================================== */

.flash {

    position: absolute;

    inset: 0;

    z-index: 20;

    pointer-events: none;

    opacity: 0;

    background:
        rgba(255,255,255,.75);

    mix-blend-mode: screen;
}


/* =====================================================
   PARTICULES
===================================================== */

.particles {

    position: absolute;

    inset: 0;

    z-index: 1;

    pointer-events: none;

    overflow: hidden;
}

.particle {

    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: rgba(255,255,255,.65);

    opacity: 0;

    animation:
        particleFloat
        var(--duration)
        ease-in-out
        infinite;

    animation-delay:
        var(--delay);
}


/* =====================================================
   ANIMATIONS
===================================================== */

.stage.loaded .eyebrow {

    animation:
        eyebrowIn
        .8s
        cubic-bezier(.16,.9,.25,1)
        .05s
        forwards;
}


.stage.loaded .title {

    animation:
        titleImpact
        1.35s
        cubic-bezier(.16,.9,.25,1)
        .18s
        forwards;
}


.stage.loaded .title-line {

    animation:
        lineImpact
        .9s
        cubic-bezier(.16,1,.3,1)
        .55s
        forwards;
}


.stage.loaded .logo-container {

    animation:
        logoContainerIn
        1.15s
        cubic-bezier(.16,.9,.25,1)
        .45s
        forwards;
}


.stage.loaded .partner-name {

    animation:
        nameImpact
        .8s
        cubic-bezier(.16,.9,.25,1)
        1.1s
        forwards;
}


.stage.loaded .partner-badge {

    animation:
        badgeIn
        .8s ease
        1.35s
        forwards;
}


.stage.loaded .slash {

    animation:
        slashImpact
        1.2s
        cubic-bezier(.16,1,.3,1)
        .55s
        forwards;
}


.stage.loaded .speed-line {

    animation:
        speedImpact
        .8s
        cubic-bezier(.15,.8,.3,1)
        forwards;
}


/* =====================================================
   KEYFRAMES
===================================================== */

@keyframes eyebrowIn {

    0% {

        opacity: 0;

        transform:
            translateY(-25px);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes titleImpact {

    0% {

        opacity: 0;

        transform:
            skewX(-5deg)
            scale(.45);

        filter: blur(8px);
    }

    14% {

        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1.10);

        filter: blur(0);
    }

    27% {

        transform:
            skewX(-5deg)
            scale(.96);
    }

    40% {

        transform:
            skewX(-5deg)
            scale(1.03);
    }

    100% {

        opacity: 1;

        transform:
            skewX(-5deg)
            scale(1);
    }
}


@keyframes lineImpact {

    0% {

        opacity: 0;

        transform:
            scaleX(0)
            skewX(-15deg);
    }

    100% {

        opacity: 1;

        transform:
            scaleX(1)
            skewX(-15deg);
    }
}


@keyframes logoContainerIn {

    0% {

        opacity: 0;

        transform:
            scale(.3);

        filter: blur(8px);
    }

    55% {

        opacity: 1;

        transform:
            scale(1.08);

        filter: blur(0);
    }

    75% {

        transform:
            scale(.96);
    }

    100% {

        opacity: 1;

        transform:
            scale(1);
    }
}


@keyframes logoIn {

    0% {

        opacity: 0;

        transform:
            scale(.3)
            rotate(-15deg);
    }

    65% {

        opacity: 1;

        transform:
            scale(1.06)
            rotate(2deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


@keyframes nameImpact {

    0% {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.8);
    }

    65% {

        opacity: 1;

        transform:
            translateY(-3px)
            scale(1.02);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes badgeIn {

    0% {

        opacity: 0;

        transform:
            translateX(-50%)
            translateY(15px);
    }

    100% {

        opacity: 1;

        transform:
            translateX(-50%)
            translateY(0);
    }
}


@keyframes slashImpact {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(0);
    }

    20% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1);
    }

    65% {

        opacity: .8;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1.05);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            rotate(-7deg)
            scaleX(1.18);
    }
}


@keyframes speedImpact {

    0% {

        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(10px)
            scaleX(0);
    }

    20% {

        opacity: .9;
    }

    100% {

        opacity: 0;

        transform:
            rotate(var(--angle))
            translateX(30px)
            scaleX(1);
    }
}


@keyframes rotateRing {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


@keyframes rotateRingReverse {

    from {
        transform: rotate(360deg);
    }

    to {
        transform: rotate(0deg);
    }
}


@keyframes pulseRing {

    0%,
    100% {

        transform: scale(.95);

        opacity: .20;
    }

    50% {

        transform: scale(1.05);

        opacity: .60;
    }
}


@keyframes particleFloat {

    0% {

        opacity: 0;

        transform:
            translateY(100vh)
            translateX(0)
            scale(.5);
    }

    20% {

        opacity: .5;
    }

    70% {

        opacity: .35;
    }

    100% {

        opacity: 0;

        transform:
            translateY(-100px)
            translateX(var(--move))
            scale(1);
    }
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 768px) {

    .title {

        font-size:
            clamp(
                55px,
                14vw,
                100px
            );
    }

    .logo-container {

        width: 250px;
        height: 250px;
    }

    .partner-name {

        max-width: 90vw;

        font-size:
            clamp(
                25px,
                6vw,
                42px
            );
    }

    .eyebrow-line {

        width: 30px;
    }
}


@media (max-width: 480px) {

    .container {

        padding:
            20px
            3vw;
    }

    .eyebrow {

        gap: 8px;
    }

    .eyebrow-text {

        font-size: 9px;

        letter-spacing: .20em;
    }

    .title {

        font-size:
            clamp(
                48px,
                15vw,
                75px
            );
    }

    .title-line {

        width: 75vw;
    }

    .logo-container {

        width: 190px;
        height: 190px;
    }

    .logo-container::before {

        inset: -10px;
    }

    .logo-container::after {

        inset: -18px;
    }

    .logo-ring-detail {

        inset: -25px;
    }

    .partner-name {

        padding:
            7px 15px 5px;

        font-size: 24px;

        border-bottom-width: 3px;
    }
}


/* =====================================================
   GRANDS ÉCRANS / LED
===================================================== */

@media (min-width: 1600px) {

    .title {

        font-size:
            clamp(
                150px,
                10vw,
                200px
            );
    }

    .logo-container {

        width:
            clamp(
                320px,
                25vw,
                450px
            );

        height:
            clamp(
                320px,
                25vw,
                450px
            );
    }

    .partner-name {

        font-size:
            clamp(
                45px,
                3.2vw,
                65px
            );
    }
}


/* =====================================================
   RÉDUCTION DES ANIMATIONS
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }
}

</style>
</head>


<body>

<div class="stage" id="stage">

    <!-- =================================================
         HALOS
    ================================================== -->

    <div class="halo"></div>

    <div class="halo-left"></div>

    <div class="halo-right"></div>


    <!-- =================================================
         ATMOSPHÈRE
    ================================================== -->

    <div class="tech-lines"></div>

    <div class="side-mark left"></div>

    <div class="side-mark right"></div>


    <!-- =================================================
         SPEED LINES
    ================================================== -->

    <div
        class="speed-lines"
        id="speedLines">
    </div>


    <!-- =================================================
         FLASH
    ================================================== -->

    <div class="flash"></div>


    <!-- =================================================
         PARTICULES
    ================================================== -->

    <div
        class="particles"
        id="particles">

        <div
            class="particle"
            style="
                left:10%;
                --duration:8s;
                --move:50px;
                --delay:1s;
            ">
        </div>

        <div

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

    authDomain:
        "diffusion-b9afa.firebaseapp.com",

    databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "diffusion-b9afa",

    storageBucket:
        "diffusion-b9afa.firebasestorage.app",

    messagingSenderId:
        "674799570797",

    appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"
};


/* =====================================================
   INITIALISATION
===================================================== */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* =====================================================
   ÉLÉMENTS
===================================================== */

const stage =
    document.getElementById("stage");

const root =
    document.documentElement;

const partnerLogo =
    document.getElementById("partnerLogo");

const partnerName =
    document.getElementById("partnerName");


/* =====================================================
   SPEED LINES
===================================================== */

const speedLines =
    document.getElementById("speedLines");

const angles = [

    0,
    18,
    36,
    54,
    72,
    90,
    108,
    126,
    144,
    162,
    180,
    198,
    216,
    234,
    252,
    270,
    288,
    306,
    324,
    342

];


angles.forEach(
    (angle, index) => {

        const line =
            document.createElement("div");

        line.className =
            "speed-line";

        line.style.setProperty(
            "--angle",
            `${angle}deg`
        );

        line.style.animationDelay =
            `${index * 0.025}s`;

        speedLines.appendChild(line);

    }
);


/* =====================================================
   RGB
===================================================== */

function hexToRgb(hex) {

    if (
        typeof hex !== "string"
    ) {

        return "0, 140, 255";
    }

    let value =
        hex
            .replace("#", "")
            .trim();


    if (
        value.length === 3
    ) {

        value =
            value
                .split("")
                .map(
                    char =>
                        char + char
                )
                .join("");
    }


    if (
        !/^[0-9a-fA-F]{6}$/.test(value)
    ) {

        return "0, 140, 255";
    }


    const r =
        parseInt(
            value.substring(0, 2),
            16
        );

    const g =
        parseInt(
            value.substring(2, 4),
            16
        );

    const b =
        parseInt(
            value.substring(4, 6),
            16
        );


    return `${r}, ${g}, ${b}`;
}


/* =====================================================
   RELANCER LES ANIMATIONS
===================================================== */

function restartAnimations() {

    stage.classList.remove(
        "loaded"
    );


    const animatedElements = [

        document.querySelector(
            ".eyebrow"
        ),

        document.querySelector(
            ".title"
        ),

        document.querySelector(
            ".title-line"
        ),

        document.querySelector(
            ".logo-container"
        ),

        partnerLogo,

        partnerName,

        document.querySelector(
            ".partner-badge"
        ),

        document.querySelector(
            ".slash"
        )

    ];


    animatedElements.forEach(
        element => {

            if (!element) {
                return;
            }

            element.style.animation =
                "none";

        }
    );


    document
        .querySelectorAll(
            ".speed-line"
        )
        .forEach(
            line => {

                line.style.animation =
                    "none";

            }
        );


    void stage.offsetWidth;


    animatedElements.forEach(
        element => {

            if (!element) {
                return;
            }

            element.style.animation =
                "";

        }
    );


    document
        .querySelectorAll(
            ".speed-line"
        )
        .forEach(
            line => {

                line.style.animation =
                    "";

            }
        );


    void stage.offsetWidth;


    stage.classList.add(
        "loaded"
    );
}


/* =====================================================
   FIREBASE — PARTENAIRE DU MATCH
===================================================== */

const partnerRef =
    ref(
        db,
        "partenairedumatch"
    );


onValue(
    partnerRef,

    snapshot => {

        const data =
            snapshot.val();


        /* =================================================
           AUCUN PARTENAIRE
        ================================================= */

        if (!data) {

            partnerName.textContent =
                "";

            partnerLogo.removeAttribute(
                "src"
            );

            partnerLogo.alt =
                "Aucun logo";


            root.style.setProperty(
                "--halo-couleur",
                "#ffffff"
            );

            root.style.setProperty(
                "--halo-couleur-rgb",
                "255,255,255"
            );


            restartAnimations();

            return;
        }


        /* =================================================
           COULEUR DU HALO
        ================================================= */

        const haloCouleur =
            data.couleur ||
            "#008cff";


        root.style.setProperty(
            "--halo-couleur",
            haloCouleur
        );


        root.style.setProperty(
            "--halo-couleur-rgb",
            hexToRgb(
                haloCouleur
            )
        );


        /* =================================================
           NOM PARTENAIRE
        ================================================= */

        partnerName.textContent =
            data.nom ||
            "";


        /* =================================================
           LOGO
        ================================================= */

        if (data.logo) {

            partnerLogo.style.opacity =
                "0";

            partnerLogo.src =
                data.logo;

            partnerLogo.alt =
                `Logo ${data.nom || "Partenaire"}`;


            partnerLogo.onload =
                () => {

                    partnerLogo.style.opacity =
                        "";

                };


            partnerLogo.onerror =
                () => {

                    console.error(
                        "Impossible de charger le logo :",
                        data.logo
                    );

                    partnerLogo.style.opacity =
                        "0";

                };

        } else {

            partnerLogo.removeAttribute(
                "src"
            );

            partnerLogo.alt =
                "Aucun logo";
        }


        /* =================================================
           RELANCER L'ANIMATION
        ================================================= */

        restartAnimations();

    },

    error => {

        console.error(
            "Erreur Firebase partenaire du match :",
            error
        );

        restartAnimations();

    }
);

</script>
