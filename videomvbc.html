<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIRECT LIVE - MVBC</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* ECRAN VIDEO */
#playerContainer {
    position: fixed;
    inset: 0;
    background: #000;
}

#youtubePlayer {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
}

/* ECRAN DE CONFIGURATION */
#setup {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: radial-gradient(circle, #202020, #050505);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.panel {
    width: 90%;
    max-width: 650px;
    text-align: center;
    color: white;
}

.logo {
    font-size: 65px;
    font-weight: 900;
    color: #ffd400;
    letter-spacing: 4px;
    margin-bottom: 10px;
}

.subtitle {
    font-size: 19px;
    letter-spacing: 5px;
    margin-bottom: 45px;
    color: #aaa;
}

input {
    width: 100%;
    padding: 22px;
    font-size: 18px;
    border: 2px solid #444;
    border-radius: 8px;
    background: #151515;
    color: white;
    outline: none;
    margin-bottom: 20px;
}

input:focus {
    border-color: #ffd400;
}

button {
    width: 100%;
    padding: 22px;
    background: #ffd400;
    color: #000;
    border: none;
    border-radius: 8px;
    font-size: 21px;
    font-weight: 900;
    cursor: pointer;
}

button:hover {
    background: white;
}

.info {
    margin-top: 25px;
    font-size: 13px;
    color: #888;
    line-height: 1.6;
}

/* BOUTON RETOUR */
#changeVideo {
    display: none;
    position: fixed;
    z-index: 20;
    top: 15px;
    right: 15px;
    width: auto;
    padding: 12px 18px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
}

#playerContainer:hover #changeVideo {
    opacity: 1;
}

/* BANDEAU "EN ATTENTE DU DIRECT" */
#waiting {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    background: #000;
    color: #ffd400;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 4px;
    justify-content: center;
    align-items: center;
    text-align: center;
}
</style>
</head>

<body>

<div id="playerContainer">

    <iframe
        id="youtubePlayer"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

    <button id="changeVideo" onclick="showSetup()">
        CHANGER DE DIRECT
    </button>

</div>

<div id="waiting">⏳ EN ATTENTE DU DIRECT…</div>

<div id="setup">

    <div class="panel">

        <div class="logo">MVBC</div>

        <div class="subtitle">DIRECT LIVE</div>

        <input
            type="text"
            id="youtubeUrl"
            placeholder="Collez ici le lien YouTube du direct"
        >

        <button onclick="launchLive()">
            ▶ LANCER LE DIRECT
        </button>

        <div class="info">
            Le lien est normalement piloté depuis la <strong>Régie</strong>.<br>
            Cette saisie manuelle ne sert qu'en cas de panne de connexion.
            <br><br>
            Diffusion plein écran • Sans défilement
        </div>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
    authDomain: "diffusion-b9afa.firebaseapp.com",
    databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "diffusion-b9afa",
    storageBucket: "diffusion-b9afa.firebasestorage.app",
    messagingSenderId: "674799570797",
    appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* =====================================================
   EXTRACTION DE L'ID YOUTUBE
===================================================== */

function extractYoutubeId(url) {

    try {
        const parsed = new URL(url.trim());

        let id = "";

        if (parsed.hostname === "youtu.be" ||
            parsed.hostname === "www.youtu.be") {
            id = parsed.pathname.split("/")[1];
        }

        else if (
            parsed.hostname.includes("youtube.com") ||
            parsed.hostname.includes("youtube-nocookie.com")
        ) {
            if (parsed.pathname === "/watch") {
                id = parsed.searchParams.get("v");
            } else {
                const match = parsed.pathname.match(
                    /^\/(?:live|embed|shorts)\/([^/?]+)/
                );
                if (match) id = match[1];
            }
        }

        if (id && /^[a-zA-Z0-9_-]{11}$/.test(id)) {
            return id;
        }

    } catch (error) {
        return null;
    }

    return null;
}

/* =====================================================
   AFFICHAGE DU DIRECT
===================================================== */

let lastVideoId = null;

function afficherDirect(videoId) {
    const player = document.getElementById("youtubePlayer");

    player.src =
        "https://www.youtube-nocookie.com/embed/" +
        videoId +
        "?autoplay=1&mute=1&controls=0&rel=0&playsinline=1";

    player.style.display = "block";

    document.getElementById("setup").style.display = "none";
    document.getElementById("waiting").style.display = "none";
    document.getElementById("changeVideo").style.display = "block";
}

function masquerDirect(afficherAttente) {
    const player = document.getElementById("youtubePlayer");
    player.src = "";
    player.style.display = "none";

    document.getElementById("changeVideo").style.display = "none";
    document.getElementById("setup").style.display = afficherAttente ? "none" : "flex";
    document.getElementById("waiting").style.display = afficherAttente ? "flex" : "none";
}

/* Lancement manuel de secours */
function launchLive() {

    const url = document.getElementById("youtubeUrl").value;
    const videoId = extractYoutubeId(url);

    if (!videoId) {
        alert("Lien YouTube invalide. Vérifiez votre URL.");
        return;
    }

    lastVideoId = videoId;
    afficherDirect(videoId);
}

function showSetup() {
    lastVideoId = null;
    masquerDirect(false);
}

window.launchLive = launchLive;
window.showSetup = showSetup;

document.getElementById("youtubeUrl").addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Enter") launchLive();
    }
);

/* =====================================================
   PILOTAGE PAR LA REGIE (Firebase : noeud "direct")
   { videoId, actif, timestamp }
===================================================== */

const directRef = ref(db, "direct");

onValue(directRef, (snapshot) => {

    const data = snapshot.val();

    if (!data) return;

    const videoId = data.videoId || extractYoutubeId(data.url || "");

    if (data.actif && videoId) {

        /*
         * On ne relance le lecteur que si l'ID a changé,
         * pour éviter de couper la vidéo à chaque ecriture.
         */
        if (videoId !== lastVideoId) {
            lastVideoId = videoId;
            afficherDirect(videoId);
        }

    } else if (data.actif === false) {
        /* La régie a arrêté le direct */
        lastVideoId = null;
        masquerDirect(true);

    } else if (data.actif === undefined && videoId) {
        /* Compatibilité : un lien sans "actif" est considéré actif */
        if (videoId !== lastVideoId) {
            lastVideoId = videoId;
            afficherDirect(videoId);
        }
    }

}, (error) => {
    console.error("Firebase direct :", error);
});

</script>

</body>
</html>
