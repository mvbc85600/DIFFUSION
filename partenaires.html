 <!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nos Partenaires</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   FOND
===================================================== */

body {

    position: relative;

    background:

        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );

}


/* Halo central */

body::before {

    content: "";

    position: fixed;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    background:

        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );

    pointer-events: none;

    animation: halo 4s ease-in-out infinite;

}


/* =====================================================
   ANIMATION HALO
===================================================== */

@keyframes halo {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;

    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

}


/* =====================================================
   TITRE
===================================================== */

h1 {

    position: relative;

    z-index: 50;

    margin: 25px 0 0 0;

    text-align: center;

    font-size: 54px;

    font-weight: 900;

    letter-spacing: 7px;

    color: #ffcc00;

    text-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px rgba(255,204,0,0.8);

}


/* petite ligne sous le titre */

h1::after {

    content: "";

    display: block;

    width: 300px;

    height: 4px;

    margin: 15px auto 0;

    background: #ffcc00;

    border-radius: 10px;

    box-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00;

}


/* =====================================================
   CARROUSEL
===================================================== */

.carousel {

    position: relative;

    width: 100%;

    height: calc(100vh - 130px);

    min-height: 650px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

    perspective-origin: center center;

}


/* =====================================================
   LOGOS
===================================================== */

.carousel img {

    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    width: auto;
    height: auto;

    max-width: 800px;
    max-height: 600px;

    padding: 25px;

    object-fit: contain;

    background:

        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 3px solid rgba(255,204,0,0.85);

    border-radius: 24px;

    box-shadow:

        0 0 15px rgba(255,204,0,0.7),
        0 0 35px rgba(255,204,0,0.35);

    transition:

        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.center {

    transform:

        translate(-50%, -50%)
        translateZ(300px)
        scale(1.15);

    z-index: 20;

    opacity: 1;

    filter:

        brightness(1.15)
        contrast(1.08);

    border-color: #ffcc00;

    box-shadow:

        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);

    animation:

        centralGlow 2.5s ease-in-out infinite;

}


/* =====================================================
   GLOW LOGO CENTRAL
===================================================== */

@keyframes centralGlow {

    0% {

        box-shadow:

            0 0 20px #ffcc00,
            0 0 45px #ffcc00,
            0 0 80px rgba(255,204,0,0.6);

    }

    50% {

        box-shadow:

            0 0 30px #ffcc00,
            0 0 65px #ffcc00,
            0 0 120px rgba(255,204,0,0.9),
            0 0 170px rgba(255,204,0,0.35);

    }

    100% {

        box-shadow:

            0 0 20px #ffcc00,
            0 0 45px #ffcc00,
            0 0 80px rgba(255,204,0,0.6);

    }

}


/* =====================================================
   LOGO GAUCHE 1
===================================================== */

.left1 {

    transform:

        translate(-50%, -50%)
        translateX(-560px)
        translateZ(40px)
        scale(0.65);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   LOGO GAUCHE 2
===================================================== */

.left2 {

    transform:

        translate(-50%, -50%)
        translateX(-900px)
        translateZ(-250px)
        scale(0.43);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   LOGO DROITE 1
===================================================== */

.right1 {

    transform:

        translate(-50%, -50%)
        translateX(560px)
        translateZ(40px)
        scale(0.65);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   LOGO DROITE 2
===================================================== */

.right2 {

    transform:

        translate(-50%, -50%)
        translateX(900px)
        translateZ(-250px)
        scale(0.43);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   LOGOS CACHÉS
===================================================== */

.hidden {

    transform:

        translate(-50%, -50%)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    filter: blur(5px);

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   INDICATEUR PARTENAIRE
===================================================== */

.partner-counter {

    position: fixed;

    left: 50%;
    bottom: 25px;

    transform: translateX(-50%);

    z-index: 100;

    padding: 10px 25px;

    border: 2px solid rgba(255,204,0,0.8);

    border-radius: 30px;

    background: rgba(0,0,0,0.75);

    color: #ffcc00;

    font-size: 18px;

    font-weight: bold;

    letter-spacing: 3px;

    box-shadow:

        0 0 15px rgba(255,204,0,0.5);

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

.light-line {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform: translateX(-50%);

    width: 65%;

    height: 3px;

    background: #ffcc00;

    box-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;

    z-index: 90;

}


/* =====================================================
   ÉCRANS 1600PX ET MOINS
===================================================== */

@media (max-width: 1600px) {

    .carousel img {

        max-width: 700px;

        max-height: 520px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(250px)
            scale(1.05);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-470px)
            translateZ(30px)
            scale(0.58);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(470px)
            translateZ(30px)
            scale(0.58);

    }


    .left2 {

        transform:

            translate(-50%, -50%)
            translateX(-720px)
            translateZ(-200px)
            scale(0.38);

    }


    .right2 {

        transform:

            translate(-50%, -50%)
            translateX(720px)
            translateZ(-200px)
            scale(0.38);

    }

}


/* =====================================================
   ÉCRANS 1200PX ET MOINS
===================================================== */

@media (max-width: 1200px) {

    h1 {

        font-size: 42px;

    }


    .carousel {

        min-height: 550px;

    }


    .carousel img {

        max-width: 600px;

        max-height: 450px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(180px)
            scale(1);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-350px)
            translateZ(20px)
            scale(0.52);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(350px)
            translateZ(20px)
            scale(0.52);

    }


    .left2,
    .right2 {

        opacity: 0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    h1 {

        font-size: 28px;

        letter-spacing: 3px;

        margin-top: 20px;

    }


    h1::after {

        width: 180px;

        margin-top: 10px;

    }


    .carousel {

        height: calc(100vh - 120px);

        min-height: 400px;

    }


    .carousel img {

        max-width: 85vw;

        max-height: 400px;

        padding: 15px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            scale(0.95);

    }


    .left1 {

        transform:

            translate(-50%, -50%)

            scale(0.42);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(190px)
            scale(0.42);

    }


    .left2,
    .right2 {

        display: none;

    }


    .partner-counter {

        bottom: 15px;

        font-size: 14px;

        padding: 8px 18px;

    }

}

</style>

  <script>

window.onload = function () {

    const logos =
        document.querySelectorAll("#carousel img");

    const counter =
        document.getElementById("counter");

    let index = 0;

    const total = logos.length;


    if (!total) {

        console.log("Aucun logo trouvé");

        return;

    }


    function updateCarousel() {

        const center =
            index % total;

        const left1 =
            (index - 1 + total) % total;

        const left2 =
            (index - 2 + total) % total;

        const right1 =
            (index + 1) % total;

        const right2 =
            (index + 2) % total;


        /* Tous cachés */

        logos.forEach(function (logo) {

            logo.className = "hidden";

        });


        /* Positions */

        logos[center].className =
            "center";

        logos[left1].className =
            "left1";

        logos[left2].className =
            "left2";

        logos[right1].className =
            "right1";

        logos[right2].className =
            "right2";


        /* Compteur */

        if (counter) {

            counter.textContent =
                "PARTENAIRE " +
                (index + 1) +
                " / " +
                total;

        }

    }


    updateCarousel();


    /* Rotation */

    setInterval(function () {

        index =
            (index + 1) % total;

        updateCarousel();

    }, 2500);


};

</script>
