<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Nos Partenaires</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   FOND
===================================================== */

body {

    position: relative;

    background:
        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );

}


/* =====================================================
   HALO CENTRAL DU FOND
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );

    pointer-events: none;

    animation:
        halo 4s ease-in-out infinite;

}


/* =====================================================
   ANIMATION HALO FOND
===================================================== */

@keyframes halo {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }


    50% {

        transform:
            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;

    }


    100% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

}


/* =====================================================
   TITRE
===================================================== */

h1 {

    position: relative;

    z-index: 50;

    margin: 25px 0 0 0;

    text-align: center;

    font-size: 54px;

    font-weight: 900;

    letter-spacing: 7px;

    color: #fff;

    text-shadow:
        0 0 10px #fff,
        0 0 25px #fff,
        0 0 50px rgba(255,255,255,0.8);

}


h1::after {

    content: "";

    display: block;

    width: 300px;

    height: 4px;

    margin: 15px auto 0;

    background: #fff;

    border-radius: 10px;

    box-shadow:
        0 0 10px #fff,
        0 0 25px #fff;

}


/* =====================================================
   CARROUSEL
===================================================== */

.carousel {

    position: relative;

    width: 100%;

    height: calc(100vh - 130px);

    min-height: 650px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

}


/* =====================================================
   LOGOS
===================================================== */

.carousel img {

    position: absolute;

    left: 50%;
    top: 50%;

    width: auto;
    height: auto;

    max-width: 740px;
    max-height: 550px;

    padding: 22px;

    object-fit: contain;

    transform-origin: center center;

    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 4px solid;

    border-radius: 24px;

    transition:
        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.6s ease;

    will-change:
        transform,
        opacity;

}


/* =====================================================
   COULEURS DES CONTOURS
===================================================== */

.color-yellow {

    border-color: #ffcc00 !important;

}


.color-red {

    border-color: #ff2020 !important;

}


.color-blue {

    border-color: #168cff !important;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.center {

    transform:
        translate(-50%, -50%)
        translateZ(300px)
        scale(1.05);

    z-index: 20;

    opacity: 1;

    filter:
        brightness(1.15)
        contrast(1.08);

}


/* =====================================================
   HALO JAUNE
===================================================== */

.center.color-yellow {

    box-shadow:
        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);

}


/* =====================================================
   HALO ROUGE
===================================================== */

.center.color-red {

    box-shadow:
        0 0 20px #ff2020,
        0 0 45px #ff2020,
        0 0 90px rgba(255,32,32,0.85),
        0 0 140px rgba(255,32,32,0.35);

}


/* =====================================================
   HALO BLEU
===================================================== */

.center.color-blue {

    box-shadow:
        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 90px rgba(22,140,255,0.85),
        0 0 140px rgba(22,140,255,0.35);

}


/* =====================================================
   GAUCHE 1
===================================================== */

.left1 {

    transform:
        translate(-50%, -50%)
        translateX(-540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:
        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   GAUCHE 2
===================================================== */

.left2 {

    transform:
        translate(-50%, -50%)
        translateX(-860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:
        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   DROITE 1
===================================================== */

.right1 {

    transform:
        translate(-50%, -50%)
        translateX(540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:
        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   DROITE 2
===================================================== */

.right2 {

    transform:
        translate(-50%, -50%)
        translateX(860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:
        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   CACHÉ À GAUCHE
===================================================== */

.hidden-left {

    transform:
        translate(-50%, -50%)
        translateX(-1150px)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   CACHÉ À DROITE
===================================================== */

.hidden-right {

    transform:
        translate(-50%, -50%)
        translateX(1150px)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

.light-line {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform:
        translateX(-50%);

    width: 65%;

    height: 3px;

    background: #ffcc00;

    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;

    transition:
        background 0.8s ease,
        box-shadow 0.8s ease;

    z-index: 90;

}


/* =====================================================
   ADAPTATION 1600PX
===================================================== */

@media (max-width: 1600px) {

    .carousel img {

        max-width: 680px;
        max-height: 510px;

    }


    .center {

        transform:
            translate(-50%, -50%)
            translateZ(250px)
            scale(0.97);

    }


    .left1 {

        transform:
            translate(-50%, -50%)
            translateX(-450px)
            translateZ(30px)
            scale(0.55);

    }


    .right1 {

        transform:
            translate(-50%, -50%)
            translateX(450px)
            translateZ(30px)
            scale(0.55);

    }


    .left2 {

        transform:
            translate(-50%, -50%)
            translateX(-700px)
            translateZ(-200px)
            scale(0.36);

    }


    .right2 {

        transform:
            translate(-50%, -50%)
            translateX(700px)
            translateZ(-200px)
            scale(0.36);

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    h1 {

        font-size: 28px;
        letter-spacing: 3px;
        margin-top: 20px;

    }


    h1::after {

        width: 180px;
        margin-top: 10px;

    }


    .carousel {

        height: calc(100vh - 120px);
        min-height: 400px;

    }


    .carousel img {

        max-width: 85vw;
        max-height: 400px;
        padding: 15px;

    }


    .center {

        transform:
            translate(-50%, -50%)
            scale(0.87);

    }


    .left1 {

        transform:
            translate(-50%, -50%)
            translateX(-190px)
            scale(0.40);

    }


    .right1 {

        transform:
            translate(-50%, -50%)
            translateX(190px)
            scale(0.40);

    }


    .left2,
    .right2 {

        opacity: 0;

    }

}

</style>

</head>


<body>


<h1>
    🤝 NOS PARTENAIRES
</h1>


<div
    class="carousel"
    id="carousel">
</div>


<div
    class="light-line">
</div>


<script>

/* =====================================================
   CONFIGURATION GITHUB
===================================================== */

const GITHUB_API =
    "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";


/* =====================================================
   PARAMÈTRES
===================================================== */

const ROTATION_TIME =
    2500;


const TRANSITION_TIME =
    900;


/* =====================================================
   CACHE
===================================================== */

const LIST_CACHE_KEY =
    "partenairesGithubLogoListV2";


const LIST_CACHE_TIME_KEY =
    "partenairesGithubLogoListTimeV2";


const LIST_CACHE_DURATION =
    10 * 60 * 1000;


/* =====================================================
   VARIABLES
===================================================== */

let logoFiles =
    [];


let logos =
    [];


let total =
    0;


let index =
    0;


let interval =
    null;


/* =====================================================
   COULEURS
===================================================== */

const colors = [

    "color-yellow",
    "color-red",
    "color-blue"

];


/* =====================================================
   RÉCUPÉRATION DES LOGOS
===================================================== */

async function getLogoFiles() {

    try {

        const cachedList =
            localStorage.getItem(
                LIST_CACHE_KEY
            );


        const cachedTime =
            localStorage.getItem(
                LIST_CACHE_TIME_KEY
            );


        if (

            cachedList &&
            cachedTime &&

            (
                Date.now() -
                parseInt(cachedTime)
            )

            <
            LIST_CACHE_DURATION

        ) {

            const parsed =
                JSON.parse(
                    cachedList
                );


            if (

                Array.isArray(parsed) &&
                parsed.length > 0

            ) {

                return parsed;

            }

        }

    }

    catch (error) {

        console.warn(
            "Impossible de lire le cache."
        );

    }


    try {

        const response =
            await fetch(

                GITHUB_API,

                {
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(

                "Erreur GitHub : HTTP " +
                response.status

            );

        }


        const files =
            await response.json();


        const imageExtensions = [

            ".png",
            ".jpg",
            ".jpeg",
            ".webp",
            ".gif",
            ".avif",
            ".svg"

        ];


        const images =

            files

                .filter(

                    file => {

                        if (
                            file.type !== "file"
                        ) {

                            return false;

                        }


                        const name =
                            file.name.toLowerCase();


                        return

                            imageExtensions.some(

                                extension =>

                                    name.endsWith(
                                        extension
                                    )

                            );

                    }

                )

                .sort(

                    (a, b) =>

                        a.name.localeCompare(

                            b.name,

                            "fr",

                            {
                                numeric: true,
                                sensitivity: "base"
                            }

                        )

                )

                /*
                   IMPORTANT :
                   On conserve directement
                   l'URL download_url fournie
                   par GitHub.
                */

                .map(

                    file => ({

                        name:
                            file.name,

                        url:
                            file.download_url

                    })

                );


        localStorage.setItem(

            LIST_CACHE_KEY,

            JSON.stringify(
                images
            )

        );


        localStorage.setItem(

            LIST_CACHE_TIME_KEY,

            Date.now().toString()

        );


        return images;

    }

    catch (error) {

        console.error(
            "Impossible de récupérer les logos GitHub.",
            error
        );

        return [];

    }

}


/* =====================================================
   INDEX CIRCULAIRE
===================================================== */

function circularIndex(value) {

    return

        (
            (
                value % total
            )
            +
            total
        )
        %
        total;

}


/* =====================================================
   COULEUR
===================================================== */

function getColor(partnerIndex) {

    return

        colors[
            circularIndex(partnerIndex)
            %
            colors.length
        ];

}


/* =====================================================
   PRÉCHARGEMENT
===================================================== */

function preloadLogo(partnerIndex) {

    const realIndex =
        circularIndex(
            partnerIndex
        );


    if (!logoFiles[realIndex]) {

        return;

    }


    const image =
        new Image();


    image.src =
        logoFiles[realIndex].url;

}


function preloadNextLogos() {

    if (!total) {

        return;

    }


    for (

        let i = -4;

        i <= 6;

        i++

    ) {

        preloadLogo(
            index + i
        );

    }

}


/* =====================================================
   CRÉATION DES 7 ÉLÉMENTS
===================================================== */

function createImageElements() {

    const carousel =
        document.getElementById(
            "carousel"
        );


    for (

        let i = 0;

        i < 7;

        i++

    ) {

        const img =
            document.createElement(
                "img"
            );


        img.alt =
            "Partenaire";


        img.decoding =
            "async";


        img.loading =
            "eager";


        carousel.appendChild(
            img
        );


        logos.push(
            img
        );

    }

}


/* =====================================================
   CHARGEMENT D'UN LOGO
===================================================== */

function setLogo(

    element,

    partnerIndex,

    positionClass

) {

    const realIndex =
        circularIndex(
            partnerIndex
        );


    const logo =
        logoFiles[realIndex];


    if (!logo) {

        return;

    }


    if (

        element.dataset.file !==
        logo.name

    ) {

        element.dataset.file =
            logo.name;


        element.src =
            logo.url;

    }


    element.alt =
        "Partenaire";


    element.className =

        positionClass +

        " " +

        getColor(
            realIndex
        );

}


/* =====================================================
   INITIALISATION DU CARROUSEL
===================================================== */

function updateCarousel() {

    if (!total) {

        return;

    }


    setLogo(
        logos[0],
        index - 3,
        "hidden-left"
    );


    setLogo(
        logos[1],
        index - 2,
        "left2"
    );


    setLogo(
        logos[2],
        index - 1,
        "left1"
    );


    setLogo(
        logos[3],
        index,
        "center"
    );


    setLogo(
        logos[4],
        index + 1,
        "right1"
    );


    setLogo(
        logos[5],
        index + 2,
        "right2"
    );


    setLogo(
        logos[6],
        index + 3,
        "hidden-right"
    );


    updateLightLine();

    preloadNextLogos();

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

function updateLightLine() {

    const lightLine =
        document.querySelector(
            ".light-line"
        );


    const currentColor =
        getColor(
            index
        );


    const colorMap = {

        "color-yellow":
            "#ffcc00",

        "color-red":
            "#ff2020",

        "color-blue":
            "#168cff"

    };


    const color =
        colorMap[currentColor];


    lightLine.style.background =
        color;


    lightLine.style.boxShadow =

        "0 0 10px " + color + "," +

        "0 0 25px " + color + "," +

        "0 0 50px " + color;

}


/* =====================================================
   ROTATION AVEC DÉROULEMENT
===================================================== */

function rotateCarousel() {

    /*
       On avance simplement l'index.

       Les éléments restent les mêmes
       et les classes changent de position.
    */

    index =
        circularIndex(
            index + 1
        );


    updateCarousel();


    localStorage.setItem(
        "partenaireIndex",
        index
    );

}


/* =====================================================
   DÉMARRAGE
===================================================== */

function startCarousel() {

    if (interval) {

        clearInterval(
            interval
        );

    }


    interval =
        setInterval(

            rotateCarousel,

            ROTATION_TIME

        );

}


/* =====================================================
   INITIALISATION
===================================================== */

async function init() {

    console.log(
        "Chargement automatique des logos..."
    );


    logoFiles =
        await getLogoFiles();


    if (

        !logoFiles ||
        logoFiles.length === 0

    ) {

        console.error(
            "Aucun logo trouvé dans DIFFUSION/logo."
        );

        return;

    }


    total =
        logoFiles.length;


    console.log(
        total +
        " logos chargés."
    );


    const savedIndex =
        localStorage.getItem(
            "partenaireIndex"
        );


    if (

        savedIndex !== null &&
        !isNaN(
            parseInt(savedIndex)
        )

    ) {

        index =
            circularIndex(
                parseInt(savedIndex)
            );

    }


    createImageElements();


    updateCarousel();


    setTimeout(

        startCarousel,

        500

    );

}


/* =====================================================
   LANCEMENT
===================================================== */

if (

    document.readyState ===
    "loading"

) {

    document.addEventListener(

        "DOMContentLoaded",

        init

    );

}

else {

    init();

}

</script>


</body>

</html>
