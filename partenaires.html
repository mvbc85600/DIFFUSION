<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nos Partenaires</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   FOND
===================================================== */

body {

    position: relative;

    background:

        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );

}


/* =====================================================
   HALO CENTRAL DU FOND
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    background:

        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );

    pointer-events: none;

    animation: halo 4s ease-in-out infinite;

}


/* =====================================================
   ANIMATION HALO
===================================================== */

@keyframes halo {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;

    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

}


/* =====================================================
   TITRE
===================================================== */

h1 {

    position: relative;

    z-index: 50;

    margin: 25px 0 0 0;

    text-align: center;

    font-size: 54px;

    font-weight: 900;

    letter-spacing: 7px;

    color: #ffffff;

    text-shadow:

        0 0 10px #ffffff,
        0 0 25px #ffffff,
        0 0 50px rgba(255,255,255,0.8);

}


/* =====================================================
   LIGNE SOUS LE TITRE
===================================================== */

h1::after {

    content: "";

    display: block;

    width: 300px;

    height: 4px;

    margin: 15px auto 0;

    background: #ffffff;

    border-radius: 10px;

    box-shadow:

        0 0 10px #ffffff,
        0 0 25px #ffffff;

}


/* =====================================================
   CARROUSEL
===================================================== */

.carousel {

    position: relative;

    width: 100%;

    height: calc(100vh - 130px);

    min-height: 650px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

    perspective-origin: center center;

}


/* =====================================================
   LOGOS
===================================================== */

.carousel img {

    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    width: auto;
    height: auto;

    max-width: 740px;
    max-height: 550px;

    padding: 22px;

    object-fit: contain;

    background:

        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 4px solid;

    border-radius: 24px;

    transition:

        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.9s ease;

}


/* =====================================================
   COULEUR JAUNE
===================================================== */

.color-yellow {

    border-color: #ffcc00 !important;

}


/* =====================================================
   COULEUR ROUGE
===================================================== */

.color-red {

    border-color: #ff2020 !important;

}


/* =====================================================
   COULEUR BLEUE
===================================================== */

.color-blue {

    border-color: #168cff !important;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.center {

    transform:

        translate(-50%, -50%)
        translateZ(300px)
        scale(1.10);

    z-index: 20;

    opacity: 1;

    filter:

        brightness(1.15)
        contrast(1.08);

}


/* =====================================================
   HALO CENTRAL JAUNE
===================================================== */

.center.color-yellow {

    box-shadow:

        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);

}


/* =====================================================
   HALO CENTRAL ROUGE
===================================================== */

.center.color-red {

    box-shadow:

        0 0 20px #ff2020,
        0 0 45px #ff2020,
        0 0 90px rgba(255,32,32,0.85),
        0 0 140px rgba(255,32,32,0.35);

}


/* =====================================================
   HALO CENTRAL BLEU
===================================================== */

.center.color-blue {

    box-shadow:

        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 90px rgba(22,140,255,0.85),
        0 0 140px rgba(22,140,255,0.35);

}


/* =====================================================
   GAUCHE 1
===================================================== */

.left1 {

    transform:

        translate(-50%, -50%)
        translateX(-540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   GAUCHE 2
===================================================== */

.left2 {

    transform:

        translate(-50%, -50%)
        translateX(-860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   DROITE 1
===================================================== */

.right1 {

    transform:

        translate(-50%, -50%)
        translateX(540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   DROITE 2
===================================================== */

.right2 {

    transform:

        translate(-50%, -50%)
        translateX(860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   LOGOS CACHÉS
===================================================== */

.hidden {

    transform:

        translate(-50%, -50%)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    filter: blur(5px);

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

.light-line {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform: translateX(-50%);

    width: 65%;

    height: 3px;

    background: #ffcc00;

    box-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;

    z-index: 90;

}


/* =====================================================
   ÉCRANS 1600PX ET MOINS
===================================================== */

@media (max-width: 1600px) {

    .carousel img {

        max-width: 680px;

        max-height: 510px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(250px)
            scale(1.02);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-450px)
            translateZ(30px)
            scale(0.55);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(450px)
            translateZ(30px)
            scale(0.55);

    }


    .left2 {

        transform:

            translate(-50%, -50%)
            translateX(-700px)
            translateZ(-200px)
            scale(0.36);

    }


    .right2 {

        transform:

            translate(-50%, -50%)
            translateX(700px)
            translateZ(-200px)
            scale(0.36);

    }

}


/* =====================================================
   ÉCRANS 1200PX ET MOINS
===================================================== */

@media (max-width: 1200px) {

    h1 {

        font-size: 42px;

    }


    .carousel {

        min-height: 550px;

    }


    .carousel img {

        max-width: 570px;

        max-height: 430px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(180px)
            scale(0.98);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-330px)
            translateZ(20px)
            scale(0.48);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(330px)
            translateZ(20px)
            scale(0.48);

    }


    .left2,
    .right2 {

        opacity: 0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    h1 {

        font-size: 28px;

        letter-spacing: 3px;

        margin-top: 20px;

    }


    h1::after {

        width: 180px;

        margin-top: 10px;

    }


    .carousel {

        height: calc(100vh - 120px);

        min-height: 400px;

    }


    .carousel img {

        max-width: 85vw;

        max-height: 400px;

        padding: 15px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            scale(0.92);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-190px)
            scale(0.40);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(190px)
            scale(0.40);

    }


    .left2,
    .right2 {

        display: none;

    }

}

</style>

<script>

/* =====================================================
   CARROUSEL PARTENAIRES
===================================================== */

window.onload = function () {


    /* -------------------------------------------------
       RÉCUPÉRATION DES LOGOS
    ------------------------------------------------- */

    const logos =
        document.querySelectorAll(
            "#carousel img"
        );


    const total =
        logos.length;


    if (!total) {

        console.log(
            "Aucun logo trouvé"
        );

        return;

    }


    /* =================================================
       COULEURS

       JAUNE → ROUGE → BLEU
    ================================================= */

    const colors = [

        "color-yellow",

        "color-red",

        "color-blue"

    ];


    /* =================================================
       RÉCUPÉRATION DU DERNIER PARTENAIRE
    ================================================= */

    let savedIndex =
        localStorage.getItem(
            "partenaireIndex"
        );


    let index;


    if (
        savedIndex !== null &&
        !isNaN(
            parseInt(savedIndex)
        )
    ) {

        index =
            parseInt(
                savedIndex
            );

        index =
            index % total;

    }

    else {

        index = 0;

    }


    /* =================================================
       COULEUR DU PARTENAIRE
    ================================================= */

    function getColor(
        partnerIndex
    ) {

        return colors[
            partnerIndex %
            colors.length
        ];

    }


    /* =================================================
       MISE À JOUR DU CARROUSEL
    ================================================= */

    function updateCarousel() {


        /* ---------------------------------------------
           POSITIONS
        --------------------------------------------- */

        const center =
            index % total;


        const left1 =
            (
                index - 1 + total
            ) % total;


        const left2 =
            (
                index - 2 + total
            ) % total;


        const right1 =
            (
                index + 1
            ) % total;


        const right2 =
            (
                index + 2
            ) % total;


        /* ---------------------------------------------
           CACHER TOUS LES LOGOS
        --------------------------------------------- */

        logos.forEach(
            function (logo) {

                logo.className =
                    "hidden";

            }
        );


        /* ---------------------------------------------
           CENTRE
        --------------------------------------------- */

        logos[center].className =

            "center " +
            getColor(center);


        /* ---------------------------------------------
           GAUCHE 1
        --------------------------------------------- */

        logos[left1].className =

            "left1 " +
            getColor(left1);


        /* ---------------------------------------------
           GAUCHE 2
        --------------------------------------------- */

        logos[left2].className =

            "left2 " +
            getColor(left2);


        /* ---------------------------------------------
           DROITE 1
        --------------------------------------------- */

        logos[right1].className =

            "right1 " +
            getColor(right1);


        /* ---------------------------------------------
           DROITE 2
        --------------------------------------------- */

        logos[right2].className =

            "right2 " +
            getColor(right2);


        /* ---------------------------------------------
           BARRE LUMINEUSE
        --------------------------------------------- */

        const lightLine =
            document.querySelector(
                ".light-line"
            );


        if (lightLine) {


            const currentColor =
                getColor(index);


            if (
                currentColor ===
                "color-yellow"
            ) {

                lightLine.style.background =
                    "#ffcc00";

                lightLine.style.boxShadow =

                    "0 0 10px #ffcc00," +
                    "0 0 25px #ffcc00," +
                    "0 0 50px #ffcc00";

            }


            else if (
                currentColor ===
                "color-red"
            ) {

                lightLine.style.background =
                    "#ff2020";

                lightLine.style.boxShadow =

                    "0 0 10px #ff2020," +
                    "0 0 25px #ff2020," +
                    "0 0 50px #ff2020";

            }


            else {

                lightLine.style.background =
                    "#168cff";

                lightLine.style.boxShadow =

                    "0 0 10px #168cff," +
                    "0 0 25px #168cff," +
                    "0 0 50px #168cff";

            }

        }


        /* ---------------------------------------------
           SAUVEGARDE DU DERNIER PARTENAIRE
        --------------------------------------------- */

        localStorage.setItem(
            "partenaireIndex",
            index
        );

    }


    /* =================================================
       AFFICHAGE INITIAL
    ================================================= */

    updateCarousel();


    /* =================================================
       ROTATION AUTOMATIQUE

       2500 ms = 2,5 secondes
    ================================================= */

    setInterval(
        function () {

            index =
                (
                    index + 1
                ) % total;


            updateCarousel();

        },
        2500
    );


};

</script>
