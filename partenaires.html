<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nos Partenaires</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          #252000 0%,
          #100e00 35%,
          #050500 65%,
          #000 100%
        );
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* HALO CENTRAL DU FOND */
    body::before {
      content: "";
      position: fixed;
      width: 900px;
      height: 900px;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      background:
        radial-gradient(
          circle,
          rgba(255,204,0,0.20) 0%,
          rgba(255,204,0,0.08) 25%,
          rgba(255,204,0,0.02) 50%,
          transparent 70%
        );
      pointer-events: none;
      animation: halo 4s ease-in-out infinite;
    }

    @keyframes halo {
      0% {
        transform: translate(-50%, -50%) scale(0.90);
        opacity: 0.65;
      }
      50% {
        transform: translate(-50%, -50%) scale(1.10);
        opacity: 1;
      }
      100% {
        transform: translate(-50%, -50%) scale(0.90);
        opacity: 0.65;
      }
    }

    /* TITRE */
    h1 {
      position: relative;
      z-index: 50;
      margin: 25px 0 0 0;
      text-align: center;
      font-size: 54px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #ffffff;
      text-shadow:
        0 0 10px #ffffff,
        0 0 25px #ffffff,
        0 0 50px rgba(255,255,255,0.8);
    }

    h1::after {
      content: "";
      display: block;
      width: 300px;
      height: 4px;
      margin: 15px auto 0;
      background: #ffcc00;
      border-radius: 10px;
      box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00;
    }

    /* CARROUSEL */
    .carousel {
      position: relative;
      width: 80%;
      height: 260px;
      margin: 50px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    .carousel img {
      position: absolute;
      max-height: 200px;
      width: auto;
      max-width: 300px;
      padding: 10px;
      background: #111;
      border: 2px solid #ffcc00;
      border-radius: 12px;
      box-shadow:
        0 0 15px #ffcc00;
      transition:
        transform 0.6s ease,
        opacity 0.6s ease;
    }

    /* POSITIONS DES LOGOS */
    .center {
      transform: translateX(0) scale(1.4);
      z-index: 5;
      opacity: 1;
      box-shadow:
        0 0 20px #ffcc00,
        0 0 40px #ffcc00,
        0 0 60px #ffcc00 inset;
    }

    .left1 {
      transform: translateX(-180px) scale(0.9);
      opacity: 0.7;
      z-index: 4;
    }

    .left2 {
      transform: translateX(-340px) scale(0.6);
      opacity: 0.4;
      z-index: 3;
    }

    .right1 {
      transform: translateX(180px) scale(0.9);
      opacity: 0.7;
      z-index: 4;
    }

    .right2 {
      transform: translateX(340px) scale(0.6);
      opacity: 0.4;
      z-index: 3;
    }

    .hidden {
      opacity: 0;
      transform: scale(0.3);
      z-index: 1;
    }

    /* BARRE LUMINEUSE */
    .light-line {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 65%;
      height: 3px;
      background: #ffcc00;
      box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
      z-index: 90;
    }

    /* ADAPTATION ÉCRAN */
    @media (max-width: 1200px) {
      .left2, .right2 {
        opacity: 0;
      }
    }

    @media (max-width: 800px) {
      h1 {
        font-size: 32px;
        letter-spacing: 3px;
      }

      .carousel {
        height: 200px;
      }

      .left1 {
        transform: translateX(-120px) scale(0.8);
      }

      .right1 {
        transform: translateX(120px) scale(0.8);
      }

      .left2 {
        transform: translateX(-220px) scale(0.5);
      }

      .right2 {
        transform: translateX(220px) scale(0.5);
      }
    }

    @media (max-width: 500px) {
      .left2, .right2 {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- TITRE -->
  <h1>🤝 NOS PARTENAIRES</h1>

  <!-- CARROUSEL -->
  <div class="carousel" id="carousel"></div>

  <!-- BARRE LUMINEUSE -->
  <div class="light-line"></div>

  <script>
    /* =====================================================
       CONFIGURATION GITHUB
    ===================================================== */
    const GITHUB_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
    const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

    /* =====================================================
       PARAMÈTRES
    ===================================================== */
    const VISIBLE_LOGOS = 5; // centre, gauche1, gauche2, droite1, droite2
    const PRELOAD_AHEAD = 2;
    const ROTATION_TIME = 2500;

    /* Cache de la liste GitHub */
    const LIST_CACHE_KEY = "partenairesGithubLogoList";
    const LIST_CACHE_TIME_KEY = "partenairesGithubLogoListTime";
    const LIST_CACHE_DURATION = 10 * 60 * 1000; // 10 minutes

    /* =====================================================
       VARIABLES
    ===================================================== */
    let logoFiles = [];
    let logos = [];
    let total = 0;
    let index = 0;
    let interval = null;

    /* =====================================================
       RÉCUPÉRATION DE LA LISTE GITHUB
    ===================================================== */
    async function getLogoFiles() {
      try {
        const cachedList = localStorage.getItem(LIST_CACHE_KEY);
        const cachedTime = localStorage.getItem(LIST_CACHE_TIME_KEY);

        if (cachedList && cachedTime && (Date.now() - parseInt(cachedTime)) < LIST_CACHE_DURATION) {
          const parsed = JSON.parse(cachedList);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed;
          }
        }
      } catch (error) {
        console.warn("Impossible de lire le cache GitHub.", error);
      }

      try {
        const response = await fetch(GITHUB_API, { cache: "no-store" });
        if (!response.ok) throw new Error("Erreur GitHub : HTTP " + response.status);

        const files = await response.json();
        const imageExtensions = [".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif", ".svg"];

        const images = files
          .filter(file => file.type === "file")
          .filter(file => {
            const name = file.name.toLowerCase();
            return imageExtensions.some(extension => name.endsWith(extension));
          })
          .sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true, sensitivity: "base" }))
          .map(file => file.name);

        localStorage.setItem(LIST_CACHE_KEY, JSON.stringify(images));
        localStorage.setItem(LIST_CACHE_TIME_KEY, Date.now().toString());
        return images;
      } catch (error) {
        console.error("Impossible de récupérer les logos GitHub.", error);
        try {
          const oldCache = localStorage.getItem(LIST_CACHE_KEY);
          if (oldCache) {
            const parsed = JSON.parse(oldCache);
            if (Array.isArray(parsed) && parsed.length > 0) {
              console.warn("Utilisation du cache GitHub expiré.");
              return parsed;
            }
          }
        } catch (cacheError) {
          console.error("Cache indisponible.", cacheError);
        }
        return [];
      }
    }

    /* =====================================================
       CRÉATION DE L'URL DU LOGO
    ===================================================== */
    function getLogoURL(fileName) {
      return GITHUB_RAW_BASE + encodeURIComponent(fileName);
    }

    /* =====================================================
       PRÉCHARGEMENT D'UN LOGO
    ===================================================== */
    function preloadLogo(fileName) {
      if (!fileName) return;
      const image = new Image();
      try { image.fetchPriority = "low"; } catch (error) {}
      image.src = getLogoURL(fileName);
    }

    /* =====================================================
       PRÉCHARGEMENT INTELLIGENT
    ===================================================== */
    function preloadNextLogos() {
      if (!total) return;
      for (let i = 1; i <= PRELOAD_AHEAD; i++) {
        const nextIndex = (index + i) % total;
        preloadLogo(logoFiles[nextIndex]);
      }
      for (let i = 1; i <= 2; i++) {
        const previousIndex = (index - i + total) % total;
        preloadLogo(logoFiles[previousIndex]);
      }
    }

    /* =====================================================
       CRÉATION DES 5 ÉLÉMENTS IMAGE
    ===================================================== */
    function createImageElements() {
      const carousel = document.getElementById("carousel");
      for (let i = 0; i < VISIBLE_LOGOS; i++) {
        const img = document.createElement("img");
        img.alt = "Partenaire";
        img.decoding = "async";
        img.loading = "eager";
        img.onerror = function() {
          console.warn("Impossible de charger le logo :", this.dataset.file);
          this.style.opacity = "0";
        };
        carousel.appendChild(img);
        logos.push(img);
      }
    }

    /* =====================================================
       POSITION D'UN LOGO
    ===================================================== */
    function getPositionClass(position) {
      if (position === 0) return "center";
      if (position === -1) return "left1";
      if (position === -2) return "left2";
      if (position === 1) return "right1";
      if (position === 2) return "right2";
      return "hidden";
    }

    /* =====================================================
       INDEX CIRCULAIRE
    ===================================================== */
    function circularIndex(value) {
      return ((value % total) + total) % total;
    }

    /* =====================================================
       CHARGEMENT D'UN LOGO DANS UN ÉLÉMENT
    ===================================================== */
    function setLogo(element, partnerIndex, className) {
      if (!element || !logoFiles.length) return;

      const fileName = logoFiles[circularIndex(partnerIndex)];
      if (element.dataset.file !== fileName) {
        element.dataset.file = fileName;
        element.alt = "Partenaire " + (circularIndex(partnerIndex) + 1);
        element.src = getLogoURL(fileName);
      }
      element.className = className;
    }

    /* =====================================================
       MISE À JOUR DU CARROUSEL
    ===================================================== */
    function updateCarousel() {
      if (!total) return;

      const center = index;
      const left1 = index - 1;
      const left2 = index - 2;
      const right1 = index + 1;
      const right2 = index + 2;

      setLogo(logos[0], center, "center");
      setLogo(logos[1], left1, "left1");
      setLogo(logos[2], left2, "left2");
      setLogo(logos[3], right1, "right1");
      setLogo(logos[4], right2, "right2");

      localStorage.setItem("partenaireIndex", index);
      preloadNextLogos();
    }

    /* =====================================================
       ROTATION
    ===================================================== */
    function startCarousel() {
      if (interval) clearInterval(interval);
      interval = setInterval(function() {
        index = (index + 1) % total;
        updateCarousel();
      }, ROTATION_TIME);
    }

    /* =====================================================
       INITIALISATION
    ===================================================== */
    async function init() {
      console.log("Chargement automatique des logos GitHub...");
      logoFiles = await getLogoFiles();

      if (!logoFiles || !logoFiles.length) {
        console.error("Aucun logo trouvé dans le dossier GitHub /logo.");
        return;
      }

      total = logoFiles.length;
      console.log(total + " logos trouvés automatiquement.");

      createImageElements();

      const savedIndex = localStorage.getItem("partenaireIndex");
      if (savedIndex !== null && !isNaN(parseInt(savedIndex))) {
        index = parseInt(savedIndex);
        index = circularIndex(index);
      } else {
        index = 0;
      }

      updateCarousel();
      startCarousel();
    }

    /* =====================================================
       LANCEMENT
    ===================================================== */
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  </script>
</body>
</html>
