<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nos Partenaires</title>

<style>
/* =====================================================
   RESET
===================================================== */
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* =====================================================
   FOND
===================================================== */
body {
    position: relative;
    background:
        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );
}

/* =====================================================
   HALO CENTRAL DU FOND
===================================================== */
body::before {
    content: "";
    position: fixed;
    width: 900px;
    height: 900px;
    left: 50%;
    top: 52%;
    transform: translate(-50%, -50%);
    background:
        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );
    pointer-events: none;
    animation: halo 4s ease-in-out infinite;
}

/* =====================================================
   ANIMATION HALO
===================================================== */
@keyframes halo {
    0% {
        transform:
            translate(-50%, -50%)
            scale(0.90);
        opacity: 0.65;
    }
    50% {
        transform:
            translate(-50%, -50%)
            scale(1.10);
        opacity: 1;
    }
    100% {
        transform:
            translate(-50%, -50%)
            scale(0.90);
        opacity: 0.65;
    }
}

/* =====================================================
   TITRE
===================================================== */
h1 {
    position: relative;
    z-index: 50;
    margin: 25px 0 0 0;
    text-align: center;
    font-size: 54px;
    font-weight: 900;
    letter-spacing: 7px;
    color: #ffffff;
    text-shadow:
        0 0 10px #ffffff,
        0 0 25px #ffffff,
        0 0 50px rgba(255,255,255,0.8);
}

/* =====================================================
   LIGNE SOUS LE TITRE
===================================================== */
h1::after {
    content: "";
    display: block;
    width: 300px;
    height: 4px;
    margin: 15px auto 0;
    background: #ffffff;
    border-radius: 10px;
    box-shadow:
        0 0 10px #ffffff,
        0 0 25px #ffffff;
}

/* =====================================================
   CARROUSEL
===================================================== */
.carousel {
    position: relative;
    width: 100%;
    height: calc(100vh - 130px);
    min-height: 650px;
    margin: 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1800px;
    perspective-origin: center center;
}

/* =====================================================
   LOGOS
===================================================== */
.carousel img {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    width: auto;
    height: auto;
    max-width: 740px;
    max-height: 550px;
    padding: 22px;
    object-fit: contain;
    background:
        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );
    border: 4px solid;
    border-radius: 24px;
    transition:
        transform 1.2s cubic-bezier(0.25, 0.1, 0.25, 1),
        opacity 1.2s ease,
        filter 1.2s ease;
}

/* Désactive les transitions pendant la mise à jour */
.carousel img.no-transition {
    transition: none !important;
}

/* =====================================================
   COULEUR JAUNE
===================================================== */
.color-yellow {
    border-color: #ffcc00 !important;
}

/* =====================================================
   COULEUR ROUGE
===================================================== */
.color-red {
    border-color: #ff2020 !important;
}

/* =====================================================
   COULEUR BLEUE
===================================================== */
.color-blue {
    border-color: #168cff !important;
}

/* =====================================================
   LOGO CENTRAL
===================================================== */
.center {
    transform:
        translate(-50%, -50%)
        translateZ(300px)
        scale(1.10);
    z-index: 20;
    opacity: 1;
    filter:
        brightness(1.15)
        contrast(1.08);
}

/* =====================================================
   HALO CENTRAL JAUNE
===================================================== */
.center.color-yellow {
    box-shadow:
        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);
}

/* =====================================================
   HALO CENTRAL ROUGE
===================================================== */
.center.color-red {
    box-shadow:
        0 0 20px #ff2020,
        0 0 45px #ff2020,
        0 0 90px rgba(255,32,32,0.85),
        0 0 140px rgba(255,32,32,0.35);
}

/* =====================================================
   HALO CENTRAL BLEU
===================================================== */
.center.color-blue {
    box-shadow:
        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 90px rgba(22,140,255,0.85),
        0 0 140px rgba(22,140,255,0.35);
}

/* =====================================================
   GAUCHE 1
===================================================== */
.left1 {
    transform:
        translate(-50%, -50%)
        translateX(-540px)
        translateZ(40px)
        scale(0.62);
    z-index: 12;
    opacity: 0.75;
    filter:
        brightness(0.75)
        contrast(0.95);
}

/* =====================================================
   GAUCHE 2
===================================================== */
.left2 {
    transform:
        translate(-50%, -50%)
        translateX(-860px)
        translateZ(-250px)
        scale(0.41);
    z-index: 8;
    opacity: 0.38;
    filter:
        brightness(0.55)
        blur(0.3px);
}

/* =====================================================
   GAUCHE 3
===================================================== */
.left3 {
    transform:
        translate(-50%, -50%)
        translateX(-1100px)
        translateZ(-400px)
        scale(0.25);
    z-index: 4;
    opacity: 0.15;
    filter:
        brightness(0.40)
        blur(1px);
}

/* =====================================================
   DROITE 1
===================================================== */
.right1 {
    transform:
        translate(-50%, -50%)
        translateX(540px)
        translateZ(40px)
        scale(0.62);
    z-index: 12;
    opacity: 0.75;
    filter:
        brightness(0.75)
        contrast(0.95);
}

/* =====================================================
   DROITE 2
===================================================== */
.right2 {
    transform:
        translate(-50%, -50%)
        translateX(860px)
        translateZ(-250px)
        scale(0.41);
    z-index: 8;
    opacity: 0.38;
    filter:
        brightness(0.55)
        blur(0.3px);
}

/* =====================================================
   DROITE 3
===================================================== */
.right3 {
    transform:
        translate(-50%, -50%)
        translateX(1100px)
        translateZ(-400px)
        scale(0.25);
    z-index: 4;
    opacity: 0.15;
    filter:
        brightness(0.40)
        blur(1px);
}

/* =====================================================
   LOGOS CACHÉS
===================================================== */
.hidden {
    transform:
        translate(-50%, -50%)
        translateZ(-700px)
        scale(0.15);
    opacity: 0;
    filter: blur(5px);
    z-index: 1;
    pointer-events: none;
}

/* =====================================================
   BARRE LUMINEUSE
===================================================== */
.light-line {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    width: 65%;
    height: 3px;
    background: #ffcc00;
    box-shadow:
        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;
    z-index: 90;
}

/* =====================================================
   ÉCRANS 1600PX ET MOINS
===================================================== */
@media (max-width: 1600px) {
    .carousel img {
        max-width: 680px;
        max-height: 510px;
    }
    .center {
        transform:
            translate(-50%, -50%)
            translateZ(250px)
            scale(1.02);
    }
    .left1 {
        transform:
            translate(-50%, -50%)
            translateX(-450px)
            translateZ(30px)
            scale(0.55);
    }
    .right1 {
        transform:
            translate(-50%, -50%)
            translateX(450px)
            translateZ(30px)
            scale(0.55);
    }
    .left2 {
        transform:
            translate(-50%, -50%)
            translateX(-700px)
            translateZ(-200px)
            scale(0.36);
    }
    .right2 {
        transform:
            translate(-50%, -50%)
            translateX(700px)
            translateZ(-200px)
            scale(0.36);
    }
    .left3 {
        transform:
            translate(-50%, -50%)
            translateX(-900px)
            translateZ(-350px)
            scale(0.22);
    }
    .right3 {
        transform:
            translate(-50%, -50%)
            translateX(900px)
            translateZ(-350px)
            scale(0.22);
    }
}

/* =====================================================
   ÉCRANS 1200PX ET MOINS
===================================================== */
@media (max-width: 1200px) {
    h1 {
        font-size: 42px;
    }
    .carousel {
        min-height: 550px;
    }
    .carousel img {
        max-width: 570px;
        max-height: 430px;
    }
    .center {
        transform:
            translate(-50%, -50%)
            translateZ(180px)
            scale(0.98);
    }
    .left1 {
        transform:
            translate(-50%, -50%)
            translateX(-330px)
            translateZ(20px)
            scale(0.48);
    }
    .right1 {
        transform:
            translate(-50%, -50%)
            translateX(330px)
            translateZ(20px)
            scale(0.48);
    }
    .left2,
    .right2 {
        opacity: 0;
    }
    .left3,
    .right3 {
        display: none;
    }
}

/* =====================================================
   MOBILE
===================================================== */
@media (max-width: 700px) {
    h1 {
        font-size: 28px;
        letter-spacing: 3px;
        margin-top: 20px;
    }
    h1::after {
        width: 180px;
        margin-top: 10px;
    }
    .carousel {
        height: calc(100vh - 120px);
        min-height: 400px;
    }
    .carousel img {
        max-width: 85vw;
        max-height: 400px;
        padding: 15px;
    }
    .center {
        transform:
            translate(-50%, -50%)
            scale(0.92);
    }
    .left1 {
        transform:
            translate(-50%, -50%)
            translateX(-190px)
            scale(0.40);
    }
    .right1 {
        transform:
            translate(-50%, -50%)
            translateX(190px)
            scale(0.40);
    }
    .left2,
    .right2,
    .left3,
    .right3 {
        display: none;
    }
}
</style>
</head>

<body>
<!-- =====================================================
     TITRE
===================================================== -->
<h1>
    🤝 NOS PARTENAIRES
</h1>

<!-- =====================================================
     CARROUSEL
===================================================== -->
<div class="carousel" id="carousel"></div>

<!-- =====================================================
     BARRE LUMINEUSE
===================================================== -->
<div class="light-line"></div>

<script>
/* =====================================================
   CONFIGURATION GITHUB
===================================================== */
const GITHUB_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

/* =====================================================
   PARAMÈTRES
===================================================== */
const VISIBLE_LOGOS = 7; // 7 logos visibles (center + left1-3 + right1-3)
const PRELOAD_AHEAD = 4;
const ROTATION_TIME = 2500; // 2.5 secondes par rotation

/* Cache GitHub */
const LIST_CACHE_KEY = "partenairesGithubLogoList";
const LIST_CACHE_TIME_KEY = "partenairesGithubLogoListTime";
const LIST_CACHE_DURATION = 10 * 60 * 1000; // 10 minutes

/* =====================================================
   VARIABLES
===================================================== */
let logoFiles = [];
let logos = [];
let total = 0;
let index = 0;
let interval = null;

/* =====================================================
   COULEURS
===================================================== */
const colors = ["color-yellow", "color-red", "color-blue"];

/* =====================================================
   RÉCUPÉRATION DE LA LISTE GITHUB
===================================================== */
async function getLogoFiles() {
    try {
        const cachedList = localStorage.getItem(LIST_CACHE_KEY);
        const cachedTime = localStorage.getItem(LIST_CACHE_TIME_KEY);

        if (cachedList && cachedTime && (Date.now() - parseInt(cachedTime)) < LIST_CACHE_DURATION) {
            const parsed = JSON.parse(cachedList);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
        }
    } catch (error) {
        console.warn("Impossible de lire le cache GitHub.", error);
    }

    try {
        const response = await fetch(GITHUB_API, { cache: "no-store" });
        if (!response.ok) throw new Error("Erreur GitHub : HTTP " + response.status);

        const files = await response.json();
        const imageExtensions = [".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif", ".svg"];

        const images = files
            .filter(file => file.type === "file")
            .filter(file => {
                const name = file.name.toLowerCase();
                return imageExtensions.some(extension => name.endsWith(extension));
            })
            .sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true, sensitivity: "base" }))
            .map(file => file.name);

        localStorage.setItem(LIST_CACHE_KEY, JSON.stringify(images));
        localStorage.setItem(LIST_CACHE_TIME_KEY, Date.now().toString());
        return images;
    } catch (error) {
        console.error("Impossible de récupérer les logos GitHub.", error);
        try {
            const oldCache = localStorage.getItem(LIST_CACHE_KEY);
            if (oldCache) {
                const parsed = JSON.parse(oldCache);
                if (Array.isArray(parsed) && parsed.length > 0) {
                    console.warn("Utilisation du cache GitHub expiré.");
                    return parsed;
                }
            }
        } catch (cacheError) {
            console.error("Cache indisponible.", cacheError);
        }
        return [];
    }
}

/* =====================================================
   CRÉATION DE L'URL DU LOGO
===================================================== */
function getLogoURL(fileName) {
    return GITHUB_RAW_BASE + encodeURIComponent(fileName);
}

/* =====================================================
   PRÉCHARGEMENT D'UN LOGO
===================================================== */
function preloadLogo(fileName) {
    if (!fileName) return;
    const image = new Image();
    try { image.fetchPriority = "low"; } catch (error) {}
    image.src = getLogoURL(fileName);
}

/* =====================================================
   PRÉCHARGEMENT INTELLIGENT
===================================================== */
function preloadNextLogos() {
    if (!total) return;
    for (let i = 1; i <= PRELOAD_AHEAD; i++) {
        const nextIndex = (index + i) % total;
        preloadLogo(logoFiles[nextIndex]);
    }
    for (let i = 1; i <= 2; i++) {
        const previousIndex = (index - i + total) % total;
        preloadLogo(logoFiles[previousIndex]);
    }
}

/* =====================================================
   CRÉATION DES ÉLÉMENTS IMAGE
===================================================== */
function createImageElements() {
    const carousel = document.getElementById("carousel");
    for (let i = 0; i < VISIBLE_LOGOS; i++) {
        const img = document.createElement("img");
        img.alt = "Partenaire";
        img.decoding = "async";
        img.loading = "eager";
        img.onerror = function() {
            console.warn("Impossible de charger le logo :", this.dataset.file);
            this.style.opacity = "0";
        };
        carousel.appendChild(img);
        logos.push(img);
    }
}

/* =====================================================
   COULEUR DU PARTENAIRE
===================================================== */
function getColor(partnerIndex) {
    return colors[partnerIndex % colors.length];
}

/* =====================================================
   INDEX CIRCULAIRE
===================================================== */
function circularIndex(value) {
    return ((value % total) + total) % total;
}

/* =====================================================
   CHARGEMENT D'UN LOGO DANS UN ÉLÉMENT
===================================================== */
function setLogo(element, partnerIndex, className) {
    if (!element || !logoFiles.length) return;

    const fileName = logoFiles[circularIndex(partnerIndex)];
    if (element.dataset.file !== fileName) {
        element.dataset.file = fileName;
        element.alt = `Partenaire ${circularIndex(partnerIndex) + 1}`;
        element.src = getLogoURL(fileName);
    }
    element.className = `${className} ${getColor(circularIndex(partnerIndex))}`;
}

/* =====================================================
   MISE À JOUR DE LA BARRE LUMINEUSE
===================================================== */
function updateLightLine() {
    const lightLine = document.querySelector(".light-line");
    if (!lightLine) return;

    const currentColor = getColor(index);
    if (currentColor === "color-yellow") {
        lightLine.style.background = "#ffcc00";
        lightLine.style.boxShadow = "0 0 10px #ffcc00, 0 0 25px #ffcc00, 0 0 50px #ffcc00";
    } else if (currentColor === "color-red") {
        lightLine.style.background = "#ff2020";
        lightLine.style.boxShadow = "0 0 10px #ff2020, 0 0 25px #ff2020, 0 0 50px #ff2020";
    } else {
        lightLine.style.background = "#168cff";
        lightLine.style.boxShadow = "0 0 10px #168cff, 0 0 25px #168cff, 0 0 50px #168cff";
    }
}

/* =====================================================
   MISE À JOUR DU CARROUSEL AVEC EFFET DE GLISSEMENT
===================================================== */
function updateCarousel() {
    if (!total) return;

    // Désactive les transitions pendant la mise à jour
    logos.forEach(img => {
        img.classList.add("no-transition");
    });

    // Positions des 7 logos visibles
    const positions = [
        { index: index - 3, class: "left3" },
        { index: index - 2, class: "left2" },
        { index: index - 1, class: "left1" },
        { index: index, class: "center" },
        { index: index + 1, class: "right1" },
        { index: index + 2, class: "right2" },
        { index: index + 3, class: "right3" }
    ];

    // Met à jour chaque logo
    positions.forEach((pos, i) => {
        const logo = logos[i];
        setLogo(logo, pos.index, pos.class);
    });

    // Réactive les transitions après un court délai
    setTimeout(() => {
        logos.forEach(img => {
            img.classList.remove("no-transition");
        });
    }, 50);

    // Met à jour la barre lumineuse
    updateLightLine();

    // Sauvegarde la position
    localStorage.setItem("partenaireIndex", index);

    // Précharge les logos suivants
    preloadNextLogos();
}

/* =====================================================
   ROTATION AVEC EFFET DE DÉFILEMENT
===================================================== */
function startCarousel() {
    if (interval) {
        clearInterval(interval);
    }
    interval = setInterval(() => {
        index = (index + 1) % total;
        updateCarousel();
    }, ROTATION_TIME);
}

/* =====================================================
   INITIALISATION
===================================================== */
async function init() {
    console.log("Chargement automatique des logos GitHub...");
    logoFiles = await getLogoFiles();

    if (!logoFiles || !logoFiles.length) {
        console.error("Aucun logo trouvé dans le dossier GitHub /logo.");
        return;
    }

    total = logoFiles.length;
    console.log(total + " logos trouvés automatiquement.");

    createImageElements();

    const savedIndex = localStorage.getItem("partenaireIndex");
    if (savedIndex !== null && !isNaN(parseInt(savedIndex))) {
        index = parseInt(savedIndex);
        index = circularIndex(index);
    } else {
        index = 0;
    }

    updateCarousel();
    startCarousel();
}

/* =====================================================
   LANCEMENT
===================================================== */
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
} else {
    init();
}
</script>
</body>
</html>
