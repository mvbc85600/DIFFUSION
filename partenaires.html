<!DOCTYPE html>

  <title>Partenaires</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #000;

      color: #fff;

      font-family: Arial, sans-serif;

    }


    /* =================================
       TITRE
       ================================= */

    h1 {

      text-align: center;

      font-size: 50px;

      margin-top: 40px;

      letter-spacing: 4px;

      color: #ffcc00;

      text-shadow:
        0 0 15px #ffcc00;

    }


    /* =================================
       CARROUSEL
       ================================= */

    .carousel {

      position: relative;

      width: 90%;

      margin: 70px auto;

      height: 380px;

      display: flex;

      justify-content: center;

      align-items: center;

      perspective: 1200px;

    }


    /* =================================
       LOGOS
       ================================= */

    .carousel img {

      position: absolute;

      max-height: 320px;

      width: auto;

      max-width: 450px;

      padding: 15px;

      background: #111;

      border: 2px solid #ffcc00;

      border-radius: 14px;

      box-shadow:
        0 0 15px #ffcc00;

      object-fit: contain;

      transition:
        transform 0.6s ease,
        opacity 0.6s ease;

    }


    /* =================================
       LOGO CENTRAL
       ================================= */

    .center {

      transform:
        translateX(0)
        scale(1.5);

      z-index: 5;

      opacity: 1;

      box-shadow:
        0 0 20px #ffcc00,
        0 0 40px #ffcc00,
        0 0 60px #ffcc00 inset;

    }


    /* =================================
       GAUCHE
       ================================= */

    .left1 {

      transform:
        translateX(-260px)
        scale(1);

      opacity: 0.75;

      z-index: 4;

    }


    .left2 {

      transform:
        translateX(-470px)
        scale(0.75);

      opacity: 0.45;

      z-index: 3;

    }


    /* =================================
       DROITE
       ================================= */

    .right1 {

      transform:
        translateX(260px)
        scale(1);

      opacity: 0.75;

      z-index: 4;

    }


    .right2 {

      transform:
        translateX(470px)
        scale(0.75);

      opacity: 0.45;

      z-index: 3;

    }


    /* =================================
       CACHÉS
       ================================= */

    .hidden {

      opacity: 0;

      transform:
        scale(0.3);

      z-index: 1;

    }


    /* =================================
       ADAPTATION ÉCRAN
       ================================= */

    @media (max-width: 1000px) {

      h1 {

        font-size: 40px;

      }


      .carousel img {

        max-height: 260px;

        max-width: 360px;

      }


      .left1 {

        transform:
          translateX(-190px)
          scale(0.85);

      }


      .right1 {

        transform:
          translateX(190px)
          scale(0.85);

      }


      .left2 {

        transform:
          translateX(-330px)
          scale(0.65);

      }


      .right2 {

        transform:
          translateX(330px)
          scale(0.65);

      }


      .center {

        transform:
          translateX(0)
          scale(1.3);

      }

    }


    /* =================================
       PETITS ÉCRANS
       ================================= */

    @media (max-width: 700px) {

      h1 {

        font-size: 30px;

        margin-top: 25px;

      }


      .carousel {

        width: 100%;

        margin-top: 50px;

      }


      .carousel img {

        max-height: 220px;

        max-width: 300px;

      }


      .left1 {

        transform:
          translateX(-130px)
          scale(0.75);

      }


      .right1 {

        transform:
          translateX(130px)
          scale(0.75);

      }


      .left2 {

        transform:
          translateX(-220px)
          scale(0.55);

      }


      .right2 {

        transform:
          translateX(220px)
          scale(0.55);

      }


      .center {

        transform:
          translateX(0)
          scale(1.2);

      }

    }

  </style>

</head>

  <script>

    window.onload = function () {

      const logos =
        document.querySelectorAll(
          "#carousel img"
        );

      let index = 0;


      if (
        !logos ||
        logos.length === 0
      ) {

        console.log(
          "Aucun logo trouvé"
        );

        return;

      }


      function updateCarousel() {

        const total =
          logos.length;


        for (
          let i = 0;
          i < total;
          i++
        ) {

          logos[i].className =
            "hidden";

        }


        const center =
          index % total;


        const left1 =
          (index - 1 + total) % total;


        const left2 =
          (index - 2 + total) % total;


        const right1 =
          (index + 1) % total;


        const right2 =
          (index + 2) % total;


        logos[center].className =
          "center";


        logos[left1].className =
          "left1";


        logos[left2].className =
          "left2";


        logos[right1].className =
          "right1";


        logos[right2].className =
          "right2";

      }


      updateCarousel();


      setInterval(

        function () {

          index =
            (index + 1)
            % logos.length;

          updateCarousel();

        },

        2500

      );

    };

  </script>
