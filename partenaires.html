<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    overflow: hidden !important;

    overscroll-behavior: none;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   FOND
===================================================== */

body {

    position: relative;

    background:

        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );

}


/* =====================================================
   HALO CENTRAL DU FOND
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: min(900px, 90vw);
    height: min(900px, 90vw);

    left: 50%;
    top: 52%;

    transform: translate(-50%, -50%);

    background:

        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );

    pointer-events: none;

    animation: halo 4s ease-in-out infinite;

}


/* =====================================================
   ANIMATION HALO
===================================================== */

@keyframes halo {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;

    }

    100% {

}


/* =====================================================
   TITRE
===================================================== */

h1 {

    position: relative;

    z-index: 50;

    width: 100%;

    margin: clamp(14px, 2vh, 25px) 0 0;

    padding: 0 10px;

    text-align: center;

    font-size: clamp(

/* =====================================================
   ICÔNE DU TITRE
===================================================== */

.title-icon {

        "Segoe UI Emoji",
        "Apple Color Emoji",

    margin-right: 8px;

/* =====================================================
   LIGNE SOUS LE TITRE
===================================================== */

h1::after {

    content: "";

    display: block;

    width: min(
        300px,
        45vw
    );

    height: 3px;

    margin: clamp(8px, 1.2vh, 15px) auto 0;

    background: #ffffff;

    border-radius: 10px;

    box-shadow:

        0 0 10px #ffffff,

        0 0 25px #ffffff;

}


/* =====================================================
   CARROUSEL
===================================================== */

.carousel {

    position: relative;

    width: 100%;
    max-width: 100vw;

    height: calc(100vh - 120px);

    min-height: 0;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

    perspective-origin: center center;

    overflow: hidden;

}


/* =====================================================
   LOGOS
===================================================== */

.carousel img {

    position: absolute;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    width: auto;
    height: auto;

    max-width: min(
        740px,
        68vw
    );

    max-height: min(
        495px,
        55vh
    );

    padding: clamp(
        12px,
        1.2vw,
        22px

            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 4px solid;

    border-radius: 24px;

    transition:

        transform 0.9s
        cubic-bezier(.22,.61,.36,1),

        opacity 0.9s ease,

        filter 0.9s ease,

        box-shadow 0.9s ease,

        border-color 0.9s ease;

    will-change:
        transform,
        opacity;

}


/* =====================================================
   COULEUR JAUNE
===================================================== */

/* =====================================================
   COULEUR ROUGE

/* =====================================================

===================================================== */

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =====================================================
   CONFIGURATION FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",

    authDomain:
        "diffusion-b9afa.firebaseapp.com",

    databaseURL:
        "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "diffusion-b9afa",

    storageBucket:
        "diffusion-b9afa.firebasestorage.app",

    messagingSenderId:
        "674799570797",

    appId:
        "1:674799570797:web:0d8b7a2a892f604eb7d464"

};


const app =
    initializeApp(firebaseConfig);


const db =
    getDatabase(app);


const partnerDurationsRef =
    ref(
        db,
        "partnerDurations"
    );


/* =====================================================
   CONFIGURATION GITHUB
===================================================== */

const GITHUB_API =
    "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";


const GITHUB_RAW_BASE =
    "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";


/* =====================================================
   PARAMÈTRES
===================================================== */

let partnerDurationsData = {

    defaultDuration:
        2500,

    durations: {}

};


/* =====================================================
   DURÉE D'UN LOGO
===================================================== */

function getPartnerDuration(
    fileName
) {

    const partnerName =
        fileName.replace(
            /\.[^/.]+$/,
            ""
        );


    const specificDuration =
        partnerDurationsData
            .durations[
                partnerName
            ];


    if (
        specificDuration &&
        specificDuration > 0
    ) {

        return specificDuration;

    }


    return

        partnerDurationsData
            .defaultDuration > 0

            ?

        partnerDurationsData
            .defaultDuration

            :

        2500;

}


/* =====================================================
   CACHE GITHUB
===================================================== */

const LIST_CACHE_KEY =
    "partenairesGithubLogoList";


const LIST_CACHE_TIME_KEY =
    "partenairesGithubLogoListTime";


const LIST_CACHE_DURATION =
    10 * 60 * 1000;


/* =====================================================
   VARIABLES
===================================================== */

let logoFiles = [];

let logos = [];

let index = 0;

let interval = null;

let carouselStarted = false;


/* =====================================================
   COULEURS
===================================================== */

const colors = [

    "color-yellow",

    "color-red",

    "color-blue"

];


/* =====================================================
   RÉCUPÉRATION DE LA LISTE GITHUB
===================================================== */

async function getLogoFiles() {

    try {

        const cachedList =
            localStorage.getItem(
                LIST_CACHE_KEY
            );


        const cachedTime =
            localStorage.getItem(
                LIST_CACHE_TIME_KEY
            );


        if (

            cachedList &&

            cachedTime &&

            (

                Date.now() -

                parseInt(
                    cachedTime
                )

            ) < LIST_CACHE_DURATION

        ) {

            const parsed =
                JSON.parse(
                    cachedList
                );


            if (

                Array.isArray(parsed) &&

                parsed.length > 0

            ) {

                return parsed;

            }

        }

    }

    catch (error) {

        console.warn(
            "Impossible de lire le cache GitHub.",
            error
        );

    }


    try {

        const response =
            await fetch(

                GITHUB_API,

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(

                "Erreur GitHub : HTTP " +

                response.status

            );

        }


        const files =
            await response.json();


        const imageExtensions = [

            ".png",

            ".jpg",

            ".jpeg",

            ".webp",

            ".gif",

            ".avif",

            ".svg"

        ];


        const images =

            files

                .filter(
                    file => {

                        if (
                            file.type !==
                            "file"
                        ) {

                            return false;

                        }


                        const name =
                            file.name
                                .toLowerCase();


                        return

                            imageExtensions.some(

                                extension =>

                                    name.endsWith(
                                        extension
                                    )

                            );

                    }

                )

                .sort(

                    (a, b) =>

                        a.name.localeCompare(

                            b.name,

                            "fr",

                            {

                                numeric:
                                    true,

                                sensitivity:
                                    "base"

                            }

                        )

                )

                .map(

                    file =>
                        file.name

                );


        localStorage.setItem(

            LIST_CACHE_KEY,

            JSON.stringify(
                images
            )

        );


        localStorage.setItem(

            LIST_CACHE_TIME_KEY,

            Date.now().toString()

        );


        return images;

    }


    catch (error) {

        console.error(

            "Impossible de récupérer les logos GitHub.",

            error

        );


        try {

            const oldCache =
                localStorage.getItem(
                    LIST_CACHE_KEY
                );


            if (oldCache) {

                const parsed =
                    JSON.parse(
                        oldCache
                    );


                if (

                    Array.isArray(parsed) &&

                    parsed.length > 0

                ) {

                    console.warn(
                        "Utilisation du cache GitHub."
                    );


                    return parsed;

                }

            }

        }

        catch (cacheError) {

            console.error(

                "Cache indisponible.",

                cacheError

            );

        }


        return [];

    }

}


/* =====================================================
   URL LOGO
===================================================== */

function getLogoURL(
    fileName
) {

    return (

        GITHUB_RAW_BASE +

        encodeURIComponent(
            fileName
        )

    );

}


/* =====================================================
   COULEUR LOGO
===================================================== */

function getColor(
    logoIndex
) {

    return colors[

        logoIndex %

        colors.length

    ];

}


/* =====================================================
   CRÉATION DES LOGOS
===================================================== */

function createAllLogos() {

    const carousel =
        document.getElementById(
            "carousel"
        );


    logoFiles.forEach(

        function (
            fileName,
            fileIndex
        ) {


            const img =
                document.createElement(
                    "img"
                );


            img.alt =
                "Partenaire";


            img.decoding =
                "async";


            img.className =

                "hidden " +

                getColor(
                    fileIndex
                );


            img.src =
                getLogoURL(
                    fileName
                );


            img.onerror =

                function () {

                    console.warn(

                        "Impossible de charger :",

                        fileName

                    );

                };


            carousel.appendChild(
                img
            );


            logos.push(
                img
            );

        }

    );

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

function updateLightLine() {

    const lightLine =
        document.querySelector(
            ".light-line"
        );


    if (!lightLine) {

        return;

    }


    const currentColor =
        getColor(
            index
        );


    let color;


    if (

        currentColor ===
        "color-yellow"

    ) {

        color =
            "#ffcc00";

    }

    else if (

        currentColor ===
        "color-red"

    ) {

        color =
            "#ff2020";

    }

    else {

        color =
            "#168cff";

    }


    lightLine.style.background =
        color;


    lightLine.style.boxShadow =

        "0 0 10px " + color +

        "," +

        "0 0 25px " + color +

        "," +

        "0 0 50px " + color;

}


/* =====================================================
   MISE À JOUR CARROUSEL
===================================================== */

function updateCarousel() {

    const total =
        logos.length;


    if (
        total === 0
    ) {

        return;

    }


    /* Tous cachés */

    for (

        let i = 0;

        i < total;

        i++

    ) {

        logos[i].className =

            "hidden " +

            getColor(i);

    }


    /* Positions */

    const center =
        index % total;


    const left1 =

        (
            index -
            1 +
            total
        ) % total;


    const left2 =

        (
            index -
            2 +
            total
        ) % total;


    const right1 =

        (
            index +
            1
        ) % total;


    const right2 =

        (
            index +
            2
        ) % total;


    /* Centre */

    logos[center].className =

        "center " +

        getColor(center);


    /* Gauche 1 */

    logos[left1].className =

        "left1 " +

        getColor(left1);


    /* Gauche 2 */

    logos[left2].className =

        "left2 " +

        getColor(left2);


    /* Droite 1 */

    logos[right1].className =

        "right1 " +

        getColor(right1);


    /* Droite 2 */

    logos[right2].className =

        "right2 " +

        getColor(right2);


    /* Barre */

    updateLightLine();


    /* Sauvegarde */

    localStorage.setItem(

        "partenaireIndex",

        index

    );

}


/* =====================================================
   ROTATION
===================================================== */

function rotateCarousel() {

    if (
        logos.length === 0
    ) {

        return;

    }


    index =

        (

            index + 1

        ) %

        logos.length;


    updateCarousel();

}


/* =====================================================
   DÉMARRAGE
===================================================== */

function startCarousel() {

    if (interval) {

        clearTimeout(
            interval
        );

        interval = null;

    }


    if (

        !carouselStarted ||

        logos.length === 0

    ) {

        return;

    }


    const currentFileName =

        logoFiles[

            index %
            logoFiles.length

        ];


    const duration =

        getPartnerDuration(
            currentFileName
        );


    interval =

        setTimeout(

            () => {

                rotateCarousel();

                startCarousel();

            },

            duration

        );

}


/* =====================================================
   FIREBASE - DURÉES
===================================================== */

onValue(

    partnerDurationsRef,

    snapshot => {


        const data =
            snapshot.val() || {};


        partnerDurationsData = {

            defaultDuration:

                Number(
                    data.defaultDuration
                ) > 0

                    ?

                Number(
                    data.defaultDuration
                )

                    :

                2500,


            durations:

                data.durations || {}

        };


        if (
            carouselStarted
        ) {

            startCarousel();

        }

    }

);


/* =====================================================
   INITIALISATION
===================================================== */

async function init() {


    console.log(
        "Chargement automatique des logos GitHub..."
    );


    /* Récupération */

    logoFiles =
        await getLogoFiles();


    /* Vérification */

    if (

        !logoFiles ||

        logoFiles.length === 0

    ) {

        console.error(

            "Aucun logo trouvé dans le dossier GitHub /logo."

        );

        return;

    }


    console.log(

        logoFiles.length +

        " logos trouvés automatiquement."

    );


    /* Création */

    createAllLogos();


    /* Position sauvegardée */

    const savedIndex =

        localStorage.getItem(
            "partenaireIndex"
        );


    if (

        savedIndex !== null &&

        !isNaN(

            parseInt(
                savedIndex
            )

        )

    ) {

        index =

            parseInt(
                savedIndex
            );


        index =

            (

                index %

                logos.length +

                logos.length

            ) %

            logos.length;

    }

    else {

        index = 0;

    }


    /* Affichage */

    updateCarousel();


    /* Démarrage */

    carouselStarted = true;

    startCarousel();

}


/* =====================================================
   LANCEMENT
===================================================== */

if (

    document.readyState ===
    "loading"

) {

    document.addEventListener(

        "DOMContentLoaded",

        init

    );

}

else {

    init();

}


</script>
