  <style>

* {
  box-sizing: border-box;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #000;
  color: #fff;

  font-family: Arial, sans-serif;
}


/* =================================
   TITRE
================================= */

h1 {

  text-align: center;

  font-size: 50px;

  margin-top: 30px;
  margin-bottom: 20px;

  letter-spacing: 4px;

  color: #ffcc00;

  text-shadow:
    0 0 15px #ffcc00,
    0 0 30px #ffcc00;

}


/* =================================
   CARROUSEL XXL
================================= */

.carousel {

  position: relative;

  width: 100%;

  height: 650px;

  margin: 20px auto 0;

  display: flex;

  justify-content: center;

  align-items: center;

  perspective: 1600px;

}


/* =================================
   LOGOS XXL
================================= */

.carousel img {

  position: absolute;

  width: auto;

  height: auto;

  max-height: 600px;

  max-width: 800px;

  padding: 20px;

  background: #111;

  border: 3px solid #ffcc00;

  border-radius: 18px;

  object-fit: contain;

  box-shadow:
    0 0 20px #ffcc00,
    0 0 40px rgba(255, 204, 0, 0.35);

  transition:
    transform 0.7s ease,
    opacity 0.7s ease,
    box-shadow 0.7s ease;

}


/* =================================
   LOGO CENTRAL
================================= */

.center {

  transform:
    translateX(0)
    scale(1.15);

  z-index: 10;

  opacity: 1;

  box-shadow:
    0 0 25px #ffcc00,
    0 0 50px #ffcc00,
    0 0 90px rgba(255, 204, 0, 0.5),
    0 0 100px #ffcc00 inset;

}


/* =================================
   GAUCHE 1
================================= */

.left1 {

  transform:
    translateX(-520px)
    scale(0.65);

  opacity: 0.75;

  z-index: 6;

}


/* =================================
   GAUCHE 2
================================= */

.left2 {

  transform:
    translateX(-850px)
    scale(0.45);

  opacity: 0.4;

  z-index: 4;

}


/* =================================
   DROITE 1
================================= */

.right1 {

  transform:
    translateX(520px)
    scale(0.65);

  opacity: 0.75;

  z-index: 6;

}


/* =================================
   DROITE 2
================================= */

.right2 {

  transform:
    translateX(850px)
    scale(0.45);

  opacity: 0.4;

  z-index: 4;

}


/* =================================
   LOGOS CACHÉS
================================= */

.hidden {

  opacity: 0;

  transform:
    translateX(0)
    scale(0.2);

  z-index: 1;

}


/* =================================
   ÉCRANS MOYENS
================================= */

@media (max-width: 1400px) {

  h1 {

    font-size: 44px;

  }


  .carousel {

    height: 600px;

  }


  .carousel img {

    max-height: 520px;

    max-width: 700px;

  }


  .center {

    transform:
      translateX(0)
      scale(1.1);

  }


  .left1 {

    transform:
      translateX(-420px)
      scale(0.6);

  }


  .right1 {

    transform:
      translateX(420px)
      scale(0.6);

  }


  .left2 {

    transform:
      translateX(-680px)
      scale(0.4);

  }


  .right2 {

    transform:
      translateX(680px)
      scale(0.4);

  }

}


/* =================================
   TABLETTES / PETITS ÉCRANS
================================= */

@media (max-width: 900px) {

  h1 {

    font-size: 35px;

    margin-top: 20px;

  }


  .carousel {

    height: 500px;

  }


  .carousel img {

    max-height: 420px;

    max-width: 550px;

  }


  .center {

    transform:
      translateX(0)
      scale(1);

  }


  .left1 {

    transform:
      translateX(-270px)
      scale(0.55);

  }


  .right1 {

    transform:
      translateX(270px)
      scale(0.55);

  }


  .left2,
  .right2 {

    opacity: 0;

  }

}

  <script>

    window.onload = function () {

      const logos =
        document.querySelectorAll(
          "#carousel img"
        );

      let index = 0;


      if (
        !logos ||
        logos.length === 0
      ) {

        console.log(
          "Aucun logo trouvé"
        );

        return;

      }


      function updateCarousel() {

        const total =
          logos.length;


        for (
          let i = 0;
          i < total;
          i++
        ) {

          logos[i].className =
            "hidden";

        }


        const center =
          index % total;


        const left1 =
          (index - 1 + total) % total;


        const left2 =
          (index - 2 + total) % total;


        const right1 =
          (index + 1) % total;


        const right2 =
          (index + 2) % total;


        logos[center].className =
          "center";


        logos[left1].className =
          "left1";


        logos[left2].className =
          "left2";


        logos[right1].className =
          "right1";


        logos[right2].className =
          "right2";

      }


      updateCarousel();


      setInterval(

        function () {

          index =
            (index + 1)
            % logos.length;

          updateCarousel();

        },

        2500

      );

    };

  </script>
