<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Nos Partenaires</title>


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    color: #fff;

    font-family: Arial, Helvetica, sans-serif;

}


/* =====================================================
   FOND
===================================================== */

body {

    position: relative;

    background:

        radial-gradient(
            circle at center,
            #252000 0%,
            #100e00 35%,
            #050500 65%,
            #000 100%
        );

}


/* =====================================================
   HALO CENTRAL
===================================================== */

body::before {

    content: "";

    position: fixed;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 52%;

    transform:
        translate(-50%, -50%);

    background:

        radial-gradient(
            circle,
            rgba(255,204,0,0.20) 0%,
            rgba(255,204,0,0.08) 25%,
            rgba(255,204,0,0.02) 50%,
            transparent 70%
        );

    pointer-events: none;

    animation:
        halo 4s ease-in-out infinite;

}


/* =====================================================
   ANIMATION HALO
===================================================== */

@keyframes halo {

    0% {

        transform:

            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }


    50% {

        transform:

            translate(-50%, -50%)
            scale(1.10);

        opacity: 1;

    }


    100% {

        transform:

            translate(-50%, -50%)
            scale(0.90);

        opacity: 0.65;

    }

}


/* =====================================================
   TITRE
===================================================== */

h1 {

    position: relative;

    z-index: 50;

    margin: 25px 0 0 0;

    text-align: center;

    font-size: 54px;

    font-weight: 900;

    letter-spacing: 7px;

    color: #ffffff;

    text-shadow:

        0 0 10px #ffffff,
        0 0 25px #ffffff,
        0 0 50px rgba(255,255,255,0.8);

}


/* =====================================================
   LIGNE SOUS LE TITRE
===================================================== */

h1::after {

    content: "";

    display: block;

    width: 300px;

    height: 4px;

    margin: 15px auto 0;

    background: #ffffff;

    border-radius: 10px;

    box-shadow:

        0 0 10px #ffffff,
        0 0 25px #ffffff;

}


/* =====================================================
   CARROUSEL
===================================================== */

.carousel {

    position: relative;

    width: 100%;

    height: calc(100vh - 130px);

    min-height: 650px;

    margin: 0 auto;

    display: flex;

    justify-content: center;

    align-items: center;

    perspective: 1800px;

    perspective-origin:
        center center;

}


/* =====================================================
   LOGOS
===================================================== */

.carousel img {

    position: absolute;

    left: 50%;
    top: 50%;

    width: auto;
    height: auto;

    max-width: 740px;
    max-height: 550px;

    padding: 22px;

    object-fit: contain;

    transform-origin:
        center center;

    background:

        linear-gradient(
            145deg,
            rgba(30,30,30,0.98),
            rgba(5,5,5,0.98)
        );

    border: 4px solid;

    border-radius: 24px;

    transition:

        transform 0.9s cubic-bezier(.22,.61,.36,1),
        opacity 0.9s ease,
        filter 0.9s ease,
        box-shadow 0.9s ease,
        border-color 0.5s ease;

    will-change:
        transform,
        opacity;

}


/* =====================================================
   COULEURS DES CONTOURS
===================================================== */

.color-yellow {

    border-color:
        #ffcc00 !important;

}


.color-red {

    border-color:
        #ff2020 !important;

}


.color-blue {

    border-color:
        #168cff !important;

}


/* =====================================================
   LOGO CENTRAL
===================================================== */

.center {

    transform:

        translate(-50%, -50%)
        translateZ(300px)
        scale(1.05);

    z-index: 20;

    opacity: 1;

    filter:

        brightness(1.15)
        contrast(1.08);

}


/* =====================================================
   HALO JAUNE
===================================================== */

.center.color-yellow {

    box-shadow:

        0 0 20px #ffcc00,
        0 0 45px #ffcc00,
        0 0 90px rgba(255,204,0,0.85),
        0 0 140px rgba(255,204,0,0.35);

}


/* =====================================================
   HALO ROUGE
===================================================== */

.center.color-red {

    box-shadow:

        0 0 20px #ff2020,
        0 0 45px #ff2020,
        0 0 90px rgba(255,32,32,0.85),
        0 0 140px rgba(255,32,32,0.35);

}


/* =====================================================
   HALO BLEU
===================================================== */

.center.color-blue {

    box-shadow:

        0 0 20px #168cff,
        0 0 45px #168cff,
        0 0 90px rgba(22,140,255,0.85),
        0 0 140px rgba(22,140,255,0.35);

}


/* =====================================================
   GAUCHE 1
===================================================== */

.left1 {

    transform:

        translate(-50%, -50%)
        translateX(-540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   GAUCHE 2
===================================================== */

.left2 {

    transform:

        translate(-50%, -50%)
        translateX(-860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   DROITE 1
===================================================== */

.right1 {

    transform:

        translate(-50%, -50%)
        translateX(540px)
        translateZ(40px)
        scale(0.62);

    z-index: 12;

    opacity: 0.75;

    filter:

        brightness(0.75)
        contrast(0.95);

}


/* =====================================================
   DROITE 2
===================================================== */

.right2 {

    transform:

        translate(-50%, -50%)
        translateX(860px)
        translateZ(-250px)
        scale(0.41);

    z-index: 8;

    opacity: 0.38;

    filter:

        brightness(0.55)
        blur(0.3px);

}


/* =====================================================
   CACHÉ À GAUCHE
===================================================== */

.hidden-left {

    transform:

        translate(-50%, -50%)
        translateX(-1150px)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    filter:
        blur(5px);

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   CACHÉ À DROITE
===================================================== */

.hidden-right {

    transform:

        translate(-50%, -50%)
        translateX(1150px)
        translateZ(-700px)
        scale(0.15);

    opacity: 0;

    filter:
        blur(5px);

    z-index: 1;

    pointer-events: none;

}


/* =====================================================
   BARRE LUMINEUSE
===================================================== */

.light-line {

    position: fixed;

    left: 50%;

    bottom: 0;

    transform:
        translateX(-50%);

    width: 65%;

    height: 3px;

    background: #ffcc00;

    box-shadow:

        0 0 10px #ffcc00,
        0 0 25px #ffcc00,
        0 0 50px #ffcc00;

    transition:

        background 0.8s ease,
        box-shadow 0.8s ease;

    z-index: 90;

}


/* =====================================================
   ÉCRANS 1600PX ET MOINS
===================================================== */

@media (max-width: 1600px) {

    .carousel img {

        max-width: 680px;

        max-height: 510px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(250px)
            scale(0.97);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-450px)
            translateZ(30px)
            scale(0.55);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(450px)
            translateZ(30px)
            scale(0.55);

    }


    .left2 {

        transform:

            translate(-50%, -50%)
            translateX(-700px)
            translateZ(-200px)
            scale(0.36);

    }


    .right2 {

        transform:

            translate(-50%, -50%)
            translateX(700px)
            translateZ(-200px)
            scale(0.36);

    }


    .hidden-left {

        transform:

            translate(-50%, -50%)
            translateX(-950px)
            translateZ(-700px)
            scale(0.15);

    }


    .hidden-right {

        transform:

            translate(-50%, -50%)
            translateX(950px)
            translateZ(-700px)
            scale(0.15);

    }

}


/* =====================================================
   ÉCRANS 1200PX ET MOINS
===================================================== */

@media (max-width: 1200px) {

    h1 {

        font-size:
            42px;

    }


    .carousel {

        min-height:
            550px;

    }


    .carousel img {

        max-width:
            570px;

        max-height:
            430px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            translateZ(180px)
            scale(0.93);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-330px)
            translateZ(20px)
            scale(0.48);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(330px)
            translateZ(20px)
            scale(0.48);

    }


    .left2,
    .right2 {

        opacity:
            0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    h1 {

        font-size:
            28px;

        letter-spacing:
            3px;

        margin-top:
            20px;

    }


    h1::after {

        width:
            180px;

        margin-top:
            10px;

    }


    .carousel {

        height:
            calc(100vh - 120px);

        min-height:
            400px;

    }


    .carousel img {

        max-width:
            85vw;

        max-height:
            400px;

        padding:
            15px;

    }


    .center {

        transform:

            translate(-50%, -50%)
            scale(0.87);

    }


    .left1 {

        transform:

            translate(-50%, -50%)
            translateX(-190px)
            scale(0.40);

    }


    .right1 {

        transform:

            translate(-50%, -50%)
            translateX(190px)
            scale(0.40);

    }


    .left2,
    .right2 {

        display:
            none;

    }

}


</style>

</head>


<body>


<!-- =====================================================
     TITRE
===================================================== -->

<h1>
    🤝 NOS PARTENAIRES
</h1>


<!-- =====================================================
     CARROUSEL
===================================================== -->

<div
    class="carousel"
    id="carousel">
</div>


<!-- =====================================================
     BARRE LUMINEUSE
===================================================== -->

<div
    class="light-line">
</div>


<script>

/* =====================================================
   CONFIGURATION GITHUB
===================================================== */

const GITHUB_API =
    "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";


const GITHUB_RAW_BASE =
    "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";


/* =====================================================
   PARAMÈTRES
===================================================== */

const ROTATION_TIME =
    2500;


/*
   Durée de l'animation.

   Elle doit correspondre à peu près à la
   transition CSS de 0.9 seconde.
*/

const TRANSITION_TIME =
    950;


/*
   7 éléments sont utilisés :

   caché gauche
   gauche 2
   gauche 1
   centre
   droite 1
   droite 2
   caché droite

   Cela permet aux logos de réellement se déplacer
   d'une position à l'autre.
*/

const CAROUSEL_ELEMENTS =
    7;


/* =====================================================
   CACHE GITHUB
===================================================== */

const LIST_CACHE_KEY =
    "partenairesGithubLogoList";


const LIST_CACHE_TIME_KEY =
    "partenairesGithubLogoListTime";


const LIST_CACHE_DURATION =
    10 * 60 * 1000;


/* =====================================================
   VARIABLES
===================================================== */

let logoFiles =
    [];


let logos =
    [];


let total =
    0;


/*
   Index du logo actuellement au centre.
*/

let index =
    0;


let interval =
    null;


/* =====================================================
   COULEURS
===================================================== */

const colors = [

    "color-yellow",

    "color-red",

    "color-blue"

];


/* =====================================================
   RÉCUPÉRATION DES LOGOS GITHUB
===================================================== */

async function getLogoFiles() {

    try {

        const cachedList =
            localStorage.getItem(
                LIST_CACHE_KEY
            );


        const cachedTime =
            localStorage.getItem(
                LIST_CACHE_TIME_KEY
            );


        if (

            cachedList &&
            cachedTime &&

            (
                Date.now() -
                parseInt(cachedTime)
            )

            <
            LIST_CACHE_DURATION

        ) {

            const parsed =
                JSON.parse(
                    cachedList
                );


            if (

                Array.isArray(parsed) &&
                parsed.length > 0

            ) {

                return parsed;

            }

        }

    }

    catch (error) {

        console.warn(
            "Impossible de lire le cache GitHub.",
            error
        );

    }


    try {

        const response =
            await fetch(

                GITHUB_API,

                {
                    cache:
                        "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(

                "Erreur GitHub : HTTP " +
                response.status

            );

        }


        const files =
            await response.json();


        const imageExtensions = [

            ".png",
            ".jpg",
            ".jpeg",
            ".webp",
            ".gif",
            ".avif",
            ".svg"

        ];


        const images =

            files

                .filter(

                    file => {

                        if (

                            file.type !==
                            "file"

                        ) {

                            return false;

                        }


                        const name =
                            file.name.toLowerCase();


                        return

                            imageExtensions.some(

                                extension =>

                                    name.endsWith(
                                        extension
                                    )

                            );

                    }

                )

                .sort(

                    (a, b) =>

                        a.name.localeCompare(

                            b.name,

                            "fr",

                            {

                                numeric:
                                    true,

                                sensitivity:
                                    "base"

                            }

                        )

                )

                .map(

                    file =>
                        file.name

                );


        localStorage.setItem(

            LIST_CACHE_KEY,

            JSON.stringify(
                images
            )

        );


        localStorage.setItem(

            LIST_CACHE_TIME_KEY,

            Date.now().toString()

        );


        return images;

    }

    catch (error) {

        console.error(

            "Impossible de récupérer les logos GitHub.",

            error

        );


        try {

            const oldCache =
                localStorage.getItem(
                    LIST_CACHE_KEY
                );


            if (oldCache) {

                const parsed =
                    JSON.parse(
                        oldCache
                    );


                if (

                    Array.isArray(parsed) &&
                    parsed.length > 0

                ) {

                    console.warn(
                        "Utilisation du cache GitHub expiré."
                    );


                    return parsed;

                }

            }

        }

        catch (cacheError) {

            console.error(

                "Cache indisponible.",

                cacheError

            );

        }


        return [];

    }

}


/* =====================================================
   URL D'UN LOGO
===================================================== */

function getLogoURL(fileName) {

    return

        GITHUB_RAW_BASE +

        encodeURIComponent(
            fileName
        );

}


/* =====================================================
   INDEX CIRCULAIRE
===================================================== */

function circularIndex(value) {

    return

        (
            (
                value % total
            )

            +
            total
        )

        %
        total;

}


/* =====================================================
   COULEUR D'UN LOGO
===================================================== */

function getColor(partnerIndex) {

    return

        colors[

            circularIndex(
                partnerIndex
            )

            %
            colors.length

        ];

}


/* =====================================================
   PRÉCHARGEMENT
===================================================== */

function preloadLogo(fileName) {

    if (!fileName) {

        return;

    }


    const image =
        new Image();


    try {

        image.fetchPriority =
            "low";

    }

    catch (error) {

        /* Rien à faire */

    }


    image.src =
        getLogoURL(
            fileName
        );

}


/* =====================================================
   PRÉCHARGEMENT DES PROCHAINS LOGOS
===================================================== */

function preloadNextLogos() {

    if (!total) {

        return;

    }


    for (

        let i = 1;

        i <= 5;

        i++

    ) {

        const nextIndex =
            circularIndex(
                index + i
            );


        preloadLogo(
            logoFiles[nextIndex]
        );

    }


    for (

        let i = 1;

        i <= 3;

        i++

    ) {

        const previousIndex =
            circularIndex(
                index - i
            );


        preloadLogo(
            logoFiles[previousIndex]
        );

    }

}


/* =====================================================
   CRÉATION DES ÉLÉMENTS
===================================================== */

function createImageElements() {

    const carousel =
        document.getElementById(
            "carousel"
        );


    for (

        let i = 0;

        i < CAROUSEL_ELEMENTS;

        i++

    ) {

        const img =
            document.createElement(
                "img"
            );


        img.alt =
            "Partenaire";


        img.decoding =
            "async";


        img.loading =
            "eager";


        img.onerror =
            function () {

                console.warn(

                    "Impossible de charger le logo :",

                    this.dataset.file

                );

            };


        carousel.appendChild(
            img
        );


        logos.push(
            img
        );

    }

}


/* =====================================================
   CHARGEMENT D'UN LOGO
===================================================== */

function loadLogo(

    element,

    partnerIndex

) {

    const realIndex =
        circularIndex(
            partnerIndex
        );


    const fileName =
        logoFiles[realIndex];


    if (

        element.dataset.file !==
        fileName

    ) {

        element.dataset.file =
            fileName;


        element.dataset.partnerIndex =
            realIndex;


        element.alt =

            "Partenaire " +

            (
                realIndex + 1
            );


        element.src =
            getLogoURL(
                fileName
            );

    }


    return realIndex;

}


/* =====================================================
   APPLICATION D'UNE POSITION
===================================================== */

function applyPosition(

    element,

    positionClass,

    partnerIndex

) {

    const realIndex =
        loadLogo(

            element,

            partnerIndex

        );


    element.className =

        positionClass +

        " " +

        getColor(
            realIndex
        );

}


/* =====================================================
   MISE À JOUR DE LA BARRE LUMINEUSE
===================================================== */

function updateLightLine() {

    const lightLine =
        document.querySelector(
            ".light-line"
        );


    if (!lightLine) {

        return;

    }


    const currentColor =
        getColor(
            index
        );


    if (

        currentColor ===
        "color-yellow"

    ) {

        lightLine.style.background =
            "#ffcc00";


        lightLine.style.boxShadow =

            "0 0 10px #ffcc00," +

            "0 0 25px #ffcc00," +

            "0 0 50px #ffcc00";

    }


    else if (

        currentColor ===
        "color-red"

    ) {

        lightLine.style.background =
            "#ff2020";


        lightLine.style.boxShadow =

            "0 0 10px #ff2020," +

            "0 0 25px #ff2020," +

            "0 0 50px #ff2020";

    }


    else {

        lightLine.style.background =
            "#168cff";


        lightLine.style.boxShadow =

            "0 0 10px #168cff," +

            "0 0 25px #168cff," +

            "0 0 50px #168cff";

    }

}


/* =====================================================
   INITIALISATION DES POSITIONS
===================================================== */

function setupInitialPositions() {

    /*
       Chaque élément représente un logo.

       Les logos sont placés autour
       du logo central.
    */


    applyPosition(

        logos[0],

        "hidden-left",

        index - 3

    );


    applyPosition(

        logos[1],

        "left2",

        index - 2

    );


    applyPosition(

        logos[2],

        "left1",

        index - 1

    );


    applyPosition(

        logos[3],

        "center",

        index

    );


    applyPosition(

        logos[4],

        "right1",

        index + 1

    );


    applyPosition(

        logos[5],

        "right2",

        index + 2

    );


    applyPosition(

        logos[6],

        "hidden-right",

        index + 3

    );


    updateLightLine();

    preloadNextLogos();

}


/* =====================================================
   ROTATION AVEC EFFET DE DÉROULEMENT
===================================================== */

function rotateCarousel() {

    if (

        !total ||

        logos.length < 7

    ) {

        return;

    }


    /*
       Le premier logo sort complètement
       à gauche.
    */

    const leavingLogo =
        logos[0];


    /*
       Tous les autres logos avancent
       d'une position vers la gauche.
    */

    logos[0] =
        logos[1];


    logos[1] =
        logos[2];


    logos[2] =
        logos[3];


    logos[3] =
        logos[4];


    logos[4] =
        logos[5];


    logos[5] =
        logos[6];


    /*
       Le logo qui vient de sortir est
       préparé avec le prochain partenaire.
    */

    logos[6] =
        leavingLogo;


    /*
       Le logo suivant devient
       le logo central.
    */

    index =
        circularIndex(
            index + 1
        );


    /*
       Les éléments déjà visibles
       changent réellement de position.

       C'est cette partie qui produit
       l'effet de déroulement fluide.
    */


    logos[0].className =

        "hidden-left " +

        getColor(
            index - 3
        );


    logos[1].className =

        "left2 " +

        getColor(
            index - 2
        );


    logos[2].className =

        "left1 " +

        getColor(
            index - 1
        );


    logos[3].className =

        "center " +

        getColor(
            index
        );


    logos[4].className =

        "right1 " +

        getColor(
            index + 1
        );


    logos[5].className =

        "right2 " +

        getColor(
            index + 2
        );


    /*
       Le logo qui était caché à gauche
       est maintenant préparé à droite.

       On attend légèrement afin que
       son ancienne sortie soit terminée.
    */

    setTimeout(

        function () {

            loadLogo(

                logos[6],

                index + 3

            );


            logos[6].className =

                "hidden-right " +

                getColor(
                    index + 3
                );


        },

        TRANSITION_TIME

    );


    updateLightLine();

    preloadNextLogos();


    localStorage.setItem(

        "partenaireIndex",

        index

    );

}


/* =====================================================
   DÉMARRAGE DU CARROUSEL
===================================================== */

function startCarousel() {

    if (interval) {

        clearInterval(
            interval
        );

    }


    interval =

        setInterval(

            function () {

                rotateCarousel();

            },

            ROTATION_TIME

        );

}


/* =====================================================
   INITIALISATION
===================================================== */

async function init() {

    console.log(
        "Chargement automatique des logos GitHub..."
    );


    logoFiles =
        await getLogoFiles();


    if (

        !logoFiles ||

        !logoFiles.length

    ) {

        console.error(
            "Aucun logo trouvé dans le dossier GitHub /logo."
        );

        return;

    }


    total =
        logoFiles.length;


    console.log(

        total +

        " logos trouvés automatiquement."

    );


    /*
       Création des 7 éléments nécessaires
       à l'effet de déroulement.
    */

    createImageElements();


    /*
       Récupération de la dernière position.
    */

    const savedIndex =

        localStorage.getItem(
            "partenaireIndex"
        );


    if (

        savedIndex !== null &&

        !isNaN(
            parseInt(
                savedIndex
            )
        )

    ) {

        index =
            circularIndex(

                parseInt(
                    savedIndex
                )

            );

    }

    else {

        index = 0;

    }


    /*
       Positionnement initial.
    */

    setupInitialPositions();


    /*
       Petit délai avant le lancement
       pour laisser le premier affichage
       se stabiliser.
    */

    setTimeout(

        function () {

            startCarousel();

        },

        500

    );

}


/* =====================================================
   LANCEMENT
===================================================== */

if (

    document.readyState ===
    "loading"

) {

    document.addEventListener(

        "DOMContentLoaded",

        init

    );

}

else {

    init();

}

</script>
