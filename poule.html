<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POULE — MVBC Score Animation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
    --green: #22c55e;
}

* { box-sizing: border-box; }

html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    background:
        radial-gradient(circle at 50% 40%, rgba(23,105,255,.13), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 40%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
    padding: 2.5vh 4vw;
}

/* Atmosphère arène */
body::before {
    content: "";
    position: fixed;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(90deg, transparent 0 90px, rgba(255,255,255,.012) 91px 92px),
        radial-gradient(ellipse at 50% 45%, rgba(255,255,255,.06), transparent 48%);
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

/* Vignette broadcast */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.48) 100%);
}

.stage {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1560px;
    margin: 0 auto;
}

.title {
    margin: 0 0 clamp(6px, 1.4vh, 18px);
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(30px, 5vw, 74px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -.02em;
    text-transform: uppercase;
    white-space: nowrap;
    color: var(--white);
    transform: skewX(-5deg);
    text-shadow:
        4px 4px 0 var(--black),
        9px 9px 0 var(--yellow),
        14px 14px 0 rgba(237,23,76,.75),
        19px 19px 0 rgba(23,105,255,.4);
}

.champ {
    margin: 0 0 clamp(28px, 5vh, 60px);
    text-align: center;
    font-size: clamp(10px, 1.2vw, 16px);
    font-weight: 800;
    letter-spacing: .32em;
    text-indent: .32em;
    text-transform: uppercase;
    color: rgba(255,255,255,.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =====================================================
   GRILLE DES MATCHS
   ===================================================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: clamp(12px, 1.6vw, 26px);
}

.match {
    position: relative;
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
    padding: clamp(14px, 1.8vw, 28px) clamp(14px, 1.8vw, 28px) clamp(18px, 2.2vw, 34px);
    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.06);
    overflow: hidden;
    animation: popIn .55s cubic-bezier(.16,.9,.25,1) both;
    animation-delay: var(--d, 0s);
}

/* Barre de statut en haut de chaque carte */
.match::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 6px;
    background: var(--statut-couleur, rgba(255,255,255,.2));
}

.statut {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: clamp(10px, 1.6vh, 18px);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: clamp(10px, 1vw, 14px);
    font-weight: 800;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--black);
    background: var(--statut-couleur, rgba(255,255,255,.2));
    white-space: nowrap;
}

.statut.live::after {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--black);
    animation: pulse 1.1s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.7); }
}

/* Ligne équipe */
.row {
    display: flex;
    align-items: center;
    gap: clamp(10px, 1.2vw, 18px);
    padding: clamp(6px, 1vh, 12px) 0;
}

.row .logo {
    flex: 0 0 auto;
    width: clamp(38px, 4.5vw, 66px);
    height: clamp(38px, 4.5vw, 66px);
    object-fit: contain;
    filter: drop-shadow(0 0 14px var(--halo, rgba(255,255,255,.35)));
}

.row .nom {
    flex: 1 1 auto;
    min-width: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 2.4vw, 40px);
    line-height: 1;
    text-transform: uppercase;
    text-shadow:
        0 0 18px var(--halo, rgba(255,255,255,.25)),
        3px 3px 0 rgba(0,0,0,.8);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Score */
.row .pts {
    flex: 0 0 auto;
    min-width: clamp(54px, 5.5vw, 90px);
    text-align: center;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 900;
    font-size: clamp(30px, 3.4vw, 58px);
    line-height: 1;
    color: var(--white);
    text-shadow: 3px 3px 0 rgba(0,0,0,.75);
    padding: clamp(4px, .8vh, 10px) 0;
    border-radius: 12px;
}

/* Équipe qui mène : pastille jaune broadcast */
.row .pts.win {
    color: var(--black);
    background: var(--yellow);
    text-shadow: none;
    box-shadow: 0 0 26px rgba(255,212,0,.35);
}

.sep {
    height: 1px;
    background: rgba(255,255,255,.1);
    margin: clamp(6px, 1vh, 12px) 0;
}

/* Message vide */
.vide-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(22px, 3vw, 40px);
    font-weight: 800;
    text-transform: uppercase;
    color: rgba(255,255,255,.35);
    background: rgba(8,9,12,.74);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 22px;
}

/* =====================================================
   DÉFILEMENT DES LOGOS PARTENAIRES
   ===================================================== */
.partners-bar {
    position: relative;
    z-index: 12;
    width: 100%;
    height: clamp(100px, 13vh, 150px);
    margin-top: clamp(24px, 3.5vh, 45px);
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px;
    overflow: hidden;
}

.partners-scroll {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    white-space: nowrap;
    animation: scrollPartners 60s linear infinite;
}

.partners-scroll img {
    height: 90%;
    max-height: 135px;
    margin: 0 30px;
    object-fit: contain;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
}

@keyframes scrollPartners {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}

@keyframes popIn {
    0% { opacity: 0; transform: translateY(26px) scale(.9); filter: blur(4px); }
    100% { opacity: 1; transform: none; filter: blur(0); }
}

/* Petits écrans */
@media (max-width: 600px) {
    .title {
        font-size: clamp(22px, 6.4vw, 40px);
        white-space: normal;
    }
    .grid {
        grid-template-columns: 1fr;
    }
    .partners-bar { height: 84px; margin-top: 18px; }
    .partners-scroll img { margin: 0 14px; }
}

@media (prefers-reduced-motion: reduce) {
    .partners-scroll, .match { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    .statut.live::after { animation: none !important; }
}
</style>
</head>

<body>

<div class="stage">
    <h1 class="title" id="titrePoule">Matchs de la poule</h1>
    <div class="champ" id="champPoule">&nbsp;</div>

    <div class="grid" id="grid"></div>

    <!-- Défilement des logos partenaires -->
    <div class="partners-bar" id="partnersBar">
        <div class="partners-scroll" id="partnersScroll"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyAnwzIOCEgOMmuAHII9lujvq73Y81Fla00",
    authDomain: "diffusion-b9afa.firebaseapp.com",
    databaseURL: "https://diffusion-b9afa-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "diffusion-b9afa",
    storageBucket: "diffusion-b9afa.firebasestorage.app",
    messagingSenderId: "674799570797",
    appId: "1:674799570797:web:0d8b7a2a892f604eb7d464"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pouleRef = ref(db, "poule");

/* =====================================================
   COULEURS DES STATUTS (même clé que regie-poule.html)
   ===================================================== */
const STATUTS = {
    "NC":                  { label: "NC",                  couleur: "#9aa0a6", live: false },
    "A VENIR":             { label: "À venir",              couleur: "#9aa0a6", live: false },
    "EN COURS 1ER QT":     { label: "En cours 1er QT",      couleur: "#ed174c", live: true  },
    "FIN 1ER QT":          { label: "Fin 1er QT",           couleur: "#ff6500", live: false },
    "EN COURS 2EME QT":    { label: "En cours 2e QT",       couleur: "#ed174c", live: true  },
    "MI-TEMPS":            { label: "Mi-temps",             couleur: "#ff6500", live: false },
    "EN COURS 3EME QT":    { label: "En cours 3e QT",       couleur: "#ed174c", live: true  },
    "FIN 3EME QT":         { label: "Fin 3e QT",            couleur: "#ff6500", live: false },
    "EN COURS 4EME QT":    { label: "En cours 4e QT",       couleur: "#ed174c", live: true  },
    "PROLONGATION":        { label: "Prolongation",         couleur: "#ed174c", live: true  },
    "FIN DU MATCH":        { label: "Fin du match",         couleur: "#22c55e", live: false },
    "REPORT":              { label: "Reporté",              couleur: "#9aa0a6", live: false }
};

const COULEURS_HALO = {
    yellow: "#ffd400", black: "#000000", blue: "#008cff", orange: "#ff6500",
    red: "#ff3030", pink: "#ff4fa3", green: "#22c55e", white: "#ffffff"
};

const grid = document.getElementById("grid");
const titrePoule = document.getElementById("titrePoule");
const champPoule = document.getElementById("champPoule");

let dernierRendu = "";

/* =====================================================
   LOGOS PARTENAIRES (GitHub — même source que quartstemps.html)
   ===================================================== */
const GITHUB_LOGO_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/logo";
const GITHUB_LOGO_RAW = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/logo/";

async function chargerLogosPartenaires() {
    try {
        const response = await fetch(GITHUB_LOGO_API, {
            headers: { "Accept": "application/vnd.github+json" },
            cache: "no-store"
        });
        if (!response.ok) throw new Error(`GitHub a répondu ${response.status}`);
        const fichiers = await response.json();
        const scroll = document.getElementById("partnersScroll");
        scroll.innerHTML = "";
        const logos = fichiers
            .filter(f => f.type === "file" && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name))
            .map(f => GITHUB_LOGO_RAW + encodeURIComponent(f.name));
        [...logos, ...logos].forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            img.alt = "Partenaire";
            img.onerror = function () { this.style.display = "none"; };
            scroll.appendChild(img);
        });
    } catch (error) {
        console.error("Erreur chargement logos partenaires :", error);
    }
}
chargerLogosPartenaires();

/* =====================================================
   RENDU
   ===================================================== */
function lireNombre(v) {
    const n = parseInt(String(v ?? "").trim(), 10);
    return Number.isNaN(n) ? null : n;
}

function rendre(data) {
    data = data || {};
    const matchs = Array.isArray(data.matchs) ? data.matchs : [];

    titrePoule.textContent = (data.nom || "Matchs de la poule").toUpperCase();
    const infos = [data.championnat, data.date, data.heure].filter(Boolean).join("  •  ");
    champPoule.textContent = infos || "\u00a0";

    grid.innerHTML = "";

    if (matchs.length === 0) {
        const vide = document.createElement("div");
        vide.className = "vide-msg";
        vide.textContent = "Aucun match programmé";
        grid.appendChild(vide);
        return;
    }

    matchs.forEach((m, i) => {
        m = m || {};
        const eq1 = (m.eq1 || "ÉQUIPE 1").toUpperCase();
        const eq2 = (m.eq2 || "ÉQUIPE 2").toUpperCase();
        const sc1 = lireNombre(m.score1);
        const sc2 = lireNombre(m.score2);
        const statut = STATUTS[(m.statut || "NC").toUpperCase()] || STATUTS["NC"];

        const card = document.createElement("div");
        card.className = "match";
        card.style.setProperty("--d", (0.15 + i * 0.1).toFixed(2) + "s");
        card.style.setProperty("--statut-couleur", statut.couleur);

        const statutHtml = `<div class="statut${statut.live ? " live" : ""}">${statut.label}</div>`;

        const rowEq = (nom, logo, halo, sc, win) => `
            <div class="row" style="--halo:${halo}">
                ${logo ? `<img class="logo" src="${logo}" alt="Logo ${nom}" onerror="this.style.display='none'">` : ""}
                <span class="nom">${nom}</span>
                <span class="pts${win ? " win" : ""}">${sc === null ? "–" : sc}</span>
            </div>`;

        const s1 = sc1 ?? 0, s2 = sc2 ?? 0;
        card.innerHTML =
            statutHtml +
            rowEq(eq1, m.logo1, COULEURS_HALO[m.haloCouleur1] || "rgba(255,255,255,.3)", sc1, sc1 !== null && s1 > s2) +
            `<div class="sep"></div>` +
            rowEq(eq2, m.logo2, COULEURS_HALO[m.haloCouleur2] || "rgba(255,255,255,.3)", sc2, sc2 !== null && s2 > s1);

        grid.appendChild(card);
    });
}

onValue(pouleRef, (snapshot) => {
    const data = snapshot.val();
    const signature = JSON.stringify(data);
    if (signature !== dernierRendu) {
        dernierRendu = signature;
        rendre(data);
    }
});
</script>

</body>
</html>
