<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nos logos — DIFFUSION</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #111827;
        background: #f4f6f9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 2rem 1.5rem; }
      header { text-align: center; margin-bottom: 2rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.8rem; }
      header p { margin: 0; color: #6b7280; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.25rem;
      }
      figure {
        margin: 0;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transition: transform .15s ease, box-shadow .15s ease;
      }
      figure:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0,0,0,.10);
      }
      img {
        max-width: 100%;
        max-height: 130px;
        object-fit: contain;
      }
      figcaption {
        margin-top: .75rem;
        font-size: .8rem;
        font-weight: 600;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .04em;
        word-break: break-word;
      }
      footer {
        text-align: center;
        margin-top: 2.5rem;
        color: #9ca3af;
        font-size: .8rem;
      }
      #msg { text-align: center; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <h1>Nos partenaires</h1>
      <p>Logos chargés automatiquement depuis le dossier logo/ du dépôt GitHub</p>
    </header>
    <main class="grid" id="grid"></main>
    <p id="msg" hidden></p>

    <script>
      // ⬇️ Seuls ces paramètres sont à adapter si besoin
      const COMPTE  = "mvbc85600";  // compte GitHub
      const DEPOT   = "DIFFUSION";  // nom du dépôt
      const BRANCHE = "main";       // branche
      const DOSSIER = "logo";       // dossier contenant les logos

      const API =
        "https://api.github.com/repos/" + COMPTE + "/" + DEPOT +
        "/contents/" + DOSSIER + "?ref=" + BRANCHE;
      const EXTENSIONS = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".bmp"];

      function estUneImage(nom) {
        return EXTENSIONS.some((ext) => nom.toLowerCase().endsWith(ext));
      }

      // Nom affiché : nom du fichier sans extension ni "(2)"
      function nomAffiche(nom) {
        return nom.replace(/\.[^.]+$/, "").replace(/\s*\(\d+\)$/, "").trim();
      }

      async function chargerLogos() {
        const grid = document.getElementById("grid");
        const msg = document.getElementById("msg");
        try {
          const reponse = await fetch(API);
          if (!reponse.ok) throw new Error("API GitHub : " + reponse.status);
          const fichiers = (await reponse.json())
            .map((f) => f.name)
            .filter(estUneImage)
            .sort((a, b) =>
              nomAffiche(a).localeCompare(nomAffiche(b), "fr", { sensitivity: "base" })
            );

          if (fichiers.length === 0) {
            msg.hidden = false;
            msg.textContent = "Aucun logo trouvé dans le dossier " + DOSSIER + "/.";
            return;
          }

          for (const fichier of fichiers) {
            const figure = document.createElement("figure");
            const img = document.createElement("img");
            img.src = "https://raw.githubusercontent.com/" + COMPTE + "/" + DEPOT +
                       "/" + BRANCHE + "/" + DOSSIER + "/" + encodeURIComponent(fichier);
            img.alt = nomAffiche(fichier);
            img.loading = "lazy";
            const caption = document.createElement("figcaption");
            caption.textContent = nomAffiche(fichier);
            figure.append(img, caption);
            grid.append(figure);
          }
        } catch (e) {
          msg.hidden = false;
          msg.textContent =
            "Impossible de charger la liste des logos depuis GitHub. " +
            "Vérifiez votre connexion internet ou réessayez dans quelques minutes.";
        }
      }

      chargerLogos();
    </script>
  </body>
</html>
