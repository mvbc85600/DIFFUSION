<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nos logos — DIFFUSION</title>
    <style>
      :root {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #111827;
        background: #f4f6f9;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 2rem 1.5rem; }
      header { text-align: center; margin-bottom: 2rem; }
      h1 { margin: 0 0 .25rem; font-size: 1.8rem; }
      header p { margin: 0; color: #6b7280; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.25rem;
      }
      figure {
        margin: 0;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-shadow: 0 1px 3px rgba(0,0,0,.06);
        transition: transform .15s ease, box-shadow .15s ease;
      }
      figure:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 16px rgba(0,0,0,.10);
      }
      img {
        max-width: 100%;
        max-height: 130px;
        object-fit: contain;
      }
      figcaption {
        margin-top: .75rem;
        font-size: .8rem;
        font-weight: 600;
        color: #374151;
        text-transform: uppercase;
        letter-spacing: .04em;
        word-break: break-word;
      }
      footer {
        text-align: center;
        margin-top: 2.5rem;
        color: #9ca3af;
        font-size: .8rem;
      }
      #msg { text-align: center; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <h1>Nos partenaires</h1>
      <p>Les logos affichés proviennent automatiquement du dossier diffusion/logo</p>
    </header>
    <main class="grid" id="grid"></main>
    <p id="msg" hidden>Aucun logo trouvé dans le dossier logo/.</p>

    <script>
      const DOSSIER = "logo/"; // dossier relatif contenant les images
      const EXTENSIONS = [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".bmp"];

      // Nom affiché : nom du fichier, sans extension ni "(2)"
      function nomAffiche(fichier) {
        return decodeURIComponent(fichier)
          .replace(/\.[^.]+$/, "")   // enlève l'extension
          .replace(/\s*\(\d+\)$/, "") // enlève " (2)", " (3)"...
          .trim();
      }

      function estUneImage(fichier) {
        return EXTENSIONS.some((ext) => fichier.toLowerCase().endsWith(ext));
      }

      // Extrait les liens d'une page d'index de répertoire (Apache, Nginx...)
      function extraireFichiers(html) {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const fichiers = [];
        doc.querySelectorAll("a[href]").forEach((a) => {
          const href = a.getAttribute("href").split(/[?#]/)[0];
          const nom = decodeURIComponent(href.replace(/^.*\//, ""));
          if (nom && estUneImage(nom) && !fichiers.includes(nom)) {
            fichiers.push(nom);
          }
        });
        return fichiers;
      }

      async function chargerLogos() {
        const grid = document.getElementById("grid");
        try {
          const reponse = await fetch(DOSSIER, { headers: { "Accept": "text/html" } });
          if (!reponse.ok) throw new Error("Index du dossier indisponible (" + reponse.status + ")");
          const fichiers = extraireFichiers(await reponse.text());

          fichiers.sort((a, b) =>
            nomAffiche(a).localeCompare(nomAffiche(b), "fr", { sensitivity: "base" })
          );

          if (fichiers.length === 0) {
            document.getElementById("msg").hidden = false;
            return;
          }

          for (const fichier of fichiers) {
            const figure = document.createElement("figure");
            const img = document.createElement("img");
            img.src = DOSSIER + encodeURIComponent(fichier);
            img.alt = nomAffiche(fichier);
            img.loading = "lazy";
            const caption = document.createElement("figcaption");
            caption.textContent = nomAffiche(fichier);
            figure.append(img, caption);
            grid.append(figure);
          }
        } catch (e) {
          document.getElementById("msg").hidden = false;
          document.getElementById("msg").textContent =
            "Impossible de lire automatiquement le dossier « logo/ ». " +
            "Vérifiez que l'index du répertoire est activé sur le serveur " +
            "(voir la note d'installation).";
        }
      }

      chargerLogos();
    </script>
  </body>
</html>
