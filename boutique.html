<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUTIQUE OFFICIELLE — Animation</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap');

:root {
    --white: #f7f7f5;
    --black: #050608;
    --red: #ed174c;
    --blue: #1769ff;
    --yellow: #ffd400;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 48%, rgba(23,105,255,.13), transparent 28%),
        radial-gradient(circle at 50% 100%, rgba(237,23,76,.09), transparent 38%),
        #050608;
    font-family: Inter, sans-serif;
    color: var(--white);
}

.stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* Subtle arena atmosphere */
.stage::before {
    content: "";
    position: absolute;
    inset: -20%;
    z-index: -3;
    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 90px,
            rgba(255,255,255,.012) 91px 92px
        ),
        radial-gradient(
            ellipse at 50% 45%,
            rgba(255,255,255,.06),
            transparent 48%
        );
    transform: perspective(800px) rotateX(58deg) scale(1.35);
    transform-origin: center bottom;
}

.stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    background: radial-gradient(
        ellipse at center,
        transparent 35%,
        rgba(0,0,0,.48) 100%
    );
}

/* Main impact */
.boutique-title {
    position: absolute;
    left: 50%;
    top: 30%;
    z-index: 10;
    margin: 0;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(80px, 12vw, 200px);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.05em;
    color: var(--white);
    text-align: center;
    text-shadow:
        5px 5px 0 var(--black),
        10px 10px 0 var(--yellow),
        16px 16px 0 rgba(237,23,76,.9),
        22px 22px 0 rgba(23,105,255,.5);
    will-change: transform, opacity, filter;
}

/* Accent slash behind title */
.slash {
    position: absolute;
    left: 50%;
    top: 30%;
    z-index: 7;
    width: min(64vw, 850px);
    height: 18px;
    transform:
        translate(-50%, -50%)
        rotate(-7deg)
        scaleX(0);
    transform-origin: center;
    opacity: 0;
    background: linear-gradient(
        90deg,
        transparent,
        var(--blue) 12%,
        var(--yellow) 35%,
        var(--white) 50%,
        var(--yellow) 65%,
        var(--red) 88%,
        transparent
    );
    box-shadow: 0 0 40px rgba(23,105,255,.45);
}

/* Giant background number */
.echo {
    position: absolute;
    left: 50%;
    top: 30%;
    z-index: 2;
    transform:
        translate(-50%, -50%)
        scale(0.9)
        skewX(-5deg);
    opacity: 0;
    font-family: "Barlow Condensed", sans-serif;
    font-size: clamp(150px, 20vw, 300px);
    font-weight: 900;
    line-height: 0.7;
    letter-spacing: -0.09em;
    color: transparent;
    -webkit-text-stroke: 2px rgba(255,255,255,.07);
}

/* Image container */
.image-container {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 15;
    width: 80%;
    max-width: 800px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
}

.image-container img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* Radial impact rings */
.ring {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 5;
    width: 40px;
    height: 40px;
    border: 2px solid rgba(255,255,255,.85);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(.1);
    opacity: 0;
}

.ring.red {
    border-color: rgba(237,23,76,.8);
}

.ring.blue {
    border-color: rgba(23,105,255,.8);
}

/* Speed lines */
.lines {
    position: absolute;
    inset: 0;
    z-index: 4;
    pointer-events: none;
    overflow: hidden;
}

.line {
    position: absolute;
    left: 50%;
    top: 50%;
    height: 2px;
    width: clamp(100px, 20vw, 300px);
    transform-origin: 0 50%;
    transform: rotate(var(--angle)) translateX(20px) scaleX(0);
    opacity: 0;
    background: linear-gradient(
        90deg,
        rgba(255,255,255,.85),
        transparent
    );
}

/* Flash */
.flash {
    position: absolute;
    inset: 0;
    z-index: 18;
    pointer-events: none;
    opacity: 0;
    background: rgba(255,255,255,.9);
    mix-blend-mode: screen;
}

/* State: active animation */
.stage.play .boutique-title {
    animation: titleImpact 2.5s cubic-bezier(.16,.9,.25,1) forwards;
}

.stage.play .echo {
    animation: echoImpact 2.5s ease-out forwards;
}

.stage.play .slash {
    animation: slashImpact 1.8s cubic-bezier(.16,1,.3,1) forwards;
}

.stage.play .image-container {
    animation: imageFadeIn 2.5s ease-in-out 0.5s forwards;
}

.stage.play .ring {
    animation: ringImpact 1.5s cubic-bezier(.12,.75,.25,1) forwards;
}

.stage.play .ring.red {
    animation-delay: .06s;
}

.stage.play .ring.blue {
    animation-delay: .12s;
}

.stage.play .flash {
    animation: flashImpact .32s ease-out forwards;
}

.stage.play .line {
    animation: lineImpact .8s cubic-bezier(.15,.8,.3,1) forwards;
}

.stage.play .line:nth-child(2n) {
    animation-delay: .035s;
}

.stage.play .line:nth-child(3n) {
    animation-delay: .07s;
}

@keyframes titleImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(0.45) skewX(-5deg);
        filter: blur(8px);
    }
    12% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1.12) skewX(-5deg);
        filter: blur(0);
    }
    23% {
        transform: translate(-50%,-50%) scale(0.96) skewX(-5deg);
    }
    38% {
        transform: translate(-50%,-50%) scale(1.02) skewX(-5deg);
    }
    70% {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1) skewX(-5deg);
    }
    90% {
        opacity: 0;
        transform: translate(-50%,-53%) scale(1.08) skewX(-5deg);
    }
    100% {
        opacity: 0;
    }
}

@keyframes imageFadeIn {
    0% { opacity: 0; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

@keyframes echoImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.6) skewX(-5deg);
    }
    18% {
        opacity: .8;
    }
    80% {
        opacity: 0;
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(1.25) skewX(-5deg);
    }
}

@keyframes slashImpact {
    0% {
        opacity: 0;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(0);
    }
    18% {
        opacity: 1;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1);
    }
    65% {
        opacity: .8;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1.05);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) rotate(-7deg) scaleX(1.18);
    }
}

@keyframes ringImpact {
    0% {
        opacity: .8;
        transform: translate(-50%,-50%) scale(.1);
    }
    100% {
        opacity: 0;
        transform: translate(-50%,-50%) scale(12);
    }
}

@keyframes lineImpact {
    0% {
        opacity: 0;
        transform: rotate(var(--angle)) translateX(10px) scaleX(0);
    }
    20% {
        opacity: .9;
    }
    100% {
        opacity: 0;
        transform: rotate(var(--angle)) translateX(30px) scaleX(1);
    }
}

@keyframes flashImpact {
    0% { opacity: 0; }
    12% { opacity: .75; }
    100% { opacity: 0; }
}

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
    .stage.play * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}
</style>
</head>

<body>
<div class="stage" id="stage">
    <div class="echo">BOUTIQUE OFFICIELLE</div>
    <div class="slash"></div>

    <div class="lines" id="lines"></div>

    <div class="ring"></div>
    <div class="ring red"></div>
    <div class="ring blue"></div>

    <div class="flash"></div>

    <div class="boutique-title" aria-live="polite">BOUTIQUE OFFICIELLE</div>

    <!-- Conteneur pour l'image -->
    <div class="image-container">
        <img src="photos/BOUTIQUE.png" alt="Articles de la boutique">
    </div>
</div>

<script>
const stage = document.getElementById("stage");
const lines = document.getElementById("lines");

const angles = [
    0, 18, 36, 54, 72, 90, 108, 126, 144, 162,
    180, 198, 216, 234, 252, 270, 288, 306, 324, 342
];

angles.forEach(angle => {
    const line = document.createElement("div");
    line.className = "line";
    line.style.setProperty("--angle", `${angle}deg`);
    lines.appendChild(line);
});

function playAnimation() {
    stage.classList.remove("play");
    void stage.offsetWidth;
    stage.classList.add("play");
}

setTimeout(playAnimation, 500);
setInterval(playAnimation, 2500);
</script>
</body>
</html>
