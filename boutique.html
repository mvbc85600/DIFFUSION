<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nos Partenaires</title>

    <!-- Importation de la police Barlow Condensed -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =====================================================
           FOND
        ===================================================== */
        body {
            position: relative;
            background:
                radial-gradient(
                    circle at center,
                    #252000 0%,
                    #100e00 35%,
                    #050500 65%,
                    #000 100%
                );
        }

        /* =====================================================
           HALO CENTRAL DU FOND
        ===================================================== */
        body::before {
            content: "";
            position: fixed;
            width: 900px;
            height: 900px;
            left: 50%;
            top: 52%;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(
                    circle,
                    rgba(255,204,0,0.20) 0%,
                    rgba(255,204,0,0.08) 25%,
                    rgba(255,204,0,0.02) 50%,
                    transparent 70%
                );
            pointer-events: none;
            animation: halo 4s ease-in-out infinite;
        }

        @keyframes halo {
            0% {
                transform: translate(-50%, -50%) scale(0.90);
                opacity: 0.65;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.10);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(0.90);
                opacity: 0.65;
            }
        }

        /* =====================================================
           NOUVEAU STYLE POUR LE TITRE (inspiré de boutique.html)
        ===================================================== */
        :root {
            --white: #f7f7f5;
            --black: #050608;
            --red: #ed174c;
            --blue: #1769ff;
            --yellow: #ffd400;
        }

        /* Conteneur pour le titre */
        .title-container {
            position: relative;
            width: 100%;
            height: auto;
            margin-top: 20px;
            z-index: 100;
            text-align: center;
        }

        /* Titre principal */
        .partner-title {
            font-family: "Barlow Condensed", sans-serif;
            font-size: clamp(40px, 6vw, 100px);
            font-weight: 900;
            line-height: 0.9;
            letter-spacing: -0.04em;
            color: var(--white);
            text-align: center;
            white-space: nowrap;
            text-shadow:
                4px 4px 0 var(--black),
                7px 7px 0 var(--yellow),
                11px 11px 0 rgba(237,23,76,.9),
                15px 15px 0 rgba(23,105,255,.5);
        }

        /* Barre colorée derrière le titre */
        .slash {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-7deg);
            width: min(64vw, 850px);
            height: 18px;
            background: linear-gradient(
                90deg,
                transparent,
                var(--blue) 12%,
                var(--yellow) 35%,
                var(--white) 50%,
                var(--yellow) 65%,
                var(--red) 88%,
                transparent
            );
            box-shadow: 0 0 40px rgba(23,105,255,.45);
            z-index: -1;
        }

        /* =====================================================
           CARROUSEL
        ===================================================== */
        .carousel {
            position: relative;
            width: 100%;
            height: calc(100vh - 150px);
            min-height: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1800px;
            perspective-origin: center center;
        }

        /* =====================================================
           LOGOS
        ===================================================== */
        .carousel img {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-origin: center center;
            width: auto;
            height: auto;
            max-width: 740px;
            max-height: 495px;
            padding: 22px;
            object-fit: contain;
            background:
                linear-gradient(
                    145deg,
                    rgba(30,30,30,0.98),
                    rgba(5,5,5,0.98)
                );
            border: 4px solid;
            border-radius: 24px;
            transition:
                transform 0.9s cubic-bezier(.22,.61,.36,1),
                opacity 0.9s ease,
                filter 0.9s ease,
                box-shadow 0.9s ease,
                border-color 0.9s ease;
            will-change: transform, opacity;
        }

        /* =====================================================
           COULEURS DES PARTENAIRES
        ===================================================== */
        .color-yellow { border-color: #ffcc00 !important; }
        .color-red { border-color: #ff2020 !important; }
        .color-blue { border-color: #168cff !important; }

        /* =====================================================
           POSITIONS DES LOGOS
        ===================================================== */
        .center {
            transform: translate(-50%, -50%) translateZ(300px) scale(1.10);
            z-index: 20;
            opacity: 1;
            filter: brightness(1.15) contrast(1.08);
        }

        .left1 {
            transform: translate(-50%, -50%) translateX(-540px) translateZ(40px) scale(0.62);
            z-index: 12;
            opacity: 0.75;
            filter: brightness(0.75) contrast(0.95);
        }

        .right1 {
            transform: translate(-50%, -50%) translateX(540px) translateZ(40px) scale(0.62);
            z-index: 12;
            opacity: 0.75;
            filter: brightness(0.75) contrast(0.95);
        }

        .left2 {
            transform: translate(-50%, -50%) translateX(-860px) translateZ(-250px) scale(0.41);
            z-index: 8;
            opacity: 0.38;
            filter: brightness(0.55) blur(0.3px);
        }

        .right2 {
            transform: translate(-50%, -50%) translateX(860px) translateZ(-250px) scale(0.41);
            z-index: 8;
            opacity: 0.38;
            filter: brightness(0.55) blur(0.3px);
        }

        .hidden {
            transform: translate(-50%, -50%) translateZ(-700px) scale(0.15);
            opacity: 0;
            filter: blur(5px);
            z-index: 1;
            pointer-events: none;
        }

        /* =====================================================
           BARRE LUMINEUSE
        ===================================================== */
        .light-line {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 65%;
            height: 3px;
            background: #ffcc00;
            box-shadow:
                0 0 10px #ffcc00,
                0 0 25px #ffcc00,
                0 0 50px #ffcc00;
            z-index: 90;
            transition:
                background 0.9s ease,
                box-shadow 0.9s ease;
        }

        /* =====================================================
           ÉCRANS 1600PX ET MOINS
        ===================================================== */
        @media (max-width: 1600px) {
            .carousel img {
                max-width: 680px;
                max-height: 460px;
            }
            .center {
                transform: translate(-50%, -50%) translateZ(250px) scale(1.02);
            }
            .left1 {
                transform: translate(-50%, -50%) translateX(-450px) translateZ(30px) scale(0.55);
            }
            .right1 {
                transform: translate(-50%, -50%) translateX(450px) translateZ(30px) scale(0.55);
            }
            .left2 {
                transform: translate(-50%, -50%) translateX(-700px) translateZ(-200px) scale(0.36);
            }
            .right2 {
                transform: translate(-50%, -50%) translateX(700px) translateZ(-200px) scale(0.36);
            }
        }

        /* =====================================================
           ÉCRANS 1200PX ET MOINS
        ===================================================== */
        @media (max-width: 1200px) {
            .partner-title {
                font-size: clamp(30px, 5vw, 80px);
            }
            .carousel {
                min-height: 500px;
            }
            .carousel img {
                max-width: 570px;
                max-height: 387px;
            }
            .center {
                transform: translate(-50%, -50%) translateZ(180px) scale(0.98);
            }
            .left1 {
                transform: translate(-50%, -50%) translateX(-330px) translateZ(20px) scale(0.48);
            }
            .right1 {
                transform: translate(-50%, -50%) translateX(330px) translateZ(20px) scale(0.48);
            }
            .left2, .right2 {
                opacity: 0;
            }
        }

        /* =====================================================
           MOBILE
        ===================================================== */
        @media (max-width: 700px) {
            .partner-title {
                font-size: clamp(24px, 6vw, 50px);
                letter-spacing: -0.02em;
            }
            .slash {
                height: 12px;
            }
            .carousel {
                height: calc(100vh - 120px);
                min-height: 400px;
            }
            .carousel img {
                max-width: 85vw;
                max-height: 360px;
                padding: 15px;
            }
            .center {
                transform: translate(-50%, -50%) scale(0.92);
            }
            .left1 {
                transform: translate(-50%, -50%) translateX(-190px) scale(0.40);
            }
            .right1 {
                transform: translate(-50%, -50%) translateX(190px) scale(0.40);
            }
            .left2, .right2 {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- Titre avec effet statique -->
    <div class="title-container">
        <div class="slash"></div>
        <h1 class="partner-title">LA BOUTIQUE</h1>
    </div>

    <!-- Carrousel -->
    <div class="carousel" id="carousel"></div>

    <!-- Barre lumineuse -->
    <div class="light-line"></div>

    <script type="module">
        /* =====================================================
           CONFIGURATION GITHUB (DOSSIER "boutique")
        ===================================================== */
        const GITHUB_API = "https://api.github.com/repos/mvbc85600/DIFFUSION/contents/boutique";
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/mvbc85600/DIFFUSION/main/boutique/";

        /* =====================================================
           PARAMÈTRES
        ===================================================== */
        let logoFiles = [];
        let logos = [];
        let index = 0;
        let interval = null;
        let carouselStarted = false;

        /* =====================================================
           COULEURS DES PARTENAIRES
        ===================================================== */
        const colors = ["color-yellow", "color-red", "color-blue"];

        /* =====================================================
           DURÉE PAR DÉFAUT (sans Firebase)
        ===================================================== */
        const DEFAULT_DURATION = 2500; // Durée fixe pour tous les logos

        /* =====================================================
           CACHE DE LA LISTE GITHUB
        ===================================================== */
        const LIST_CACHE_KEY = "boutiqueGithubLogoList";
        const LIST_CACHE_TIME_KEY = "boutiqueGithubLogoListTime";
        const LIST_CACHE_DURATION = 10 * 60 * 1000; // 10 minutes

        /* =====================================================
           RÉCUPÉRATION DE LA LISTE DES LOGOS
        ===================================================== */
        async function getLogoFiles() {
            try {
                const cachedList = localStorage.getItem(LIST_CACHE_KEY);
                const cachedTime = localStorage.getItem(LIST_CACHE_TIME_KEY);

                if (cachedList && cachedTime && (Date.now() - parseInt(cachedTime)) < LIST_CACHE_DURATION) {
                    const parsed = JSON.parse(cachedList);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                }
            } catch (error) {
                console.warn("Impossible de lire le cache GitHub.", error);
            }

            try {
                const response = await fetch(GITHUB_API, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error("Erreur GitHub : HTTP " + response.status);
                }
                const files = await response.json();
                const imageExtensions = [".png", ".jpg", ".jpeg", ".webp", ".gif", ".avif", ".svg"];
                const images = files
                    .filter(file => {
                        if (file.type !== "file") return false;
                        const name = file.name.toLowerCase();
                        return imageExtensions.some(extension => name.endsWith(extension));
                    })
                    .sort((a, b) => a.name.localeCompare(b.name, "fr", { numeric: true, sensitivity: "base" }))
                    .map(file => file.name);

                localStorage.setItem(LIST_CACHE_KEY, JSON.stringify(images));
                localStorage.setItem(LIST_CACHE_TIME_KEY, Date.now().toString());
                return images;
            } catch (error) {
                console.error("Impossible de récupérer les logos GitHub.", error);
                try {
                    const oldCache = localStorage.getItem(LIST_CACHE_KEY);
                    if (oldCache) {
                        const parsed = JSON.parse(oldCache);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            console.warn("Utilisation du cache GitHub.");
                            return parsed;
                        }
                    }
                } catch (cacheError) {
                    console.error("Cache indisponible.", cacheError);
                }
                return [];
            }
        }

        /* =====================================================
           CRÉATION DE L'URL D'UN LOGO
        ===================================================== */
        function getLogoURL(fileName) {
            return GITHUB_RAW_BASE + encodeURIComponent(fileName);
        }

        /* =====================================================
           COULEUR D'UN LOGO
        ===================================================== */
        function getColor(logoIndex) {
            return colors[logoIndex % colors.length];
        }

        /* =====================================================
           CRÉATION DE TOUS LES LOGOS
        ===================================================== */
        function createAllLogos() {
            const carousel = document.getElementById("carousel");
            logoFiles.forEach(function (fileName, fileIndex) {
                const img = document.createElement("img");
                img.alt = "Partenaire";
                img.decoding = "async";
                img.className = "hidden " + getColor(fileIndex);
                img.src = getLogoURL(fileName);
                img.onerror = function () {
                    console.warn("Impossible de charger :", fileName);
                };
                carousel.appendChild(img);
                logos.push(img);
            });
        }

        /* =====================================================
           MISE À JOUR DE LA BARRE LUMINEUSE
        ===================================================== */
        function updateLightLine() {
            const lightLine = document.querySelector(".light-line");
            if (!lightLine) return;

            const currentColor = getColor(index);
            let color;
            if (currentColor === "color-yellow") color = "#ffcc00";
            else if (currentColor === "color-red") color = "#ff2020";
            else color = "#168cff";

            lightLine.style.background = color;
            lightLine.style.boxShadow = "0 0 10px " + color + ", 0 0 25px " + color + ", 0 0 50px " + color;
        }

        /* =====================================================
           MISE À JOUR DU CARROUSEL
        ===================================================== */
        function updateCarousel() {
            const total = logos.length;
            if (total === 0) return;

            for (let i = 0; i < total; i++) {
                logos[i].className = "hidden " + getColor(i);
            }

            const center = index % total;
            const left1 = (index - 1 + total) % total;
            const left2 = (index - 2 + total) % total;
            const right1 = (index + 1) % total;
            const right2 = (index + 2) % total;

            logos[center].className = "center " + getColor(center);
            logos[left1].className = "left1 " + getColor(left1);
            logos[left2].className = "left2 " + getColor(left2);
            logos[right1].className = "right1 " + getColor(right1);
            logos[right2].className = "right2 " + getColor(right2);

            updateLightLine();
            localStorage.setItem("boutiqueIndex", index);
        }

        /* =====================================================
           ROTATION DU CARROUSEL
        ===================================================== */
        function rotateCarousel() {
            if (logos.length === 0) return;
            index = (index + 1) % logos.length;
            updateCarousel();
        }

        /* =====================================================
           DÉMARRAGE DU CARROUSEL
        ===================================================== */
        function startCarousel() {
            if (interval) {
                clearTimeout(interval);
                interval = null;
            }
            if (!carouselStarted || logos.length === 0) return;

            // Durée fixe pour tous les logos (sans Firebase)
            interval = setTimeout(() => {
                rotateCarousel();
                startCarousel();
            }, DEFAULT_DURATION);
        }

        /* =====================================================
           INITIALISATION
        ===================================================== */
        async function init() {
            console.log("Chargement automatique des logos GitHub depuis /boutique...");
            logoFiles = await getLogoFiles();
            if (!logoFiles || logoFiles.length === 0) {
                console.error("Aucun logo trouvé dans le dossier GitHub /boutique.");
                return;
            }
            console.log(logoFiles.length + " logos trouvés automatiquement.");
            createAllLogos();

            const savedIndex = localStorage.getItem("boutiqueIndex");
            if (savedIndex !== null && !isNaN(parseInt(savedIndex))) {
                index = parseInt(savedIndex);
                index = ((index % logos.length) + logos.length) % logos.length;
            } else {
                index = 0;
            }

            updateCarousel();
            carouselStarted = true;
            startCarousel();
        }

        /* =====================================================
           LANCEMENT
        ===================================================== */
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", init);
        } else {
            init();
        }
    </script>
</body>
</html>
